"무기 대안"},{"name":"요정 판금 (Fae Plate)","reason":"의식 전 보호막 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"},{"name":"말하는 모자 (Talking Hat)","reason":"Enchantment 퀵캐스트로 사전 준비 행동 효율 증가 [Head / 제작: Enchantment×3 + 자유×5, 총 8]","priority":"유틸"},{"name":"위기 부적 (Crisis Charm)","reason":"급사에 대비하는 안전 장신구 [Trinket / 제작: Holy×1 + Word×1 + 자유×2, 총 4]","priority":"선택"}],"craftNotes":["재료 예: Holy Water(Holy+Ritual), Blood Basin(Blood+Ritual), Scripted Cortex(Arcane+Word), Dragontongue Tablet(Dragon+Word).","Book of Revelation은 장신구. Multimancer's Staff/Rapid Ritual Rod는 둘 다 무기이므로 선택.","HP 77은 의식의 직접 비용이다. 고HP·회복·보호막 확보 전에는 시작하지 않는다."],"auto":["계시 의식 채널 중 Holy Fire가 매턴 시야 대상에 자동 시전된다.","Holy Fire→Heaven Call은 처치 조건부로 Seraph 소환, 매번 반드시 소환되지 않는다.","The Witness는 추가 자동 Blinding Light, Multimancer's Staff는 대상수 +50%.","의식 완료 후 False Prophet 7 소환. 채널 중단 시 완료 보상은 얻지 못한다."],"rotation":["Blinding Light→Halting Light로 위협 적 제어.","Arcane Warding·체력 77 이상과 추가 여유분 확보.","계시록 의식 시작, Holy Fire 자동 발동·처치 시 세라프 소환.","채널 완료를 노리되 위험하면 안전한 위치·방어 우선.","보스는 Sanction/다른 속성 공격 보완."],"pitfalls":["Book of Revelation은 주문이 아니라 장신구.","HP 비용 77·채널 최대 12턴 때문에 초중반 운용이 위험.","Heaven Call은 Holy Fire 처치 시에만 소환.","멀티맨서와 신속 의식 지팡이는 같은 무기 슬롯.","시야 대상이 없으면 자동 포격 대상 감소.","성속성·화염 저항이 높은 적은 다른 피해 수단 필요."],"boss":["성속성/화염 저항과 주문 유형 면역을 별도 확인.","단일 보스는 처치 트리거가 적어 Seraph 자동 증식이 어려움.","모르드레드는 미리 소환군·방어·이동을 준비한다."],"variants":["폭격형: 계시록+Multimancer's Staff+Heaven Call.","제어형: Blinding Light→Halting Light + The Witness.","소환 영구형: Seraph + Permanence→Reality Hold.","의식 반복형: Rapid Ritual Rod 무기 대안."],"evidence":"Steam Book of Revelation 공략과 2026-10-12 live 데이터 검증. Ritual of Revelation HP77/채널12/대상3/완료시 False Prophet7; Heaven Call은 처치 조건. 세부 구역은 생존형 재구성.","sources":[["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["2026-10-12 베타 변경사항","https://steamdb.info/patchnotes/25891047/"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드"},{"id":"stormritual","icon":"🌩️","title":"초고속 폭풍 의식 · 이중 폭발","level":"★★★","tagline":"Storm Burst를 의식화하고 Rapid Ritual Rod로 냉기·번개 다단 공격","idea":"Storm Burst는 시전자 중심 냉기 또는 번개 광역 공격이다. Dual Nova를 구매하면 두 속성 모두 타격하고, Ritual of Storms로 최대 3턴 채널링 의식으로 전환한다. Rapid Ritual Rod를 장착하면 채널 중 Ritual 주문이 매턴 한 번 더 발동해 피해·빙결·기절을 중첩한다. 2개 속성을 동시에 봉쇄하는 적과 본체의 채널링 생존이 난관이다.","first":["1구역: Lightning Bolt나 Icicle 중 기본 공격 하나로 시작.","2~4구역: SP를 모으고 Fae Plate 등 방어 장비 확보.","4~7구역: Storm Burst 확보 후 밀집 적 한 번에 정리(기본 3회 충전 주의).","7~11구역: Dual Nova로 Ice+Lightning 양속성 피해, Stormshield로 아군 보호.","11~15구역: Ritual of Storms 업그레이드로 폭풍의식 채널링.","13~17구역: Rapid Ritual Rod 제작(Ritual×2+자유×5).","17~21구역: Arcane Warding·Teleport·Essence Flux로 면역·보스 대응."],"phases":[{"range":"1–3","target":"저비용 생존","actions":["Lightning Bolt 단일 공격으로 시작, 위험 원거리 적이 없는 균열 선택.","Storm Burst 기본 충전 횟수 3이므로 약한 한 마리에 낭비 금지."]},{"range":"4–7","target":"폭풍 광역 확보","actions":["Storm Burst는 시전자 중심 반경 5에 Ice 또는 Lightning 피해, 피해 유형에 따라 빙결·기절.","Stormshield로 영향을 받는 아군 Ice/Lightning 피해 면역 부여가 가능하다."]},{"range":"7–11","target":"이중 신성","actions":["Dual Nova는 Ice와 Lightning을 모두 적용해 속성 조합에 강하다.","Robe of Storms는 냉기/번개 처치 시 보호막, Boreal Armor는 구역 시작 보호막7과 반격. 몸통은 택일."]},{"range":"11–15","target":"Ritual of Storms","actions":["Ritual of Storms는 최대 채널 3턴, 완료 시 그 구역 Storm Burst 반경+1·지속+1.","Rapid Ritual Rod는 채널 Ritual 효과를 매턴 한 번 추가 발생시켜 복수 타격.","지팡이 복제 제단은 특별 운이므로 기본 루트로 가정하지 않는다."]},{"range":"16–19","target":"저항과 이동 보강","actions":["Essence Flux는 Fire↔Ice, Lightning↔Physical 저항을 바꾸는 주문으로 직접 피해가 아니다.","Arcane Warding·Teleport로 의식 도중 다수 피격을 피한다."]},{"range":"20–21","target":"최종 보스","actions":["냉기와 번개 모두 높은 저항이면 별도 속성 공격 확보.","빠른 타격만 믿고 위험한 위치에서 채널을 고집하지 않는다.","보호막 보스에는 Siphon Shields 준비."]}],"spells":[{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"초반 공격","priority":"시작"},{"name":"폭풍 폭발 (Storm Burst)","up":"Dual Nova (5SP)","reason":"Ice+Lightning 두 속성 동시 광역","priority":"필수"},{"name":"폭풍 폭발 (Storm Burst)","up":"Ritual of Storms (7SP)","reason":"최대 3턴 채널로 자동 반복","priority":"필수"},{"name":"폭풍 폭발 (Storm Burst)","up":"Stormshield (2SP)","reason":"아군 보호","priority":"안전"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"의식 중 본체 방어","priority":"필수"},{"name":"정수 교환 (Essence Flux)","up":"Essence Degradation (2SP)","reason":"보스 저항을 낮은 쪽으로 교환","priority":"후반"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"위험 위치 이탈","priority":"생존"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"실드형 보스","priority":"후반"}],"gear":[{"name":"신속 의식 지팡이 (Rapid Ritual Rod)","reason":"채널 Ritual이 매턴 한 번 더 발동 [Weapon / 제작: Ritual×2 + 자유×5, 총 7]","priority":"필수"},{"name":"폭풍 로브 (Robe of Storms)","reason":"Ice/Lightning 처치시 보호막 1 [Body / 제작: Ice×1 + Lightning×1 + Nature×1 + 자유×3, 총 6]","priority":"공격형 방어"},{"name":"북방 갑옷 (Boreal Armor)","reason":"구역 시작 보호막7·실드 피격 반격, 폭풍로브와 택일 [Body / 제작: Ice×1 + Metallic×1 + 자유×4, 총 6]","priority":"보스형 방어"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보호막, 몸통 대안 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"초반"},{"name":"폭풍 오큘러스 (Storm Oculus)","reason":"저항력 대응 보조 [Trinket / 제작: Enchantment×1 + Ice×1 + Lightning×1 + 자유×3, 총 6]","priority":"선택"},{"name":"철학자의 돌 (Philosopher's Stone)","reason":"충전 관리 보조 [Trinket / 제작: 자유×10, 총 10]","priority":"선택"}],"craftNotes":["Rapid Ritual Rod=Ritual×2+자유×5. Blood Basin(Blood+Ritual)이나 Holy Water(Holy+Ritual) 등 Ritual 재료를 모은다.","Storm Burst가 Ritual of Storms 업그레이드를 받아야 Rapid Ritual Rod 시너지가 발생.","Boreal Armor/Robe of Storms/Fae Plate는 모두 몸통 장비로 하나만 착용."],"auto":["Storm Burst→Ritual of Storms로 최대 3턴 채널링.","Rapid Ritual Rod는 Ritual 채널마다 1회 추가 발동. Dual Nova를 갖추면 두 속성 피해가 중첩.","일반적으로 매턴 무제한 주문으로 변하는 것은 아니며 채널 보호가 필요."],"rotation":["구역 입장 전에 Ice/Lightning 저항·시작 위치 확인.","보호막 시전 후 안전한 거리 유지.","Storm Burst→Dual Nova로 빙결·기절 유도.","Ritual of Storms+Rapid Ritual Rod로 자동 추가 타격.","고저항 보스는 Essence Flux 및 별도 피해로 전환."],"pitfalls":["기본 Storm Burst 충전3개라 너무 이른 남용 주의.","Ritual은 채널링 중 이동·상태이상으로 중단될 수 있음.","Robe of Storms와 Boreal Armor 동시 착용 불가.","Essence Flux는 저항 교환이지 화력 주문이 아니다.","지팡이 복제 제단은 별도 희귀 운에 의존."],"boss":["높은 Ice+Lightning 내성에는 Essence Flux·다른 속성.","실드형 보스에는 Siphon Shields.","모르드레드 시전 중 급사하지 않도록 보호막·Teleport."],"variants":["Dual Nova + Rapid Ritual Rod 다단 공격형.","Stormshield+Arcane Warding 방어형.","Essence Flux 저항 대응형.","복제 제단을 얻었을 때 추가 채널틱 강화형."],"evidence":"라이아노즈 실제 승리 #10 Storm Burst+Rapid Ritual Rod, live 데이터의 Ritual of Storms 완료 효과와 Dual Nova 확인. 구역 순서는 추천.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드"},{"id":"iceeye","icon":"👁️","title":"얼음의 눈 · 냉기 연타 폭격","level":"★★★","tagline":"눈동자의 자동 고드름과 눈보라로 냉기 주문 발동 횟수를 늘려 가면 강화","idea":"Eye of Ice는 30턴 지속하며 3턴마다 시야의 적에게 Ice 15 피해. Icy Array로 눈을 중복 유지하고 Eye of Icicles로 눈의 발사마다 Icicle을 추가한다. Ice Frenzy Mask는 냉기 주문을 시전할 때마다 Ice 주문/장비 피해를 6턴 동안 +2 중첩. Blizzard→Hailstorm이 생성한 구름마다 매턴 25% 확률로 Icicle을 시전하며 스택을 빠르게 올린다. 냉기 면역과 본체 피격이 약점.","first":["1구역: Icicle로 안전한 물리+냉기 기본 공격.","2~4구역: Eye of Ice 확보(3턴에 한 번 자동 Ice).","4~7구역: Icy Array와 Fae Plate/Arcane Warding 확보.","7~11구역: Eye of Icicles와 Ice Frenzy Mask 제작(Ice×2+자유×4).","11~15구역: Blizzard→Hailstorm 추가, 조건되면 Blizzard Beacon.","15~18구역: Icicle→Corrosive Shard로 Poison/Dark·저항 감소 대책.","19~21구역: 가면/로브는 슬롯 택일. 보호막·비냉기 단일 화력 보강."],"phases":[{"range":"1–3","target":"고드름","actions":["Icicle은 물리 직접 피해+좁은 냉기 범위이므로 초반 공격으로 효율적.","얼음 면역 다수 균열은 피한다."]},{"range":"4–7","target":"얼음 눈 중첩","actions":["Eye of Ice 기본 공격은 3턴마다 자동 한 번, 지속 30턴. 매턴 공격으로 오해하지 않는다.","Icy Array를 구매하면 눈을 여러 개 유지해 자동 타격 수를 늘린다.","Fae Plate/Arcane Warding으로 눈이 반응하는 사이 생존한다."]},{"range":"7–11","target":"고드름의 눈+가면","actions":["Eye of Icicles는 눈이 적을 때릴 때 Icicle을 추가 시전.","Ice Frenzy Mask는 냉기 주문 시전마다 피해 +2 버프를 6턴간 중첩.","Icy Chill Mask는 시야 광역 냉기 피해 대안. 두 가면은 같은 머리 슬롯이다."]},{"range":"11–15","target":"눈보라 자동 연타","actions":["Blizzard→Hailstorm: 생성된 눈보라 구름 하나당 매턴 25% 확률로 Icicle 추가.","Blizzard Beacon은 매턴 무작위 눈보라 구름을 공급하지만 상황에 따라 적을 못 맞힐 수 있다.","Robe of Crystals는 Arcane+Ice 추가 공격, Robe of Frostfire는 Fire+Ice로 저항 대처."]},{"range":"15–18","target":"내성 대응","actions":["Icicle→Corrosive Shard는 Poison/Dark 추가와 무작위 저항 -10%를 부여. 냉기 저항만 확정 감소시키지는 않는다.","Ice Frenzy Mask 효과는 주문 시전 횟수에 달렸으므로 눈 타격이 끊기지 않도록 시야 확보.","로브와 Fae Plate는 모두 몸통 슬롯, 공격/방어 하나만 선택."]},{"range":"20–21","target":"보스 유지력","actions":["단일 보스에게 눈의 자동 공격을 집중할 수 있으나 얼음 면역이라면 추가 화력 필요.","Blizzard Hailstorm+Corrosive Shard로 약점 형성 후 다른 속성으로 마무리.","Arcane Warding/Teleport로 강한 원거리 다단 공격 회피."]}],"spells":[{"name":"고드름 (Icicle)","up":"Corrosive Shard (5SP)","reason":"Physical+Ice, 후반 Dark/Poison·무작위 저항감소","priority":"시작"},{"name":"얼음의 눈 (Eye of Ice)","up":"Icy Array (4SP)","reason":"눈 중복 유지","priority":"핵심"},{"name":"얼음의 눈 (Eye of Ice)","up":"Eye of Icicles (6SP)","reason":"눈 타격 때 Icicle 추가 발동","priority":"핵심"},{"name":"눈보라 (Blizzard)","up":"Hailstorm (7SP)","reason":"구름마다 25% Icicle 반복 시전","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"자동 공격 사이 본체 방어","priority":"안전"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"시야 확보·회피","priority":"안전"},{"name":"얼음 드레이크 (Ice Drake)","up":"기본","reason":"초중반 탱킹 필요 시","priority":"선택"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"고실드 보스","priority":"후반"}],"gear":[{"name":"얼음 광란 가면 (Ice Frenzy Mask)","reason":"Ice 주문마다 냉기 피해+2/6턴 중첩 [Head / 제작: Ice×2 + 자유×4, 총 6]","priority":"핵심"},{"name":"냉기의 가면 (Icy Chill Mask)","reason":"Ice 시전마다 대상 시야의 적 추가 냉기 피해, 머리 대안 [Head / 제작: Eye×1 + Ice×2 + 자유×6, 총 9]","priority":"대안"},{"name":"수정 로브 (Robe of Crystals)","reason":"Ice/Arcane 시전 시 Ice+Arcane 추가 공격 [Body / 제작: Arcane×1 + Ice×1 + Eye×1 + 자유×3, 총 6]","priority":"공격 몸통"},{"name":"서리불꽃 로브 (Robe of Frostfire)","reason":"Ice/Fire 시전 시 Ice+Fire 추가 공격 [Body / 제작: Fire×1 + Ice×1 + Eye×1 + 자유×3, 총 6]","priority":"몸통 대안"},{"name":"폭풍 로브 (Robe of Storms)","reason":"Ice/Lightning 처치 시 보호막 [Body / 제작: Ice×1 + Lightning×1 + Nature×1 + 자유×3, 총 6]","priority":"안전 몸통"},{"name":"눈보라 신호기 (Blizzard Beacon)","reason":"매턴 눈보라 구름 자동 생성 [Trinket / 제작: Ice×2 + Translocation×1 + 자유×2, 총 5]","priority":"확장"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보호막, 로브와 택일 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"초반"}],"craftNotes":["Ice Frenzy Mask=Ice×2+자유×4. Elemental Ice(Ice), Frostpetal(Ice+Nature), Glacial Script(Ice+Word)를 재료 후보로.","Icy Chill Mask는 Eye×1+Ice×2+자유×6; Retinal Jelly(Eye+Slime), Watcher Stone(Eye+Metallic) 등 Eye 재료가 필요.","얼음 가면 두 종류는 머리 한 칸, Robe of Crystals/Frostfire/Storms/Fae Plate는 몸통 한 칸에서 선택."],"auto":["Eye of Ice 기본 3턴 간격 자동 냉기 공격. Icy Array로 중복 유지.","Eye of Icicles는 눈 발사 시 Icicle 추가, Ice Frenzy Mask의 강화 스택을 늘린다.","Blizzard→Hailstorm은 구름별 매턴 25% Icicle, Blizzard Beacon은 구름 자동 공급."],"rotation":["Icicle로 초반 돌파 및 Eye of Ice 설치.","Icy Array로 여러 눈 유지, 본체 보호막 사용.","Eye of Icicles+Ice Frenzy Mask의 주문 반복 강화.","Blizzard→Hailstorm으로 Icicle 자동 발동 확대.","냉기 저항은 Corrosive Shard와 다른 속성으로 대응."],"pitfalls":["Eye of Ice는 기본 3턴에 한 번 타격.","Icy Array·Eye of Icicles 모두 SP 비용이 크므로 초반 한 번에 구매 어려움.","Ice Frenzy와 Icy Chill은 머리 장비 택일.","여러 로브·Fae Plate는 몸통 택일.","Corrosive Shard의 감소 저항 속성은 무작위.","빙결·냉기 면역 적에는 별도 피해 필요."],"boss":["눈의 여왕 등 Ice 면역 상대로 물리·Dark·Poison/다른 속성 활용.","실드 보스에는 Siphon Shields.","모르드레드 단일 고HP에 눈 화력 집중 전 방어·Teleport 준비."],"variants":["Ice Frenzy Mask+Icy Array/Eye of Icicles 반복 냉기형.","Icy Chill Mask+Blizzard Beacon 화면 냉기 확산형.","Robe of Crystals 혼합 Arcane형.","Robe of Storms+Arcane Warding 생존형."],"evidence":"라이아노즈 실제 Cryomancer #14 승리 기록. live 데이터 Eye 3턴, 가면 +2/6턴, Hailstorm 구름별 25% 확인. 단계는 재구성.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드"},{"id":"bluelion","icon":"🦁","title":"푸른 사자 · 음파 보호막 반격","level":"★★★","tagline":"푸른 사자가 보호막을 공급하고 깨질 때 Sonic Shields가 침묵 반격","idea":"Blue Lion은 Arcane·Nature·Holy 소환수이며 기본 3턴 간격으로 시야 내 아군에 실드 1(상한2)을 부여한다. Sonic Shields는 주문이 아닌 장신구로, 아군의 실드가 깨질 때 5타일 시야 내 최대2 적에게 Physical+Arcane 피해 각1과 침묵2턴을 준다. Magic Minion Shield가 Arcane 아군 소환 때 실드3을 주며, Void Hunter's Sigil은 Arcane 유닛 사망 시 Arcane 주문 충전 하나를 회복한다. Magic Missile→Arcane Crossfire 및 Disperse→Violent Warp로 부족한 화력을 보완한다.","first":["1구역: Magic Missile 한 종류로 시작.","2~4구역: Disperse로 적을 흩뜨려 생존, Violent Warp는 SP 여유 있을 때.","4~7구역: Blue Lion 확보, 3턴마다 아군에게 보호막이 부여되는지 확인.","7~11구역: Sonic Shields 제작(Arcane×2+Metallic×1+자유×5).","10~14구역: Magic Minion Shield로 Arcane 아군 생성 즉시 실드3, Crossfire로 직접 화력 추가.","14~18구역: Void Hunter's Sigil 제작(Arcane×2 + Arcane×2 + 자유×6)로 사망 시 충전 회복.","19~21구역: Quipu Saga 장비 피해 성장과 비Arcane 피해·보호막 대응."],"phases":[{"range":"1–3","target":"미사일·분산 생존","actions":["Magic Missile로 초반 적 정리.","Disperse는 범위 내 유닛 랜덤 순간이동으로 위험 적을 분리하는 생존 도구."]},{"range":"4–7","target":"푸른 사자 배치","actions":["Blue Lion은 HP28, Arcane/Physical 저항50%, 3턴마다 아군 시야 내 실드1(최대2)을 부여.","Lion Saviors는 구역 최초로 본체 HP 50% 미만이면 사자 3마리를 소환. 이 조건을 고의로 만들지는 않는다."]},{"range":"7–11","target":"Sonic Shields 연동","actions":["Sonic Shields는 아군 실드가 깨져야 발동, 최대2 적에 Physical+Arcane 각각1 피해·침묵2턴.","Magic Minion Shield는 Arcane 아군 소환 때 실드3(다른 아군은 1) 제공.","실드를 보호할 몬스터가 없으면 자동 공격이 발생하지 않으므로 위치 선정이 중요."]},{"range":"11–15","target":"Arcane 화력 추가","actions":["Magic Missile→Arcane Crossfire는 직접 수동 시전할 때 Arcane 아군이 추가 발사한다.","Disperse→Violent Warp는 순간이동된 적에게 Magic Missile을 발사해 광역 보조.","Arcane 면역 적은 다른 속성 공격 필요."]},{"range":"15–19","target":"죽음→충전 회수","actions":["Void Hunter's Sigil은 Arcane 유닛 사망마다 소유 Arcane 주문 하나의 충전 1 회복.","Blue Lion은 Arcane 태그가 있어 사망→충전 흐름이 가능하나 회복 주문 선택은 고정되지 않는다.","Quipu Saga 희귀 재료를 Sonic Shields 제작에 쓰면 damage 속성 있는 장비에 구역 종료 때마다 +1 피해를 부여할 수 있다."]},{"range":"20–21","target":"모르드레드","actions":["Sonic Shields 기본 물리/비전 피해가 낮으므로 자동 반격만으로 단일 고HP 보스를 끝내기 어렵다.","고실드 적에 Siphon Shields, Arcane 면역 적에 별도 피해 유형을 준비.","Arcane Warding과 Teleport로 본체 생존 후 직접 Magic Missile/Disperse 화력 병행."]}],"spells":[{"name":"마법 미사일 (Magic Missile)","up":"Arcane Crossfire (1SP)","reason":"수동 시전시 Arcane 아군 추가 사격","priority":"시작+중반"},{"name":"분산 (Disperse)","up":"Violent Warp (6SP), Protective Warp (2SP)","reason":"위치 제어·Magic Missile 추가 시전","priority":"중반"},{"name":"푸른 사자 (Blue Lion)","up":"Lion Saviors (4SP), Holy Bolt (2SP)","reason":"아군 실드 공급·위기시 추가 사자·Holy 보조","priority":"핵심"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"본체 보호막","priority":"안전"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"보스 실드 제거","priority":"후반"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"배치·도주","priority":"안전"},{"name":"영속성 (Permanence)","up":"Reality Hold (4SP)","reason":"다른 임시 Arcane 소환수를 쓰는 경우만","priority":"선택"}],"gear":[{"name":"음파 보호막 (Sonic Shields)","reason":"아군 실드 파괴 시 자동 Physical+Arcane 피해/침묵 [Trinket / 제작: Arcane×2 + Metallic×1 + 자유×5, 총 8]","priority":"핵심"},{"name":"마법 소환수 보호막 (Magic Minion Shield)","reason":"Arcane 아군 소환 순간 실드3, 그 외 아군1 [Trinket / 제작: Arcane×1 + Conjuration×1 + 자유×3, 총 5]","priority":"보조"},{"name":"공허 사냥꾼의 인장 (Void Hunter's Sigil)","reason":"Arcane 유닛 사망시 Arcane 주문 무작위 충전 1회복 [Trinket / 제작: Arcane×2 + Arcane×2 + 자유×6, 총 10]","priority":"후반 핵심"},{"name":"요정 판금 (Fae Plate)","reason":"본체 생존 보호막 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"},{"name":"요정 가시 지팡이 (Fae Thorn Staff)","reason":"Arcane/Nature 주문 시 Fae Thorn 소환으로 아군 물량 보강 [Weapon / 제작: Arcane×1 + Conjuration×1 + Nature×2 + 자유×2, 총 6]","priority":"무기 선택"},{"name":"수정 로브 (Robe of Crystals)","reason":"Arcane 주문에 Ice+Arcane 추가 공격, Fae Plate와 택일 [Body / 제작: Arcane×1 + Ice×1 + Eye×1 + 자유×3, 총 6]","priority":"몸통 대안"}],"craftNotes":["Arcane Mote(Arcane), Voidstone Shard(Arcane+Sorcery), Slime Core(Arcane+Slime), Mithril Ore(Metallic) 등 모으기.","Void Hunter's Sigil의 Arcane×2+Arcane×2는 같은 속성 요구 묶음 두 개다. 총 요구 10으로 제작이 비싸다.","Quipu Saga는 희귀 On Craft 재료로 damage 특성이 있는 장비를 제작하면 매 구역 종료 때 피해 +1. Sonic Shields 강화에 적합."],"auto":["Blue Lion은 3턴마다 아군 실드 공급, Magic Minion Shield는 소환 순간 실드 추가.","아군 실드가 공격으로 깨질 때 Sonic Shields가 물리+비전 피해와 침묵을 자동 발동.","Arcane 태그 사자 등 아군 사망 시 Void Hunter's Sigil이 Arcane 주문 충전 하나를 회복.","Magic Missile→Arcane Crossfire는 반드시 직접 시전해야 하는 별도 공격 경로."],"rotation":["Magic Missile/Disperse로 초반 위치와 공격을 관리.","푸른 사자를 적과 본체 사이에 배치해 아군 실드 공급.","Sonic Shields+Magic Minion Shield 준비 후 적이 실드를 깰 때 반격·침묵 확인.","Arcane Crossfire/Violent Warp로 직접 화력 보충.","Void Hunter's Sigil로 소환수 사망 시 충전 회수, 보스는 대체 피해로 마무리."],"pitfalls":["Sonic Shields는 주문이 아니라 장신구이므로 직접 시전하지 않는다.","아군 실드가 깨지지 않으면 발동하지 않는다.","기본 데미지가 작아 보스에게는 추가 강화 필요.","Void Hunter's Sigil은 특정 주문 충전을 반드시 돌려주지는 않는다.","Arcane Crossfire는 직접 Magic Missile 시전 조건.","Robe of Crystals와 Fae Plate는 같은 몸통 슬롯."],"boss":["Arcane 면역 적에게 Sonic Shields의 Physical 피해/다른 속성 공격 필요.","높은 실드는 Siphon Shields로 제거.","모르드레드 본체는 보호막/회피를 확보한 뒤 수동 Arcane 미사일과 다른 유효 속성 사용."],"variants":["기본형: Blue Lion+Sonic Shields+Arcane Warding.","충전 순환형: Void Hunter's Sigil+Magic Minion Shield.","공격형: Magic Missile→Arcane Crossfire + Disperse→Violent Warp.","희귀 성장형: Quipu Saga를 Sonic Shields에 제작 사용."],"evidence":"라이아노즈 Manamancer #18 실제 승리+live 데이터 비교. Blue Lion 보호막 쿨다운3, Sonic Shields 반응·기본 피해·Silence2, Void Hunter's Sigil 제작식 확인. 구역은 재구성.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드"}],"tips":{"principles":[["🎯","한 턴 후 위험을 먼저 계산","적을 얼마나 때리느냐보다 내 행동이 끝난 뒤 몇 마리가 나를 공격할 수 있는지가 중요."],["👁️","T / L로 시야와 위협 확인","T=위협 범위, L=시야. 시작 타일과 매 턴 이동할 타일을 확인."],["🚪","보상보다 안전한 균열","주력 속성 100% 저항 적, 긴 사거리, 소환사, 기절·공포 적은 초반에 피하기."],["🧱","벽·모서리·병목 활용","원거리 적 다수에게 동시에 노출되는 대신 벽 뒤에 숨어 한두 마리씩 상대."],["🎯","당장 위험한 적 먼저 제거","행동 불능 유발 → 소환사/회복 적 → 원거리 광역 → 일반 근접 순서가 대체로 유리."],["🛡️","보호막은 공격 횟수를 막는다","보호막 3개면 강한 공격 3회는 막지만 약한 다단 공격 4회엔 체력 피해가 날 수 있음."],["🔮","4구역 전 역할 3가지 이상","단일 처치, 다수 처치, 탈출·방어·소환 중 1개 이상을 갖추는 것이 안전."],["💰","SP는 빌드와 생존 사이 균형","핵심 업그레이드 전 무분별한 주문 구매를 피하되, 반복해서 죽으면 보조 방어를 먼저 구매."],["🧰","제작은 후반까지 미루지 않기","완성형 장비 하나보다 초반에 제작 가능한 보호막/소환 지팡이 하나가 더 유용할 때가 많음."],["🥚","소환수는 방패가 아니라 시간","소환수가 한 턴을 벌어주는 사이 위험한 원거리/상태이상 적을 직접 처리."]],"opening":[["1구역","안전한 공격 + T로 시작 위치 선택","주력 공격 하나만 확보하고 약한 균열로 진입. 시작 위치에서 원거리 적의 사거리와 상태이상 적을 먼저 조사."],["2구역","적 대응을 알아보기","주력 속성 면역 적을 피하고, 소환수나 저비용 보조 마법으로 적의 공격을 분산."],["3구역","첫 장비 확인","얻은 제작 재료로 즉시 만들 수 있는 보호막 또는 소환수 강화 장비를 확인."],["4구역","필요 역할 점검","광역/단일 처치, 생존 또는 이동 중 부족한 수단을 보충."],["5구역","핵심 연계 1개 완성","완전한 엔딩 빌드보다 우선 생존. 위험한 보상보다 클리어 가능한 균열을 선택."]],"enemies":[["위험한 상태이상","기절(Stun)·공포(Fear)·빙결(Frozen)·침묵(Silence)","상태이상 적은 피해량이 낮아도 최우선으로 제거/제어."],["소환사","추가 적을 생성하는 몬스터","그대로 두면 적 수가 불어나므로 먼저 처치하거나 소환 전력 자체를 막기."],["고저항 적","주력 피해 유형 저항력 100%","공격을 몇 번 쓸지 고민하기 전에 적 정보와 속성을 확인."],["원거리 광역","시야 바깥이나 벽 관통/넓은 공격","위협 범위 시각화만 믿지 말고 주문 설명과 타일 배치 확인."]],"materials":[["슬라임 핵 (Slime Core)","획득 시 아군 공허 슬라임(Void Slime) 3마리 소환 — 전투 중 유용할 수 있음."],["아스트랄 성물함 (Astral Phylactery)","획득 시 영혼 항아리(Soul Jar) 생성; 항아리가 살아있는 동안 생존 효과."],["요정 판금 (Fae Plate)","방어 장비 우선 후보. 매 턴 보호막 공급(정확한 상한은 현재 버전 툴팁 확인)."],["재료의 On Pickup / On Craft","획득하는 순간의 효과와 제작에 소비할 때 발동하는 효과를 반드시 구별."],["제작 코드의 *","자유 재료 슬롯. 제작 창에서 정확한 태그와 개수 확인."]],"bosses":[["개구리 교황 (Pope the Frog)","턴당 피해 상한 때문에 극딜보다 지속 방어가 중요."],["아마루 (Amaru)","화염·냉기 면역과 Sorcery/Enchantment 유형 피해 무효에 주의."],["전기의 육체 (The Body Electric)","직접 대상 지정 마법에 반격. 간접 피해·소환수 활용."],["눈의 여왕 (Snow Queen)","냉기·독 면역, 추가 형태/보호막 관리."],["오판 (Ophan)","피해를 다른 아군에게 전가하므로 주변의 특수 적부터 제거."],["모르드레드 (Mordred)","다수 적 정리·단일 보스 피해·생존 수단을 모두 준비. 소환수만 늘리지 않기."]],"checklist":["적 저항력과 상태이상 공격을 확인했다","T로 시작 위치 위협 범위를 확인했다","즉시 죽일 수 있는 위험한 적이 누군지 안다","내 주력 피해가 통한다","방어·소환·이동 중 하나 이상의 대응 수단이 있다","제작 가능한 장비를 확인했다","이번 행동이 끝나면 얼마나 공격받는지 예상했다"]},"updated":"2026-11-04","meta":"2026-11-04 실전 승리 기록과 Rift Wizard 3 Compendium live(24995190) 주문·장비·제작식 대조로 신규 6개 빌드 추가. 모든 성장 구역은 추천이며 장비는 제작 재료·게임 버전에 따라 변경될 수 있음."};
const $=x=>document.getElementById(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getStore=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};
let state={id:'intro',tab:'overview',q:'',closed:false,checks:getStore('rw3_checks',{}),theme:getStore('rw3_theme','light')};
function saveChecks(){try{localStorage.setItem('rw3_checks',JSON.stringify(state.checks))}catch{}}
function setTheme(v){state.theme=v;document.documentElement.dataset.theme=v;try{localStorage.setItem('rw3_theme',JSON.stringify(v))}catch{}}
setTheme(state.theme);
const groups=['게임 안내','입문 추천','핵심 빌드 1–4','소환·방어','신규 연구 빌드','기타 빌드'];
const sections=[{id:'intro',icon:'📖',title:'Rift Wizard란?',group:'게임 안내',tagline:'게임 소개 · 시스템 · 플레이 흐름'},{id:'tips',icon:'📘',title:'게임 전체 생존 팁',group:'입문 추천',tagline:'균열·시야·SP·제작·보스'},...D.builds];
const tabs=[['overview','개요·바로 시작'],['route','구역별 성장 루트'],['gear','마법·업그레이드·장비'],['battle','전투·보스 대응']];
const tipTabs=[['overview','핵심 생존 원칙'],['route','1–5구역 운영'],['gear','제작·장비·적 분석'],['battle','보스·출발 체크']];
const introTabs=[['overview','게임 소개'],['route','게임 진행 흐름'],['gear','마법·장비 시스템'],['battle','초보자 시작 가이드']];
const pageTabs=id=>id==='intro'?introTabs:id==='tips'?tipTabs:tabs;
function hashRead(){const raw=location.hash.slice(1).split('/');let id=raw[0]||'intro';state.id=sections.some(x=>x.id===id)?id:'intro';state.tab=pageTabs(state.id).some(x=>x[0]===raw[1])?raw[1]:'overview';}
function go(id,tab='overview'){state.id=id;state.tab=tab;location.hash=id+'/'+tab;render();window.scrollTo({top:0,behavior:'instant'});if(innerWidth<=820)closeSidebar();}
function renderNav(){let q=state.q.toLocaleLowerCase();let content='';for(const group of groups){let items=sections.filter(s=>s.group===group&&(!q||[s.title,s.tagline,s.id,...(s.spells||[]).map(x=>x.name),...(s.gear||[]).map(x=>x.name)].join(' ').toLocaleLowerCase().includes(q)));if(!items.length)continue;content+='<div class="sgroup"><h3>'+esc(group)+'</h3>';for(let s of items)content+='<button class="navitem '+(s.id===state.id?'active':'')+'" data-go="'+s.id+'"><span class="emoji">'+s.icon+'</span><span class="ntext">'+esc(s.title)+'<span class="desc">'+esc(s.tagline)+'</span></span></button>';content+='</div>'} $('nav').innerHTML=content||'<div class="empty">검색 결과가 없습니다.</div>';document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));}
function renderTabs(list){return '<nav class="tabs" aria-label="페이지별 상세 내용">'+list.map(([id,txt])=>'<button role="tab" aria-selected="'+(state.tab===id)+'" data-tab="'+id+'">'+txt+'</button>').join('')+'</nav>'}
function renderFooter(){return '<div class="footer">업데이트·정리: '+D.updated+' · '+esc(D.meta)+'<br>관련 마법·제작 코드·SP 비용은 게임 버전마다 바뀔 수 있으므로 실제 툴팁이 최우선입니다.</div>'}
function renderSources(arr){return '<section class="source"><h2>해외 원문·데이터 확인</h2>'+arr.map(([name,url])=>'<a target="_blank" rel="noopener" href="'+esc(url)+'">↗ '+esc(name)+'</a>').join('')+'</section>'}
function list(items,cls='cleanlist'){return '<ul class="'+cls+'">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function checkRows(key,items){let done=items.filter((v,i)=>state.checks[key+':'+i]).length;return '<div class="card flat"><div class="flexbetween"><b>✅ 플레이 체크리스트</b><small>'+done+' / '+items.length+' 완료</small></div><div class="progress"><div class="fill" style="width:'+(100*done/items.length)+'%"></div></div>'+items.map((x,i)=>'<label class="checkline"><input type="checkbox" data-check="'+key+':'+i+'" '+(state.checks[key+':'+i]?'checked':'')+'><span>'+esc(x)+'</span></label>').join('')+'<div style="text-align:right;margin-top:14px"><button class="btn" data-reset="'+key+'">체크 초기화</button></div></div>'}
function summaryCard(title,items){return '<section class="card flat"><h3>'+esc(title)+'</h3>'+list(items)+'</section>'}
function introPage(){
let intro='<div class="kicker">GAME INTRODUCTION · TURN-BASED ROGUELIKE</div><h1>📖 Rift Wizard란?</h1><p class="lede">마법의 조합을 직접 설계하고, 위험한 균열을 하나씩 선택해 돌파하는 고난도 턴제 전략 로그라이크입니다. ‘얼마나 좋은 장비를 얻었는지’보다 <b>지금 배우고 싶은 마법을 어떻게 연결하고 다음 턴을 살아남을지</b>가 승부를 가릅니다.</p>'+renderTabs(introTabs);
let body='';
if(state.tab==='overview'){
body='<section class="summary"><b>한 줄 소개</b><p>기억을 잃은 불멸의 마법사가 우주 곳곳의 균열을 돌파해 숙적에게 도전합니다. 매번 새로운 마법과 제작 장비를 조합하고, 전투에서의 한 턴 한 턴을 계산하며 나아가는 게임입니다.</p></section><h2>이 게임만의 특별한 점</h2><div class="tipgrid">'+[
['🧙','나만의 마법서','마법과 업그레이드를 정해진 직업 트리 대신 자유롭게 선택하고 조합합니다.'],
['⚡','한 턴의 무게','내가 한 번 행동하면 적도 행동합니다. 공격보다 적의 위협 범위·시야·위치를 먼저 보는 것이 중요합니다.'],
['🚪','균열과 시작 위치 선택','다음 구역의 적·보상을 살피고 들어갈 균열과 출발 위치를 선택합니다.'],
['⚒️','제작과 시너지','재료로 장비를 만들고, 한 주문이 다른 주문·소환수·장비 효과를 연쇄적으로 발동하게 만듭니다.'],
['♻️','매번 달라지는 도전','죽으면 그 시도의 성장이 끝나지만, 다음 판에는 새로운 주문과 장비 조합을 시도할 수 있습니다.'],
['📚','앞서 해보기','2026년 6월 23일 앞서 해보기로 출시되어 마법·장비·밸런스가 계속 변경됩니다.']
].map(([em,title,desc])=>'<section class="card"><span class="em">'+em+'</span><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></section>').join('')+'</div><div class="note">2026년 10월 기준 개발사 소개: 200종 이상의 마법, 400종 이상의 주문 업그레이드, 300종 이상의 제작 장비를 표방합니다. 개별 수치와 효과는 패치에 따라 달라질 수 있습니다.</div>';
}
if(state.tab==='route'){
body='<h2>한 번의 플레이는 이렇게 흘러갑니다</h2><div class="timeline">'+[
['① 준비','주문과 SP','게임 진행 중 얻는 주문 포인트(Spell Points, SP)로 필요한 주문·업그레이드를 구매합니다. 처음에는 공격 한 종류와 생존 방법을 마련합니다.'],
['② 균열 선택','적 구성과 보상 비교','어떤 적이 나오며 무엇을 얻는지 확인합니다. 주력 속성에 면역인 적이 많다면 다른 균열을 선택할 수 있습니다.'],
['③ 전투','시작 위치와 한 턴 계산','원거리 적의 위협 범위(T), 시야(L), 상태이상을 확인합니다. 한 행동 뒤 적이 어떻게 대응할지 예상해야 합니다.'],
['④ 성장','전리품과 장비 제작','제작 재료와 보상을 이용해 소환수 강화·보호막·마법 연쇄를 완성합니다. 빌드의 핵심 엔진을 하나씩 연결합니다.'],
['⑤ 마지막 도전','20구역과 최종 전투','후반 특수 보스와 숙적 모르드레드에 대비합니다. 높은 저항력, 보호막, 소환수 제어 등 빌드의 약점 대책이 필요합니다.']
].map(([r,t,a])=>'<section class="step"><div class="stepnum">'+esc(r)+'</div><div><h3>'+esc(t)+'</h3><p>'+esc(a)+'</p></div></section>').join('')+'</div><div class="callout"><b>핵심:</b> 고정된 맵을 빨리 통과하는 게임이 아니라, 내가 상대할 적과 보상을 고르고 그 적을 이길 마법을 설계하는 게임입니다.</div>';
}
if(state.tab==='gear'){
body='<h2>기본 시스템 정리</h2><div class="tablewrap"><table><thead><tr><th>용어</th><th>하는 일</th></tr></thead><tbody>'+[
['주문 포인트 (Spell Points)','새 주문·업그레이드를 구입하는 자원. 무작정 여러 주문에 분산하지 않는 것이 좋습니다.'],
['주문 충전 횟수 (Charges)','한 구역에서 주문을 사용할 수 있는 횟수. 공격 효율과 생존을 함께 고려합니다.'],
['피해 저항력 (Resistance)','속성별 피해 감소. 100% 저항이면 일반적인 해당 속성 공격은 통하지 않을 수 있습니다.'],
['보호막 (Shields)','기본적으로 피해량보다 피격 횟수에 대응하는 방어 자원입니다. 다단 공격에 약할 수 있습니다.'],
['마법 분류·속성 (Tags)','Fire, Ice, Lightning, Arcane, Holy, Dark, Conjuration 등. 주문과 장비의 시너지를 결정합니다.'],
['제작 재료 (Components)','장비의 레시피 슬롯을 채우며, 일부는 줍거나 제작할 때 추가 효과가 발동합니다.'],
['제단 (Shrines)','강화·변환·재료 보상 등 다양한 선택을 제공하는 장소입니다.']
].map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+esc(b)+'</td></tr>').join('')+'</tbody></table></div><h2>빌드의 기본 구성</h2>'+summaryCard('대부분의 빌드에서 필요한 네 역할',['일반 적을 처리하는 주력 공격','여러 적을 한 번에 제어하거나 제거하는 광역 수단','보호막·소환수·순간이동 등 생존 수단','주력 속성 면역 적과 고체력 보스에 대응하는 보조 피해']) ;
}
if(state.tab==='battle'){
body='<h2>처음 플레이한다면</h2>'+summaryCard('실패를 줄이는 다섯 가지 습관',['처음에는 완성형 빌드보다 첫 3구역을 안전하게 통과하는 것이 목표.','균열 선택 전에 적의 위협 범위와 주력 피해의 저항력을 확인.','적을 많이 때리는 행동보다 공격을 덜 받는 행동을 선택.','저렴하게 제작 가능한 보호막·소환 장비를 초반에 활용.','사망 원인을 적 공격·상태이상·위치·면역 중 하나로 기록.'])+'<h2>이 공략집을 보는 순서</h2>'+summaryCard('추천 학습 순서',['① 게임 전체 생존 팁 페이지에서 T키·균열·제작 확인','② 고룡의 알 또는 슬라임 군단으로 초반 생존 연습','③ 빌드별 구역 루트와 체크리스트에 따라 플레이','④ 중후반에는 보스·저항력 대책만 추가해 엔딩 도전'])+'<div class="note">도움이 필요하면 페이지 상단의 목차 열기에서 생존 팁과 빌드를 선택하세요. 구매한 항목 체크는 현재 브라우저 저장소에만 남습니다.</div>';
}
return intro+body+renderSources([['Steam 공식 상점·게임 설명','https://store.steampowered.com/app/4366330/Rift_Wizard_3/'],['개발자 발표·패치 노트','https://steamcommunity.com/app/4366330/allnews/'],['마법·장비 정보 검색','https://hpp3.github.io/rw3/']])+renderFooter();
}
function tipsPage(){let t=D.tips;let intro='<div class="kicker">기본 가이드 · 공통 생존 전략</div><h1>📘 게임 전체 생존 팁</h1><p class="lede">모든 빌드에 공통으로 적용되는 생존 기술입니다. 먼저 시작 위치와 위협 범위부터 확인하면 빌드 완성 전 사망을 줄일 수 있습니다.</p>'+renderTabs(tipTabs);let body='';
if(state.tab==='overview'){body='<div class="callout"><b>초반의 목표는 ‘빌드 완성’이 아니라 ‘다음 한 턴 살아남기’입니다.</b><br>매 턴: 위험 범위 확인 → 위험한 적 제거/제어 → 안전한 위치 확보 순서로 판단하세요.</div><div class="tipgrid">'+t.principles.map(([em,title,desc])=>'<section class="card"><span class="em">'+em+'</span><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></section>').join('')+'</div>'}
if(state.tab==='route'){body='<h2>1–5구역 행동 루틴</h2><div class="timeline">'+t.opening.map(([r,title,desc])=>'<section class="step"><div class="stepnum">'+r+'</div><div><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></div></section>').join('')+'</div><h2>실전 위험도 체크</h2>'+summaryCard('첫 턴에 반드시 할 일',['적을 클릭/호버하고 공격 범위·상태이상·저항력을 확인한다.','T로 적 위협 범위를 확인하고 가장 안전한 시작 타일을 고른다.','이번 턴에 즉시 위험한 적 한 마리 또는 여러 마리를 제거할 수 있는지 본다.','한 턴 공격받을 피해가 치명적이라면 공격 대신 이동·소환·빙결·보호막을 선택한다.'])}
if(state.tab==='gear'){body='<h2>위험한 적 유형</h2><div class="tablewrap"><table><thead><tr><th>유형</th><th>원문 / 예시</th><th>대응</th></tr></thead><tbody>'+t.enemies.map(x=>'<tr>'+x.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><h2>제작 재료·장비 기본</h2><div class="cards">'+t.materials.map(([a,b])=>'<section class="card"><h3>'+esc(a)+'</h3><p>'+esc(b)+'</p></section>').join('')+'</div><div class="note">SP는 강한 주문 하나에 전부 쓰기보다, 현재 부족한 역할(광역/단일/방어/이동)을 먼저 점검하세요. 장비가 제작되면 즉시 효과를 확인하세요.</div>'}
if(state.tab==='battle'){body='<h2>주요 후반 보스 유의점</h2><div class="tablewrap"><table><thead><tr><th>보스</th><th>대응 핵심</th></tr></thead><tbody>'+t.bosses.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</tbody></table></div>'+checkRows('tips',t.checklist)}
return intro+body+renderSources(Object.values({db:sourcesFallback('db'),steam:sourcesFallback('steam')}))+renderFooter();}
function sourcesFallback(k){return ({db:['Rift Wizard 3 Compendium','https://hpp3.github.io/rw3/'],steam:['Steam 빌드 가이드','https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466']})[k]}
function buildPage(b){let intro='<div class="kicker">'+esc(b.group)+' · 난이도 '+esc(b.level)+'</div><h1>'+b.icon+' '+esc(b.title)+'</h1><p class="lede">'+esc(b.tagline)+'</p><div class="chiprow"><span class="chip">'+esc(b.level)+'</span><span class="chip good">마법·장비 영문 병기</span><span class="chip">구역별 목표</span></div>'+renderTabs(tabs);let body='';
if(state.tab==='overview'){body='<section class="summary"><b>🎯 빌드의 작동 원리</b><p>'+esc(b.idea)+'</p></section><h2>지금 바로 시작하는 순서</h2>'+checkRows(b.id+'-first',b.first)+'<div class="note"><b>근거 구분:</b> '+esc(b.evidence)+'</div>'+summaryCard('이 빌드의 특징',[b.tagline, b.level==='★☆☆'?'초보자용 생존과 전투 연습에 적합':'초반 구역에서 생존·SP 관리를 먼저 확인', '게임 패치에 따라 일부 자동 시전/업그레이드 조건이 다를 수 있음'])}
if(state.tab==='route'){body='<h2>초반부터 최종 보스까지</h2><div class="timeline">'+b.phases.map(p=>'<section class="step"><div class="stepnum">'+esc(p.range)+'</div><div><h3>'+esc(p.target)+'</h3>'+list(p.actions)+'</div></section>').join('')+'</div><div class="note">구역별 목표는 별도 표기가 없는 한 해외 공략을 바탕으로 재구성한 <b>추천 진행안</b>입니다. SP·재료 운에 따라 몇 구역 늦어져도 생존을 우선하세요.</div>'}
if(state.tab==='gear'){body='<h2>필수·추천 주문</h2><div class="tablewrap"><table><thead><tr><th>주문 (원문)</th><th>업그레이드</th><th>목적</th><th>우선</th></tr></thead><tbody>'+b.spells.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.up)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.priority)+'</td></tr>').join('')+'</tbody></table></div><h2>추천 장비</h2><div class="tablewrap"><table><thead><tr><th>장비 (원문)</th><th>이유</th><th>시점</th></tr></thead><tbody>'+b.gear.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.priority)+'</td></tr>').join('')+'</tbody></table></div><div class="note">특정 제작식/재료 태그/장비 가격을 검증하지 않은 항목은 억지로 채우지 않았습니다. 아래 Compendium에서 영문명을 검색해 실제 게임 버전과 대조하세요.</div>'+(b.craftNotes?summaryCard('제작 재료·장비 슬롯 안내',b.craftNotes):'')+''}
if(state.tab==='battle'){body=summaryCard('한 전투의 추천 순서',b.rotation)+(b.auto?summaryCard('자동 시전·연쇄 발동 조건',b.auto):'')+summaryCard('자주 실패하는 이유',b.pitfalls)+summaryCard('보스와 면역 대응',b.boss)+(b.variants.length?summaryCard('대체·변칙 운영',b.variants):'')+checkRows(b.id+'-battle',[...b.rotation.map((x,i)=>'전투 순서 '+(i+1)+': '+x)])}
return intro+body+renderSources(b.sources)+renderFooter();}
function render(){renderNav();let b=D.builds.find(x=>x.id===state.id);$('appBody').innerHTML=state.id==='intro'?introPage():state.id==='tips'?tipsPage():buildPage(b);document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>go(state.id,el.dataset.tab));document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.check]=el.checked;saveChecks();let pageY=window.scrollY;render();window.scrollTo(0,pageY)});document.querySelectorAll('[data-reset]').forEach(el=>el.onclick=()=>{for(let key of Object.keys(state.checks))if(key.startsWith(el.dataset.reset+':'))delete state.checks[key];saveChecks();render()});$('sidebarToggle').textContent=state.closed?'☰ 목차 열기':'☰ 목차 접기';$('sidebarToggle').setAttribute('aria-expanded',String(!state.closed));}
function closeSidebar(){state.closed=true;$('sidebar').classList.add('closed');$('shade').classList.add('hidden');render();}
function openSidebar(){state.closed=false;$('sidebar').classList.remove('closed');$('shade').classList.toggle('hidden',innerWidth>820);render();}
$('sidebarToggle').onclick=()=>state.closed?openSidebar():closeSidebar();$('sideClose').onclick=closeSidebar;$('shade').onclick=closeSidebar;$('search').oninput=e=>{state.q=e.target.value;renderNav()};$('theme').onclick=()=>{setTheme(state.theme==='light'?'dark':'light');render()};$('share').onclick=async()=>{let url=location.href;try{await navigator.clipboard.writeText(url);$('share').textContent='✓ 복사됨';setTimeout(()=>$('share').textContent='🔗 링크',1300)}catch{prompt('현재 페이지 주소',url)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.closed)closeSidebar();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();openSidebar();$('search').focus()}});window.addEventListener('hashchange',()=>{hashRead();render()});hashRead();render();
if(innerWidth<=820){closeSidebar()}
</script>
</body></html>
