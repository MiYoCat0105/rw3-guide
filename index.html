hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Melt","cost":2,"tags":"Fire / Sorcery","base":"Target takes 22 Fire damage and loses 100 Physical resist","stats":"피해 22 · 충전 14 · 사거리 5 · 지속 3턴","upgrades":[{"name":"Mass Melt","cost":3,"effect":"Melt gains 6 Num Targets / Melt affects up to 6 enemies in a connected group"},{"name":"Melting Point","cost":3,"effect":"If you end your turn in range of a frozen or soaked enemy, cast Melt on them"},{"name":"Plasmify","cost":3,"effect":"Melt gains 10 Minion Health / Melt gains 3 Minion Damage / Melt gains 3 Minion Range / Summon 2 Red Slimes when Melt kills its target / Adds the Slime tag"},{"name":"White Flame","cost":5,"effect":"When you cast a Fire or Chaos spell other than Melt targeting an enemy, Melt is also cast at the target / Always Active"}]}],"verifiedGear":[{"name":"Armor Melter","slot":"장신구","recipe":"Fire×2 + Metallic×1 + 자유×2","cost":5,"effect":"When enemies take Fire damage, they gain a stack of Melted Armor for 3 turns / Melted Armor reduces Physical resistance by 10","priority":"핵심","verified":true},{"name":"Amulet of Emerald Flame","slot":"장신구","recipe":"Enchantment×1 + Fire×1 + 자유×2","cost":4,"effect":"For every 50 damage dealt by Enchantment spells, the nearest enemy takes 10 Fire damage / Damage Dealt: 0","priority":"핵심 연계","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"선택","verified":true},{"name":"Icy Vengeance Icon","slot":"장신구","recipe":"Conjuration×1 + Dark×1 + Ice×2 + 자유×3","cost":7,"effect":"When your allies die, up to 3 random enemies within 5 tiles take Ice damage equal to half the dead ally's max HP","priority":"선택","verified":true},{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"선택","verified":true}]},{"id":"stonewake","icon":"🪨","title":"스톤웨이크 · 자력 골렘","group":"신규 연구 빌드","level":"★★★","tagline":"골렘을 만들 때 자력화 주문이 반복 발동하는 공학형","idea":"스톤웨이크(Stonewake/Stone Wake)로 골렘을 만들고 북극(North Pole)으로 자력화(Magnetize)를 대량 발동시킨다. 생성 골렘 수만큼 레이저아이·철학자의 돌·마법 지팡이 같은 ‘시전 반응형’ 장비가 작동한다. 기존 소환수 물량전과 달리 소환 자체가 주문·장비 발동 스위치다.","first":["1~3구역은 특정 골렘이 없어도 버틸 수 있는 저비용 공격 또는 전열 소환으로 출발.","스톤웨이크(Stonewake)를 구매하고 소환 위치·지형에 익숙해진다.","북극(North Pole)을 제작/확보해 자력화(Magnetize) 연계를 활성화한다.","시전 반응 장비를 하나씩 추가하고 마지막에 물리 저항 보스 대책을 만든다.","핵심 연계: Stonewake가 벽을 골렘으로 전환→The North Pole가 Metallic 소환마다 Magnetize 자동 시전","핵심 주문이 늦어질 때: The North Pole이 없다면 Stonewake 골렘으로 임시 앞라인을 만들고 Arcane Warding/Teleport로 진행한다.","보스 대비: 벽이 없거나 Physical 저항이 높은 상대는 Dragon Claw→Chaos Claws 또는 독립된 다른 피해 축 추가."],"phases":[{"range":"1–3","target":"초반 버티기","actions":["원본은 지식 제단(Shrine of Knowledge)에서 얻은 강화된 레그헤드(Leghead)로 생존했다.","그 제단 보상은 확정이 아니므로 범용 공격·보호막/소환으로 대체한다.","Stonewake(Lv5)는 시전자 주변 반경3의 벽을 골렘으로 만든다. 벽이 거의 없으면 발동 효율이 급감."]},{"range":"4–7","target":"골렘 준비","actions":["스톤웨이크를 확보하고 골렘 소환이 안전하게 되는 지형을 고른다.","소환 행동 후 적이 본체를 공격할 수 있는지 확인한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"자력화 엔진","actions":["북극(North Pole)을 확보하여 Magnetize 발동을 늘린다.","레이저아이(Rayzoreye), 철학자의 돌(Philosopher’s Stone), 마법 지팡이(Magic Wand) 등의 장비 발동을 시험한다.","The North Pole은 Metallic 아군이 소환될 때 Magnetize를 시전, Razoreye는 Metallic 주문을 시전하면 물리 포격."]},{"range":"13–17","target":"수은·유령 연쇄","actions":["액체 자력(Liquid Magnetism)→수은화(Mercurize)와 유령 소환 연계는 선택적으로 확장한다.","시전 횟수가 늘어나면 성능 저하가 있는지 점검한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"물리 저항 대응","actions":["혼돈의 발톱(Chaos Claws)이 달린 용발톱 군화(Dragonclaw Sabatons)나 다른 속성 보조를 준비한다.","유령/골렘이 고저항 보스에게 실제 피해를 주는지 전투 로그로 확인한다.","Magnetize→Liquid Magnetism(6SP)은 자력화된 유닛 턴 끝에 인접 적에 Mercurize 시전. Mercurize 별도 주문 필요."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["벽이 없거나 Physical 저항이 높은 상대는 Dragon Claw→Chaos Claws 또는 독립된 다른 피해 축 추가.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","벽이 없거나 Physical 저항이 높은 상대는 Dragon Claw→Chaos Claws 또는 독립된 다른 피해 축 추가."]}],"spells":[{"name":"스톤웨이크 (Stonewake)","up":"골렘 생성","reason":"자력화 엔진의 시작점","priority":"필수"},{"name":"자력화 (Magnetize)","up":"북극(North Pole) 장비와 연계","reason":"반복 발동의 중심 효과","priority":"필수 연계"},{"name":"액체 자력 (Magnetize)","up":"액체 자력(Liquid Magnetism, 6 SP)","reason":"Magnetize의 업그레이드. 인접 적에게 Mercurize 발동","priority":"선택"},{"name":"용의 발톱 (Dragon Claw)","up":"혼돈의 발톱 (Chaos Claws)","reason":"물리 저항 적 보완용","priority":"선택"},{"name":"수은화 (Mercurize)","up":"기본","reason":"Liquid Magnetism에서 발동할 효과 확보","priority":"핵심"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"골렘 시동 전 방어","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"벽 없는 구역 탈출","priority":"선택"}],"gear":[{"name":"북극 (The North Pole)","reason":"자력화(Magnetize)를 다수 발동하게 하는 핵심 장비","priority":"필수급"},{"name":"레이저아이 (Razoreye)","reason":"골렘 소환/시전 연쇄의 추가 피해 반응","priority":"중반"},{"name":"철학자의 돌 (Philosopher's Stone)","reason":"반복 시전에 반응하는 보조 자원 엔진","priority":"중반"},{"name":"마법 지팡이 (Magic Wand)","reason":"반복 시전 연계","priority":"중반"},{"name":"용발톱 군화 (Dragonclaw Sabatons)","reason":"혼돈의 발톱 변형으로 물리 피해의 약점 보완","priority":"대체"}],"rotation":["초반 공격과 방어로 골렘 생성 준비 시간을 확보한다.","스톤웨이크로 골렘을 만들고 북극의 발동을 확인한다.","발동된 자력화/추가 공격으로 적 숫자가 줄어드는지 본다.","피해가 통하지 않는 적에게는 혼돈 속성 등 다른 공격을 적용한다.","The North Pole은 Metallic 아군이 소환될 때 Magnetize를 시전, Razoreye는 Metallic 주문을 시전하면 물리 포격.","벽이 없거나 Physical 저항이 높은 상대는 Dragon Claw→Chaos Claws 또는 독립된 다른 피해 축 추가."],"pitfalls":["원본 플레이어는 특정 제단 보상으로 초반을 버텼다. 같은 스타트를 고정적으로 재현할 수 없다.","북극과 다수의 시전 반응 장비를 갖추기 전에는 완성형처럼 강하지 않다.","물리 저항력이 높으면 골렘 물량만으로 부족할 수 있다.","자동 주문 발동이 지나치게 많아지면 게임 진행이 느려질 수 있다.","초기 승리 기록의 Leghead 제단 보상은 고정되지 않는다. 마법/장비 없으면 소환 연쇄가 자동 완성되지 않는다."],"boss":["일반 맵: 골렘 수만큼 발동하는 자력화를 이용해 광역 정리.","물리 저항 보스: 별도 혼돈·비물리 공격을 확보.","모르드레드: 시전 반응 장비가 충분하지 않다면 방어를 늘리고 다른 속성의 피해를 확보.","벽이 없거나 Physical 저항이 높은 상대는 Dragon Claw→Chaos Claws 또는 독립된 다른 피해 축 추가."],"variants":["골렘 물량형: 원본 #4의 스톤웨이크+북극 조합.","철 금속형: 원본 #20의 스톤웨이크+아마겟돈 블레이드(Armageddon Blade)+파멸의 낙인(Doombrand)."],"evidence":"라이아노즈 실제 승리 로그 #4·#20 기반. 초반 핵심 아이템의 입수는 무작위라 장비 의존성이 크다.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Stonewake가 벽을 골렘으로 전환→The North Pole가 Metallic 소환마다 Magnetize 자동 시전","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"초기 승리 기록의 Leghead 제단 보상은 고정되지 않는다. 마법/장비 없으면 소환 연쇄가 자동 완성되지 않는다."},"fallbacks":["The North Pole이 없다면 Stonewake 골렘으로 임시 앞라인을 만들고 Arcane Warding/Teleport로 진행한다.","초기 승리 기록의 Leghead 제단 보상은 고정되지 않는다. 마법/장비 없으면 소환 연쇄가 자동 완성되지 않는다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Stonewake가 벽을 골렘으로 전환→The North Pole가 Metallic 소환마다 Magnetize 자동 시전","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","The North Pole이 없다면 Stonewake 골렘으로 임시 앞라인을 만들고 Arcane Warding/Teleport로 진행한다."],"craftNotes":["핵심 장비 The North Pole의 제작 태그는 Enchantment×2 + Lightning×2 + Metallic×2 + 자유×4 (총 10). 태그 공급 재료 예: Enchantment: Lost Ring(Enchantment), Binding Ring(Conjuration+Enchantment), Cursed Seal(Dark+Enchantment) / Lightning: Lightning Jar(Lightning), Charged Cog(Metallic+Lightning), Fulminite Shard(Lightning+Enchantment) / Metallic: Shielding Shard(Metallic), Charged Cog(Metallic+Lightning), Sacrificial Brand(Blood+Metallic). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Lightning Bolt","cost":1,"reason":"Deal 12 Lightning damage in a beam"},{"kind":"spell","name":"Stonewake","cost":5,"reason":"Walls within 3 tiles become floors, and are transformed into temporary Golems"},{"kind":"spell","name":"Magnetize","cost":2,"reason":"Magnetize target Metallic unit / Enemies within 3 tiles of the magnetized unit are pulled 1 tile toward it each turn / Then, deal 10 Lightning damage to adjacent enemies / Lasts 10 turns"},{"kind":"upgrade","name":"Liquid Magnetism","forSpell":"Magnetize","cost":6,"reason":"At the end of a Magnetized unit's turn, cast Mercurize on adjacent enemies for 1 turns"},{"kind":"spell","name":"Mercurize","cost":2,"reason":"Afflict the target with Mercurized for 6 turns / Mercurized units take 2 Poison and Physical damage each turn / If the target dies while Mercurized, it is raised as a temporary Mercurial Geist / The Geist inherits the max HP of the Mercurized unit"},{"kind":"spell","name":"Dragon Claw","cost":1,"reason":"Deal 20 Physical damage in an arc / Will not damage allies unless directly targeted"},{"kind":"upgrade","name":"Chaos Claws","forSpell":"Dragon Claw","cost":5,"reason":"Dragon Claw also deals Fire and Lightning damage / Adds the Chaos tag"}],"purchaseCost":22,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Stonewake","cost":5,"tags":"Arcane / Conjuration / Nature / Metallic","base":"Walls within 3 tiles become floors, and are transformed into temporary Golems","stats":"충전 3 · 반경 3","upgrades":[{"name":"Return from Dust","cost":3,"effect":"Golems transform back into walls when they die"},{"name":"Crystalline Core","cost":4,"effect":"Adjacent walls are transformed into Crystal Golems instead"},{"name":"Orb Guardians","cost":4,"effect":"When you cast Stonewake, your Orb allies also cast your Stonewake / Adds the Orb tag"},{"name":"Supremacy of Stone","cost":8,"effect":"After the initial burst, every wall in your line of sight is also transformed into a Golem"}]},{"name":"Magnetize","cost":2,"tags":"Lightning / Metallic / Enchantment","base":"Magnetize target Metallic unit / Enemies within 3 tiles of the magnetized unit are pulled 1 tile toward it each turn / Then, deal 10 Lightning damage to adjacent enemies / Lasts 10 turns","stats":"피해 10 · 충전 18 · 사거리 8 · 반경 3 · 지속 10턴","upgrades":[{"name":"Hemomagnetism","cost":1,"effect":"Magnetize gains 4 HP Cost / Magnetism can also target Living units / Adds the Blood tag"},{"name":"Radioactivity","cost":3,"effect":"Lowers an enemy's or raises an ally's Lightning and Arcane resistances by 75% / Magnetize also deals Poison damage to all enemies in its radius each turn"},{"name":"Electromagnetism","cost":4,"effect":"Deals Lightning damage to all enemies in its radius rather than just adjacent ones"},{"name":"Liquid Magnetism","cost":6,"effect":"At the end of a Magnetized unit's turn, cast Mercurize on adjacent enemies for 1 turns"}]},{"name":"Dragon Claw","cost":1,"tags":"Dragon / Sorcery","base":"Deal 20 Physical damage in an arc / Will not damage allies unless directly targeted","stats":"피해 20 · 사거리 1.5","upgrades":[{"name":"Serrated Steel Claws","cost":1,"effect":"Dragon Claw gains 6 Duration / Dragon Claw also inflicts 6 turns of bleed / Adds the Metallic tag"},{"name":"Dragon Tutor","cost":2,"effect":"When an allied Dragon is summoned, replace their normal melee attack with your Dragon Claw spell / Always Active"},{"name":"Frenzied Swipes","cost":4,"effect":"Dragon Claw gains 3 Num Targets / Dragon Claw hits 3 times"},{"name":"Chaos Claws","cost":5,"effect":"Dragon Claw also deals Fire and Lightning damage / Adds the Chaos tag"}]},{"name":"Mercurize","cost":2,"tags":"Dark / Metallic / Enchantment / Conjuration","base":"Afflict the target with Mercurized for 6 turns / Mercurized units take 2 Poison and Physical damage each turn / If the target dies while Mercurized, it is raised as a temporary Mercurial Geist / The Geist inherits the max HP of the Mercurized unit","stats":"피해 2 · 충전 5 · 사거리 5 · 지속 6턴","upgrades":[{"name":"Morbidity","cost":2,"effect":"Mercurized also deals Dark damage"},{"name":"Mercurial Temper","cost":4,"effect":"Each turn, units affected by Mercurized with less than half health become berserk for the remainder of its duration"},{"name":"Mercurial Vengeance","cost":4,"effect":"When a Mercurial Geist is killed, its killer is afflicted with Mercurized"},{"name":"Retrograde","cost":4,"effect":"The cooldowns of the target's spells will not progress while they are Mercurized"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 2 turns"}]}],"verifiedGear":[{"name":"The North Pole","slot":"장신구","recipe":"Enchantment×2 + Lightning×2 + Metallic×2 + 자유×4","cost":10,"effect":"When a Metallic unit is summoned, cast Magnetize on it","priority":"필수급","verified":true},{"name":"Razoreye","slot":"장신구","recipe":"Eye×1 + Metallic×1 + 자유×3","cost":5,"effect":"When you cast a Metallic spell, deal 27 Physical damage to 1 enemy in line of sight per spell level","priority":"중반","verified":true},{"name":"Philosopher's Stone","slot":"장신구","recipe":"자유×10","cost":10,"effect":"This item gains the tags of the components used to craft it / When you cast a spell that shares a tag with this item, there is a 10% chance for all of your spells to regain a charge","priority":"중반","verified":true},{"name":"Magic Wand","slot":"무기","recipe":"자유×5","cost":5,"effect":"This item gains the tags of the components used to craft it / When you cast a spell, for each tag it shares with this item, shoot a 3 damage bolt at a random enemy in your line of sight / If the shared tag is also a damage type, the bolt deals that type of damage, otherwise a random damage type is chosen","priority":"중반","verified":true},{"name":"Dragonclaw Sabatons","slot":"신발","recipe":"Blood×1 + Dragon×2 + Translocation×1 + 자유×3","cost":7,"effect":"When you take a step, cast Dragon Claw on a random adjacent enemy","priority":"대체","verified":true}]},{"id":"skull","icon":"💀","title":"황금 해골 · 죽음의 손길","group":"신규 연구 빌드","level":"★★★","tagline":"원거리에서 ‘죽음의 손길’을 여러 해골이 반복 발동","idea":"뼈 손가락 왕관(Crown of Bony Fingers)은 강력한 죽음의 손길(Touch of Death)을 발동하지만 한 턴에 한 번 임의 대상을 노리기 쉬워 불안정하다. 황금 해골(Golden Skull)의 갑옷 해골(Armored Skull)로 왕관 효과를 복제하면 해골 수만큼 발동 횟수를 늘릴 수 있다.","first":["초반에는 언데드 소환·어둠 공격 외에도 최소한 하나의 안정적인 처리 수단을 확보한다.","황금 해골(Golden Skull)을 확보해 배치와 충전 수급을 연습한다.","뼈 손가락 왕관(Crown of Bony Fingers)을 제작/확보한 후 갑옷 해골(Armored Skull)을 우선 목표로 삼는다.","어둠 면역 몬스터에 화염의 손길(Flametouch)·황혼의 시선(Twilight Gaze)을 준비한다.","핵심 연계: Golden Skull→Armored Skulls로 머리 장비 복제→Crown of Bony Fingers에서 Touch of Death 자동 시전","핵심 주문이 늦어질 때: 왕관이 나오지 않으면 Golden Skull 소환을 임시 탱커로 쓰고 다른 단일 공격으로 전환, 완성되지 않은 자동 Touch of Death를 가정하지 않는다.","보스 대비: Dark 면역 보스에는 Touch of Death→Flametouch(4SP)로 Fire를 추가하고 Twilight Gaze로 Dark/Holy 저항 감소."],"phases":[{"range":"1–3","target":"언데드 스타트","actions":["죽음 계열 저비용 공격 또는 소환수로 시작한다.","이 단계의 고정 구매 순서는 원본에 명시되지 않았다. 생존용 보호막/공격을 우선한다.","Golden Skull Lv5·기본 2충전이므로 Death Bolt 등 저가 암흑 공격으로 SP를 저축한다."]},{"range":"4–7","target":"해골 안정화","actions":["황금 해골을 확보하고 적 공격을 분산할 위치에 배치한다.","해골을 한 위치에 몰아놓고 광역 피해를 함께 맞지 않게 한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"왕관 복제 엔진","actions":["뼈 손가락 왕관 + 갑옷 해골(Armored Skull)을 연결한다.","해골 여러 마리가 죽음의 손길을 발동하는지 확인한다.","Crown of Bony Fingers는 턴마다 Undead 아군 하나가 Touch of Death를 임의 대상에 시전. Armored Skulls는 현재 머리 장비를 복제한다."]},{"range":"13–17","target":"충전·속성 대책","actions":["영혼 수확자(Soul Harvester)로 해골 충전 수급을 보조한다.","화염의 손길(Flametouch), 황혼의 시선(Twilight Gaze)로 어둠 면역을 대비한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"지형·보스 대응","actions":["흡혈귀의 손길(Touch of the Vampire) 및 유령구(Ghostball)로 장애물 많은 지형에 접근한다.","죽음의 손길 외의 속성 피해와 보호막으로 보스의 반격을 견딘다.","Soul Harvester는 주문이 아닌 장신구로 적 사망 시 Dark/Holy 충전 회복 기회가 생긴다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["Dark 면역 보스에는 Touch of Death→Flametouch(4SP)로 Fire를 추가하고 Twilight Gaze로 Dark/Holy 저항 감소.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","Dark 면역 보스에는 Touch of Death→Flametouch(4SP)로 Fire를 추가하고 Twilight Gaze로 Dark/Holy 저항 감소."]}],"spells":[{"name":"황금 해골 (Golden Skull)","up":"갑옷 해골 (Armored Skull)","reason":"왕관 효과를 복제하는 원거리 언데드","priority":"필수"},{"name":"죽음의 손길 (Touch of Death)","up":"최후의 손길 (Final Touch)은 선택","reason":"강력한 단일 피해의 핵심","priority":"필수 연계"},{"name":"화염의 손길 (Touch of Death)","up":"화염 손길(Flametouch, 4 SP)","reason":"Touch of Death의 업그레이드이며 독립 주문이 아님","priority":"중반"},{"name":"황혼의 시선 (Twilight Gaze)","up":"저항력 약화","reason":"어둠 저항/면역 대응","priority":"후반"},{"name":"흡혈귀의 손길 (Touch of Death)","up":"흡혈의 손길(Touch of the Vampire, 2 SP)","reason":"Touch of Death의 업그레이드이며 독립 주문이 아님","priority":"선택"},{"name":"죽음 화살 (Death Bolt)","up":"기본","reason":"저비용 언데드 스타트","priority":"초반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"해골 전개 중 본체 보호","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"근접 Touch of Death 위치 조절","priority":"선택"}],"gear":[{"name":"뼈 손가락 왕관 (Crown of Bony Fingers)","reason":"죽음의 손길을 해골들과 연계하는 빌드 필수품","priority":"필수"},{"name":"요정 판금 (Fae Plate)","reason":"해골을 준비하는 동안 본체 보호막","priority":"안전"},{"name":"영혼 수확자 (Soul Harvester)","reason":"적 처치시 Dark/Holy 충전 회복 확률","priority":"후반"},{"name":"위기 부적 (Crisis Charm)","reason":"본체 급사 대책","priority":"생존"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"해골 소환 보강","priority":"선택"}],"rotation":["원거리에서 살아남을 수 있도록 해골을 나눠 배치한다.","왕관을 가진 해골이 실제로 죽음의 손길을 발동하는지 확인한다.","충전이 소모되면 영혼 수확자로 보충한다.","어둠 면역 적은 화염의 손길·황혼의 시선과 보조 피해로 처리한다.","Crown of Bony Fingers는 턴마다 Undead 아군 하나가 Touch of Death를 임의 대상에 시전. Armored Skulls는 현재 머리 장비를 복제한다.","Dark 면역 보스에는 Touch of Death→Flametouch(4SP)로 Fire를 추가하고 Twilight Gaze로 Dark/Holy 저항 감소."],"pitfalls":["왕관 제작 전에는 공격력이 폭발하지 않는다.","왕관만 있고 해골 숫자가 적으면 턴당 1회 무작위 공격의 한계가 남는다.","어둠 면역 적이 많으므로 단일 속성에 올인하면 실패한다.","최후의 손길(Final Touch)은 원본 플레이어가 제단에서 얻은 보너스다. 필수 구매로 가정하지 않는다.","Flametouch·Touch of the Vampire는 모두 Touch of Death 업그레이드다. 두 업그레이드 제한을 엄수한다."],"boss":["일반 몬스터: 여러 해골의 손길 공격으로 수적 우세.","고저항 적: 황혼의 시선과 화염의 손길로 속성 보완.","20구역 보스: 원본은 최후의 손길 추가 업그레이드 덕분에 매우 빠른 처치를 기록. 항상 보장되지는 않는다.","Dark 면역 보스에는 Touch of Death→Flametouch(4SP)로 Fire를 추가하고 Twilight Gaze로 Dark/Holy 저항 감소."],"variants":["왕관을 얻지 못했다면 다른 언데드 기반의 주력 피해 주문으로 전환.","더 높은 피해 변형: 진화 제단에서 최후의 손길(Final Touch)을 얻었을 때."],"evidence":"라이아노즈 실제 승리 로그 #16(Necromancer 챌린지) 기반. 왕관을 요구하므로 초보자에게는 후반 장비 의존형.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Golden Skull→Armored Skulls로 머리 장비 복제→Crown of Bony Fingers에서 Touch of Death 자동 시전","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Flametouch·Touch of the Vampire는 모두 Touch of Death 업그레이드다. 두 업그레이드 제한을 엄수한다."},"fallbacks":["왕관이 나오지 않으면 Golden Skull 소환을 임시 탱커로 쓰고 다른 단일 공격으로 전환, 완성되지 않은 자동 Touch of Death를 가정하지 않는다.","Flametouch·Touch of the Vampire는 모두 Touch of Death 업그레이드다. 두 업그레이드 제한을 엄수한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Golden Skull→Armored Skulls로 머리 장비 복제→Crown of Bony Fingers에서 Touch of Death 자동 시전","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","왕관이 나오지 않으면 Golden Skull 소환을 임시 탱커로 쓰고 다른 단일 공격으로 전환, 완성되지 않은 자동 Touch of Death를 가정하지 않는다."],"craftNotes":["핵심 장비 Crown of Bony Fingers의 제작 태그는 Dark×1 + Sorcery×1 + 자유×4 (총 6). 태그 공급 재료 예: Dark: Shadeweave(Dark), Cursed Dice(Dark+Sorcery), Cursed Seal(Dark+Enchantment) / Sorcery: Magic Rune(Sorcery), Ancient Inscription(Sorcery+Word), Crimson Sigil(Blood+Sorcery). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Death Bolt","cost":1,"reason":"Deals 10 Dark damage to a target / Slain Living units are raised as Skeletons / Raised skeletons inherit the max HP of the slain unit"},{"kind":"spell","name":"Golden Skull","cost":5,"reason":"Summon a Golden Skull"},{"kind":"upgrade","name":"Armored Skulls","forSpell":"Golden Skull","cost":5,"reason":"The Golden Skull is equipped with a copy of your headwear if you own any"},{"kind":"spell","name":"Touch of Death","cost":2,"reason":"Deal 200 Dark damage to the target"},{"kind":"upgrade","name":"Flametouch","forSpell":"Touch of Death","cost":4,"reason":"Touch of Death also deals Fire damage / Adds the Fire tag"},{"kind":"spell","name":"Twilight Gaze","cost":6,"reason":"Enemies in your line of sight lose 50 Dark and Holy resist / Lasts 10 turns"}],"purchaseCost":23,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Golden Skull","cost":5,"tags":"Dark / Holy / Metallic / Conjuration","base":"Summon a Golden Skull","stats":"충전 2 · 사거리 5","upgrades":[{"name":"Blood Skull","cost":4,"effect":"The Golden Skull can cast your Bloodshift on a 3 turn cooldown / Adds the Blood tag"},{"name":"Armored Skulls","cost":5,"effect":"The Golden Skull is equipped with a copy of your headwear if you own any"},{"name":"Skull Sentry","cost":5,"effect":"When you cast this spell, if there is room, summon a Skull Sentry instead of a Golden Skull"},{"name":"Golden Wheel","cost":6,"effect":"The Golden Skull can cast your Wheel of Death on a 12 turn cooldown"}]},{"name":"Touch of Death","cost":2,"tags":"Dark / Sorcery","base":"Deal 200 Dark damage to the target","stats":"피해 200 · 충전 9 · 사거리 1.5","upgrades":[{"name":"Hand of Death","cost":2,"effect":"Touch of Death gains 4 Num Targets / Touch of Death hits up to 4 more targets adjacent to the caster"},{"name":"Touch of the Vampire","cost":2,"effect":"Touch of Death gains 32 Minion Health / Touch of Death gains 7 Minion Damage / When a Living target is damaged by Touch of Death, you heal for the damage dealt / If it dies to Touch of Death it is raised as Vampire / Adds the Blood tag / Adds the Conjuration tag"},{"name":"Flametouch","cost":4,"effect":"Touch of Death also deals Fire damage / Adds the Fire tag"},{"name":"Final Touch","cost":8,"effect":"Touch of Death deals additional damage equal to the target's max HP"}]},{"name":"Twilight Gaze","cost":6,"tags":"Holy / Dark / Enchantment / Eye","base":"Enemies in your line of sight lose 50 Dark and Holy resist / Lasts 10 turns","stats":"충전 4 · 지속 10턴","upgrades":[{"name":"Shrouded Twilight","cost":2,"effect":"Twilight Gaze also inflicts a 50% range penalty on enemy spells"},{"name":"Arcane Gaze","cost":3,"effect":"Twilight Gaze also reduces Arcane resist / Adds the Arcane tag"},{"name":"Piercing Gaze","cost":4,"effect":"Twilight Gaze affects all enemies, not just those in your light of sight"},{"name":"Resistance Debuff","cost":5,"effect":"Twilight Gaze gains 50 Resistance Debuff"}]},{"name":"Death Bolt","cost":1,"tags":"Dark / Sorcery / Conjuration","base":"Deals 10 Dark damage to a target / Slain Living units are raised as Skeletons / Raised skeletons inherit the max HP of the slain unit","stats":"피해 10 · 충전 20 · 사거리 6","upgrades":[{"name":"Blood Bolt","cost":2,"effect":"Death Bolt gains 1 HP Cost / Death Bolt heals the caster for any damage it deals / Adds the Blood tag"},{"name":"Winter Bolt","cost":2,"effect":"Deathbolt also deals Ice damage / Adds the Ice tag"},{"name":"Soul Battery","cost":3,"effect":"The Wizard gains Soulcharge when Death Bolt kills a target / Soulcharge grants 1 damage to Dark spells and equipment until the level ends"},{"name":"Corpse Explosion","cost":5,"effect":"Death Bolt gains 2 Radius / Killing a unit with Death Bolt deals 3 Dark and Physical damage to enemies in a 2 tile radius around them"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]}],"verifiedGear":[{"name":"Crown of Bony Fingers","slot":"머리","recipe":"Dark×1 + Sorcery×1 + 자유×4","cost":6,"effect":"Each turn, one of your Undead allies casts your Touch of Death spell on a random enemy","priority":"필수","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Soul Harvester","slot":"장신구","recipe":"Dark×3 + Holy×3 + 자유×4","cost":10,"effect":"When an enemy dies, there is a 10% chance to regain a charge of your Dark and Holy spells / This chance is tripled if they died to Dark or Holy damage","priority":"후반","verified":true},{"name":"Crisis Charm","slot":"장신구","recipe":"Holy×1 + Word×1 + 자유×2","cost":4,"effect":"On taking lethal damage, remove all debuffs and heal to full health / Discarded after use","priority":"생존","verified":true},{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"선택","verified":true}]},{"id":"blades","icon":"🗡️","title":"칼날 소환 · 음파 보호막","group":"신규 연구 빌드","level":"★★☆","tagline":"검 군단으로 전선을 만들고 음파 보호막으로 공격을 방어","idea":"칼날 소환(Summon Blade) 의식을 고속화해 한 턴에 다수의 검을 전개한다. 검은 몸으로 적 공격을 소모시키는 역할을 하고, 플레이어는 비전 방호·음파 보호막(Sonic Shields)으로 안전을 확보한다. 기존 늑대나 드래곤 소환과 달리 ‘소환수 자체가 소모 가능한 방패’라는 점이 핵심이다.","first":["초반에는 칼날 소환(Summon Blade)으로 한 번에 감당할 적 수를 제한한다.","피해량보다 검 소환 횟수와 안전한 소환 위치를 우선한다.","중반에 칼날 의식(Ritual of Blades)+검 제작(Bladeworks)을 목표로 한다.","양치기의 지팡이·전쟁군주 깃발·고속 의식 지팡이 중 제작 가능한 것을 확보한다.","핵심 연계: Summon Blade→Bladeworks+Ritual of Blades로 다수 검 소환→Shields 소실 시 Sonic Shields 자동 반격","핵심 주문이 늦어질 때: Sonic Shields·Quipu Saga 재료가 없으면 검으로 적의 공격 횟수를 흡수하면서 본체 보호막·다른 공격으로 진행한다.","보스 대비: Physical 저항이 높은 보스는 Poison Sting→Acidity(-Poison 저항100) 등 별도 피해로 응대."],"phases":[{"range":"1–3","target":"검으로 전선 만들기","actions":["칼날 소환을 공격과 어그로 분산 수단으로 사용한다.","소환수가 막을 수 없는 광역 주문 적은 별도로 제거한다.","Summon Blade Lv1이고 기본 검은 HP9/실드2. 적 공격을 한 턴 벌어주는 저렴한 앞라인."]},{"range":"4–7","target":"검 물량 증가","actions":["칼날 의식(Ritual of Blades), 검 제작(Bladeworks) 업그레이드를 모은다.","이 시점에는 일단 생존 가능한 검 숫자가 목표다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"전선 폭증","actions":["양치기의 지팡이(Shepherd’s Staff), 전쟁군주 깃발(Warlord Banner), 고속 의식 지팡이(Rapid Ritual Rod)로 의식을 가속한다.","원본 클리어 기록에서는 장비가 갖춰져 1턴 약 12자루를 전개했다. 보편적 수치가 아니다.","Bladeworks(6SP)는 검 2마리, Ritual of Blades(9SP)는 8턴 채널/완료 후 8턴간 매턴 검 소환."]},{"range":"13–17","target":"보호막·불멸 보강","actions":["음파 보호막(Sonic Shields)과 퀴푸 사가(Quipu Saga)를 추가한다.","천상의 우상(Heavenly Idol), 필멸성 유예(Suspend Mortality)로 검 재생을 시도한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"보스 파훼","actions":["비전 방호(Arcane Warding)로 본체를 지킨다.","독침(Poison Sting)+산성(Acidity) 업그레이드로 모르드레드 3페이즈의 대책을 확보한다.","Rapid Ritual Rod는 Ritual의 채널을 매턴 추가 발동시키는 무기, Warlord Banner/Shepherd's Staff와 같은 무기 칸에서 선택."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["Physical 저항이 높은 보스는 Poison Sting→Acidity(-Poison 저항100) 등 별도 피해로 응대.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","Physical 저항이 높은 보스는 Poison Sting→Acidity(-Poison 저항100) 등 별도 피해로 응대."]}],"spells":[{"name":"칼날 소환 (Summon Blade)","up":"칼날 의식 (Ritual of Blades), 검 제작 (Bladeworks)","reason":"소모 가능한 검 군단을 빠르게 양산","priority":"필수"},{"name":"비전 방호 (Arcane Warding)","up":"필수 업그레이드 아님","reason":"본체의 보호막 유지","priority":"중반"},{"name":"천상의 우상 (Heavenly Idol)","up":"불멸의 요새(Bastion of Immortality)","reason":"검의 생존력 강화","priority":"후반"},{"name":"필멸성 유예 (Suspend Mortality)","up":"대량 불멸 (Mass Immortality), 끝없는 삶 (Endlessness)","reason":"검 반복 부활","priority":"후반"},{"name":"독침 (Poison Sting)","up":"산성 (Acidity)","reason":"최종 보스에 별도 피해 경로","priority":"후반"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"의식 취소 후 생존","priority":"생존"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"보스 실드 대응","priority":"후반"}],"gear":[{"name":"양치기의 지팡이 (Shepherd's Staff)","reason":"소환 개수 보완","priority":"핵심"},{"name":"전쟁군주 깃발 (Warlord Banner)","reason":"소환 개수 증가에 기여","priority":"핵심"},{"name":"고속 의식 지팡이 (Rapid Ritual Rod)","reason":"칼날 의식을 빠르게 시전","priority":"핵심"},{"name":"기사 우리 (Knight Cage)","reason":"구역 시작 아군 기사 소환. Familiar's Collar는 장비가 아닌 제작 재료(On Craft)","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"핵심 검 의식을 만들기 전 플레이어 보호","priority":"대체"},{"name":"음파 보호막 (Sonic Shields)","reason":"아군 실드 소실 시 자동 반격·침묵","priority":"중반"},{"name":"레이저아이 (Razoreye)","reason":"Metallic 주문 시 물리 반응 포격","priority":"선택"}],"rotation":["안전 타일에서 검을 전방에 소환한다.","검이 적의 공격을 소모시키는 동안 위험한 상태이상 적을 직접 처리한다.","의식 업그레이드를 완성해 검 수를 늘리되 본체가 무방비인 채 채널링하지 않는다.","후반에는 비전 방호+검 부활을 유지하면서 보스의 유효 피해 수단을 점검한다.","Bladeworks(6SP)는 검 2마리, Ritual of Blades(9SP)는 8턴 채널/완료 후 8턴간 매턴 검 소환.","Physical 저항이 높은 보스는 Poison Sting→Acidity(-Poison 저항100) 등 별도 피해로 응대."],"pitfalls":["검은 강한 피해보다는 어그로와 보호막 소모 역할이 더 중요하다.","고급 의식 장비가 없으면 물량이 덜 나오지만 빌드 자체는 굴러간다.","채널링 도중 기절·침묵 등으로 취소될 수 있어 시작 타일 선정이 중요하다.","검 물량만으로 막히는 보스에게는 산성 등 다른 피해가 필요하다.","Sonic Shields는 장신구, Quipu Saga와 Familiar's Collar는 희귀 제작 재료다. 이들을 주문 구매 목록에 넣지 않는다."],"boss":["20구역: 보호막과 군중 제어로 장기전 대비.","오판: 피해 전가 적을 먼저 제거.","모르드레드: 원본은 독침(Poison Sting)+산성(Acidity)으로 3페이즈를 보완해 클리어.","Physical 저항이 높은 보스는 Poison Sting→Acidity(-Poison 저항100) 등 별도 피해로 응대."],"variants":["방어형: 검 물량+비전 방호만 우선해 중반 생존 연습.","완성형: 천상의 우상과 필멸성 유예로 무한 부활을 노린다."],"evidence":"라이아노즈 실제 승리 로그 #15 기반. 1턴 12자루는 특정 장비 조합이 완성된 원본 사례의 수치.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"craftNotes":["Quipu Saga(자연+언령×2)는 희귀 제작 재료이며 장비가 아니다. Sonic Shields 제작 시 사용하면 대미지 특성이 있는 장비의 구역별 피해 성장 효과를 노릴 수 있다.","Familiar's Collar는 희귀 제작 재료(On Craft)로, 소환 장비 제작 시 체력 비용으로 소환수를 Soulbound시키는 용도다.","핵심 장비 Shepherd's Staff의 제작 태그는 Conjuration×1 + 자유×3 (총 4). 태그 공급 재료 예: Conjuration: Incense(Conjuration), Binding Ring(Conjuration+Enchantment), Moonstone(Conjuration+Holy). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"engine":{"core":"Summon Blade→Bladeworks+Ritual of Blades로 다수 검 소환→Shields 소실 시 Sonic Shields 자동 반격","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Sonic Shields는 장신구, Quipu Saga와 Familiar's Collar는 희귀 제작 재료다. 이들을 주문 구매 목록에 넣지 않는다."},"fallba not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]}],"verifiedGear":[{"name":"Shepherd's Staff","slot":"무기","recipe":"Conjuration×1 + 자유×3","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Duration ; Conjuration spells and equipment gain 1 Num Summons ; Conjuration spells and equipment gain 1 Minion Range","priority":"핵심","verified":true},{"name":"Warlord Banner","slot":"무기","recipe":"Conjuration×2 + 자유×6","cost":8,"effect":"All spells and equipment gain 2 Num Summons","priority":"핵심","verified":true},{"name":"Rapid Ritual Rod","slot":"무기","recipe":"Ritual×2 + 자유×5","cost":7,"effect":"Your channeled Ritual spells activate an additional time each turn","priority":"핵심","verified":true},{"name":"Knight Cage","slot":"장신구","recipe":"Conjuration×1 + Arcane×1 + Metallic×1 + 자유×3","cost":6,"effect":"At the beginning of each level summon 2 Animated Knights / The Animated Knights gain bonus HP equal to the the product of your Arcane and Metallic masteries","priority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"대체","verified":true},{"name":"Sonic Shields","slot":"장신구","recipe":"Arcane×2 + Metallic×1 + 자유×5","cost":8,"effect":"When one of your allies loses a shield, up to 2 enemies in their line of sight within 5 tiles take 1 Physical and Arcane damage / Enemies hit are silenced for 2 turns","priority":"중반","verified":true},{"name":"Razoreye","slot":"장신구","recipe":"Eye×1 + Metallic×1 + 자유×3","cost":5,"effect":"When you cast a Metallic spell, deal 27 Physical damage to 1 enemy in line of sight per spell level","priority":"선택","verified":true}]},{"id":"seraph","icon":"🪽","title":"세라프 소환 · 불멸 우상","group":"신규 연구 빌드","level":"★★★","tagline":"신성 소환수를 살려 증식시키는 장기전 신성 빌드","idea":"세라프 소환(Call Seraph)으로 주력 천사 소환수를 만들고 천상의 우상(Heavenly Idol)과 필멸성 유예(Suspend Mortality)를 중첩한다. 영혼 수확자(Soul Harvester)로 소환 전력을 늘리고, 불기둥(Pillar of Fire)으로 첫 턴의 약한 구간을 메운다. 기존 아콘 소환과 달리 광선 보호막보다 불멸/복제 유지가 중심이다.","first":["초반에 세라프를 바로 구매하려고 공격 주문을 포기하지 않는다.","구역 시작 직후 적을 정리할 폭발 주문으로 불기둥(Pillar of Fire) 등을 준비한다.","세라프 소환(Call Seraph)과 천상의 우상(Heavenly Idol)을 연결한다.","영혼 수확자(Soul Harvester)로 증식할 수 있을 때 생존 지원을 추가한다.","핵심 연계: Call Seraph→Heavenly Idol의 Bastion of Immortality→Suspend Mortality 자동 부여","핵심 주문이 늦어질 때: Heavenly Idol이 늦어도 Call Seraph 기본 실드8로 전열을 만들고 Fae Plate·Arcane Warding으로 생존한다.","보스 대비: 최종 보스 단일체에 물리·성속성 피해만으로 못 뚫으면 Sanction→Stripped Bare로 저항 0 유도.","Heavenly Idol→Bastion of Immortality는 Suspend Mortality 주문을 배운 뒤 제대로 활용할 수 있어, 주문을 먼저 확보하도록 구매 순서를 조정했다."],"phases":[{"range":"1–3","target":"신성 입문","actions":["다수 적을 처리할 저가 공격 주문이나 소환수를 확보한다.","보스형 적뿐 아니라 구역 시작 직후 소환사와 원거리 적을 우선 정리한다.","Call Seraph Lv4·실드8·HP96의 임시 소환수. 저가 공격으로 SP를 마련하고 위험 위치에 먼저 세운다."]},{"range":"4–7","target":"세라프 준비","actions":["세라프 소환(Call Seraph)을 확보할 SP를 모은다.","천상의 우상과 필멸성 유예의 연결 조건을 확인한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"불멸 연결","actions":["천상의 우상(Heavenly Idol)과 필멸성 유예(Suspend Mortality)를 함께 사용한다.","주문 충전 수급 수단으로 영혼 수확자(Soul Harvester)를 고려한다.","Heavenly Idol→Bastion of Immortality(5SP)는 5턴마다 자신의 Suspend Mortality를 아군에게 시전(마법사 제외)."]},{"range":"13–17","target":"초반 급사 방어","actions":["불기둥(Pillar of Fire)을 초기 광역 피해 수단으로 강화한다.","아름다움의 언령(Word of Beauty) 및 위기 부적(Crisis Charm) 등으로 본체를 보호한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"제재로 보스 대응","actions":["제재(Sanction)의 무장 해제(Stripped Bare) 및 추방자(Exiled One) 업그레이드로 모르드레드를 대비한다.","신성 피해 무효인 적이 등장하면 별도 타입의 공격을 준비한다.","Soul Harvester는 장비(장신구)로 적이 죽을 때 Dark/Holy 주문 충전 회복 확률이 있다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["최종 보스 단일체에 물리·성속성 피해만으로 못 뚫으면 Sanction→Stripped Bare로 저항 0 유도.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","최종 보스 단일체에 물리·성속성 피해만으로 못 뚫으면 Sanction→Stripped Bare로 저항 0 유도."]}],"spells":[{"name":"세라프 소환 (Call Seraph)","up":"기본 세라프 소환","reason":"후반 핵심 전투력","priority":"필수"},{"name":"천상의 우상 (Heavenly Idol)","up":"원본은 제단에서 강화형 획득","reason":"불멸 연계의 중심","priority":"핵심"},{"name":"필멸성 유예 (Suspend Mortality)","up":"소환수에게 생존 효과 부여","reason":"세라프 생존력 강화","priority":"핵심"},{"name":"불기둥 (Pillar of Fire)","up":"초기 피해","reason":"소환 전 취약 턴 보완","priority":"중반"},{"name":"제재 (Sanction)","up":"벌거벗기기 (Stripped Bare), 추방자 (Exiled One)","reason":"최종 보스의 방어·면역 대비","priority":"후반"},{"name":"아름다움의 언령 (Word of Beauty)","up":"상태이상/방어 확인","reason":"본체 급사 방지 보조","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"세라프 전개 전 보호","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"보스 반격 회피","priority":"선택"}],"gear":[{"name":"위기 부적 (Crisis Charm)","reason":"한 번의 사고로 종료되는 상황에 대비","priority":"중요"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"세라프의 기본 성능 강화","priority":"대체"},{"name":"신성 지팡이 (Holy Staff)","reason":"신성 주문의 보조 성능 강화","priority":"대체"},{"name":"요정 판금 (Fae Plate)","reason":"세라프를 세우기 전 본체 보호막","priority":"초반 대체"},{"name":"영혼 수확자 (Soul Harvester)","reason":"적 처치 후 Holy/Dark 충전 회복 가능성","priority":"중후반"},{"name":"마법 소환수 보호막 (Magic Minion Shield)","reason":"소환 직후 실드 제공","priority":"생존"}],"rotation":["불기둥 등 즉시 공격으로 첫 턴 위험한 원거리 적부터 줄인다.","안전한 뒤쪽 타일에서 세라프를 소환한다.","천상의 우상+필멸성 유예로 세라프가 전선을 유지하게 한다.","영혼 수확자로 충전 수급을 연결하고 본체는 위기 부적으로 급사를 대비한다.","Heavenly Idol→Bastion of Immortality(5SP)는 5턴마다 자신의 Suspend Mortality를 아군에게 시전(마법사 제외).","최종 보스 단일체에 물리·성속성 피해만으로 못 뚫으면 Sanction→Stripped Bare로 저항 0 유도."],"pitfalls":["원본 클리어는 지식 제단에서 강화된 천상의 우상을 얻은 행운이 있었다.","첫 턴 소환 전까지 공격에 취약하다.","신성 면역이나 소환수 제어를 하는 적에게 막힐 수 있다.","후반 핵심 주문이 여럿 필요해 초보자 스타트로는 권장하지 않는다.","이전 기록의 지식 제단 강화형 아이돌은 랜덤 보상이라 확정 구매 순서에 포함할 수 없다."],"boss":["강한 원거리 보스: 첫 턴 전멸을 피하기 위해 본체 보호막과 즉시 피해가 필요.","신성 면역 보스: 불기둥 및 제재의 유효 공격 경로 확인.","모르드레드: 원본은 제재+Stripped Bare+Exiled One으로 최종 돌파.","최종 보스 단일체에 물리·성속성 피해만으로 못 뚫으면 Sanction→Stripped Bare로 저항 0 유도."],"variants":["안전 변형: 세라프+본체 보호막 위주로 진행한 뒤 불멸 연계는 늦게 완성.","클리어 변형: 세라프+천상의 우상+필멸성 유예+영혼 수확자를 갖춘 원본 구성."],"evidence":"라이아노즈 실제 승리 로그 #19(Sanctumancer) 기반. 원본의 지식 제단 보상은 확정 획득 요소가 아니다.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Call Seraph→Heavenly Idol의 Bastion of Immortality→Suspend Mortality 자동 부여","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"이전 기록의 지식 제단 강화형 아이돌은 랜덤 보상이라 확정 구매 순서에 포함할 수 없다."},"fallbacks":["Heavenly Idol이 늦어도 Call Seraph 기본 실드8로 전열을 만들고 Fae Plate·Arcane Warding으로 생존한다.","이전 기록의 지식 제단 강화형 아이돌은 랜덤 보상이라 확정 구매 순서에 포함할 수 없다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Call Seraph→Heavenly Idol의 Bastion of Immortality→Suspend Mortality 자동 부여","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Heavenly Idol이 늦어도 Call Seraph 기본 실드8로 전열을 만들고 Fae Plate·Arcane Warding으로 생존한다."],"craftNotes":["핵심 장비 Crisis Charm의 제작 태그는 Holy×1 + Word×1 + 자유×2 (총 4). 태그 공급 재료 예: Holy: Holy Icon(Holy), Golden Dragonscale(Dragon+Holy), Holy Water(Holy+Ritual) / Word: Ancient Inscription(Sorcery+Word), Dragontongue Tablet(Dragon+Word), Glacial Script(Ice+Word). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Lightning Bolt","cost":1,"reason":"Deal 12 Lightning damage in a beam"},{"kind":"spell","name":"Call Seraph","cost":4,"reason":"Summon a temporary Seraph"},{"kind":"spell","name":"Heavenly Idol","cost":5,"reason":"Summon a Heavenly Idol"},{"kind":"spell","name":"Suspend Mortality","cost":3,"reason":"Target ally gains the ability to reincarnate on death"},{"kind":"upgrade","name":"Bastion of Immortality","forSpell":"Heavenly Idol","cost":5,"reason":"Heavenly Idol can cast your Suspend Mortality on a 5 turn cooldown / Cannot target the Wizard"},{"kind":"upgrade","name":"Endlessness","forSpell":"Suspend Mortality","cost":4,"reason":"Suspend Mortality gains 2 Lives / Grants 3 reincarnations instead of just 1"},{"kind":"spell","name":"Sanction","cost":6,"reason":"Sanction the target / Sanction deals 30 Holy damage to the cursed unit when they cast a spell or take Holy damage from another source / You are healed for 1 HP when Sanction deals damage"},{"kind":"upgrade","name":"Stripped Bare","forSpell":"Sanction","cost":6,"reason":"Sanction reduces all resistances to 0"}],"purchaseCost":34,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Call Seraph","cost":4,"tags":"Holy / Fire / Conjuration","base":"Summon a temporary Seraph","stats":"충전 3 · 사거리 4","upgrades":[{"name":"Quickened Seraphs","cost":2,"effect":"The Seraphs gain quickstep"},{"name":"Moonblade","cost":3,"effect":"The Seraphs' cleave attack also deals Arca gain 3 SH when summoned / Other allies gain 1 SH instead","priority":"생존","verified":true}]},{"id":"chaos","icon":"🌈","title":"혼돈 탄막 · 캔트립 연쇄","group":"신규 연구 빌드","level":"★★☆","tagline":"속성을 바꿔가며 정예·보스에게 집중 폭격","idea":"혼돈 탄막(Chaos Barrage)의 똑똑한 탄환(Smart Bolts)이 다양한 피해 속성 가운데 유효 속성을 찾아 집중 공격한다. 캔트립 연쇄(Cantrip Cascade)의 방출 융합(Evocation Amalgamation)으로 다단 공격을 강화한다. 기존 마법 미사일+분산과 달리 엘리트·단일 보스 처리에 초점을 맞춘다.","first":["시작: 혼돈 탄막(Chaos Barrage)을 구매할 수 있다면 주력 단일 공격 후보로 정한다.","초반: 똑똑한 탄환(Smart Bolts) 업그레이드로 저항력이 높은 정예를 처리한다.","중반: 캔트립 연쇄(Cantrip Cascade)+방출 융합(Evocation Amalgamation)을 목표로 SP를 축적한다.","후반: 신비로운 시야(Mystic Vision)와 공격 범위·사거리 증폭 장비를 추가한다.","핵심 연계: Chaos Barrage→Smart Bolts로 약점 속성 선택→Cantrip Cascade의 Evocation Amalgamation으로 Lv2 Sorcery 반복","핵심 주문이 늦어질 때: Cantrip Cascade가 늦으면 Smart Bolts+Arcane Warding만으로 버티고 부족한 광역은 Fireball 등 Lv1 보조 주문으로 대처한다.","보스 대비: 단일 보스는 부채꼴의 남는 탄환 수와 차단물·시야를 확인하고 Mystic Vision으로 사거리 확보.","Cantrip Cascade 기본 효과(Lv1 Sorcery)를 쓰려면 Fireball 같은 Lv1 원거리 마법이 필요하다. Chaos Barrage는 Lv2라서 Evocation Amalgamation 이후에야 연결된다."],"phases":[{"range":"1–3","target":"정예 대응","actions":["혼돈 탄막+똑똑한 탄환을 우선 목표로 한다.","충전 횟수가 부족하면 별도 저비용 광역 주문이나 소환수를 확보한다.","Chaos Barrage는 기본 Lv2·부채꼴 9발, Fire/Lightning/Physical 피해. Smart Bolts(3SP)가 약한 저항 유형 자동 선택."]},{"range":"4–7","target":"중반 연결","actions":["캔트립 연쇄를 확보하고 해당 주문의 자동 발동 조건을 확인한다.","적을 한 방향으로 묶어 남는 탄환이 고체력 적에게 집중되도록 위치를 고른다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"융합 다단 공격","actions":["방출 융합(Evocation Amalgamation)을 적용해 혼돈 탄막을 여러 번 시전하는 엔진을 만든다.","방어 수단이 빈약하면 비전 방호와 보호막 장비를 먼저 확보한다.","Cantrip Cascade(Lv5)는 현재 보유 Lv1 원거리 Sorcery를 원뿔 범위 적마다 시전, Evocation Amalgamation(6SP)은 Lv2 Sorcery도 추가."]},{"range":"13–17","target":"사거리와 추가 피해","actions":["신비로운 시야(Mystic Vision)로 사거리 이점을 확보한다.","절멸자 지팡이(Annihilator Staff)·탐투의 눈(Eye of Tamtu) 등 시전 보조 장비를 제작한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"보스 집중 폭격","actions":["저항력 높은 보스에 Smart Bolts의 유효 속성 탐색이 실제 작동하는지 확인한다.","체력 보상과 보호막 유지로 연속 공격을 버틴다.","Chaos Barrage는 Lv2 Sorcery이므로 Evocation Amalgamation이 있고 Lv2 Sorcery 목록이 알맞을 때 공격에 연결된다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["단일 보스는 부채꼴의 남는 탄환 수와 차단물·시야를 확인하고 Mystic Vision으로 사거리 확보.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","단일 보스는 부채꼴의 남는 탄환 수와 차단물·시야를 확인하고 Mystic Vision으로 사거리 확보."]}],"spells":[{"name":"혼돈 탄막 (Chaos Barrage)","up":"똑똑한 탄환 (Smart Bolts)","reason":"정예·고체력 적에 적합한 핵심 공격","priority":"필수"},{"name":"캔트립 연쇄 (Cantrip Cascade)","up":"방출 융합 (Evocation Amalgamation)","reason":"혼돈 탄막의 다단 발동 엔진","priority":"필수"},{"name":"신비로운 시야 (Mystic Vision)","up":"사거리 보조","reason":"벽/장거리 적을 공격할 기회 확대","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"보호막","reason":"초반 후의 급사 방지","priority":"중반"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"실드 보스 대응","priority":"후반"},{"name":"죽음 화살 (Death Bolt)","up":"Blood Bolt","reason":"체력 회복과 Dark 보조 화력","priority":"선택"},{"name":"화염구 (Fireball)","up":"기본","reason":"Cantrip Cascade 기본효과가 사용할 Lv1 Sorcery 주문","priority":"연계 필수"}],"gear":[{"name":"절멸자 지팡이 (Annihilator Staff)","reason":"혼돈 탄막의 추가 피해 및 방어 대응","priority":"후반"},{"name":"탐투의 눈 (Eye of Tamtu)","reason":"혼돈 연쇄 추가 피해","priority":"후반"},{"name":"요정 판금 (Fae Plate)","reason":"캔트립 엔진 완성 전 보호막을 제공","priority":"안전"},{"name":"비전 광란 가면 (Arcane Frenzy Mask)","reason":"연속 비전 공격 강화","priority":"선택"},{"name":"고통 로브 (Robe of Agony)","reason":"연쇄 주문의 발동 횟수로 피해 누적","priority":"선택"},{"name":"반짝이는 무희 로브 (Glittering Dancer's Robes)","reason":"충전·내성 고려한 대안","priority":"선택"}],"rotation":["첫 턴에 어떤 적이 가장 위험한지 확인한다.","혼돈 탄막+똑똑한 탄환으로 고위험 정예 적을 먼저 제거한다.","캔트립 연쇄가 완성되면 적 여러 마리를 포함해 탄막이 고체력 적에게도 향하도록 배치한다.","남은 보스에는 속성 약점을 확인하며 반복 집중 공격을 한다.","Cantrip Cascade(Lv5)는 현재 보유 Lv1 원거리 Sorcery를 원뿔 범위 적마다 시전, Evocation Amalgamation(6SP)은 Lv2 Sorcery도 추가.","단일 보스는 부채꼴의 남는 탄환 수와 차단물·시야를 확인하고 Mystic Vision으로 사거리 확보."],"pitfalls":["혼돈 탄막은 태그가 Chaos·Sorcery 계열이라 특정 강화 장비 확보에 운이 따른다.","고체력 한 마리를 잘 잡아도 넓은 맵의 다수 적을 통제할 수단이 없으면 위험하다.","캔트립 엔진 이전에는 별도 생존·광역 수단이 필요하다.","방출 융합의 세부 발동 조건 및 업그레이드 가격은 게임 내 툴팁 우선.","Cantrip Cascade의 기본 효과는 Lv1 Sorcery이며 Chaos Barrage는 Lv2라서 Evocation Amalgamation 없이 자동 연계된다고 생각하지 않는다."],"boss":["정예 적: 똑똑한 탄환으로 유효 피해 속성을 탐색.","다수 소환형 보스: 광역·소환수/보호막 보조를 함께 운용.","모르드레드: 원본 플레이어는 Smart Bolts가 유효한 속성을 찾아 승리했다고 보고.","단일 보스는 부채꼴의 남는 탄환 수와 차단물·시야를 확인하고 Mystic Vision으로 사거리 확보."],"variants":["입문 변형: 혼돈 탄막+똑똑한 탄환을 단일 화력용으로 사용, 다른 주력 빌드 보조.","완성형: 캔트립 연쇄+방출 융합으로 다단 공격, 탐투의 눈/절멸자 지팡이 추가."],"evidence":"라이아노즈 실제 승리 로그 #7 기반. 비전 마법 미사일과 별개로 보스 집중 딜링에 특화된 구성.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Chaos Barrage→Smart Bolts로 약점 속성 선택→Cantrip Cascade의 Evocation Amalgamation으로 Lv2 Sorcery 반복","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Cantrip Cascade의 기본 효과는 Lv1 Sorcery이며 Chaos Barrage는 Lv2라서 Evocation Amalgamation 없이 자동 연계된다고 생각하지 않는다."},"fallbacks":["Cantrip Cascade가 늦으면 Smart Bolts+Arcane Warding만으로 버티고 부족한 광역은 Fireball 등 Lv1 보조 주문으로 대처한다.","Cantrip Cascade의 기본 효과는 Lv1 Sorcery이며 Chaos Barrage는 Lv2라서 Evocation Amalgamation 없이 자동 연계된다고 생각하지 않는다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Chaos Barrage→Smart Bolts로 약점 속성 선택→Cantrip Cascade의 Evocation Amalgamation으로 Lv2 Sorcery 반복","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Cantrip Cascade가 늦으면 Smart Bolts+Arcane Warding만으로 버티고 부족한 광역은 Fireball 등 Lv1 보조 주문으로 대처한다."],"craftNotes":["핵심 장비 Annihilator Staff의 제작 태그는 Chaos×2 + Sorcery×2 + 자유×5 (총 9). 태그 공급 재료 예: Chaos: Devil's Blood(Blood+Chaos), Warped Dragon Egg(Chaos+Dragon) / Sorcery: Magic Rune(Sorcery), Ancient Inscription(Sorcery+Word), Crimson Sigil(Blood+Sorcery). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Chaos Barrage","cost":2,"reason":"Shoot up to 9 bolts of chaotic energy at units in a cone / Each bolt deals 6 Fire, Lightning, or Physical damage"},{"kind":"upgrade","name":"Smart Bolts","forSpell":"Chaos Barrage","cost":3,"reason":"Chaos Barrage will not harm allies / Each bolt will use the damage type its target resists the least"},{"kind":"spell","name":"Cantrip Cascade","cost":5,"reason":"Cast each of your level 1 ranged Sorcery spells on each enemy in a cone"},{"kind":"spell","name":"Fireball","cost":1,"reason":"Deal 9 Fire damage in a 2 tile burst"},{"kind":"upgrade","name":"Evocation Amalgamation","forSpell":"Cantrip Cascade","cost":6,"reason":"Cantrip Cascade also casts a random level 2 Sorcery spell you know on each affected unit"},{"kind":"spell","name":"Mystic Vision","cost":3,"reason":"All spells and equipment gain 5 range / Lasts 6 turns"},{"kind":"upgrade","name":"Truesight","forSpell":"Mystic Vision","cost":8,"reason":"Mystic Vision also lets you ignore line of sight requirements for casting spells"}],"purchaseCost":28,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Chaos Barrage","cost":2,"tags":"Chaos / Sorcery","base":"Shoot up to 9 bolts of chaotic energy at units in a cone / Each bolt deals 6 Fire, Lightning, or Physical damage","stats":"피해 6 · 충전 6 · 사거리 6","upgrades":[{"name":"Endless Barrage","cost":3,"effect":"Chaos Barrage gains 4 Max Channel / You may channel Chaos Barrage for 4 turns"},{"name":"Smart Bolts","cost":3,"effect":"Chaos Barrage will not harm allies / Each bolt will use the damage type its target resists the least"},{"name":"Shockwaves","cost":4,"effect":"Each bolt also deals damage to adjacent tiles"},{"name":"Mega Barrage","cost":5,"effect":"Chaos Barrage gains 9 Num Targets"}]},{"name":"Cantrip Cascade","cost":5,"tags":"Arcane / Sorcery","ba heal for half the incoming damage"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]},{"name":"Death Bolt","cost":1,"tags":"Dark / Sorcery / Conjuration","base":"Deals 10 Dark damage to a target / Slain Living units are raised as Skeletons / Raised skeletons inherit the max HP of the slain unit","stats":"피해 10 · 충전 20 · 사거리 6","upgrades":[{"name":"Blood Bolt","cost":2,"effect":"Death Bolt gains 1 HP Cost / Death Bolt heals the caster for any damage it deals / Adds the Blood tag"},{"name":"Winter Bolt","cost":2,"effect":"Deathbolt also deals Ice damage / Adds the Ice tag"},{"name":"Soul Battery","cost":3,"effect":"The Wizard gains Soulcharge when Death Bolt kills a target / Soulcharge grants 1 damage to Dark spells and equipment until the level ends"},{"name":"Corpse Explosion","cost":5,"effect":"Death Bolt gains 2 Radius / Killing a unit with Death Bolt deals 3 Dark and Physical damage to enemies in a 2 tile radius around them"}]},{"name":"Fireball","cost":1,"tags":"Fire / Sorcery","base":"Deal 9 Fire damage in a 2 tile burst","stats":"range=6 · max_charges=12 · damage=9 · radius=2","upgrades":[{"name":"Ash Ball","cost":2,"effect":"Fireball gains 4 Duration / Fireball blinds and poisons units for 4 turns"},{"name":"Meteor","cost":3,"effect":"Fireball gains 3 Duration / Units in the center tile take extra Physical damage and are stunned for 3 turns"},{"name":"Shaped Blast","cost":4,"effect":"Fireball gains 1 radius for every 4 tiles away that you cast it, and never damages the wizard or their allies"},{"name":"Chaos Ball","cost":5,"effect":"Fireball randomly deals Physical, Lightning, or Fire damage / If a unit is resistant to one or more of these damage types, Fireball deals the damage type that unit is least resistant to / Adds the Chaos tag"}]}],"verifiedGear":[{"name":"Annihilator Staff","slot":"무기","recipe":"Chaos×2 + Sorcery×2 + 자유×5","cost":9,"effect":"Deals 2 Physical, Fire, and Lightning damage to units before they would be damaged by your Sorcery spells","priority":"후반","verified":true},{"name":"Eye of Tamtu","slot":"장신구","recipe":"Chaos×1 + Dragon×1 + Eye×1 + 자유×2","cost":5,"effect":"Dragon spells and equipment gain 100% Minion Health ; Chaos spells and equipment gain 100% Damage ; Eye spells and equipment gain 100% Duration","priority":"후반","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Arcane Frenzy Mask","slot":"머리","recipe":"Arcane×2 + 자유×4","cost":6,"effect":"When you cast an Arcane spell, your Arcane spells and equipment gain 2 damage for 6 turns","priority":"선택","verified":true},{"name":"Robe of Agony","slot":"몸통","recipe":"Lightning×1 + Dark×1 + Eye×1 + 자유×3","cost":6,"effect":"When you cast a Lightning or Dark spell, deal 8 Lightning damage to a random enemy in line of sight, and 8 Dark damage to another","priority":"선택","verified":true},{"name":"Glittering Dancer's Robes","slot":"몸통","recipe":"Arcane×1 + Conjuration×1 + Translocation×2 + 자유×2","cost":6,"effect":"When you cast three Arcane spells in a row, regain a charge of a random Translocation spell and summon 2 temporary Faeries","priority":"선택","verified":true}]},{"id":"bloodworm","icon":"🪱","title":"벌레 증식 · HP 피해 반사","level":"★★★","tagline":"벌레를 소환·포식해 체력을 순환시키고 HP 소모를 광역 피해로 변환","idea":"벌레 생성(Lumbriogenesis)은 현재 HP 절반을 소모해 벌레를 만들고, 포식(Devour Flesh)은 아군 Living 벌레의 현재 HP만큼 회복시킨다. Worm Host를 얻으면 벌레 생성 충전 제한이 해제되고 매턴 HP 3이 회복된다. 고통의 거울(Pain Mirror)은 HP 손실/소비만큼 시야의 적에게 암흑 피해를 주며, Voodoo Doll·Bloodspike Helm·Orb of Infinite Slaughter가 공격 연쇄를 만든다. 체력 회복 차단과 희귀 재료 부족에 취약한 고난도형.","first":["1구역: Blood Bullet을 기본 공격으로, HP를 과하게 쓰지 않는다.","2~4구역: Lumbriogenesis+Devour Flesh로 벌레를 소환한 뒤 포식하는 기본 회복 루틴을 만든다.","4~7구역: Worm Host 확보 목표. 6SP 업그레이드 이전에는 무한 소환으로 오해하지 않는다.","6~10구역: Voodoo Doll 또는 Bloodspike Helm을 만들어 HP 소비를 직접 공격으로 바꾼다.","10~14구역: Pain Mirror와 Illusory Pain; 암흑 면역이 문제면 Burning Pain으로 화염 추가.","14~18구역: Mass Feeding+Hemocorruptor 또는 Orb of Infinite Slaughter 폭발 시너지 준비.","19~21구역: Arcane Warding·독 대응·Stripped Bare로 보스 저항과 급사 대처."],"phases":[{"range":"1–3","target":"혈탄과 HP 관리","actions":["Blood Bullet은 HP를 소모하므로 적은 수를 안전하게 처치한다.","독·암흑 저항·장거리 공격 적이 많은 균열을 피하고 회복 기회를 우선한다.","Lumbriogenesis는 현재 HP 절반을 지불하므로 초반 벌레를 너무 자주 생성하지 않는다."]},{"range":"3–6","target":"벌레→포식 순환","actions":["Lumbriogenesis로 현재 HP 절반을 써 소환한 Living 벌레를 Devour Flesh로 먹어 회복한다.","Worm Host는 충전 제한을 없애고 매턴 HP 3 재생. 이때부터 반복 소환이 편해진다.","HP 부족 시 더 소환하지 말고 포식/이동으로 생존을 우선한다."]},{"range":"6–10","target":"HP 소비를 반격으로","actions":["Voodoo Doll은 시작 시 고HP 적 다섯을 묶고 HP 소비에 물리 피해를 보낸다.","Bloodspike Helm은 HP 소비량을 시야 안 적 최대 셋에 물리 피해로 적용한다.","Pain Mirror는 14턴 동안 HP 소비·피해 시 시야의 적에 암흑 피해. 시전도 HP 11 소모한다.","Worm Host는 매턴 HP3 재생 및 충전 제거, Devour Flesh로 Living 소환수 회복이 가능하다."]},{"range":"10–15","target":"피해 유형 확대","actions":["Pain Mirror→Burning Pain으로 화염 피해를 추가해 암흑 저항을 넘는다.","Devour Flesh→Mass Feeding으로 아군 회복 범위를 늘리고 Hemocorruptor의 독 피해와 연결한다.","Crimson Coronet의 소환수 화염 오라는 Bloodspike Helm과 같은 머리 장비라 대체 경로다."]},{"range":"15–19","target":"희귀 구체·장기전","actions":["Orb of Infinite Slaughter의 사망 폭발은 Dark 피해이며 피해만큼 본체를 회복한다.","구체는 Chaos·Dragon·Enchantment·Holy·Nature·Orb 각 1을 필요로 하므로 재료가 나오지 않으면 Voodoo Doll/Pain Mirror 중심으로 계속 진행한다.","Flagellant's Cup으로 디버프 1개 제거를 노리되 매턴 HP 1 지불을 감안한다.","Voodoo Doll은 구역 시작 고HP 5명 저주/HP소모 Physical 반격, Pain Mirror는 14턴 시야 대상 Dark 반격."]},{"range":"20–21","target":"보스 대비","actions":["독은 포식 회복을 막을 수 있으니 정화 수단·시야·후퇴 위치를 우선한다.","Sanction→Stripped Bare로 높은 저항을 0으로 낮추거나 다른 유효 피해 유형을 준비한다.","벌레 폭발만으로 못 끝내는 모르드레드는 보호막·직접 피해를 병행한다.","Poison 상태에서는 회복 차단 위험이 있으므로 Flagellant's Cup 등의 해제 수단 확보."]}],"spells":[{"name":"혈탄 (Blood Bullet)","up":"초반 기본","reason":"초반 물리 공격(HP 비용 있음)","priority":"시작"},{"name":"벌레 생성 (Lumbriogenesis)","up":"Worm Host (6SP)","reason":"현 HP 절반 소비해 벌레 생성; 업그레이드 후 무제한 충전+턴당 3HP","priority":"필수"},{"name":"포식 (Devour Flesh)","up":"Controlled Appetite (1SP), Mass Feeding (2SP)","reason":"인접 Living 아군을 포식해 HP 회복·광역 아군 회복","priority":"필수"},{"name":"고통의 거울 (Pain Mirror)","up":"Illusory Pain (1SP), Burning Pain (6SP)","reason":"HP 지출·피격량을 시야 내 Dark/Fire 피해로 변환","priority":"핵심"},{"name":"제재 (Sanction)","up":"Stripped Bare (6SP)","reason":"보스 저항을 0으로 만들기 위한 저주","priority":"후반"},{"name":"혈액 이동 (Bloodshift)","up":"Blood Greed (3SP)","reason":"Dark 광역 타격·본체 회복 대안","priority":"선택"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"HP 비용 사용 직후 보호막","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"독·강한 적 포위에서 벗어남","priority":"생존"}],"gear":[{"name":"부두 인형 (Voodoo Doll)","reason":"HP 소비를 물리 피해로 변환 [Trinket / 제작: Blood×1 + Enchantment×1 + 자유×2, 총 4]","priority":"초중반"},{"name":"혈침 투구 (Bloodspike Helm)","reason":"HP 소비 시 최대 3명에게 물리 피해 [Head / 제작: Blood×1 + Eye×1 + Metallic×1 + 자유×3, 총 6]","priority":"핵심"},{"name":"무한 학살의 구체 (Orb of Infinite Slaughter)","reason":"유닛 사망 시 인접 Dark 폭발+회복, 재료 수급 난도 큼 [Trinket / 제작: Chaos×1 + Dragon×1 + Enchantment×1 + Holy×1 + Nature×1 + Orb×1, 총 6]","priority":"후반"},{"name":"혈오염기 (Hemocorruptor)","reason":"아군 회복 시 최대 3명의 적에 Poison 피해 [Trinket / 제작: Blood×1 + Dark×1 + Nature×1 + 자유×3, 총 6]","priority":"중반"},{"name":"진홍 왕관 (Crimson Coronet)","reason":"소환수 화염 오라, 혈침 투구와 같은 머리 칸 [Head / 제작: Blood×1 + Fire×2 + Conjuration×1 + 자유×3, 총 7]","priority":"대안"},{"name":"고행자의 잔 (Flagellant's Cup)","reason":"매턴 HP 1 소모하고 디버프 하나 제거 [Trinket / 제작: Blood×1 + Holy×1 + 자유×3, 총 5]","priority":"생존"},{"name":"피의 불꽃 지팡이 (Blazeblood Staff)","reason":"Blood/Fire 주문 퀵캐스트 [Weapon / 제작: Arcane×1 + Blood×1 + Fire×1 + 자유×4, 총 7]","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보호막 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"}],"craftNotes":["속성 재료 예: Heart Fragment(Blood), Blood Basin(Blood+Ritual), Devil's Blood(Blood+Chaos), Relocator Beacon(Orb+Translocation).","무한 학살의 구체는 총 6개 요구 태그가 모두 다르다. 모자란 속성 하나 때문에 제작이 늦을 수 있다.","혈침 투구와 진홍 왕관은 머리 장비 양자택일. 레시피의 숫자는 제작 태그 요구량이며 재료 하나가 태그 여럿을 지닐 수 있다.","핵심 장비 Bloodspike Helm의 제작 태그는 Blood×1 + Eye×1 + Metallic×1 + 자유×3 (총 6). 태그 공급 재료 예: Blood: Heart Fragment(Blood), Beastblood Fungus(Nature+Blood), Blood Basin(Blood+Ritual) / Eye: Retinal Jelly(Eye+Slime), Seer's Orb(Eye+Orb), Stormglass Eye(Eye+Lightning) / Metallic: Shielding Shard(Metallic), Charged Cog(Metallic+Lightning), Sacrificial Brand(Blood+Metallic). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"auto":["Worm Host: Lumbriogenesis 무제한 충전과 매턴 HP 재생은 상시 효과지만 벌레를 실제로 소환하는 행동은 직접 필요.","Voodoo Doll·Bloodspike Helm·Pain Mirror: HP 소비 발생 시 연계 피해 자동 발동. Pain Mirror는 미리 시전해야 함.","Orb of Infinite Slaughter: 유닛 사망 조건부 폭발, 몬스터의 Dark 저항과 폭발 위치에 영향 받음."],"rotation":["초반 혈탄으로 몬스터 수 줄이기.","벌레 생성→포식 회복을 먼저 안정화.","고통의 거울/보호막을 사용한 뒤 체력 지출로 연계 공격.","적과 본체 사이 벌레를 유지하면서 독·암흑 저항 강한 대상 따로 처리.","보스는 Sanction/물리/화염 및 보호막으로 마무리."],"pitfalls":["Lumbriogenesis는 현재 HP의 절반을 소모하므로 과도하게 반복하면 HP가 바닥난다.","독 상태는 회복을 막으므로 Devour Flesh 활용이 봉쇄될 수 있다.","Pain Mirror는 시야 내 적만 공격한다.","혈침 투구/진홍 왕관은 같이 착용할 수 없다.","희귀 구체가 없다고 진행을 멈추지 않는다.","혈마법 트라이얼의 재료 우선순위를 일반 게임에 그대로 적용할 필요는 없다.","Worm Host가 있어도 행동·HP를 무한히 쓸 수 있는 것은 아니다."],"boss":["Dark+Fire 저항이 높으면 Sanction→Stripped Bare나 Physical 보조 공격 확보.","공격 차수가 많으면 HP 기반 몸빵만으로 위험하므로 Arcane Warding으로 보호.","모르드레드에게 벌레 사망 폭발이 충분히 들어가지 않으면 별도 직접 피해로 전환.","Poison 상태에서는 회복 차단 위험이 있으므로 Flagellant's Cup 등의 해제 수단 확보."],"variants":["수동 생존형: Worm Host+Devour Flesh+비전 방호.","혈비용 반사형: Voodoo Doll+Bloodspike Helm+Pain Mirror.","사망 폭발형: Orb of Infinite Slaughter 중심(제작 의존).","소환/회복 독형: Mass Feeding+Hemocorruptor."],"evidence":"실제 엔딩 승리 로그 #5 및 Steam Hemomancer 트라이얼과 대조. 마법, 업그레이드, 장비 레시피는 2026-10-12 live 게임 데이터 확인. 구역 시점은 권장 재구성.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Hemomancer Trial 실전","https://steamcommunity.com/app/4366330/discussions/0/589561964325498148/"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드","engine":{"core":"Lumbriogenesis→Worm Host 무제한 충전→Devour Flesh 회복→Pain Mirror/Voodoo Doll로 HP 비용을 공격으로","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Worm Host가 있어도 행동·HP를 무한히 쓸 수 있는 것은 아니다."},"fallbacks":["Orb of Infinite Slaughter 재료는 희귀하고 다양한 태그가 필요하다. Voodoo Doll/Bloodspike Helm/Arcane Warding으로 대체한다.","Worm Host가 있어도 행동·HP를 무한히 쓸 수 있는 것은 아니다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"purchase":[{"kind":"spell","name":"Blood Bullet","cost":1,"reason":"Shoot a projectile that deals 10 Physical damage to the first unit in its path"},{"kind":"spell","name":"Lumbriogenesis","cost":3,"reason":"Pay half your current HP rounded up to summon a Worm Ball with that much health / Worm Balls have a melee attack that deals damage equal to half their max HP / If you sacrificed 50 or more HP, summon a Worm Shambler instead"},{"kind":"spell","name":"Devour Flesh","cost":3,"reason":"Devour an allied Living unit to heal yourself for its current HP"},{"kind":"upgrade","name":"Worm Host","forSpell":"Lumbriogenesis","cost":6,"reason":"Lumbriogenesis max charges removed / You regenerate 3 HP each turn / Always Active"},{"kind":"spell","name":"Pain Mirror","cost":4,"reason":"When you take damage or spend HP, deal that much Dark damage to enemies in your line of sight / Lasts 14 turns"},{"kind":"upgrade","name":"Burning Pain","forSpell":"Pain Mirror","cost":6,"reason":"Pain Mirror also deals Fire damage / Adds the Fire tag"}],"purchaseCost":23,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Blood Bullet","cost":1,"tags":"Blood / Metallic / Sorcery","base":"Shoot a projectile that deals 10 Physical damage to the first unit in its path","stats":"피해 10 · HP소모 1 · 사거리 10","upgrades":[{"name":"Rime Coated Rounds","cost":2,"effect":"Blood Bullet also deals Ice damage / Adds the Ice tag"},{"name":"Blessed Blood","cost":4,"effect":"Blood Bullet also deals Holy damage / Blood Bullet will penetrate Dark, Demon, and Undead units / Adds the Holy tag"},{"name":"Double Tap","cost":4,"effect":"Blood Bullet gains 2 Num Targets / Shoot 2 bullets instead of one"},{"name":"Sniper's Trance","cost":5,"effect":"Pass the turn to gain the Sniper buff / Sniper grants a stacking +1 range and +10 damage bonus to Blood Bullet, and removes its line of sight requirement / All stacks of Sniper are removed when you move"}]},{"name":"Lumbriogenesis","cost":3,"tags":"Blood / Nature / Conjuration","base":"Pay half your current HP rounded up to summon a Worm Ball with that much health / Worm Balls have a melee attack that deals damage equal to half their max HP / If you sacrificed 50 or more HP, summon a Worm Shambler instead","stats":"충전 4 · 사거리 1","upgrades":[{"name":"Toxogenesis","cost":3,"effect":"Also summon a Toxic Worm Ball"},{"name":"Ectogenesis","cost":4,"effect":"Also summon a Ghost Worm Ball / Adds the Dark tag"},{"name":"Mechanogenesis","cost":5,"effect":"Also summon an Iron Worm Ball / Adds the Metallic tag"},{"name":"Worm Host","cost":6,"effect":"Lumbriogenesis max charges removed / You regenerate 3 HP each turn / Always Active"}]},{"name":"Devour Flesh","cost":3,"tags":"Blood","base":"Devour an allied Living unit to heal yourself for its current HP","stats":"사거리 1","upgrades":[{"name":"Controlled Appetite","cost":1,"effect":"Instead of killing the target, only steal as much HP as you are missing, leaving the target with at least 1 HP"},{"name":"Demonic Appetite","cost":2,"effect":"Devour Flesh can target Demon allies / Adds the Chaos tag"},{"name":"Mass Feeding","cost":2,"effect":"Devour Flesh gains 2 Radius / Also heals your other allies within 2 tiles of the target"},{"name":"Resistance Absorption","cost":5,"effect":"Gain resistance to the target's most resisted damage type equal to their resistance / Lasts until the end of the level"}]},{"name":"Pain Mirror","cost":4,"tags":"Blood / Enchantment","base":"When you take damage or spend HP, deal that much Dark damage to enemies in your line of sight / Lasts 14 turns","stats":"충전 1 · HP소모 11 · 지속 14턴","upgrades":[{"name":"Illusory Pain","cost":1,"effect":"Pain Mirror's outgoing damage is based on pre-resistance values, rather than actual damage taken"},{"name":"Pain Seeker","cost":2,"effect":"Casting Pain Mirror also grants quickstep for the same duration / Adds the Translocation tag"},{"name":"Burning Pain","cost":6,"effect":"Pain Mirror also deals Fire damage / Adds the Fire tag"},{"name":"Spirits of Pain","cost":7,"effect":"Pain Mirror gains 24 Minion Health / Pain Mirror gains 4 Minion Range / Pain Mirror gains 6 Minion Damage / Pain Mirror gains 3 Minion Duration / For every 30 damage dealt by Pain Mirror, summon a temporary Pain nearby / Adds the Conjuration tag / Adds the Lightning tag"}]},{"name":"Sanction","cost":6,"tags":"Blood / Holy / Enchantment","base":"Sanction the target / Sanction deals 30 Holy damage to the cursed unit when they cast a spell or take Holy damage from another source / You are healed for 1 HP when Sanction deals damage","stats":"피해 30 · 충전 10 · HP소모 10 · 사거리 36","upgrades":[{"name":"Divine Rebuke","cost":3,"effect":"Each turn, cast Sanction on the first unsanctioned enemy that damages you / Always Active"},{"name":"Exiled One","cost":3,"effect":"Sanction gains 5 Duration / Sanctioned units are berserked for 5 turns"},{"name":"Mass Sanction","cost":4,"effect":"Sanction gains 4 Num Targets / Sanction affects up to 4 enemies in a connected group"},{"name":"Stripped Bare","cost":6,"effect":"Sanction reduces all resistances to 0"}]},{"name":"Bloodshift","cost":3,"tags":"Blood / Dark / Sorcery","base":"Enemies in a 4 tile burst take 18 Dark damage / Damage dealt this way heals you or a wounded ally in the targeted area for half that amount","stats":"피해 18 · 충전 6 · HP소모 8 · 사거리 5 · 반경 4","upgrades":[{"name":"Blood Freeze","cost":2,"effect":"Bloodshift gains 3 Duration / Affected enemies are frozen for 3 turns / Adds the Ice tag"},{"name":"Blood Greed","cost":3,"effect":"You and only you are healed by this spell, even if you are out of the targeted area"},{"name":"Boiling Bloodshift","cost":4,"effect":"Allies in the affected area receive a buff to their damage, as though you had cast Boiling Blood / Adds the Fire tag"},{"name":"Toxic Shift","cost":5,"effect":"Bloodshift also deals Poison damage"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]}],"verifiedGear":[{"name":"Voodoo Doll","slot":"장신구","recipe":"Blood×1 + Enchantment×1 + 자유×2","cost":4,"effect":"At the beginning of each level, the 5 enemies with the highest HP are Voodoo Bound / When you take damage, Voodoo Bound enemies take that damage / When you spend HP, Voodoo Bound deals that much Physical damage to enemies","priority":"초중반","verified":true},{"name":"Bloodspike Helm","slot":"머리","recipe":"Blood×1 + Eye×1 + Metallic×1 + 자유×3","cost":6,"effect":"When you spend HP, deal that much Physical damage to up to 3 enemies in your line of sight","priority":"핵심","verified":true},{"name":"Orb of Infinite Slaughter","slot":"장신구","recipe":"Chaos×1 + Dragon×1 + Enchantment×1 + Holy×1 + Nature×1 + Orb×1","cost":6,"effect":"Units explode on death, dealing Dark damage to adjacent units / The damage dealt is equal to your Blood mastery / You heal for any damage dealt by this item","priority":"후반","verified":true},{"name":"Hemocorruptor","slot":"장신구","recipe":"Blood×1 + Dark×1 + Nature×1 + 자유×3","cost":6,"effect":"When your allies heal, up to 3 enemies in line of sight within 4 tiles take that much Poison damage","priority":"중반","verified":true},{"name":"Crimson Coronet","slot":"머리","recipe":"Blood×1 + Fire×2 + Conjuration×1 + 자유×3","cost":7,"effect":"Grant allies a Fire damage aura when they are summoned / You can grant a number of these auras each level equal to the product of your Blood and Fire masteries","priority":"대안","verified":true},{"name":"Flagellant's Cup","slot":"장신구","recipe":"Blood×1 + Holy×1 + 자유×3","cost":5,"effect":"At the beginning of each turn, pay 1 HP / If you have any debuffs, remove one","priority":"생존","verified":true},{"name":"Blazeblood Staff","slot":"무기","recipe":"Arcane×1 + Blood×1 + Fire×1 + 자유×4","cost":7,"effect":"Fire spells and equipment gain 1 Quick Cast ; Blood spells and equipment gain 1 Quick Cast","priority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true}]},{"id":"rainzap","icon":"🌧️","title":"폭우 · 급류 · 자동 감전","level":"★★☆","tagline":"비구름으로 젖음을 유지하고 장신구가 매턴 감전·물 정령은 전열 담당","idea":"Rain Storm과 Torrent는 Soaked를 부여한다. 젖음은 Ice/Lightning 저항 각각 -50%, Fire 저항 +50%다. Dowsing Spark(장신구)가 젖은 적 최대 20명에게 매턴 Lightning 5 피해를 자동 발생시키고, Rain Storm→Living Rain이 매턴 Water Elemental을 소환한다. 초반 적 제압과 채널링 효율은 좋지만 자동 감전 단독 피해는 낮아 중후반 Lightning 직접 공격과 생존이 필요하다.","first":["1구역: Lightning Bolt로 생존.","2~3구역: Rain Storm·Torrent 중 가능한 것을 확보해 Soaked 부여.","3~5구역: Dowsing Spark 제작. Lightning×1+Nature×1+Translocation×1+자유×2.","5~9구역: Torrent는 3칸 너비의 물리 피해 채널·밀쳐내기. 본체 안전 위치에서 시전.","9~13구역: Rain Storm→Living Rain으로 매턴 물 정령을 생성.","13~17구역: Rain Beacon·Acid Rain·Stagnation Basin 등 지속 확장.","18~21구역: Chain Lightning·Arcane Warding·Teleport로 보스와 저항 몬스터에 대응.","Rain Storm은 Living Rain + Personal Storms 중심으로 선택. Acid Rain은 둘 중 하나를 교체하는 별도 분기다."],"phases":[{"range":"1–3","target":"물·번개 스타트","actions":["Lightning Bolt 한 종류로 일단 클리어하고 Rain Storm으로 젖음 공급.","구름이 실제 적 위치에 생기는지 확인. Personal Storms가 있으면 적 점유 타일에도 생성.","젖음은 Ice/Lightning 저항을 -50%, Fire 저항을 +50%로 만든다."]},{"range":"3–6","target":"Dowsing Spark 자동 감전","actions":["Dowsing Spark는 매턴 Soaked 적 최대 20명에게 Lightning 5피해(장신구).","Torrent는 3칸 너비 물리 피해·Soaked 6턴·밀쳐내기, 최대 6턴 채널.","채널링 중 다른 주문·이동이 제한되므로 안전한 통로에서 시작한다."]},{"range":"6–10","target":"물 정령으로 방어","actions":["Rain Storm→Living Rain은 매턴 아군 비구름에서 Water Elemental 2마리를 생성.","물 정령은 물리 저항 75%, Soaked 상태에서 턴당 15HP 회복(물리 완전 면역 아님).","정령이 공격을 받아 주는 동안 Torrent로 밀어내고 Dowsing Spark가 자동 타격.","Torrent 채널은 물리 피해·밀어내기·젖음을 반복하지만 안전 타일에서 시작해야 한다."]},{"range":"10–15","target":"범위와 피해 유형 확장","actions":["Rain Beacon으로 구름 자동 생성 또는 Acid Rain·Stagnation Basin으로 Poison 피해 추가.","번개 피해는 Soaked의 저항 -50%와 시너지, Fire 공격은 Soaked의 저항 +50% 때문에 불리.","Robe of Storms는 Ice/Lightning로 적을 죽이면 보호막 획득. Fae Plate와 몸 슬롯 양자택일."]},{"range":"16–19","target":"중반 화력 정체 극복","actions":["Torrent 물리와 Dowsing Spark 번개만으로 고HP 적을 못 잡으면 Chain Lightning 구매.","빙결/기절·침묵 원거리 적이 있는 균열에서 장시간 Torrent 채널링은 피한다.","Arcane Warding·Teleport로 시작 위치 위험 줄이기.","Living Rain은 Rain Cloud에서 Water Elemental 매턴 소환, Rain Beacon은 구름 생성 확장."]},{"range":"20–21","target":"보스 지속전","actions":["Soaked를 먼저 걸고 Lightning 직접 피해를 쌓는다. 장신구 기본 5/턴만 믿지 않는다.","높은 물리·번개 저항 적에게 Poison/저항 감소로 대체.","보스 패턴이 위험하면 Torrent 채널을 고집하지 않고 본체 보호막·이동을 우선한다.","Dowsing Spark의 기본 피해 5는 최종 보스에 작아 Chain Lightning이나 Miasma 등의 후반 공격 추가."]}],"spells":[{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"초반·보스 Lightning 직접 피해","priority":"시작"},{"name":"폭우 (Rain Storm)","up":"Living Rain (4SP), Personal Storms (2SP)","reason":"구름 Soaked 공급·물 정령 소환","priority":"핵심"},{"name":"급류 (Torrent)","up":"Dangerous Debris (2SP), Water Bend (3SP)","reason":"물리 채널 피해·젖음·밀쳐내기","priority":"핵심"},{"name":"폭우 (Rain Storm)","up":"Acid Rain (4SP)","reason":"후반 Poison 대체 피해","priority":"선택"},{"name":"연쇄 번개 (Chain Lightning)","up":"Cloud Conductance (2SP)","reason":"고HP 보스 Lightning 직격","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"채널링 시작 전 보호막","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"위험한 채널 중단·탈출","priority":"생존"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"실드형 보스 대응","priority":"후반"}],"gear":[{"name":"감전 탐지기 (Dowsing Spark)","reason":"매턴 Soaked 대상 최대 20명 Lightning 피해 [Trinket / 제작: Lightning×1 + Nature×1 + Translocation×1 + 자유×2, 총 5]","priority":"핵심"},{"name":"비 신호기 (Rain Beacon)","reason":"매턴 무작위 비구름 자동 생성 [Trinket / 제작: Nature×2 + Translocation×1 + 자유×2, 총 5]","priority":"확장"},{"name":"고인 물 대야 (Stagnation Basin)","reason":"Soaked 적을 10턴 Poison 상태로 [Trinket / 제작: Nature×1 + 자유×3, 총 4]","priority":"대체"},{"name":"폭풍 로브 (Robe of Storms)","reason":"Ice/Lightning 처치 시 보호막 1 [Body / 제작: Ice×1 + Lightning×1 + Nature×1 + 자유×3, 총 6]","priority":"후반"},{"name":"요정 판금 (Fae Plate)","reason":"초반 턴당 보호막 유지, 몸통 로브와 택일 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"},{"name":"갈바닉 초점 (Galvanic Focus)","reason":"번개 저항 감소 보조, 값은 게임 툴팁 우선 [Trinket / 제작: Lightning×1 + Metallic×1 + 자유×3, 총 5]","priority":"선택"}],"craftNotes":["재료 예: Lightning Jar(Lightning), Wildflower(Nature), Mirror Stone(Ritual+Translocation), Charged Cog(Metallic+Lightning).","Dowsing Spark를 3~5구역에 만들면 빠르지만 재료/균열 운에 달린다. Rain Beacon은 이후 목표.","Fae Plate와 Robe of Storms는 같은 몸통 칸; 둘 중 하나만 선택.","핵심 장비 Dowsing Spark의 제작 태그는 Lightning×1 + Nature×1 + Translocation×1 + 자유×2 (총 5). 태그 공급 재료 예: Lightning: Lightning Jar(Lightning), Charged Cog(Metallic+Lightning), Fulminite Shard(Lightning+Enchantment) / Nature: Wildflower(Nature), Beastblood Fungus(Nature+Blood), Dreamthorn Vine(Arcane+Nature) / Translocation: Rift Residue(Translocation), Mirror Stone(Ritual+Translocation), Relocator Beacon(Orb+Translocation). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"auto":["Rain Storm/Torrent로 Soaked를 유지하면 Dowsing Spark가 매턴 Lightning 피해를 자동 발생.","Living Rain은 비구름에서 Water Elemental 매턴 소환; Rain Beacon은 구름 범위 확장.","Torrent 자체는 채널 중 자동으로 반복 타격하나 마법사는 다른 행동을 하기 어렵다."],"rotation":["폭우/급류로 적에게 Soaked 적용.","감전 탐지기 자동 공격과 물 정령 전열 형성.","채널링 중 원거리 위험 적부터 처리.","부족한 화력을 Chain Lightning/Acid Rain으로 보강.","보스에선 실드와 순간이동을 먼저 확보."],"pitfalls":["Dowsing Spark는 젖은 적이 없으면 자동 피해가 없다.","Water Elemental 물리 저항 75%는 완전 면역이 아님.","채널 중 적 기절·침묵과 피격에 취약.","Soaked는 Fire 저항을 높여 화염 보조 공격 효율이 낮아짐.","일부 실제 승리 기록에서도 중반 딜이 막혀 추가 주문을 선택했다.","감전 5피해/턴만으로 최종 보스 클리어가 보장되지 않는다.","Acid Rain·Living Rain·Personal Storms를 모두 한 주문에 구매할 수 없다. 둘을 선택한다."],"boss":["물리 저항 적은 Soaked→Lightning로.","Lightning 저항 적은 Torrent 물리·Acid Rain Poison 등 대안.","모르드레드는 Dowsing Spark 외 고화력 직접 공격을 별도로 확보.","Dowsing Spark의 기본 피해 5는 최종 보스에 작아 Chain Lightning이나 Miasma 등의 후반 공격 추가."],"variants":["안정형: Rain Storm+Torrent+Dowsing Spark.","소환형: Living Rain+Rain Beacon.","독혼합: Acid Rain+Stagnation Basin.","보스형: Soaked+Chain Lightning+Arcane Warding."],"evidence":"Steam 초반/승리 사례와 일본 별도 승리 로그 대조. 실제 데이터에서 Soaked의 내성 변경과 감전 5피해/20대상, 물 정령 물리 저항 75% 확인. 중반 딜 부족을 경고했으며 구역은 추천 재구성.","sources":[["Steam Torrent + Rain Storm 실전 의견","https://steamcommunity.com/app/4366330/discussions/0/573791755377536594/"],["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드","engine":{"core":"Rain Storm/Torrent로 Soaked 적용→Dowsing Spark의 매턴 20명까지 자동 Lightning 피해","proof":"유사 승리 기록 있음(완주에는 별도 Miasma 등 추가)","risk":"Acid Rain·Living Rain·Personal Storms를 모두 한 주문에 구매할 수 없다. 둘을 선택한다."},"fallbacks":["Dowsing Spark 재료가 안 나오면 Torrent의 물리 피해와 직접 Lightning Bolt로 진행한다.","Acid Rain·Living Rain·Personal Storms를 모두 한 주문에 구매할 수 없다. 둘을 선택한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"purchase":[{"kind":"spell","name":"Lightning Bolt","cost":1,"reason":"Deal 12 Lightning damage in a beam"},{"kind":"spell","name":"Rain Storm","cost":2,"reason":"Create Rain Clouds over tiles in a 4 tile radius / Rain Clouds apply 2 turns of Soaked to units each t
