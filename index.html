<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;color-scheme:light;--bg:#f5f6f8;--surface:#fff;--surface2:#f1f4f7;--line:#dbe0e7;--text:#17212e;--muted:#657282;--accent:#3666c8;--accentbg:#eaf1ff;--green:#187d59;--shadow:0 10px 36px #15233c12}
[data-theme="dark"]{color-scheme:dark;--bg:#111823;--surface:#1b2634;--surface2:#243244;--line:#344456;--text:#ecf2f9;--muted:#aab8c8;--accent:#8cb5ff;--accentbg:#293e60;--green:#74dab3;--shadow:0 8px 28px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.65}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:row}.main{min-width:0;flex:1;transition:margin .2s}.content{max-width:980px;padding:33px 40px 100px;margin:0 auto}.top{position:sticky;top:0;z-index:5;padding:10px 24px;background:color-mix(in srgb,var(--surface) 96%,transparent);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px)}.brand{font-weight:800;font-size:15px;white-space:nowrap}.top small{color:var(--muted);white-space:nowrap}.top .push{flex:1}.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:8px 12px;font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.tabs{display:flex;gap:7px;flex-wrap:wrap;position:relative;margin:22px 0 26px}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 13px;font-weight:650}.tabs button[aria-selected=true]{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}.side{width:286px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--line);background:var(--surface);transition:width .22s,transform .22s;z-index:7;scrollbar-width:thin}.side.closed{width:0;border:0;overflow:hidden}.sideInner{width:285px;padding:18px 16px 26px}.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.shead h2{margin:0;font-size:16px}.side button.iconbtn,.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;width:33px;height:33px;display:grid;place-items:center}.search{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;outline-offset:2px}.search:focus{outline:2px solid var(--accent)}.sgroup{margin-top:20px}.sgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;padding-left:8px}.navitem{width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:flex-start}.navitem:hover{background:var(--surface2)}.navitem.active{background:var(--accentbg);color:var(--accent);font-weight:750}.navitem .emoji{font-size:18px;line-height:1.2}.navitem .ntext{font-size:13px;line-height:1.38}.navitem .desc{display:block;color:var(--muted);font-size:11px;font-weight:450;margin-top:3px}.sideNote{margin:25px 8px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:14px}.kicker{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.02em;margin-bottom:8px}h1{font-size:clamp(26px,4.5vw,38px);letter-spacing:-.04em;line-height:1.28;margin:0 0 12px}h2{font-size:21px;letter-spacing:-.025em;margin:28px 0 12px}h3{font-size:16px;margin:20px 0 8px}p{margin:10px 0 15px}.lede{color:var(--muted);font-size:15px;max-width:850px}.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{background:var(--surface2);border:1px solid var(--line);padding:3px 10px;border-radius:50px;font-size:12px;color:var(--muted);font-weight:650}.chip.good{color:var(--green)}.card{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:19px;margin-bottom:13px;box-shadow:var(--shadow)}.card.flat{box-shadow:none}.card h3{margin-top:0}.card p:last-child{margin-bottom:0}.summary{border-left:4px solid var(--accent);padding:18px 20px;border-radius:0 13px 13px 0;background:var(--surface)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cards .card{margin:0;box-shadow:none}.step{display:flex;gap:15px;margin:0;padding:18px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.stepnum{width:76px;flex-shrink:0;text-align:center;background:var(--surface2);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:850;height:max-content}.step h3{margin:0 0 6px;font-size:16px}.step p{margin:4px 0}.step ul{margin:6px 0 0;padding-left:20px}.step li{margin-bottom:5px}.cleanlist{padding-left:22px}.cleanlist li{margin:7px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:15px 0}table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}th,td{padding:12px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:750;background:var(--surface2)}tr:last-child td{border-bottom:0}td:first-child{font-weight:700;min-width:160px}.note{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px;color:var(--muted);margin:15px 0}.timeline{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 18px}.checkline{display:flex;align-items:flex-start;gap:11px;padding:11px 3px;border-bottom:1px solid var(--line);cursor:pointer}.checkline:last-child{border:0}.checkline input{width:17px;height:17px;accent-color:var(--accent);margin-top:4px}.checkline span{flex:1}.progress{height:7px;border-radius:100px;background:var(--surface2);overflow:hidden;margin:8px 0 17px}.fill{height:100%;background:var(--green);width:0;transition:width .2s}.flexbetween{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.source a{display:inline-block;color:var(--accent);text-decoration:none;font-weight:650;margin:0 12px 8px 0}.source a:hover{text-decoration:underline}.footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px;margin-top:35px}.empty{text-align:center;color:var(--muted);padding:28px}.tipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tipgrid .card{box-shadow:none;margin:0}.tipgrid .em{font-size:23px}.callout{margin:20px 0;background:var(--accentbg);color:var(--text);padding:15px 18px;border-radius:12px}.toggleFloat{display:none}.mobileShade{display:none}.jump{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;margin-top:22px}a{color:var(--accent)}
@media(max-width:820px){.content{padding:25px 18px 80px}.top{padding:9px 12px}.top small{display:none}.side{position:fixed;right:0;top:0;box-shadow:-18px 0 40px #0003;transform:translateX(0)}.side.closed{width:286px;transform:translateX(110%);border-left:1px solid var(--line)}.mobileShade{display:block;position:fixed;inset:0;background:#0007;z-index:6}.mobileShade.hidden{display:none}.btn.widehide{display:none}.cards,.tipgrid{grid-template-columns:1fr}.stepnum{width:64px}}
@media print{body{background:white;color:black}.top,.side,.tabs,.jump,.btn,.sideNote{display:none!important}.content{max-width:100%;padding:0} .card{break-inside:avoid;box-shadow:none}.step{break-inside:avoid}.pageBreak{break-before:page}}
</style>

<body><div class="app"><main class="main"><header class="top"><span class="brand">⚔️ RW3 생존·빌드 공략집</span><small>대화 요약본</small><span class="push"></span><button class="btn widehide" id="theme" title="화면 테마 변경">◐ 테마</button><button class="btn" id="share" title="현재 페이지 주소 복사">🔗 링크</button><button class="btn primary" id="sidebarToggle" aria-expanded="true">☰ 목차 접기</button></header><div id="appBody" class="content"></div></main><div id="shade" class="mobileShade hidden"></div><aside class="side" id="sidebar"><div class="sideInner"><div class="shead"><h2>📚 페이지 목차</h2><button class="iconbtn" id="sideClose" aria-label="목차 닫기">✕</button></div><input id="search" class="search" aria-label="빌드 검색" placeholder="🔍 빌드·마법 검색  /" autocomplete="off"><div id="nav"></div><div class="sideNote">각 빌드는 <b>개요 / 성장 순서 / 주문·장비 / 전투·대응</b>으로 구분됩니다. 체크 상태는 이 브라우저에만 저장됩니다.</div></div></aside></div>
<script>
const D = {"builds":[{"id":"wyrm","icon":"🥚","title":"고룡의 알 · 드레이크 탑승","group":"입문 추천","level":"★★☆","tagline":"소환수로 버티며 반복 소환을 완성하는 첫 엔딩 후보","idea":"고룡의 알(Wyrm Eggs)을 확보한 뒤 용을 전개하고, 드레이크 탑승(Ride Drake)·용들의 비행(Flight of the Dragons)·드래곤 사냥꾼의 인장(Dragon Hunter’s Sigil)을 연결해 소환 전력을 유지한다. 후반에는 마법사 소환(Summon Wizard)으로 화력을 보완한다.","first":["1구역: 저비용 공격 1개로 안전하게 시작. 늑대(Wolf)는 안전형 선택이지만 알 구매가 늦어진다.","2~3구역: 불필요한 주문 구매를 줄이고 고룡의 알(Wyrm Eggs) 구매 자금 확보.","3~5구역: 고룡의 알 구매 후 알이 부화할 시간을 확보하고 마법사는 후방 유지.","장비는 얼음 소환사(Ice Caller)·양치기의 지팡이(Shepherd’s Staff)처럼 제작 가능한 것을 먼저 사용.","핵심 연계: 초반 저축→고룡의 알→Ride Drake 직접 시전 시 Dragon Conjuration 재시전→용 소환 반복","핵심 주문이 늦어질 때: Dragon Hunter's Sigil 재료가 부족하면 알의 부화 시간을 벌어줄 보호막과 소환수 강화에 우선 투자한다.","보스 대비: 용 피해 속성이 Fire/Ice에 집중되므로 화염·냉기 저항 보스에게 Summon Wizard(Dragon Wizard) 등 다른 공격원을 준비한다."],"phases":[{"range":"1–3","target":"기본 생존·SP 저축","actions":["저비용 공격 하나로 약한 균열을 선택한다.","각 맵 시작 전에 위협 범위(T)를 확인하고 소환수나 벽 뒤에서 한 턴을 벌어준다.","고룡의 알 구매를 목표로 SP를 보유한다.","3구역 Wyrm Eggs(기본 7SP)를 목표로 하되, 원거리 적이 많으면 저가 공격·소환수 1종을 먼저 마련한다."]},{"range":"3–5","target":"고룡의 알 확보","actions":["고룡의 알(Wyrm Eggs)을 구매한다(3구역 목표는 빠른 기록, 4~5구역도 괜찮음).","알이 부화하기 전에 맞아 죽지 않도록 적의 원거리 공격을 제거하거나 시야를 끊는다.","알을 플레이어와 적 사이에 소환하되 광역 공격 한 번에 같이 맞지 않도록 한다."]},{"range":"6–10","target":"소환 유지력","actions":["얼음 소환사(Ice Caller) 또는 양치기의 지팡이(Shepherd’s Staff) 중 가능한 장비를 먼저 제작한다.","고룡 영혼 갑옷(Wyrm Spirit Armor)을 노리되 재료가 안 나오면 기다리지 않는다.","알/드래곤이 전장에 유지되는 시간을 늘리고 주문 충전 관리에 익숙해진다.","Ride Drake의 Flight of the Dragons는 직접 시전할 때만 다른 Dragon Conjuration을 시전한다. 자동 시전만 기다리지 않는다."]},{"range":"11–15","target":"반복 소환 엔진","actions":["드레이크 탑승(Ride Drake)과 용들의 비행(Flight of the Dragons)을 확보한다.","드래곤 사냥꾼의 인장(Dragon Hunter’s Sigil)을 제작 목표로 둔다.","용들의 비행은 패치 이후 직접 시전 조건에 주의한다.","회피 기동(Evasive Maneuvers)을 생존에 필요한 시점에 확보한다."]},{"range":"16–19","target":"보스 대처 및 마법사 군단","actions":["마법사 소환(Summon Wizard)·용 마법사(Dragon Wizard)·마법사 군단(Wizard Gang)으로 보조 공격을 마련한다.","냉기·화염에 면역인 보스용 물리/다른 유형의 피해를 확인한다.","소환수만 많고 보스 체력이 줄지 않는 상황이면 소환 추가보다 저항력 대책을 우선한다.","Dragon Hunter's Sigil이 늦으면 Ice Caller Staff/Shepherd's Staff 등 소환 강화 장비로 안전하게 진행한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["용 피해 속성이 Fire/Ice에 집중되므로 화염·냉기 저항 보스에게 Summon Wizard(Dragon Wizard) 등 다른 공격원을 준비한다.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","용 피해 속성이 Fire/Ice에 집중되므로 화염·냉기 저항 보스에게 Summon Wizard(Dragon Wizard) 등 다른 공격원을 준비한다."]}],"spells":[{"name":"고룡의 알 (Wyrm Eggs)","up":"빛나는 알(Radiant Eggs) 등은 선택","reason":"핵심 소환원","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"용들의 비행 (Flight of the Dragons)","reason":"드래곤 추가 소환과 탑승 연계","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"회피 기동 (Evasive Maneuvers)","reason":"소환형의 방어 안정화","priority":"필수"},{"name":"마법사 소환 (Summon Wizard)","up":"용 마법사(Dragon Wizard), 마법사 군단(Wizard Gang)","reason":"엔딩용 마법 공격 보완","priority":"후반"},{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"1~3구역 최소 공격","priority":"초반"}],"gear":[{"name":"얼음 소환사 (Ice Caller Staff)","reason":"초중반 알/냉기 소환 보완","priority":"초중반"},{"name":"양치기의 지팡이 (Shepherd's Staff)","reason":"소환수 전개 보조","priority":"초중반"},{"name":"고룡 영혼 갑옷 (Wyrm Spirit Armor)","reason":"드래곤 계열 지속력과 방어 강화","priority":"중후반"},{"name":"드래곤 사냥꾼의 인장 (Dragon Hunter's Sigil)","reason":"반복 소환의 핵심 장비","priority":"후반 핵심"},{"name":"요정 판금 (Fae Plate)","reason":"본체의 지속 보호막","priority":"안전"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환 능력 보강","priority":"선택"},{"name":"툰드라 망토 (Tundra Mantle)","reason":"고룡 소환 충전 수 보완","priority":"선택"}],"rotation":["위협 범위를 확인하고 안전한 시작 위치를 고른다.","알을 전방에 생성하고, 마법사는 광역 공격의 직선·범위에서 벗어난다.","부화한 용이 공격하는 동안 위협적인 원거리/상태이상 적만 직접 처리한다.","드레이크 탑승 이후 용들의 비행으로 소환 전력을 보충한다.","고체력 보스는 마법사 소환과 별도 피해 수단으로 마무리한다."],"pitfalls":["초반부터 늑대·보조 주문을 너무 많이 구매하면 고룡의 알 구매가 지연된다.","알이 부화하기 전까지 무방비일 수 있으니 원거리 공격이 겹치는 맵을 피한다.","고룡 영혼 갑옷이 없다고 진행을 중단하지 않는다.","드래곤 사냥꾼 인장의 정확한 발동 조건과 용들의 비행의 직접 시전 조건을 현 버전에서 확인한다.","Wyrm Eggs 충전은 기본 1회이고 알이 죽어야 용으로 부화한다. 적 광역 공격 한 번에 본체가 노출되지 않도록 한다."],"boss":["20구역 개구리 교황: 한 턴 피해 제한 때문에 장기 소환/생존이 중요.","눈의 여왕·아마루: 냉기/화염 면역에 주의해 다른 유형 공격 확보.","모르드레드: 소환수만 늘리기보다 본체에게 유효 피해가 들어가는지 먼저 확인.","용 피해 속성이 Fire/Ice에 집중되므로 화염·냉기 저항 보스에게 Summon Wizard(Dragon Wizard) 등 다른 공격원을 준비한다."],"variants":["안전 스타트: 늑대(Wolf) + 고룡의 알. 구매 시점이 늦어지는 대신 초반 탱킹에 유리.","빠른 스타트: 저비용 공격만 구매하고 3구역 고룡의 알 목표."],"evidence":"일본 플레이어의 실제 엔딩 승리 기록 기반. 1~3구역 세부 안전 스타트는 재구성.","sources":[["일본 플레이어 실제 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"초반 저축→고룡의 알→Ride Drake 직접 시전 시 Dragon Conjuration 재시전→용 소환 반복","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Wyrm Eggs 충전은 기본 1회이고 알이 죽어야 용으로 부화한다. 적 광역 공격 한 번에 본체가 노출되지 않도록 한다."},"fallbacks":["Dragon Hunter's Sigil 재료가 부족하면 알의 부화 시간을 벌어줄 보호막과 소환수 강화에 우선 투자한다.","Wyrm Eggs 충전은 기본 1회이고 알이 죽어야 용으로 부화한다. 적 광역 공격 한 번에 본체가 노출되지 않도록 한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["초반 저축→고룡의 알→Ride Drake 직접 시전 시 Dragon Conjuration 재시전→용 소환 반복","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Dragon Hunter's Sigil 재료가 부족하면 알의 부화 시간을 벌어줄 보호막과 소환수 강화에 우선 투자한다."],"craftNotes":["핵심 장비 Dragon Hunter's Sigil의 제작 태그는 Translocation×2 + Dragon×2 + 자유×6 (총 10). 태그 공급 재료 예: Translocation: Rift Residue(Translocation), Mirror Stone(Ritual+Translocation), Relocator Beacon(Orb+Translocation) / Dragon: Dragontongue Tablet(Dragon+Word), Drakentooth(Dragon+Fire), Golden Dragonscale(Dragon+Holy). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Wyrm Eggs","cost":7,"reason":"Summons 4 Wyrm eggs near the caster / Each egg will hatch into either a Fire or an Ice wyrm on death"},{"kind":"spell","name":"Ride Drake","cost":2,"reason":"Beckon forth a draconic mount, gaining quickstep and flying / Lasts 10 turns"},{"kind":"upgrade","name":"Flight of the Dragons","forSpell":"Ride Drake","cost":7,"reason":"When you manually cast Ride Drake, cast your other Dragon Conjuration spells nearby"},{"kind":"upgrade","name":"Evasive Maneuvers","forSpell":"Ride Drake","cost":2,"reason":"Ride Drake gains 6 Shields / Gain 6 SH on cast"},{"kind":"spell","name":"Summon Wizard","cost":8,"reason":"Summons a random wizard"},{"kind":"upgrade","name":"Dragon Wizard","forSpell":"Summon Wizard","cost":3,"reason":"Always summon the Dragon Wizard / Adds the Dragon tag"},{"kind":"upgrade","name":"Wizard Gang","forSpell":"Summon Wizard","cost":9,"reason":"Summon Wizard gains 3 Num Summons / Summon 3 wizards instead of one"}],"purchaseCost":38,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Wyrm Eggs","cost":7,"tags":"Fire / Ice / Dragon / Conjuration","base":"Summons 4 Wyrm eggs near the caster / Each egg will hatch into either a Fire or an Ice wyrm on death","stats":"충전 1","upgrades":[{"name":"Incubation Exposure","cost":3,"effect":"When one of your wyrm eggs is killed, the wyrm it spawns gains 100% resistance to the damage type that killed it"},{"name":"Radiant Eggs","cost":3,"effect":"Wyrm Eggs gains 1 Damage / Wyrm Eggs gains 3 Radius / Wyrm Eggs gain a damaging aura with a 3 tile radius / The aura deals 1 Fire or Ice damage to match the egg's type"},{"name":"Magic Eggs","cost":4,"effect":"Fire eggs can cast your Fireball on a 3 turn cooldown / Ice eggs can cast your Icicle on a 3 turn cooldown"},{"name":"Scale Harvest","cost":5,"effect":"For every 8 Dragon allies that die, regain a charge of Wyrm Eggs / Always Active"}]},{"name":"Ride Drake","cost":2,"tags":"Dragon / Translocation","base":"Beckon forth a draconic mount, gaining quickstep and flying / Lasts 10 turns","stats":"충전 4 · 지속 10턴","upgrades":[{"name":"Armored Drake","cost":1,"effect":"While mounted, gain 50% Physical resist / Adds the Metallic tag"},{"name":"Evasive Maneuvers","cost":2,"effect":"Ride Drake gains 6 Shields / Gain 6 SH on cast"},{"name":"Flight of the Dragons","cost":7,"effect":"When you manually cast Ride Drake, cast your other Dragon Conjuration spells nearby"},{"name":"Strafing Run","cost":7,"effect":"While mounted, cast Dragon Breath at the closest nearby enemy each turn"}]},{"name":"Summon Wizard","cost":8,"tags":"Conjuration / Arcane","base":"Summons a random wizard","stats":"충전 1 · 사거리 5","upgrades":[{"name":"Global Summoning","cost":2,"effect":"Summon Wizard gains -1 Requires LoS / Summon Wizard gains 99 Range"},{"name":"Dragon Wizard","cost":3,"effect":"Always summon the Dragon Wizard / Adds the Dragon tag"},{"name":"Jealousy","cost":5,"effect":"Summon Wizard gains 2 Num Targets / When you cast this spell, up to 2 enemy wizards in line of sight of the summoned wizard become your allies"},{"name":"Wizard Gang","cost":9,"effect":"Summon Wizard gains 3 Num Summons / Summon 3 wizards instead of one"}]},{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 2 turns"}]}],"verifiedGear":[{"name":"Ice Caller Staff","slot":"무기","recipe":"Ice×1 + 자유×3","cost":4,"effect":"Ice spells and equipment gain 50% Minion Health ; Ice spells and equipment gain 50% Minion Duration ; Ice spells and equipment gain 1 Max Charges ; Ice spells and equipment gain 1 Minion Range","priority":"초중반","verified":true},{"name":"Shepherd's Staff","slot":"무기","recipe":"Conjuration×1 + 자유×3","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Duration ; Conjuration spells and equipment gain 1 Num Summons ; Conjuration spells and equipment gain 1 Minion Range","priority":"초중반","verified":true},{"name":"Wyrm Spirit Armor","slot":"몸통","recipe":"Conjuration×1 + Dragon×2 + Holy×1 + 자유×3","cost":7,"effect":"When one of your Dragon allies dies, gain 10% resistance to damage types matching their tags / Resets each level","priority":"중후반","verified":true},{"name":"Dragon Hunter's Sigil","slot":"장신구","recipe":"Translocation×2 + Dragon×2 + 자유×6","cost":10,"effect":"For every Dragon unit that dies, one of your Translocation spells regains 1 charge / At the end of each level, a Rift containing Dragon enemies is created","priority":"후반 핵심","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"선택","verified":true},{"name":"Tundra Mantle","slot":"몸통","recipe":"Ice×2 + 자유×4","cost":6,"effect":"Each turn, soaked enemies within 5 tiles are frozen for 3 turns","priority":"선택","verified":true}]},{"id":"slime","icon":"🟢","title":"슬라임 군단 · 재생 오라","group":"입문 추천","level":"★☆☆","tagline":"느리지만 소환수가 대신 맞아주는 안정형","idea":"슬라임 형태(Slime Form)로 아군 숫자를 늘리고 재생 오라(Regeneration Aura)로 전열을 회복시킨다. 흡혈의 시선(Vampiric Gaze)으로 본체의 지속 전투 능력을 보완한다.","first":["1~2구역: 저비용 주문/소환수로 생존하며 SP 모으기.","3~5구역: 슬라임 형태(Slime Form) 확보.","5~8구역: 재생 오라(Regeneration Aura)로 유지력 강화.","8~11구역: 흡혈의 시선(Vampiric Gaze)과 방어 장비 확보.","핵심 연계: Slime Form 매턴 슬라임 생성→Regeneration Aura의 4HP 회복→장기 소환 전선","핵심 주문이 늦어질 때: 초반 슬라임이 너무 빨리 죽으면 Wolf 한 마리와 Fae Plate를 우선 사용하고, 재생 오라는 슬라임이 쌓일 때 시작한다.","보스 대비: 슬라임 소환만으로 보스가 줄지 않으면 Vampiric Gaze(아군의 시야에서 Dark 공격)와 별도 속성 직접 공격을 추가한다."],"phases":[{"range":"1–3","target":"준비","actions":["기본 공격 또는 늑대 소환으로 앞라인을 만든다.","가능하면 소환/방어 관련 장비를 우선 만든다.","Slime Form은 기본 12턴, 턴마다 Green Slime을 만들고 Physical 50·Poison 100 저항을 제공한다."]},{"range":"4–7","target":"슬라임 양산","actions":["슬라임 형태를 확보해 아군이 적의 공격을 나눠 받게 한다.","재생 오라를 확보해 손상된 전열을 회복한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"지속전","actions":["흡혈의 시선과 비전 방호를 보완한다.","재생 점액(Regenerative Goop)으로 회복 효과의 시너지를 노린다.","Regeneration Aura는 본체가 아니라 아군을 회복한다. 마법사 자신도 회복하려면 Self Healing(2SP)을 별도로 선택한다."]},{"range":"13–17","target":"군단 강화","actions":["죽음 저항(Death Defiance) 등 소환수 생존 업그레이드 고려.","본체가 직접 맞는 일이 없도록 위치·시야를 관리한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"보스 준비","actions":["슬라임과 다른 피해 속성을 가진 직접 공격 추가.","고체력·높은 물리저항 보스를 대비해 저항력 감소 및 집중 피해 확보.","Regenerative Goop은 슬라임이 오라 회복을 받으면 인접 아군도 회복시킨다. Death Defiance를 대안/두 번째 슬롯으로 검토한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["슬라임 소환만으로 보스가 줄지 않으면 Vampiric Gaze(아군의 시야에서 Dark 공격)와 별도 속성 직접 공격을 추가한다.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","슬라임 소환만으로 보스가 줄지 않으면 Vampiric Gaze(아군의 시야에서 Dark 공격)와 별도 속성 직접 공격을 추가한다."]}],"spells":[{"name":"슬라임 형태 (Slime Form)","up":"슬라임 생성","reason":"전열과 어그로 분산","priority":"필수"},{"name":"재생 오라 (Regeneration Aura)","up":"재생 점액(Regenerative Goop)","reason":"피해를 입은 아군의 회복","priority":"필수"},{"name":"재생 오라 (Regeneration Aura)","up":"죽음 저항(Death Defiance)","reason":"소환수의 생존 보조","priority":"후반"},{"name":"흡혈의 시선 (Vampiric Gaze)","up":"기본 효과","reason":"후방에서 공격·회복","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"기본 효과","reason":"본체 보호막","priority":"선택"},{"name":"늑대 (Wolf)","up":"기본","reason":"슬라임 형태 완성 전 일시적인 앞라인","priority":"초반"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"군단 배치·도주","priority":"생존"},{"name":"석화 (Petrify)","up":"기본","reason":"소환수 접근 전에 강적 제어","priority":"후반"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"자연 지팡이 (Nature Staff)","reason":"자연 속성 증강","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환 전력 강화","priority":"선택"},{"name":"위기 부적 (Crisis Charm)","reason":"급사 방지","priority":"안전"},{"name":"점액 지팡이 (Ooze Wand)","reason":"슬라임 계열 주문 강화","priority":"선택"},{"name":"드루이드 로브 (Robe of the Druids)","reason":"자연 주문 피해 강화, 몸통 장비 대안","priority":"선택"}],"rotation":["슬라임을 먼저 생성한 후 본체가 한 발짝 물러난다.","오라 효과 범위에 전열을 유지한다.","적 소환사·강력한 원거리 몬스터는 흡혈의 시선으로 따로 처치한다.","소환수가 잘 버티는 동안 추가 슬라임을 준비한다.","Regeneration Aura는 본체가 아니라 아군을 회복한다. 마법사 자신도 회복하려면 Self Healing(2SP)을 별도로 선택한다.","슬라임 소환만으로 보스가 줄지 않으면 Vampiric Gaze(아군의 시야에서 Dark 공격)와 별도 속성 직접 공격을 추가한다."],"pitfalls":["광역 공격이 플레이어와 슬라임을 함께 맞추지 않게 한다.","슬라임 수만 늘리고 보스 화력이 부족할 수 있다.","소환수가 많아지면 턴 진행이 느려질 수 있다.","Vampiric Gaze는 HP 10을 소비한다. 주문만 무작정 반복하면 본체 체력이 위험해진다."],"boss":["보스에게 슬라임 공격이 통하는지 확인.","슬라임 물량만으로 피해가 부족하면 다른 속성 공격·저항력 감소를 확보한다.","슬라임 소환만으로 보스가 줄지 않으면 Vampiric Gaze(아군의 시야에서 Dark 공격)와 별도 속성 직접 공격을 추가한다."],"variants":["회색 점액(Gray Goo) + 방어구 용해기(Armor Melter) 기반 물리 저항력 감소 변형."],"evidence":"스팀 초중반 생존 사례 기반. 이 정확한 세 주문 조합으로 엔딩 클리어는 검증되지 않음.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Slime Form 매턴 슬라임 생성→Regeneration Aura의 4HP 회복→장기 소환 전선","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Vampiric Gaze는 HP 10을 소비한다. 주문만 무작정 반복하면 본체 체력이 위험해진다."},"fallbacks":["초반 슬라임이 너무 빨리 죽으면 Wolf 한 마리와 Fae Plate를 우선 사용하고, 재생 오라는 슬라임이 쌓일 때 시작한다.","Vampiric Gaze는 HP 10을 소비한다. 주문만 무작정 반복하면 본체 체력이 위험해진다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Slime Form 매턴 슬라임 생성→Regeneration Aura의 4HP 회복→장기 소환 전선","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","초반 슬라임이 너무 빨리 죽으면 Wolf 한 마리와 Fae Plate를 우선 사용하고, 재생 오라는 슬라임이 쌓일 때 시작한다."],"craftNotes":["핵심 장비 Fae Plate의 제작 태그는 Arcane×1 + Metallic×1 + 자유×2 (총 4). 태그 공급 재료 예: Arcane: Arcane Mote(Arcane), Dreamthorn Vine(Arcane+Nature), Scripted Cortex(Arcane+Word) / Metallic: Shielding Shard(Metallic), Charged Cog(Metallic+Lightning), Sacrificial Brand(Blood+Metallic). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Wolf","cost":1,"reason":"Summon a Wolf"},{"kind":"spell","name":"Slime Form","cost":3,"reason":"Assume Slime Form for 12 turns / Gain 50 Physical and 100 Poison resistance / Each turn, summon a Green Slime nearby / If you have multiple upgrades that would replace the Green Slime, summon one of each"},{"kind":"spell","name":"Regeneration Aura","cost":2,"reason":"Each turn, heal allies within 8 tiles for 4 HP / Lasts 8 turns"},{"kind":"upgrade","name":"Regenerative Goop","forSpell":"Regeneration Aura","cost":2,"reason":"Slime allies heal adjacent allies when healed by the aura / Adds the Slime tag"},{"kind":"spell","name":"Vampiric Gaze","cost":4,"reason":"A bolt of darkness shoots forth from each of your allies at a random enemy in their line of sight / Each bolt deals 6 Dark damage / Allies are healed for the damage dealt by their corresponding bolt"},{"kind":"upgrade","name":"Death Defiance","forSpell":"Regeneration Aura","cost":6,"reason":"When you cast this spell, allies in the affected radius gain the ability to reincarnate on death / Adds the Holy tag"}],"purchaseCost":18,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Slime Form","cost":3,"tags":"Enchantment / Conjuration / Slime","base":"Assume Slime Form for 12 turns / Gain 50 Physical and 100 Poison resistance / Each turn, summon a Green Slime nearby / If you have multiple upgrades that would replace the Green Slime, summon one of each","stats":"충전 2 · 지속 12턴","upgrades":[{"name":"Blood Slime","cost":3,"effect":"Slime Form gains 3 HP Cost / Instead of a Green Slime, summon a Blood Slime / Adds the Blood tag"},{"name":"Electric Slime","cost":3,"effect":"Instead of a Green Slime, summon an Electric Slime / Adds the Lightning tag"},{"name":"Fire Slime","cost":3,"effect":"Instead of a Green Slime, summon a Fire Slime / Adds the Fire tag"},{"name":"Ice Slime","cost":3,"effect":"Instead of a Green Slime, summon an Ice Slime / Adds the Ice tag"},{"name":"Void Slime","cost":3,"effect":"Instead of a Green Slime, summon a Void Slime / Adds the Arcane tag"},{"name":"Chromatic Oozemancer","cost":9,"effect":"Slime Form gains 4 Num Summons / Summon 4 additional random slimes each turn / Adds the Chaos tag"}]},{"name":"Regeneration Aura","cost":2,"tags":"Enchantment / Nature","base":"Each turn, heal allies within 8 tiles for 4 HP / Lasts 8 turns","stats":"충전 2 · 반경 8 · 지속 8턴","upgrades":[{"name":"Regenerative Goop","cost":2,"effect":"Slime allies heal adjacent allies when healed by the aura / Adds the Slime tag"},{"name":"Self Healing","cost":2,"effect":"You are also healed by the aura"},{"name":"Global","cost":4,"effect":"The aura heals all allies on the level"},{"name":"Death Defiance","cost":6,"effect":"When you cast this spell, allies in the affected radius gain the ability to reincarnate on death / Adds the Holy tag"}]},{"name":"Vampiric Gaze","cost":4,"tags":"Dark / Blood / Sorcery / Eye","base":"A bolt of darkness shoots forth from each of your allies at a random enemy in their line of sight / Each bolt deals 6 Dark damage / Allies are healed for the damage dealt by their corresponding bolt","stats":"피해 6 · 충전 8 · HP소모 10","upgrades":[{"name":"Toxic Gaze","cost":3,"effect":"Vampiric Gaze also deals Poison damage / Adds the Nature tag"},{"name":"Coagulation","cost":4,"effect":"Vampiric Gaze gains 10 Minion Health / Vampiric Gaze gains 3 Minion Damage / Vampiric Gaze gains 3 Minion Range / Summon a Blood Slime when Vampiric Gaze kills a unit / Adds the Slime tag"},{"name":"Vampiric Tax","cost":5,"effect":"Vampiric Gaze heals you for any damage it deals"},{"name":"Refracting Gaze","cost":6,"effect":"Each bolt bounces once to an enemy in line of sight of its target"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Wolf","cost":1,"tags":"Nature / Conjuration","base":"Summon a Wolf","stats":"충전 7 · 사거리 5","upgrades":[{"name":"Werewolf","cost":1,"effect":"Summon a Werewolf instead of a Wolf / Adds the Dark tag"},{"name":"Fleet Footed","cost":2,"effect":"Wolves gain quickstep / Adds the Translocation tag"},{"name":"Ravenous Wolf","cost":5,"effect":"Consumes all remaining charges on cast / The wolf's health and spells' damage are multiplied by the number of charges consumed / Each time the wolf kills a unit, they grow more powerful / Adds the Blood tag"},{"name":"Wolf Pack","cost":6,"effect":"Wolf gains 3 Num Summons / Summons a pack of 3 wolves instead of just 1"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Petrify","cost":2,"tags":"Arcane / Enchantment","base":"Petrify the target for 10 turns","stats":"충전 10 · 사거리 6 · 지속 10턴","upgrades":[{"name":"Arcane Conductivity","cost":2,"effect":"Target also loses 100 Arcane resist"},{"name":"Glassify","cost":2,"effect":"Target is glassed instead of petrified"},{"name":"Rocky Servitude","cost":3,"effect":"Petrify gains 8 Minion Damage / If the target is slain while petrified, raise them as a Golem / Golems inherit the HP of the slain unit"},{"name":"Panic","cost":8,"effect":"Enemies in line of sight of the target are feared for 2 turns"}]}],"verifiedGear":[{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Nature Staff","slot":"무기","recipe":"Nature×2 + 자유×2","cost":4,"effect":"Nature spells and equipment gain 50% Max Charges ; Nature spells and equipment gain 50% Minion Damage ; Nature spells and equipment gain 50% Minion Health","priority":"선택","verified":true},{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"선택","verified":true},{"name":"Crisis Charm","slot":"장신구","recipe":"Holy×1 + Word×1 + 자유×2","cost":4,"effect":"On taking lethal damage, remove all debuffs and heal to full health / Discarded after use","priority":"안전","verified":true},{"name":"Ooze Wand","slot":"무기","recipe":"Slime×2 + 자유×2","cost":4,"effect":"Slime spells and equipment gain 100% Minion Health ; Slime spells and equipment gain 100% Minion Range","priority":"선택","verified":true},{"name":"Robe of the Druids","slot":"몸통","recipe":"Nature×2 + 자유×7","cost":9,"effect":"Nature spells and equipment gain 50% Damage ; Nature spells and equipment gain 50% Minion Health ; 100% Resist Poison","priority":"선택","verified":true}]},{"id":"chain","icon":"⚡","title":"연쇄 번개 · 폭풍 드래곤","group":"핵심 빌드 1–4","level":"★★☆","tagline":"드래곤에게 번개를 맡기는 자동 포격","idea":"연쇄 번개(Chain Lightning)와 폭풍 드래곤(Storm Drake)을 조합한다. 용 마법사(Dragon Mage)로 소환수가 직접 연쇄 번개를 사용하게 하며, 번개 보호막(Lightning Shield)으로 방어까지 담당한다.","first":["1구역: 번개 화살(Lightning Bolt).","2구역: 폭풍 드래곤(Storm Drake).","3구역: 연쇄 번개(Chain Lightning).","4구역: 번개 보호막(Lightning Shield).","5구역: 용 마법사(Dragon Mage).","7구역 목표: 폭풍 소환(Storm Summoning)."],"phases":[{"range":"1–2","target":"드래곤 확보","actions":["번개 화살로 직선의 적을 함께 공격한다.","드래곤이 살아남을 위치에 소환한다.","Lightning Bolt는 직선형이라 적을 한 줄에 세워 초기 충전을 절약한다."]},{"range":"3–5","target":"자동 번개","actions":["연쇄 번개 → 번개 보호막 → 용 마법사 순서로 연결한다.","드래곤이 주문을 쓰는 시간을 벌어준다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"6–10","target":"확장","actions":["폭풍 소환(Storm Summoning) 확보.","뇌우의 비(Rain of Thunderbolts)를 목표로 한다.","Storm Summoning은 별도 주문이 아닌 Storm Drake 7SP 업그레이드. Dragon Mage와 2업그레이드 한도 내에서 선택한다."]},{"range":"11–15","target":"자동 생산","actions":["폭풍 드래곤 생성(Tempest Drakes)·폭풍 신호기(Storm Beacon)로 소환 효율을 높인다.","갈바닉 집중 장치 등 저항력 감소 수단 확보.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"16–19","target":"후반 대책","actions":["비번개 속성/물리 공격 보조.","보호막 장비와 순간이동으로 본체 보호.","소환수가 제어되거나 훔쳐지는 적을 조심한다.","Tempest Drakes는 Rain of Thunderbolts의 9SP 업그레이드이며 확률 소환이다. Storm Beacon을 얻지 못해도 드레이크 하나로 운용한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["The Body Electric은 Lightning 내성이 있어 직접 피해에 취약하지 않다. 물리·Fire·Arcane 등 별도 피해가 필요하다.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","The Body Electric은 Lightning 내성이 있어 직접 피해에 취약하지 않다. 물리·Fire·Arcane 등 별도 피해가 필요하다."]}],"spells":[{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"초반 공격","priority":"필수"},{"name":"폭풍 드래곤 (Storm Drake)","up":"용 마법사(Dragon Mage)","reason":"자동 번개 공격","priority":"필수"},{"name":"연쇄 번개 (Chain Lightning)","up":"번개 보호막(Lightning Shield)","reason":"아군 보호막 생성 및 적 연쇄 공격","priority":"필수"},{"name":"연쇄 번개 (Chain Lightning)","up":"구름 전도(Cloud Conductance)","reason":"구름 연쇄를 활용하는 변형","priority":"선택"},{"name":"폭풍 소환 (Storm Drake)","up":"폭풍 소환(Storm Summoning, 7 SP)","reason":"폭풍 드래곤의 업그레이드로 소환 확대. 별도 주문이 아님","priority":"필수"},{"name":"뇌우의 비 (Rain of Thunderbolts)","up":"폭풍 드래곤 생성(Tempest Drakes)","reason":"후반 대량 소환","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"번개 면역 적 앞에서 본체 보호","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"소환 자리 조정","priority":"생존"}],"gear":[{"name":"번개 지팡이 (Lightning Staff)","reason":"번개 주문 강화","priority":"초중반"},{"name":"갈바닉 집중 장치 (Galvanic Focus)","reason":"번개 저항력 대응","priority":"중반"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"드래곤 강화","priority":"선택"},{"name":"폭풍 신호기 (Storm Beacon)","reason":"후반 소환 가속","priority":"후반"}],"rotation":["시야가 안전한 곳에서 폭풍 드래곤을 소환한다.","연쇄 번개를 사용해 밀집한 적을 타격하고 아군에 보호막을 제공한다.","용 마법사로 드래곤이 자동으로 연쇄 번개를 사용하게 한다.","폭풍을 이용해 소환을 확장하고, 본체는 위험한 적만 직접 제거한다.","Storm Summoning은 별도 주문이 아닌 Storm Drake 7SP 업그레이드. Dragon Mage와 2업그레이드 한도 내에서 선택한다.","The Body Electric은 Lightning 내성이 있어 직접 피해에 취약하지 않다. 물리·Fire·Arcane 등 별도 피해가 필요하다."],"pitfalls":["초반 용 마법사 이전까지는 화력이 낮아 사망할 수 있다.","번개 저항력 100% 적이 많은 균열은 선택하지 않는다.","보호막을 무조건 생성하는 게 아니라 아군 연결·배치가 중요하다.","Lightning Shield는 Chain Lightning의 업그레이드. 추가 보호막이 생겨도 소환수 직접 시전 조건과 번개 면역을 따로 확인해야 한다."],"boss":["전기의 육체(Body Electric): 직접 대상 주문 반격 주의.","아마루 등 번개만으로 어려운 적은 소환수 물리/다른 유형 피해 필요.","The Body Electric은 Lightning 내성이 있어 직접 피해에 취약하지 않다. 물리·Fire·Arcane 등 별도 피해가 필요하다."],"variants":["구름 전도(Cloud Conductance) 중심 번개 구름 빌드.","연쇄 화염구(Chain Fireball)로 화염 피해를 연계하는 혼합형."],"evidence":"THEKI 트라이얼 1~7구역 구매 흐름과 해외 클리어 사례를 참고.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Storm Drake→Dragon Mage로 드래곤이 Chain Lightning 자동 시전→Lightning Shield로 전열 보호","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Lightning Shield는 Chain Lightning의 업그레이드. 추가 보호막이 생겨도 소환수 직접 시전 조건과 번개 면역을 따로 확인해야 한다."},"fallbacks":["Storm Drake가 늦으면 Chain Lightning+Jolting Chain(1SP)으로 기절 제어 후 보호막 장비를 먼저 제작한다.","Lightning Shield는 Chain Lightning의 업그레이드. 추가 보호막이 생겨도 소환수 직접 시전 조건과 번개 면역을 따로 확인해야 한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Storm Drake→Dragon Mage로 드래곤이 Chain Lightning 자동 시전→Lightning Shield로 전열 보호","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Storm Drake가 늦으면 Chain Lightning+Jolting Chain(1SP)으로 기절 제어 후 보호막 장비를 먼저 제작한다."],"craftNotes":["핵심 장비 Lightning Staff의 제작 태그는 Lightning×2 + 자유×2 (총 4). 태그 공급 재료 예: Lightning: Lightning Jar(Lightning), Charged Cog(Metallic+Lightning), Fulminite Shard(Lightning+Enchantment). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Lightning Bolt","cost":1,"reason":"Deal 12 Lightning damage in a beam"},{"kind":"spell","name":"Storm Drake","cost":4,"reason":"Summon a Storm Drake"},{"kind":"spell","name":"Chain Lightning","cost":3,"reason":"Unleash an arcing bolt of electricity dealing 24 Lightning damage / The bolt repeatedly arcs to new targets within range of the previous target / Each arc deals damage to units in a beam / The bolt terminates when it cannot arc to any new targets"},{"kind":"upgrade","name":"Dragon Mage","forSpell":"Storm Drake","cost":3,"reason":"Storm Drakes can cast your Chain Lightning on a 9 turn cooldown"},{"kind":"upgrade","name":"Lightning Shield","forSpell":"Chain Lightning","cost":3,"reason":"Chain Lightning can arc to friendly targets / Friendly units hit by Chain Lightning gain 1 SH instead of being damaged"},{"kind":"upgrade","name":"Storm Summoning","forSpell":"Storm Drake","cost":7,"reason":"Storm Drake gains 2 Num Summons / When you cast Storm Drake, up to 2 Storm Clouds in line of sight of the target are converted into Storm Drakes"},{"kind":"spell","name":"Rain of Thunderbolts","cost":7,"reason":"Cast Thunder Strike targeting up to 12 Storm Clouds each turn / Clouds with enemies in them are prioritized / Will not target the caster or their allies / This spell can be channeled for up to 12 turns"}],"purchaseCost":28,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 2 turns"}]},{"name":"Storm Drake","cost":4,"tags":"Lightning / Conjuration / Dragon","base":"Summon a Storm Drake","stats":"충전 3 · 사거리 4","upgrades":[{"name":"Dragon Mage","cost":3,"effect":"Storm Drakes can cast your Chain Lightning on a 9 turn cooldown"},{"name":"Spirit Drakes","cost":3,"effect":"Storm Drakes gain 5 HP when you cast a Lightning spell targeting a tile in their line of sight"},{"name":"Storm Summoning","cost":7,"effect":"Storm Drake gains 2 Num Summons / When you cast Storm Drake, up to 2 Storm Clouds in line of sight of the target are converted into Storm Drakes"},{"name":"Stormcrest","cost":9,"effect":"When you cast this spell, if there is room, summon Stormcrest instead of a Storm Drake / Can only activate once each level"}]},{"name":"Chain Lightning","cost":3,"tags":"Lightning / Sorcery","base":"Unleash an arcing bolt of electricity dealing 24 Lightning damage / The bolt repeatedly arcs to new targets within range of the previous target / Each arc deals damage to units in a beam / The bolt terminates when it cannot arc to any new targets","stats":"피해 24 · 충전 3 · 사거리 5","upgrades":[{"name":"Jolting Chain","cost":1,"effect":"Affected units are stunned for 1 turn"},{"name":"Cloud Conductance","cost":2,"effect":"Chain Lightning can arc to Blizzards, Rain Clouds, and Storm Clouds / Adds the Nature tag"},{"name":"Lightning Shield","cost":3,"effect":"Chain Lightning can arc to friendly targets / Friendly units hit by Chain Lightning gain 1 SH instead of being damaged"},{"name":"Chain Fireball","cost":7,"effect":"Cast Fireball on each tile Chain Lightning arcs to / Adds the Fire tag"}]},{"name":"Rain of Thunderbolts","cost":7,"tags":"Lightning / Sorcery","base":"Cast Thunder Strike targeting up to 12 Storm Clouds each turn / Clouds with enemies in them are prioritized / Will not target the caster or their allies / This spell can be channeled for up to 12 turns","stats":"충전 1 · 채널 12턴","upgrades":[{"name":"Cryostorm","cost":6,"effect":"Rain of Thunderbolts may also target Blizzards or Rain Clouds, but casts Iceball on them instead of Thunder Strike / Adds the Ice tag"},{"name":"Stormbringer","cost":7,"effect":"Each turn you channel, summon 12 Storm Clouds at random locations"},{"name":"Thunder God","cost":8,"effect":"Instead of channeling this spell, when you cast it, you get a buff for 12 turns which causes its effects to trigger as though you had channeled it at the end of each turn / Adds the Enchantment tag"},{"name":"Tempest Drakes","cost":9,"effect":"Each strike has a 20% chance of casting your Storm Drake spell / Adds the Dragon tag"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]}],"verifiedGear":[{"name":"Lightning Staff","slot":"무기","recipe":"Lightning×2 + 자유×2","cost":4,"effect":"Lightning spells and equipment gain 7 Damage ; Lightning spells and equipment gain 4 Minion Damage ; Lightning spells and equipment gain 1 Max Charges","priority":"초중반","verified":true},{"name":"Galvanic Focus","slot":"장신구","recipe":"Lightning×1 + Metallic×1 + 자유×3","cost":5,"effect":"Targeting a Metallic or Construct enemy with a Lightning spell inflicts a debuff which reduces their Lightning resistance by 25%","priority":"중반","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"선택","verified":true},{"name":"Storm Beacon","slot":"장신구","recipe":"Lightning×2 + Translocation×1 + 자유×2","cost":5,"effect":"Each turn, summon a random number of Storm Clouds across the level / The Storm Clouds deal 10 damage and last for 5 turns / The maximum number summoned each turn is your Lightning mastery","priority":"후반","verified":true}]},{"id":"fire","icon":"🔥","title":"화염 · 저주 · 불기둥","group":"핵심 빌드 1–4","level":"★★★","tagline":"화염구 1종으로 초반을 넘기고, 방어를 갖춘 다음 불기둥 연쇄를 완성","idea":"초반에는 화염구(Fireball) 한 종류로 광역 처치를 담당하고 SP를 방어·핵심 주문에 집중한다. 비전 방호(Arcane Ward) 또는 요정 판금(Fae Plate)으로 피격을 줄인 다음, 불기둥(Pillar of Fire)으로 체력이 낮은 적을 처치해 절멸의 기둥(Pillar of Annihilation)을 연쇄 발동한다. 중후반 화염·번개 저주(Pyrostatic Curse)와 저항력 융해(Resistance Melting)로 저항력에 대응한다. 화염 폭발·고급 제작 장비는 필수 선행 조건이 아니라 여유가 있을 때 강화하는 선택지다.","first":["1구역: 화염구(Fireball) 1종으로 시작. 여러 적을 함께 맞히고, 약한 적 1마리에게 남은 충전을 낭비하지 않는다.","2~3구역: 화염구 외 공격 주문을 연달아 구매하지 말고 SP를 모은다. 원거리·상태이상 적이 적은 균열을 고른다.","3~5구역: 요정 판금(Fae Plate)을 제작할 수 있으면 우선 검토; 재료가 없다면 비전 방호(Arcane Ward)를 방어 1순위로 고려한다. 둘 다 없다면 벽·시야·시작 위치로 버틴다.","5~8구역: 불기둥(Pillar of Fire)을 확보해 강한 원거리 적을 제거한다. 광역 범위에 자기 자신이 들어가는지 반드시 확인한다.","8~11구역: 낮은 체력 적 처치가 가능하면 절멸의 기둥(Pillar of Annihilation)을, 화염 저항·보호막이 문제면 교란의 불꽃(Disrupting Flames)을 먼저 택한다.","11~15구역: 화염·번개 저주(Pyrostatic Curse) → 저항력 융해(Resistance Melting). 절멸 연쇄가 안정적이면 파이로스태틱 혼돈(Pyrostatic Chaos)으로 확장한다.","후반: 순간이동(Teleport)·추가 방어·비화염 공격을 보강한다. 정화자(The Purifier)나 화산의 창(Volcanic Lance)은 재료가 갖춰질 때만 연계한다."],"phases":[{"range":"1–2","target":"최소 주문으로 안정화","actions":["화염구(Fireball)는 다수 적을 맞히는 위치에서 사용하고, 시야를 끊어 적을 나눠 상대한다.","SP를 화염 폭발·추가 광역기에 바로 투자하지 않는다. 화염 저항 적이 많은 균열은 피한다.","첫 구역부터 안전한 시작 타일을 정하고 적 소환사·장거리 상태이상 적을 먼저 처리한다.","Fireball은 기본 Lv1·범위 피해. 본체가 범위에 포함되는지 확인하고 저가 주문으로 SP를 절약한다."]},{"range":"3–5","target":"방어 1개 + SP 확보","actions":["재료가 허용하면 요정 판금(Fae Plate), 아니면 비전 방호(Arcane Ward) 등 방어 수단 한 개를 먼저 확보한다.","즉시 제작 가능한 방어 장비가 있다면 보호 주문 구매를 뒤로 미뤄 SP를 아낀다.","화염구 충전이 부족하거나 저항 적을 피할 수 없을 때에만 보조 공격을 추가한다."]},{"range":"5–8","target":"불기둥으로 위협 제거","actions":["불기둥(Pillar of Fire) 확보 시점은 SP에 따라 조정한다. 먼저 강한 적을 제거하는 단일 결정타로 사용한다.","불기둥은 사용 횟수가 적고 자기 피격 위험이 있으므로, 마법사가 범위 밖에 있는지 확인한다.","불기둥만으로 모든 적을 처리하려 하지 말고 남은 적은 화염구로 정리한다.","Pillar of Fire는 중심 타일에 2배 피해를 주지만 기본 충전 2회. Pillar of Annihilation은 처치에 성공해야 추가 발동한다."]},{"range":"8–11","target":"첫 번째 연쇄 완성","actions":["체력이 낮은 적을 불기둥으로 처치해 절멸의 기둥(Pillar of Annihilation)을 연쇄시킨다.","보호막·화염 저항이 발목을 잡으면 절멸보다 교란의 불꽃(Disrupting Flames)을 먼저 구입한다.","연쇄 발동에 실패해도 바로 죽지 않도록 보호막과 벽 뒤 후퇴 위치를 준비한다."]},{"range":"11–16","target":"저주·장비는 선택적으로 확대","actions":["화염·번개 저주(Pyrostatic Curse)에 저항력 융해(Resistance Melting)를 연결해 화염·번개 저항 적을 상대한다.","절멸이 안정적으로 발생하는 경우에만 파이로스태틱 혼돈(Pyrostatic Chaos)을 추가한다.","정화자(The Purifier)가 있으면 화염 폭발(Flame Burst)의 밝은 화염(Bright Flame) 연계를 고려하고, 장비가 없다면 해당 추가 지출은 미룬다.","방어가 부족하면 화력 주문보다 순간이동(Teleport)이나 비전 방호 보강을 우선한다.","Disrupting Flames와 Pillar of Annihilation은 같은 주문의 두 업그레이드 슬롯을 쓰므로 세 번째 업그레이드를 더 살 수 없다는 점을 지킨다."]},{"range":"17–21","target":"보스용 지속전","actions":["화염 속성 저항 외에도 Sorcery/Enchantment 주문 유형 면역이 있는지 확인하고 별도 피해 수단을 마련한다.","불기둥 충전이 부족한 긴 보스전은 충전 보조 장비·저주·다른 피해 유형으로 대응한다.","모르드레드전에서는 연쇄 시작용 약한 적이 없을 수도 있으므로 단일 대상 지속 피해와 본체 생존을 함께 준비한다.","Amaru는 Fire/Ice 및 특정 주문 유형 면역이 있어 비화염·비주문 피해 대책이 필요하다."]}],"spells":[{"name":"화염구 (Fireball)","up":"혼돈 화염구(Chaos Ball)는 저항 적 대처가 필요할 때만","reason":"첫 1~5구역의 기본 공격. 다수 적 동시 처리에 사용","priority":"시작 필수"},{"name":"비전 방호 (Arcane Warding)","up":"기본 효과로도 충분; 방어 장비가 없을 때 우선","reason":"불기둥 연쇄가 완성되기 전 급사 방지","priority":"초반 생존"},{"name":"불기둥 (Pillar of Fire)","up":"절멸의 기둥 (Pillar of Annihilation)","reason":"처치 성공 시 추가 절멸 주문으로 화력 확대","priority":"핵심"},{"name":"불기둥 (Pillar of Fire)","up":"교란의 불꽃 (Disrupting Flames)","reason":"보호막·화염 저항 적이 막힐 때 우선 구매","priority":"조건부 핵심"},{"name":"화염·번개 저주 (Pyrostatic Curse)","up":"저항력 융해 (Resistance Melting)","reason":"화염·번개 저항 대처. 10/12 베타 변경 효과는 현재 버전 확인","priority":"중반 핵심"},{"name":"화염·번개 저주 (Pyrostatic Curse)","up":"파이로스태틱 혼돈 (Pyrostatic Chaos)","reason":"절멸의 기둥의 Chaos 주문과 연쇄되도록 확장","priority":"연쇄 완성 후"},{"name":"순간이동 (Teleport)","up":"퀵캐스트 (Quickcast) 가능하면","reason":"불기둥 범위 회피·시야 단절·위기 탈출","priority":"생존 추천"},{"name":"화염 폭발 (Flame Burst)","up":"밝은 화염(Bright Flame), 이중 폭발(Dual Burst)","reason":"정화자(The Purifier) 등을 얻었을 때 확장. 초반 필수 아님","priority":"장비 조건부"},{"name":"용해 (Melt)","up":"백색 화염(White Flame), 대량 용해(Mass Melt)","reason":"중후반 추가 화력과 연계","priority":"후반 선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"조기 제작 가능하면 방어 투자 부담을 줄이는 보호막 장비","priority":"초반 안전"},{"name":"화산의 창 (Volcanic Lance)","reason":"화염 주문 사용 시 추가 광선; 확보 시 연쇄 화력 향상","priority":"중후반 화력"},{"name":"정화자 (The Purifier)","reason":"밝은 화염(Bright Flame) 등 신성 피해 연계가 있을 때 효율 증가","priority":"조건부 연계"},{"name":"파이로스태틱 오큘러스 (Pyrostatic Oculus)","reason":"화염·번개 저항력 감소 보조","priority":"저항 대응"},{"name":"철학자의 돌 (Philosopher's Stone)","reason":"충전 횟수가 부족한 불기둥의 지속전 보조","priority":"지속전 추천"},{"name":"보이드 여행자의 망토 (Void Traveler's Cloak)","reason":"순간이동과 보호막 획득 연계가 가능한 경우","priority":"생존 선택"}],"rotation":["전투 전 T키로 위협 범위, 화염 저항, 시작 타일을 확인하고 화염구로 밀집한 약한 적부터 정리한다.","즉사 위험이 있으면 공격보다 비전 방호/장비 보호막 또는 순간이동으로 한 턴을 확보한다.","불기둥 범위에 본체가 없는지 확인하고 체력이 낮은 적을 마무리해 절멸의 기둥을 연쇄 발동한다.","화염 저항·보호막이 걸림돌이면 교란의 불꽃 또는 화염·번개 저주로 대응한 다음 연쇄를 건다.","보스에게 연쇄용 잡몹이 없으면 주문을 낭비하지 말고 충전 보조·별도 지속 피해로 전환한다."],"pitfalls":["화염구·화염 폭발·고급 업그레이드를 초반에 함께 구매하면 불기둥과 생존 주문 확보가 늦어진다.","불기둥은 피해 범위에 마법사가 들어가면 자해 위험이 있고 충전 횟수도 적다.","절멸의 기둥은 처치가 선행되어야 하므로 체력이 높은 적 하나를 상대로 자동 연쇄를 기대하지 않는다.","화염 저항 100%뿐 아니라 Sorcery/Enchantment 유형 면역, 적 보호막을 확인한다.","제작 장비는 드랍·재료 운에 좌우된다. 정화자·화산의 창이 없어도 빌드를 진행할 수 있어야 한다.","Pyrostatic Curse Resistance Melting의 효과는 버전별 확인. 화염 저항 감소와 다른 주문 유형 면역을 혼동하지 않는다."],"boss":["아마루(Amaru): 화염 저항과 주문 유형 면역을 따로 확인하고 유효한 다른 피해 유형을 준비한다.","모르드레드(Mordred): 초기 연쇄를 터뜨릴 처치 대상이 없을 수 있으니 단일 지속 피해·보호막·충전 관리를 확보한다.","보호막이 많은 상대는 교란의 불꽃(Disrupting Flames) 등 제거 수단을 우선한다.","Amaru는 Fire/Ice 및 특정 주문 유형 면역이 있어 비화염·비주문 피해 대책이 필요하다."],"variants":["정화자(The Purifier)를 일찍 제작했다면 화염 폭발(Flame Burst) → 밝은 화염(Bright Flame)으로 보조 화력을 늘린다. 제작 불가 시 무리해서 구매하지 않는다.","불의 비(Rain of Fire) + 화염의 문(Flame Gate) + 화염 광란 가면(Fire Frenzy Mask)은 별도 소환·화염구 반복형으로 전환할 때만 선택한다."],"evidence":"스팀 파이로맨서 트라이얼 조합과 플레이 후기 기반. 1~8구역 생존·구매 순서는 안정성을 위해 재설계한 권장 경로로, 보장된 클리어 루트는 아니다. 2026-10-12 베타의 저항력 융해 변경은 실제 플레이 브랜치에서 확인할 것.","sources":[["Steam 파이로맨서 트라이얼 구성","https://steamcommunity.com/app/4366330/discussions/0/589562498866268086/"],["Steam 빌드 가이드·공통 생존 지침","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["RW3 2026-10-12 베타 변경 사항","https://steamdb.info/patchnotes/25891047/"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Fireball 최저가 스타트→Pillar of Fire→Pillar of Annihilation 연쇄→Pyrostatic Curse 저항 대응","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Pyrostatic Curse Resistance Melting의 효과는 버전별 확인. 화염 저항 감소와 다른 주문 유형 면역을 혼동하지 않는다."},"fallbacks":["Pillar가 늦으면 Fireball로 밀집 적만 처리하고 Fae Plate/Arcane Warding으로 위험한 턴을 통과한다.","Pyrostatic Curse Resistance Melting의 효과는 버전별 확인. 화염 저항 감소와 다른 주문 유형 면역을 혼동하지 않는다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Fireball 최저가 스타트→Pillar of Fire→Pillar of Annihilation 연쇄→Pyrostatic Curse 저항 대응","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Pillar가 늦으면 Fireball로 밀집 적만 처리하고 Fae Plate/Arcane Warding으로 위험한 턴을 통과한다."],"craftNotes":["핵심 장비 Fae Plate의 제작 태그는 Arcane×1 + Metallic×1 + 자유×2 (총 4). 태그 공급 재료 예: Arcane: Arcane Mote(Arcane), Dreamthorn Vine(Arcane+Nature), Scripted Cortex(Arcane+Word) / Metallic: Shielding Shard(Metallic), Charged Cog(Metallic+Lightning), Sacrificial Brand(Blood+Metallic). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Fireball","cost":1,"reason":"Deal 9 Fire damage in a 2 tile burst"},{"kind":"spell","name":"Pillar of Fire","cost":5,"reason":"Deal 50 Fire damage in a 1 tile burst / Deals double damage to the targeted tile"},{"kind":"upgrade","name":"Pillar of Annihilation","forSpell":"Pillar of Fire","cost":4,"reason":"Pillar of Fire gains 4 Num Targets / On kill, cast Annihilate on up to 4 enemies in line of sight of the killed unit / Adds the Chaos tag"},{"kind":"upgrade","name":"Disrupting Flames","forSpell":"Pillar of Fire","cost":3,"reason":"Pillar of Fire gains 10 Duration / Strips target of shields and applies -50 Fire resist for 10 turns"},{"kind":"spell","name":"Pyrostatic Curse","cost":3,"reason":"Curse enemies in a 4 tile burst for 6 turns / When a cursed unit takes Fire damage, 2 enemies in line of sight of it take that much Lightning damage"},{"kind":"upgrade","name":"Resistance Melting","forSpell":"Pyrostatic Curse","cost":3,"reason":"Pyrostatic Curse removes 50% Fire resist from affected targets"}],"purchaseCost":19,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Fireball","cost":1,"tags":"Fire / Sorcery","base":"Deal 9 Fire damage in a 2 tile burst","stats":"피해 9 · 충전 12 · 사거리 6 · 반경 2","upgrades":[{"name":"Ash Ball","cost":2,"effect":"Fireball gains 4 Duration / Fireball blinds and poisons units for 4 turns"},{"name":"Meteor","cost":3,"effect":"Fireball gains 3 Duration / Units in the center tile take extra Physical damage and are stunned for 3 turns"},{"name":"Shaped Blast","cost":4,"effect":"Fireball gains 1 radius for every 4 tiles away that you cast it, and never damages the wizard or their allies"},{"name":"Chaos Ball","cost":5,"effect":"Fireball randomly deals Physical, Lightning, or Fire damage / If a unit is resistant to one or more of these damage types, Fireball deals the damage type that unit is least resistant to / Adds the Chaos tag"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Pillar of Fire","cost":5,"tags":"Fire / Holy / Sorcery","base":"Deal 50 Fire damage in a 1 tile burst / Deals double damage to the targeted tile","stats":"피해 50 · 충전 2 · 사거리 8 · 반경 1","upgrades":[{"name":"Channeled Flame","cost":2,"effect":"Pillar of Fire gains 12 Max Channel / You may channel Pillar of Fire for up to 12 turns"},{"name":"Disrupting Flames","cost":3,"effect":"Pillar of Fire gains 10 Duration / Strips target of shields and applies -50 Fire resist for 10 turns"},{"name":"Pillar of Annihilation","cost":4,"effect":"Pillar of Fire gains 4 Num Targets / On kill, cast Annihilate on up to 4 enemies in line of sight of the killed unit / Adds the Chaos tag"},{"name":"Orbital Bombardment","cost":5,"effect":"Pillar of Fire gains 50 Damage / Pillar of Fire gains 8 Range / Pillar of Fire gains 1 Radius"}]},{"name":"Pyrostatic Curse","cost":3,"tags":"Fire / Lightning / Enchantment","base":"Curse enemies in a 4 tile burst for 6 turns / When a cursed unit takes Fire damage, 2 enemies in line of sight of it take that much Lightning damage","stats":"충전 2 · 사거리 7 · 반경 4 · 지속 6턴","upgrades":[{"name":"Linear Conductance","cost":1,"effect":"Lightning damage is dealt in a beam instead of to a single target"},{"name":"Cursebringer","cost":2,"effect":"Cast Pyrostatic Curse at your location at the beginning of each level"},{"name":"Resistance Melting","cost":3,"effect":"Pyrostatic Curse removes 50% Fire resist from affected targets"},{"name":"Pyrostatic Chaos","cost":5,"effect":"When you cast another Chaos spell, cast Pyrostatic Curse at the target / Adds the Chaos tag"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Flame Burst","cost":4,"tags":"Fire / Sorcery","base":"Deal 40 Fire damage in a 5 tile burst around the caster","stats":"피해 40 · 충전 3 · 반경 5","upgrades":[{"name":"Melting Flame","cost":2,"effect":"Melt walls adjacent to the blast"},{"name":"Bright Flame","cost":4,"effect":"Deal Holy damage instead of Fire / Grants allies 1 SH instead of damaging them / Adds the Holy tag"},{"name":"Dual Burst","cost":5,"effect":"Auto recasts at the end of your next turn"},{"name":"Spreading Flame","cost":6,"effect":"Casting Flame Burst consumes all remaining charges / For each charge consumed, it gets +1 radius / Slain units create additional explosions with half radius and damage / Will not harm the caster"}]},{"name":"Melt","cost":2,"tags":"Fire / Sorcery","base":"Target takes 22 Fire damage and loses 100 Physical resist","stats":"피해 22 · 충전 14 · 사거리 5 · 지속 3턴","upgrades":[{"name":"Mass Melt","cost":3,"effect":"Melt gains 6 Num Targets / Melt affects up to 6 enemies in a connected group"},{"name":"Melting Point","cost":3,"effect":"If you end your turn in range of a frozen or soaked enemy, cast Melt on them"},{"name":"Plasmify","cost":3,"effect":"Melt gains 10 Minion Health / Melt gains 3 Minion Damage / Melt gains 3 Minion Range / Summon 2 Red Slimes when Melt kills its target / Adds the Slime tag"},{"name":"White Flame","cost":5,"effect":"When you cast a Fire or Chaos spell other than Melt targeting an enemy, Melt is also cast at the target / Always Active"}]}],"verifiedGear":[{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"초반 안전","verified":true},{"name":"Volcanic Lance","slot":"무기","recipe":"Fire×2 + Translocation×1 + 자유×3","cost":6,"effect":"When you cast a Fire spell targeting an enemy, send out a destructive beam toward the target / The beam destroys walls and deals Fire damage equal to your Fire mastery","priority":"중후반 화력","verified":true},{"name":"The Purifier","slot":"무기","recipe":"Fire×2 + Enchantment×2 + Holy×2 + 자유×4","cost":10,"effect":"For every 120 damage dealt to enemies by Holy spells or equipment, cast Immolate on a random enemy / Damage Dealt: 0","priority":"조건부 연계","verified":true},{"name":"Pyrostatic Oculus","slot":"장신구","recipe":"Enchantment×1 + Fire×1 + Lightning×1 + 자유×3","cost":6,"effect":"The first time an enemy takes Fire or Lightning damage, it gets -25 Fire and Lightning resist","priority":"저항 대응","verified":true},{"name":"Philosopher's Stone","slot":"장신구","recipe":"자유×10","cost":10,"effect":"This item gains the tags of the components used to craft it / When you cast a spell that shares a tag with this item, there is a 10% chance for all of your spells to regain a charge","priority":"지속전 추천","verified":true},{"name":"Void Traveler's Cloak","slot":"몸통","recipe":"Arcane×1 + Translocation×2 + 자유×2","cost":5,"effect":"When you teleport, gain 2 SH","priority":"생존 선택","verified":true}]},{"id":"missile","icon":"✨","title":"마법 미사일 · 분산","group":"핵심 빌드 1–4","level":"★★★","tagline":"분산시킨 적마다 마법 미사일을 발동","idea":"마법 미사일(Magic Missile) → 분산(Disperse) → 폭력적 왜곡(Violent Warp)을 초반에 맞추고, 도탄(Ricochet)과 비전 광란 가면(Arcane Frenzy Mask)으로 다수 적에게 강해지는 빌드.","first":["1구역: 마법 미사일(Magic Missile).","2구역: 분산(Disperse).","3구역 목표: 폭력적 왜곡(Violent Warp).","4~5구역: 도탄(Ricochet)·교란 탄환(Disruption Bolt)을 검토.","핵심 연계: Magic Missile→Disperse→Violent Warp로 순간이동 적마다 미사일 발동","핵심 주문이 늦어질 때: Fae Thorn Staff 등의 보조가 늦어도 Magic Missile+Disperse 핵심 주문만으로 움직인다.","보스 대비: Arcane 100% 저항 적에게 Disruption Bolt가 있으면 Magic Missile의 Dark/Holy 변환을 활용한다.","Magic Missile 업그레이드 최대 2개: Arcane Crossfire, Ricochet, Disruption Bolt 중 2개를 선택한다."],"phases":[{"range":"1–3","target":"자동 공격 엔진","actions":["마법 미사일과 분산을 구매한다.","폭력적 왜곡을 빠르게 구매해 순간이동된 적에게 미사일 발동.","소수의 비전 면역 적은 피한다.","Magic Missile Lv1 이후 Disperse Lv2만 구매하면 즉시 위치 제어가 된다. Violent Warp 6SP를 핵심으로 저축한다."]},{"range":"4–7","target":"광역 보완","actions":["도탄(Ricochet) 및 교란 탄환(Disruption Bolt)로 사각지대 감소.","위협 범위 확인 후 분산을 사용한다(적이 가까이 올 수도 있음).","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"반복 공격","actions":["비전 광란 가면을 제작 목표로 둔다.","공허불꽃 랜턴/수정 로브로 보조 발동을 검토한다.","Disperse는 적을 무작위 위치로 보낼 수 있어 오히려 가까이 올 위험이 있다. 시작 위치와 벽을 먼저 확인한다."]},{"range":"13–17","target":"충전·생존","actions":["반짝이는 무희의 로브 등 충전 회복 장비를 고려한다.","본체 보호막을 보강한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"단일 보스 화력","actions":["고체력 단일 보스용 별도 공격 또는 피해 누적 수단을 준비한다.","비전 면역 적에게 교란 탄환 등 다른 속성 활용.","Magic Missile은 업그레이드 2개만 선택 가능. Ricochet+Disruption Bolt 또는 Arcane Crossfire+Disruption Bolt 중 선택한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["Arcane 100% 저항 적에게 Disruption Bolt가 있으면 Magic Missile의 Dark/Holy 변환을 활용한다.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","Arcane 100% 저항 적에게 Disruption Bolt가 있으면 Magic Missile의 Dark/Holy 변환을 활용한다."]}],"spells":[{"name":"마법 미사일 (Magic Missile)","up":"도탄(Ricochet)","reason":"기본/추가 대상 공격","priority":"필수"},{"name":"분산 (Disperse)","up":"폭력적 왜곡(Violent Warp)","reason":"적 순간이동 후 미사일 추가 시전","priority":"필수"},{"name":"마법 미사일 (Magic Missile)","up":"교란 탄환(Disruption Bolt)","reason":"비전 면역 대처","priority":"필수"},{"name":"마법 미사일 (Magic Missile)","up":"비전 교차 사격(Arcane Crossfire)","reason":"직접 시전 미사일 연계","priority":"선택"},{"name":"석화 (Petrify)","up":"비전 전도(Arcane Conductivity)","reason":"저항력 대응 변형","priority":"선택"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"보호막","priority":"생존"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"보스 보호막 제거","priority":"선택"}],"gear":[{"name":"비전 광란 가면 (Arcane Frenzy Mask)","reason":"반복 비전 발동으로 화력 누적","priority":"핵심"},{"name":"공허불꽃 랜턴 (Voidflame Lantern)","reason":"추가 피해 연계","priority":"선택"},{"name":"수정 로브 (Robe of Crystals)","reason":"비전 피해 보조","priority":"선택"},{"name":"반짝이는 무희의 로브 (Glittering Dancer's Robes)","reason":"충전 횟수·지속력 보강","priority":"선택"},{"name":"요정 가시 지팡이 (Fae Thorn Staff)","reason":"비전 아군 공급 변형","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"}],"rotation":["다수의 적을 분산 범위에 포함시키되 이동 후 위협 범위를 감안한다.","폭력적 왜곡으로 적마다 마법 미사일 발동을 유도한다.","위협적인 원거리 적이 남으면 직접 마법 미사일로 마무리한다.","보스만 남았다면 분산 연쇄가 약해지므로 별도 단일 화력을 사용한다.","Disperse는 적을 무작위 위치로 보낼 수 있어 오히려 가까이 올 위험이 있다. 시작 위치와 벽을 먼저 확인한다.","Arcane 100% 저항 적에게 Disruption Bolt가 있으면 Magic Missile의 Dark/Holy 변환을 활용한다."],"pitfalls":["비전 면역 적을 초반에 만나면 무력해질 수 있다.","분산은 적을 자신 근처에 재배치할 수 있다.","비전 교차 사격은 무료 자동 시전 모두에 무제한 반응하지 않는다(패치 주의).","Arcane Crossfire는 Magic Missile을 직접 시전할 때 추가 미사일이 나오는 조건을 확인한다."],"boss":["단일 보스에게 다수 적용 분산의 이점이 줄어든다.","비전 면역·보호막 대상 처리 수단과 본체 생존력 필수.","Arcane 100% 저항 적에게 Disruption Bolt가 있으면 Magic Missile의 Dark/Holy 변환을 활용한다."],"variants":["캔트립 연쇄(Cantrip Cascade) + 저레벨 주문 다량 발동형.","요정 가시 지팡이 + 비전 교차 사격으로 직접 시전 보강."],"evidence":"일본 Manamancer 공략의 3구역 목표와 클리어 로그 참고.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["일본 플레이어 실제 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Magic Missile→Disperse→Violent Warp로 순간이동 적마다 미사일 발동","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Arcane Crossfire는 Magic Missile을 직접 시전할 때 추가 미사일이 나오는 조건을 확인한다."},"fallbacks":["Fae Thorn Staff 등의 보조가 늦어도 Magic Missile+Disperse 핵심 주문만으로 움직인다.","Arcane Crossfire는 Magic Missile을 직접 시전할 때 추가 미사일이 나오는 조건을 확인한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Magic Missile→Disperse→Violent Warp로 순간이동 적마다 미사일 발동","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Fae Thorn Staff 등의 보조가 늦어도 Magic Missile+Disperse 핵심 주문만으로 움직인다."],"craftNotes":["핵심 장비 Arcane Frenzy Mask의 제작 태그는 Arcane×2 + 자유×4 (총 6). 태그 공급 재료 예: Arcane: Arcane Mote(Arcane), Dreamthorn Vine(Arcane+Nature), Scripted Cortex(Arcane+Word). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Magic Missile","cost":1,"reason":"Deal 11 Arcane damage to the target"},{"kind":"spell","name":"Disperse","cost":2,"reason":"Teleport all units in a 3 tile radius to random locations / The caster is unaffected"},{"kind":"upgrade","name":"Violent Warp","forSpell":"Disperse","cost":6,"reason":"Cast Magic Missile on teleported enemies"},{"kind":"upgrade","name":"Ricochet","forSpell":"Magic Missile","cost":5,"reason":"Magic Missile gains 2 Num Targets / Magic Missile bounces up to 2 times to targets in range and line of sight of the target"},{"kind":"upgrade","name":"Disruption Bolt","forSpell":"Magic Missile","cost":3,"reason":"If Magic Missile targets an Arcane unit, it deals Dark and Holy damage instead of Arcane"}],"purchaseCost":17,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Magic Missile","cost":1,"tags":"Arcane / Sorcery","base":"Deal 11 Arcane damage to the target","stats":"피해 11 · 충전 20 · 사거리 9","upgrades":[{"name":"Arcane Crossfire","cost":1,"effect":"Magic Missile gains 3 Num Targets / When you manually cast Magic Missile, up to 3 additional missiles are fired by Arcane allies in line of sight of the target"},{"name":"Shield Burn","cost":2,"effect":"Magic Missile removes all SH from the target before dealing damage"},{"name":"Disruption Bolt","cost":3,"effect":"If Magic Missile targets an Arcane unit, it deals Dark and Holy damage instead of Arcane"},{"name":"Ricochet","cost":5,"effect":"Magic Missile gains 2 Num Targets / Magic Missile bounces up to 2 times to targets in range and line of sight of the target"}]},{"name":"Disperse","cost":2,"tags":"Arcane / Sorcery / Translocation","base":"Teleport all units in a 3 tile radius to random locations / The caster is unaffected","stats":"충전 15 · 사거리 6 · 반경 3","upgrades":[{"name":"Protective Warp","cost":2,"effect":"Disperse gains 3 Shields / Teleported allies gain 3 SH"},{"name":"Void Sickness","cost":2,"effect":"Disperse gains 10 Duration / Teleported enemies receive 10 turns of silence and poison / Adds the Dark tag"},{"name":"Far Sending","cost":3,"effect":"Instead of being randomly teleported, targets are sent as far away from the caster as possible"},{"name":"Violent Warp","cost":6,"effect":"Cast Magic Missile on teleported enemies"}]},{"name":"Petrify","cost":2,"tags":"Arcane / Enchantment","base":"Petrify the target for 10 turns","stats":"충전 10 · 사거리 6 · 지속 10턴","upgrades":[{"name":"Arcane Conductivity","cost":2,"effect":"Target also loses 100 Arcane resist"},{"name":"Glassify","cost":2,"effect":"Target is glassed instead of petrified"},{"name":"Rocky Servitude","cost":3,"effect":"Petrify gains 8 Minion Damage / If the target is slain while petrified, raise them as a Golem / Golems inherit the HP of the slain unit"},{"name":"Panic","cost":8,"effect":"Enemies in line of sight of the target are feared for 2 turns"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]}],"verifiedGear":[{"name":"Arcane Frenzy Mask","slot":"머리","recipe":"Arcane×2 + 자유×4","cost":6,"effect":"When you cast an Arcane spell, your Arcane spells and equipment gain 2 damage for 6 turns","priority":"핵심","verified":true},{"name":"Voidflame Lantern","slot":"장신구","recipe":"Arcane×1 + Eye×1 + Fire×1 + 자유×1","cost":4,"effect":"When you cast a Fire or Arcane spell, gain Starcharged with duration equal to the spell's level / Starcharged deals 6 Arcane damage to one random enemy in line of sight each turn, and then 6 Fire damage to another","priority":"선택","verified":true},{"name":"Robe of Crystals","slot":"몸통","recipe":"Arcane×1 + Ice×1 + Eye×1 + 자유×3","cost":6,"effect":"When you cast a Arcane or Ice spell, deal 8 Arcane damage to a random enemy in line of sight, and 8 Ice damage to another","priority":"선택","verified":true},{"name":"Glittering Dancer's Robes","slot":"몸통","recipe":"Arcane×1 + Conjuration×1 + Translocation×2 + 자유×2","cost":6,"effect":"When you cast three Arcane spells in a row, regain a charge of a random Translocation spell and summon 2 temporary Faeries","priority":"선택","verified":true},{"name":"Fae Thorn Staff","slot":"무기","recipe":"Arcane×1 + Conjuration×1 + Nature×2 + 자유×2","cost":6,"effect":"When you cast an Arcane or Nature spell, summon 3 temporary Fae Thorns near the target","priority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true}]},{"id":"freeze","icon":"❄️","title":"광역 빙결 · 자동 분쇄","group":"핵심 빌드 1–4","level":"★★☆","tagline":"빙결→물리 분쇄로 시작해 장비 완성 후 매턴 자동 빙결·분쇄 연쇄","idea":"기존 프리즘 광선 중심 운영을 광역 동결(Mass Freeze) + 분쇄(Shatter)로 전환한 지속전 빌드. 초반에는 얼음구(Iceball)나 동결(Freeze)로 적을 얼리고 분쇄로 물리 피해를 주며, 보호막을 갖춘 뒤 분쇄의 서리 교본(Shattering Frost Manual)을 제작하면 매턴 자동 분쇄가 발생한다. 냉기의 지팡이(Chill Staff)와 결합하면 자동 분쇄의 냉기 주문 연계로 적이 새로 빙결되어 추가 분쇄 대상을 마련할 수 있다. 더 넓은 자동 빙결 확산은 냉기의 가면(Icy Chill Mask) + 한파 부적(Coldsnap Amulet)을 갖췄을 때 노릴 수 있는 장비 의존 확장형이다. '모든 적이 매턴 자동 빙결'되는 무조건적인 효과는 아니며, 냉기·물리 저항과 발동 순서·장비 수급에 따라 화력이 달라진다.","first":["1구역: 고드름(Icicle) 1종으로 안정적으로 출발. 처음부터 주문 세 종류를 모두 구입하지 않는다.","2~3구역: 적 밀집도가 높고 SP가 되면 얼음구(Iceball)로 광역 피해+빙결을 확보한다. 스스로 안전하게 처리된다면 얼음구 구매를 뒤로 미뤄도 된다.","3~5구역: 동결(Freeze)→광역 동결(Mass Freeze)과 분쇄(Shatter)를 목표로 SP를 모은다. 동결과 분쇄를 모두 당장 구매하기 어렵다면 얼음구+분쇄 또는 동결+분쇄로 먼저 시작한다.","4~6구역: 요정 판금(Fae Plate)을 제작할 수 있으면 활용하고, 아니라면 비전 방호(Arcane Ward)를 검토한다. 공격 주문 추가보다 본체 생존을 먼저 확보한다.","6~10구역: 광역 동결로 여러 적을 묶은 뒤 수동 분쇄. 빙결이 풀린 적은 이동·시야 관리로 다시 묶는다.","8~13구역 이후: 분쇄의 서리 교본(Shattering Frost Manual)을 제작할 수 있는 즉시 자동 분쇄 체제로 전환한다. 제작 전에는 기존 수동 루트로 진행한다.","중후반: 냉기의 지팡이(Chill Staff)로 자동 분쇄→신규 빙결의 순환을 보강하고, 한파 부적(Coldsnap Amulet)+냉기의 가면(Icy Chill Mask)이 가능하면 시야 범위로 빙결을 확산한다.","후반: Sorcwinter+죽음의 한기(Death Chill)는 대체 지팡이/처치 연쇄 경로로 검토한다. 물리 저항·빙결 면역 보스에 대비해 별도 화력과 보호막·순간이동을 준비한다."],"phases":[{"range":"1–2","target":"생존형 냉기 스타트","actions":["고드름(Icicle)을 첫 공격으로 사용하고 원거리·상태이상 몬스터가 적은 균열을 고른다.","광역 적이 유난히 많으면 얼음구(Iceball)를 구매해 여러 적을 한꺼번에 얼리는 선택을 한다.","처음부터 고드름·얼음구·동결의 업그레이드를 전부 구입하지 않고 분쇄를 위한 SP를 남긴다.","Iceball의 기본 효과 자체가 범위 Freeze를 주므로 SP가 모자라면 Iceball+Shatter로 먼저 구성해도 된다."]},{"range":"3–5","target":"첫 빙결→분쇄 연계","actions":["동결(Freeze)과 분쇄(Shatter)를 확보해 얼어붙은 적에 물리 피해를 넣는 흐름을 만든다.","이미 얼음구로 무리 전체를 빙결시킬 수 있다면 분쇄 구매를 먼저 당기고, 광역 동결 업그레이드는 다음으로 미룰 수 있다.","요정 판금(Fae Plate) 또는 비전 방호(Arcane Ward) 같은 방어 1개를 확보한다. 제작 장비 운이 없으면 방어 주문 우선."]},{"range":"5–8","target":"광역 동결 확장","actions":["동결(Freeze)→광역 동결(Mass Freeze)을 완성해 연결된 적 무리를 묶는다. 전장 전체 자동 빙결과는 다르다.","빙결된 무리에 분쇄를 사용해 물리 피해를 주고, 광역 공격을 받는 위치에 오래 서 있지 않는다.","빙결된 적이 물리 피해를 받으면 행동 봉쇄가 해제될 수 있으므로, 분쇄 후 생존할 강적은 다시 묶을 계획을 세운다.","Shatter는 기본 Frozen 적에게 Physical 80 피해이며 대상에 물리 저항이 높으면 기대 화력이 줄어든다."]},{"range":"8–12","target":"자동 분쇄 엔진 확보","actions":["분쇄의 서리 교본(Shattering Frost Manual) 제작 가능 여부를 우선 점검한다. 2026년 8월 28일 업데이트로 추가된 자동 시전 장비다.","교본을 장착하면 매턴 분쇄가 자동 발동하므로, 본체는 빙결·방어·이동에 턴을 사용할 수 있다.","자동 시전이 어떤 순서로 처리되는지, 빙결 대상이 없을 때 어떻게 동작하는지 게임 내 전투 로그로 확인한다.","교본을 아직 못 만들었다면 분쇄를 직접 사용해도 빌드는 기능한다. 제작 재료를 기다리느라 진도를 멈추지 않는다."]},{"range":"12–16","target":"자동 빙결 보충","actions":["냉기의 지팡이(Chill Staff)로 분쇄 자동 시전 시 추가 빙결을 발생시키는 실전 기록 기반 연계를 목표로 한다.","초기 광역 동결 1회로 시작해 자동 분쇄→다음 빙결 대상 생성의 반복을 노린다. 매턴 전장 전체를 얼리는 효과로 오해하지 않는다.","자동 빙결 대상이 적거나 끊기는 경우 동결·얼음구를 직접 사용해 엔진을 다시 가동한다.","여유가 생기면 순간이동(Teleport)+퀵캐스트(Quickcast) 또는 비전 방호로 본체를 보호한다."]},{"range":"16–19","target":"시야 범위 빙결 확산","actions":["냉기의 가면(Icy Chill Mask)의 냉기 피해 확산과 한파 부적(Coldsnap Amulet)의 빙결 연계로 신규 대상에 빙결을 퍼뜨리는 확장형을 검토한다.","분쇄의 서리 교본이 매턴 냉기 주문을 시전하면 가면·부적 연계가 돌아갈 수 있지만, 피해 저항·시야·적 구성·발동 조건에 따라 결과가 다르다.","Sorcwinter가 나온다면 죽음의 한기(Death Chill)로 처치 후 빙결 확산을 노리는 대체 지팡이 경로를 선택한다. Chill Staff와 동일 지팡이 칸이면 둘 중 하나를 선택한다.","빙결과 분쇄가 혼합된 다수 대상 전투에서 효과가 좋더라도, 자동 연쇄가 보스에게 그대로 유지될 것으로 가정하지 않는다.","Shattering Frost Manual은 살아 있는 적이 있는 한 매턴 끝에 Shatter를 시전한다. Chill Staff/Coldsnap Amulet은 수급 시 확장."]},{"range":"19–21","target":"보스·저항 대응","actions":["빙결 면역 대상은 분쇄 엔진의 시동 자체가 막힐 수 있으므로 비냉기·비물리 피해 수단을 별도로 갖춘다.","높은 물리 저항력에는 저항력 감소 효과를 가진 주문·장비 또는 별도 공격 유형을 준비한다.","보호막형 상대에는 보호막 흡수(Siphon Shields) 등으로 선제 대응하고, 고체력 단일 보스전에서는 지속 피해·보호막·이동을 우선한다.","장비 자동 시전만 믿고 턴을 넘기지 말고, 적에게 반격 기회가 생기는지 매턴 확인한다.","Snow Queen은 Ice/Poison 면역. 빙결 면역 대상에는 Shatter 연계 자체가 시작되지 않으므로 비냉기 공격 준비."]}],"spells":[{"name":"고드름 (Icicle)","up":"냉기 저항 적이 많으면 부식 파편(Corrosive Shard) 검토","reason":"초반에 SP 낭비를 줄이는 기본 공격. 이후 빙결 중 직접 물리 타격으로 빙결이 풀릴 수 있음","priority":"초반 시작"},{"name":"얼음구 (Iceball)","up":"기본 효과(광역 냉기 피해·빙결). 필요할 때만 강화","reason":"여러 적을 한 번에 빙결해 분쇄의 시동을 걸기 좋음. 초기 SP가 부족하면 구매를 미룸","priority":"초반 광역 선택"},{"name":"동결 (Freeze)","up":"광역 동결 (Mass Freeze)","reason":"연결된 적 무리를 한 번에 제어하는 핵심 빙결 수단. 자동 전장 전체 빙결은 아님","priority":"핵심 제어"},{"name":"분쇄 (Shatter)","up":"면도날 얼음 (Razor Ice)은 출혈 연계가 필요할 때 검토. 증기 정령(Steam Anima)은 화염 피해를 추가하므로 빙결 해제 영향 주의","reason":"빙결된 적에 물리 피해를 가하는 주력 마무리. 교본 확보 전 직접 시전","priority":"핵심 공격"},{"name":"비전 방호 (Arcane Warding)","up":"기본 효과로도 사용 가능","reason":"자동 시전 엔진 완성 전과 보스전의 본체 생존 보장","priority":"생존 우선"},{"name":"순간이동 (Teleport)","up":"퀵캐스트 (Quickcast)","reason":"자동 공격 동안 위치를 조정하고 면역 적에게서 탈출","priority":"중반 생존"},{"name":"죽음의 한기 (Death Chill)","up":"기본 효과·빙결 확산 관련 툴팁을 현재 버전에서 확인","reason":"Sorcwinter 활용 시 처치 연쇄로 추가 빙결 확장","priority":"대체 경로"},{"name":"얼음의 언령 (Word of Ice)","up":"주문서/장비를 통해 확보할 수 있을 때 검토","reason":"넓은 전장의 초기 대량 빙결을 만드는 보조 시동","priority":"선택 보조"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본 효과","reason":"적 보호막으로 분쇄 피해가 막힐 때 대응","priority":"후반 상황별"}],"gear":[{"name":"분쇄의 서리 교본 (Shattering Frost Manual)","reason":"매턴 분쇄(Shatter) 자동 시전. 자동화의 핵심 장비이며 수급 전에는 수동 분쇄로 진행","priority":"자동화 최우선"},{"name":"냉기의 지팡이 (Chill Staff)","reason":"분쇄의 자동 냉기 시전이 새 빙결을 유발하는 연계. 교본과 결합하면 매턴 표적 공급 가능","priority":"자동 빙결 핵심"},{"name":"냉기의 가면 (Icy Chill Mask)","reason":"냉기 주문 시 시야 범위 냉기 피해를 확산해 한파 부적의 추가 빙결을 유도","priority":"광역 자동화"},{"name":"한파 부적 (Coldsnap Amulet)","reason":"냉기 피해와 빙결 확산의 연결 고리. 냉기의 가면과 시너지","priority":"광역 자동화"},{"name":"소서윈터 (Sorcwinter)","reason":"죽음의 한기(Death Chill)로 처치 후 추가 빙결을 노리는 대체 지팡이. Chill Staff와 양자택일","priority":"대체 확장"},{"name":"요정 판금 (Fae Plate)","reason":"초반 자동 엔진을 준비하는 동안 본체를 보호하는 방어 장비","priority":"초반 안전"},{"name":"폭풍의 로브 (Robe of Storms)","reason":"냉기·번개 피해로 적을 처치할 때 보호막을 획득하는 방어형 로브. 분쇄의 물리 처치만으로는 발동을 기대하지 말 것","priority":"방어 선택"},{"name":"수정의 로브 (Robe of Crystals)","reason":"냉기 피해를 광역으로 확산하는 장비 조합에서 보스 화력 증폭을 노리는 공격형 로브","priority":"후반 화력"},{"name":"얼음 광란 가면 (Ice Frenzy Mask)","reason":"냉기 주문 반복 시 공격력 증폭을 노리는 대체 머리 장비.
