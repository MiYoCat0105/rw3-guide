Icy Chill Mask와 같은 머리 칸이면 양자택일","priority":"공격 대체"},{"name":"눈 신발 (Snow Shoes)","reason":"빙결을 유지하는 동안 방어 안정성을 보강하는 신발 후보","priority":"보조 생존"}],"rotation":["입장 전 T키로 시작 위치·적 공격 범위를 확인하고, 빙결 면역과 물리 저항이 높은 적부터 표시한다.","초반 수동 구간: 얼음구(Iceball) 또는 광역 동결(Mass Freeze)로 적들을 묶고, 분쇄(Shatter)를 직접 사용해 처리한다.","교본 획득 후: 빙결을 먼저 준비해 두면 분쇄의 서리 교본(Shattering Frost Manual)이 매턴 분쇄를 자동 시전하므로 직접 분쇄하는 턴을 아낄 수 있다.","냉기의 지팡이(Chill Staff) 추가 후: 자동 분쇄에서 새로운 빙결 대상이 생기는지 확인하고, 끊기면 동결/얼음구로 재시동한다.","광역 확장 후: Icy Chill Mask → 시야 내 냉기 피해 → Coldsnap Amulet에 의한 빙결 확산 → 다음 분쇄의 순환을 노린다. 발동 순서는 실제 게임 툴팁·로그 확인.","장기전: Sorcwinter·Death Chill 처치 연쇄로 전환하거나 보호막·저항 감소·다른 피해 수단을 사용한다. 본체가 위험할 땐 자동 공격을 믿고 턴을 넘기지 않는다."],"pitfalls":["광역 동결(Mass Freeze)은 연결된 적 무리 제어이지 시야 전체가 매턴 자동으로 빙결되는 효과는 아니다.","Shattering Frost Manual은 자동 분쇄 장비지만, 적이 얼어 있지 않거나 발동 대상이 없으면 원하는 피해가 나오지 않는다.","분쇄의 물리 피해는 빙결을 해제할 수 있다. 살아남은 강적의 반격을 예상하고 다시 얼리거나 후퇴한다.","Chill Staff의 자동 빙결은 한꺼번에 모든 적을 얼리는 보장이 아니다. 넓은 범위 자동화에는 Icy Chill Mask + Coldsnap Amulet 등이 추가로 필요하다.","Chill Staff와 Sorcwinter, Icy Chill Mask와 Ice Frenzy Mask, Robe of Storms와 Robe of Crystals는 각각 같은 유형의 장비이므로 실제 장비 칸을 확인해 서로 다른 경로로 선택한다.","높은 물리 저항 적은 빙결이 들어가도 분쇄 피해가 줄 수 있다. 빙결 면역 적은 자동 연계 시동이 잘 걸리지 않는다.","8월 이후 패치에서 Shatter의 Shattered Sorrows는 제거되고 Steam Anima로 변경됐다. 오래된 업그레이드명은 따라 사지 않는다.","교본·지팡이·가면·부적은 재료 수급에 따라 늦을 수 있다. 자동화를 완성하지 못해도 수동 분쇄+방어로 계속 진행한다.","Frozen은 Fire/Physical 피해에 해제될 수 있다. Shatter 후 살아남은 적에게 즉시 반격당할 수 있다."],"boss":["일반 무리: 광역 동결→분쇄→자동 재빙결로 적 행동을 줄이고 시야 범위 자동 처치를 노린다.","눈의 여왕(Snow Queen): 냉기 저항/면역과 빙결 가능 여부를 확인하고 비냉기 피해 수단을 준비한다.","높은 물리 저항 보스: 분쇄가 핵심 피해를 주지 못할 수 있어 저항력 감소 또는 독립된 다른 속성 공격이 필요하다.","보호막이 많은 상대: 보호막 흡수(Siphon Shields) 등으로 대응한다.","모르드레드(Mordred): 다수 적을 대상으로 연쇄를 늘리는 빌드가 단일 본체로 전환될 때 약해지므로 본체 보호막·순간이동·비빙결 대체 화력을 마련한다.","Snow Queen은 Ice/Poison 면역. 빙결 면역 대상에는 Shatter 연계 자체가 시작되지 않으므로 비냉기 공격 준비."],"variants":["기본·무장비형: 고드름 → 얼음구/광역 동결 → 수동 분쇄 → 비전 방호. 교본이 없어도 성장과 전투 진행이 가능하다.","자동화 중심형(추천): 분쇄의 서리 교본 + 냉기의 지팡이, 초기 광역 동결로 시작. 매턴 신규 빙결 대상이 생기며 자동 분쇄가 이어지는지 확인한다.","광역 확산형(장비 의존): 분쇄의 서리 교본 + 냉기의 가면 + 한파 부적. 냉기 피해를 시야로 퍼뜨려 추가 빙결 대상을 만드는 후반 확장.","처치 연쇄형: 냉기의 지팡이 대신 소서윈터(Sorcwinter)와 죽음의 한기(Death Chill)를 이용해 킬 체인을 늘린다.","예전 프리즘 광선형 보존: 프리즘 광선(Prismatic Beam)+부드러워진 빛(Softened Light)으로 빙결 적을 즉시 섬멸하는 폭발형. 자해 방지 업그레이드가 필수이며 단일 보스 남으면 화력이 급감할 수 있어, 자동 분쇄형과 다른 선택 빌드로 취급한다."],"evidence":"2026-08-28 공식 업데이트로 Shattering Frost Manual 추가 확인, 2026-09-27 일본 트라이얼 공략의 실전 Shatter→Chill Staff→Sorcwinter→Icy Chill Mask·Coldsnap Amulet 연계 기록 참고. Steam 커뮤니티의 Iceball+Shatter 초반 사례 및 프리즘 광선의 단일 보스 한계 검토. '매턴 자동 분쇄'는 자료로 확인된 동작이나 '매턴 시야 전체 자동 빙결'은 특정 장비 조합과 발동 조건이 있어 항상 보장되지 않는다. 구역별 구매 순서와 장비 우선순위는 안정성 중심으로 재구성한 권장안이며 미검증 세부 수치·제작식은 기록하지 않았다.","sources":[["분쇄 자동 장비·빙결 자동화 실전 기록 (THEKI, 2026-09-27)","https://note.com/theki/n/nf90736db34ac?hl=ko"],["공식 패치 — Shattering Frost Manual 추가 (2026-08-28)","https://steamdb.info/patchnotes/24995190/"],["Steam 실전 의견 — Iceball+Shatter·초반 생존","https://steamcommunity.com/app/4366330/discussions/0/592938033420140478/"],["Steam 프리즘 광선의 한계·보스전 사례","https://steamcommunity.com/app/4366330/discussions/0/592937761422713548/"],["Rift Wizard 3 Compendium (주문·장비·패치별 확인)","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Freeze→Mass Freeze로 무리를 묶고 Shatter 물리 피해; Shattering Frost Manual로 매턴 자동 시전","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Frozen은 Fire/Physical 피해에 해제될 수 있다. Shatter 후 살아남은 적에게 즉시 반격당할 수 있다."},"fallbacks":["교본이 없으면 Freeze→Mass Freeze→수동 Shatter로 운영하고 보호막을 선구매한다.","Frozen은 Fire/Physical 피해에 해제될 수 있다. Shatter 후 살아남은 적에게 즉시 반격당할 수 있다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Freeze→Mass Freeze로 무리를 묶고 Shatter 물리 피해; Shattering Frost Manual로 매턴 자동 시전","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","교본이 없으면 Freeze→Mass Freeze→수동 Shatter로 운영하고 보호막을 선구매한다."],"craftNotes":["핵심 장비 Shattering Frost Manual의 제작 태그는 Ice×1 + Word×1 + 자유×4 (총 6). 태그 공급 재료 예: Ice: Elemental Ice(Ice), Frostpetal(Ice+Nature), Glacial Script(Ice+Word) / Word: Ancient Inscription(Sorcery+Word), Dragontongue Tablet(Dragon+Word), Glacial Script(Ice+Word). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Icicle","cost":1,"reason":"Deal 6 Physical damage to the target / Then, deal 6 Ice damage to the target and a 1 tile burst around it / Turns chasms into floors"},{"kind":"spell","name":"Freeze","cost":2,"reason":"Target is frozen for 5 turns"},{"kind":"spell","name":"Shatter","cost":3,"reason":"Frozen enemies take 80 Physical damage"},{"kind":"upgrade","name":"Mass Freeze","forSpell":"Freeze","cost":4,"reason":"Freeze affects a connected group of enemies"},{"kind":"upgrade","name":"Gather Ice","forSpell":"Shatter","cost":1,"reason":"Gain 1 SH for each damaged target in your line of sight"}],"purchaseCost":11,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Icicle","cost":1,"tags":"Ice / Sorcery","base":"Deal 6 Physical damage to the target / Then, deal 6 Ice damage to the target and a 1 tile burst around it / Turns chasms into floors","stats":"피해 6 · 충전 14 · 사거리 6 · 반경 1","upgrades":[{"name":"Freezing","cost":1,"effect":"Icicle gains 3 Duration / Freeze the target for 3 turns"},{"name":"Ice Spear","cost":2,"effect":"Deals Physical damage in a beam to the target"},{"name":"Corrosive Shard","cost":5,"effect":"Icicle also deals Poison and Dark damage to the target / Reduces a random resistance by 10% / Adds the Dark tag"},{"name":"Storm Spike","cost":5,"effect":"Icicle also deals Lightning damage to affected tiles / Icicle can be cast on any tile containing a cloud / Adds the Lightning tag"}]},{"name":"Iceball","cost":2,"tags":"Sorcery / Ice","base":"Inflicts 14 Ice damage and 3 turns of frozen in a 2 tile burst","stats":"피해 14 · 충전 8 · 사거리 7 · 반경 2 · 지속 3턴","upgrades":[{"name":"Ice Crush","cost":1,"effect":"Units inside of the area of effect which are already frozen take Physical damage before being frozen again"},{"name":"Cloud Combustion","cost":2,"effect":"Gain +2 radius and x2 damage if cast on a Blizzard / Consumes the Blizzard"},{"name":"Fae Ball","cost":3,"effect":"Iceball gains 9 Minion Health / Iceball gains 2 Minion Damage / Iceball gains 4 Minion Range / When you cast Iceball, summon an Ice Faery for every 4 enemies it damages / Adds the Conjuration tag"},{"name":"Subzero Ice","cost":5,"effect":"Instead of inflicting frozen, cast your Freeze spell on affected units"}]},{"name":"Freeze","cost":2,"tags":"Enchantment / Ice","base":"Target is frozen for 5 turns","stats":"충전 20 · 사거리 8 · 지속 5턴","upgrades":[{"name":"Quickcast","cost":2,"effect":"Freeze gains quickcast"},{"name":"Refreezing","cost":3,"effect":"The target is refrozen every turn for the duration"},{"name":"Frostbite","cost":4,"effect":"Freeze gains 3 Damage / Each turn all frozen enemies take 3 Dark and Ice damage / Always Active / Adds the Dark tag"},{"name":"Mass Freeze","cost":4,"effect":"Freeze affects a connected group of enemies"}]},{"name":"Shatter","cost":3,"tags":"Ice / Sorcery","base":"Frozen enemies take 80 Physical damage","stats":"피해 80 · 충전 6","upgrades":[{"name":"Gather Ice","cost":1,"effect":"Gain 1 SH for each damaged target in your line of sight"},{"name":"Razor Ice","cost":2,"effect":"Shatter gains 12 Duration / Shatter also inflicts 12 turns of hemorrhage"},{"name":"Glacial Excision","cost":3,"effect":"Shatter gains 10 HP Cost / After dealing damage, Shatter reduces affected enemies' max HP to match their current HP / Adds the Blood tag"},{"name":"Steam Anima","cost":6,"effect":"Shatter gains 10 Minion Damage / Shatter gains 4 Minion Range / Shatter gains 6 Minion Duration / Shatter also deals Fire damage / When Shatter kills a unit, summon a temporary Steam Elemental at its location / Adds the Conjuration tag / Adds the Fire tag"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Death Chill","cost":3,"tags":"Enchantment / Dark / Ice","base":"Deal 11 Dark damage to the target each turn for 5 turns / When a unit dies while afflicted with Death Chill, they explode in a flurry of ice / The explosion inflicts 11 Ice damage and 5 turns of frozen on enemies within 3 tiles","stats":"피해 11 · 충전 7 · 사거리 6 · 반경 3 · 지속 5턴","upgrades":[{"name":"Compounding Chill","cost":2,"effect":"Death Chill will stack instead of refreshing the duration on subsequent applications"},{"name":"Slaughter Chill","cost":2,"effect":"Death Chill also deals Poison damage each turn"},{"name":"Lockjaw","cost":3,"effect":"Applying Death Chill applies silence for the same duration"},{"name":"Mass Death Chill","cost":7,"effect":"Applies Death Chill to a connected group of enemies"}]},{"name":"Word of Ice","cost":7,"tags":"Ice / Word","base":"All enemies are frozen for 5 turns / Deal 50 Ice damage to Fire enemies","stats":"피해 50 · 충전 1 · 지속 5턴","upgrades":[{"name":"Endless Ice","cost":2,"effect":"Regain a charge of your other Ice spells on cast"},{"name":"Echoing Ice","cost":5,"effect":"Auto recast in 10 turns"},{"name":"Killer Cold","cost":6,"effect":"Ice damage is dealt to all enemies, not only those with the Fire tag"},{"name":"Word of Wind","cost":7,"effect":"Word of Ice gains 3 Num Targets / Casts Chill Wind on up to 3 random enemies"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]}],"verifiedGear":[{"name":"Shattering Frost Manual","slot":"장신구","recipe":"Ice×1 + Word×1 + 자유×4","cost":6,"effect":"While enemies live, cast Shatter at the end of each turn","priority":"자동화 최우선","verified":true},{"name":"Chill Staff","slot":"무기","recipe":"Ice×1 + Translocation×1 + 자유×3","cost":5,"effect":"When you cast an Ice spell, the nearest unfrozen enemy to that spell's target is frozen for 3 turns","priority":"자동 빙결 핵심","verified":true},{"name":"Icy Chill Mask","slot":"머리","recipe":"Eye×1 + Ice×2 + 자유×6","cost":9,"effect":"When you cast an Ice spell, deal 1 Ice damage to enemies in line of sight of the target","priority":"광역 자동화","verified":true},{"name":"Coldsnap Amulet","slot":"장신구","recipe":"Ice×1 + Metallic×1 + 자유×2","cost":4,"effect":"When an enemy takes Ice damage, it has a 40% chance to be afflicted with 2 turns of frozen","priority":"광역 자동화","verified":true},{"name":"Sorcwinter","slot":"무기","recipe":"Enchantment×2 + Dark×2 + Ice×2 + Sorcery×2 + 자유×2","cost":10,"effect":"For every 120 damage dealt to enemies by Sorcery spells or equipment, cast Death Chill on a random enemy / Damage Dealt: 0","priority":"대체 확장","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"초반 안전","verified":true},{"name":"Robe of Storms","slot":"몸통","recipe":"Ice×1 + Lightning×1 + Nature×1 + 자유×3","cost":6,"effect":"When an enemy dies to Ice or Lightning damage, gain 1 SH","priority":"방어 선택","verified":true},{"name":"Robe of Crystals","slot":"몸통","recipe":"Arcane×1 + Ice×1 + Eye×1 + 자유×3","cost":6,"effect":"When you cast a Arcane or Ice spell, deal 8 Arcane damage to a random enemy in line of sight, and 8 Ice damage to another","priority":"후반 화력","verified":true},{"name":"Ice Frenzy Mask","slot":"머리","recipe":"Ice×2 + 자유×4","cost":6,"effect":"When you cast an Ice spell, your Ice spells and equipment gain 2 damage for 6 turns","priority":"공격 대체","verified":true},{"name":"Snow Shoes","slot":"신발","recipe":"Ice×1 + Nature×1 + 자유×3","cost":5,"effect":"When a unit is frozen, heal 2 HP","priority":"보조 생존","verified":true}]},{"id":"archon","icon":"🪽","title":"아콘 소환 · 보호막 광선","group":"소환·방어","level":"★★☆","tagline":"소환수가 광선 공격과 보호막 공급을 동시에","idea":"아콘 소환(Call Archon)의 광선의 호(Beam Arc)·폭풍 아콘(Storm Archon)을 활용하고 영속화(Permanence)와 재생 오라로 유지력을 높인다.","first":["1~3구역: 늑대 또는 저비용 공격으로 시작.","4~7구역: 아콘 소환(Call Archon) 확보.","8~11구역: 광선의 호(Beam Arc), 폭풍 아콘(Storm Archon).","후반: 보호막·소환 장비·저항력 감소 강화.","핵심 연계: Call Archon의 광선→Beam Arc로 연결→Storm Archon Ice 추가→영속화로 전선 유지","핵심 주문이 늦어질 때: 영속화·회복 오라가 늦으면 아콘을 원거리 적 앞에 세우고 본체 보호막부터 구입한다.","보스 대비: 아콘 광선이 Ice/Lightning 등 높은 저항에 막히면 비원소 속성 공격 또는 Petrify→Arcane Conductivity 보조로 전환한다."],"phases":[{"range":"1–3","target":"기본 생존","actions":["고비용 아콘을 기다리는 동안 저비용 공격으로 약한 균열 선택.","Call Archon은 기본 Lv5, 14턴 임시 아군. 초반에는 저비용 공격·Fae Plate를 먼저 마련한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"4–8","target":"아콘 확보","actions":["아콘 소환과 광선의 호를 목표.","아콘 광선이 적과 아군을 지나는 배치를 의식.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"9–13","target":"화력 확대","actions":["폭풍 아콘, 냉기 충격 부적, 소환술 지팡이 등 보완.","Beam Arc(4SP)는 아콘 광선이 대상 시야의 다른 적에게 한 번 튀는 업그레이드.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"14–18","target":"소환 유지","actions":["영속화(Permanence), 재생 오라 등으로 소환수 보호.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"19–19","target":"보스","actions":["드래곤/아콘 소환수의 공격이 통하지 않는 적용 보조 공격 준비.","본체 보호막 없을 때 전방 노출 금지.","Storm Archon(5SP)은 Ice 피해를 추가하므로 기존 광선의 피해 유형을 늘린다. 이 두 업그레이드로 슬롯 두 개를 사용한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["아콘 광선이 Ice/Lightning 등 높은 저항에 막히면 비원소 속성 공격 또는 Petrify→Arcane Conductivity 보조로 전환한다.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","아콘 광선이 Ice/Lightning 등 높은 저항에 막히면 비원소 속성 공격 또는 Petrify→Arcane Conductivity 보조로 전환한다."]}],"spells":[{"name":"아콘 소환 (Call Archon)","up":"광선의 호(Beam Arc)","reason":"광선 확대","priority":"필수"},{"name":"아콘 소환 (Call Archon)","up":"폭풍 아콘(Storm Archon)","reason":"공격 속성 추가","priority":"필수"},{"name":"영속화 (Permanence)","up":"현실 고정(Reality Hold)","reason":"소환 유지","priority":"중반"},{"name":"재생 오라 (Regeneration Aura)","up":"죽음 저항(Death Defiance)","reason":"소환수 생존","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"본체 보호막","priority":"안전"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"아콘 배치","priority":"생존"}],"gear":[{"name":"소환술 지팡이 (Conjuration Staff)","reason":"아콘 능력 강화","priority":"핵심"},{"name":"냉기 충격 부적 (Coldsnap Amulet)","reason":"광선 공격 시너지","priority":"선택"},{"name":"분노의 연결고리 (Wrath Links)","reason":"광선 연계","priority":"선택"},{"name":"혼돈의 연결고리 (Chaos Links)","reason":"추가 피해","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보조 보호막","priority":"안전"}],"rotation":["아콘을 안전한 곳에서 소환한다.","아콘의 광선이 적을 타격하는 경로를 관찰한다.","보호막을 받을 수 있도록 자신의 위치를 조정한다.","소환수가 공격하는 동안 본체는 위험한 적만 대응한다.","Beam Arc(4SP)는 아콘 광선이 대상 시야의 다른 적에게 한 번 튀는 업그레이드.","아콘 광선이 Ice/Lightning 등 높은 저항에 막히면 비원소 속성 공격 또는 Petrify→Arcane Conductivity 보조로 전환한다."],"pitfalls":["광선 각도가 나쁘면 실제 화력이 떨어진다.","SP가 많이 들어 초반 완성 전 취약하다.","Permanence는 그 자체로 소환수를 무조건 영구화하지 않는다. Reality Hold 업그레이드와 시전 타이밍을 확인한다."],"boss":["소환수의 공격 속성 저항·면역 보스를 위한 별도 피해 필요.","아콘 광선이 Ice/Lightning 등 높은 저항에 막히면 비원소 속성 공격 또는 Petrify→Arcane Conductivity 보조로 전환한다."],"variants":["신성 아콘 + 세라프 소환 연계 변형."],"evidence":"스팀 빌드 가이드 기반. 해당 가이드 작성자의 엔딩 검증은 별도.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Call Archon의 광선→Beam Arc로 연결→Storm Archon Ice 추가→영속화로 전선 유지","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Permanence는 그 자체로 소환수를 무조건 영구화하지 않는다. Reality Hold 업그레이드와 시전 타이밍을 확인한다."},"fallbacks":["영속화·회복 오라가 늦으면 아콘을 원거리 적 앞에 세우고 본체 보호막부터 구입한다.","Permanence는 그 자체로 소환수를 무조건 영구화하지 않는다. Reality Hold 업그레이드와 시전 타이밍을 확인한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Call Archon의 광선→Beam Arc로 연결→Storm Archon Ice 추가→영속화로 전선 유지","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다." cker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 2 turns"}]}],"verifiedGear":[{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"핵심","verified":true},{"name":"Coldsnap Amulet","slot":"장신구","recipe":"Ice×1 + Metallic×1 + 자유×2","cost":4,"effect":"When an enemy takes Ice damage, it has a 40% chance to be afflicted with 2 turns of frozen","priority":"선택","verified":true},{"name":"Wrath Links","slot":"장신구","recipe":"Holy×1 + Lightning×1 + Translocation×1 + 자유×2","cost":5,"effect":"When an enemy dies to Holy or Lightning damage, a random enemy in their line of sight within 3 tiles takes 9 damage of that type","priority":"선택","verified":true},{"name":"Chaos Links","slot":"장신구","recipe":"Chaos×1 + Fire×1 + Lightning×1 + Translocation×1 + 자유×2","cost":6,"effect":"When an enemy dies to Fire, Physical, or Lightning damage, a random enemy in line of sight within 3 tiles takes 13 damage of that type","priority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true}]},{"id":"claw","icon":"🐉","title":"용의 발톱 · 대지 보호막","group":"소환·방어","level":"★★★","tagline":"직접 싸우되 지형 이동과 보호막으로 버티기","idea":"용의 발톱(Dragon Claw)의 근접 공격에 대지 통로(Earth Passage)·광물 보호막(Mineral Shielding)을 결합하는 방식. 단단한 느낌은 크지만 위치 선정 난이도는 높다.","first":["1구역: 용의 발톱(Dragon Claw) 또는 다른 저비용 공격.","초반: 대지 통로(Earthen Passage)와 광물 보호막(Mineral Shielding).","중반: 용발톱 군화(Dragonclaw Sabatons), 혼돈의 발톱(Chaos Claws).","후반: 드레이크 탑승(Ride Drake)과 회피 기동(Evasive Maneuvers).","핵심 연계: Dragon Claw 근접 물리→Earthen Passage 벽 간 이동→Mineral Shielding 보호막","핵심 주문이 늦어질 때: Earthen Passage를 쓸 벽이 부족하면 Teleport를 우선 구입하고 용의 발톱을 직접 시전한다.","보스 대비: 벽 없는 넓은 공간, 원거리 기절 몬스터, Physical 고저항 보스에는 Teleport/Arcane Warding이 필수 대안."],"phases":[{"range":"1–3","target":"발톱 사용법","actions":["매 턴 위협 범위를 확인한다.","근접 시 적 여러 마리에게 동시에 맞으면 지형 이동을 우선한다.","Dragon Claw는 Lv1 근접 범위 물리 공격. 적이 몰려오기 전 벽이 있는 지형으로 유도한다."]},{"range":"4–8","target":"방어 이동","actions":["대지 통로와 광물 보호막 확보.","벽/병목을 활용해 한 번에 상대하는 적 수 축소.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"9–14","target":"근접 화력","actions":["용발톱 군화와 혼돈의 발톱으로 물리저항 대책 마련.","Earthen Passage는 벽에 인접해야만 사용할 수 있다. Mineral Shielding은 시전 시 보호막 3 생성.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"15–18","target":"탑승 생존","actions":["드레이크 탑승 및 회피 기동으로 위험 감소.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"19–19","target":"보스","actions":["근접하면 즉사할 수 있는 보스의 공격 범위를 반드시 확인.","원거리 또는 다른 속성 피해 수단 준비.","Dragon Claw의 Chaos Claws를 선택하면 Fire+Lightning이 추가돼 Physical 저항을 일부 우회한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["벽 없는 넓은 공간, 원거리 기절 몬스터, Physical 고저항 보스에는 Teleport/Arcane Warding이 필수 대안.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","벽 없는 넓은 공간, 원거리 기절 몬스터, Physical 고저항 보스에는 Teleport/Arcane Warding이 필수 대안."]}],"spells":[{"name":"용의 발톱 (Dragon Claw)","up":"혼돈의 발톱(Chaos Claws)","reason":"직접 공격","priority":"필수"},{"name":"대지 통로 (Earthen Passage)","up":"광물 보호막(Mineral Shielding)","reason":"지형 이동과 방어","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"회피 기동(Evasive Maneuvers)","reason":"후반 생존","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"근접 공세 보호막","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"벽이 없는 구역 탈출","priority":"생존"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"실드 적 대응","priority":"후반"}],"gear":[{"name":"용발톱 군화 (Dragonclaw Sabatons)","reason":"용의 발톱 연계","priority":"핵심"},{"name":"요정 판금 (Fae Plate)","reason":"보호막","priority":"안전"},{"name":"위기 부적 (Crisis Charm)","reason":"큰 한방 대비","priority":"안전"},{"name":"대지 동화 장화 (Earthmeld Boots)","reason":"이동하지 않는 턴마다 HP 3 회복; Dragonclaw Sabatons과 신발 슬롯 양자택일","priority":"대체 방어"},{"name":"북방 갑옷 (Boreal Armor)","reason":"구역 시작 보호막 7·실드 피격 시 Ice 반격; Fae Plate와 몸통 슬롯 양자택일","priority":"대체 방어"}],"rotation":["원거리 몬스터가 공격할 수 없는 벽 뒤에서 접근한다.","단일 적을 빠르게 제거한 후 이동하여 공격 범위 밖에 선다.","위험할 때는 대지 통로와 방어를 우선 사용한다.","Earthen Passage는 벽에 인접해야만 사용할 수 있다. Mineral Shielding은 시전 시 보호막 3 생성.","벽 없는 넓은 공간, 원거리 기절 몬스터, Physical 고저항 보스에는 Teleport/Arcane Warding이 필수 대안."],"pitfalls":["단단하다고 무조건 근접하면 안 된다.","행동 불능·원거리 집중 공격에 취약.","근접 피해만 올리면 보스 앞에서 서서 피격을 반복한다. 보호막이 없으면 이동·거리 확보를 먼저 한다."],"boss":["정원사 같은 강한 근접 보스에게 정면 돌격 금지.","벽 없는 넓은 공간, 원거리 기절 몬스터, Physical 고저항 보스에는 Teleport/Arcane Warding이 필수 대안."],"variants":["소환/탑승 능력을 강화한 드레이크 전사 변형."],"evidence":"스팀 초반 조합 추천 기반. 완전한 엔딩 클리어 경로 검증은 부족.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Dragon Claw 근접 물리→Earthen Passage 벽 간 이동→Mineral Shielding 보호막","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"근접 피해만 올리면 보스 앞에서 서서 피격을 반복한다. 보호막이 없으면 이동·거리 확보를 먼저 한다."},"fallbacks":["Earthen Passage를 쓸 벽이 부족하면 Teleport를 우선 구입하고 용의 발톱을 직접 시전한다.","근접 피해만 올리면 보스 앞에서 서서 피격을 반복한다. 보호막이 없으면 이동·거리 확보를 먼저 한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Dragon Claw 근접 물리→Earthen Passage 벽 간 이동→Mineral Shielding 보호막","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Earthen Passage를 쓸 벽이 부족하면 Teleport를 우선 구입하고 용의 발톱을 직접 시전한다."],"craftNotes":["핵심 장비 Dragonclaw Sabatons의 제작 태그는 Blood×1 + Dragon×2 + Translocation×1 + 자유×3 (총 7). 태그 공급 재료 예: Blood: Heart Fragment(Blood), Beastblood Fungus(Nature+Blood), Blood Basin(Blood+Ritual) / Dragon: Dragontongue Tablet(Dragon+Word), Drakentooth(Dragon+Fire), Golden Dragonscale(Dragon+Holy) / Translocation: Rift Residue(Translocation), Mirror Stone(Ritual+Translocation), Relocator Beacon(Orb+Translocation). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다.","Earthmeld Boots=Metallic×1+Nature×1+자유×2로 이동하지 않는 턴마다 HP 3 회복. Dragonclaw Sabatons과 같은 신발 슬롯이므로 이동형/고정형 대안 선택."],"purchase":[{"kind":"spell","name":"Dragon Claw","cost":1,"reason":"Deal 20 Physical damage in an arc / Will not damage allies unless directly targeted"},{"kind":"spell","name":"Earthen Passage","cost":2,"reason":"Teleport through a connected group of wall ot":"신발","recipe":"Metallic×1 + Nature×1 + 자유×2","cost":4,"effect":"Each turn, heal 3 HP unless you moved","priority":"대체 방어","verified":true},{"name":"Boreal Armor","slot":"몸통","recipe":"Ice×1 + Metallic×1 + 자유×4","cost":6,"effect":"Gain 7 SH at the beginning of each level / When an enemy removes one of your shields, deal 12 Ice damage to them","priority":"대체 방어","verified":true}]},{"id":"eye","icon":"👁️","title":"부유하는 눈 · 보호막 포탑","group":"기타 빌드","level":"★★★","tagline":"보호막을 공격력으로 바꾸는 눈 소환","idea":"부유하는 눈(Floating Eye)에 눈의 마법사(Eye Mage)와 재생 보호막(Regenerating Shields)을 연결하고, 보호막 흡수(Siphon Shields)의 안구 렌즈화(Ocular Lensing)로 공격과 보호막을 증폭한다.","first":["초반: 저비용 눈 공격 또는 일반 광역 공격으로 생존.","중반: 부유하는 눈 + 눈의 마법사 + 재생 보호막.","중후반: 보호막 흡수 + 안구 렌즈화.","후반: 신비로운 시야 + 감시(Overwatch) 및 눈 장비.","핵심 연계: Floating Eye→Regenerating Shields의 자동 보호막→Eyemage·Siphon Shields 강화","핵심 주문이 늦어질 때: Eyemage가 늦으면 Regenerating Shields와 Arcane Warding으로 어그로를 받아내고 저비용 공격에 집중한다.","보스 대비: 고체력/높은 Arcane 저항 보스는 눈만 전개해도 체력이 줄지 않을 수 있어 다른 피해 유형 확보.","Floating Eye→Eyemage가 자동으로 사용할 다른 Lv2 Eye 주문으로 Eye of Ice를 확보한다. 구매하지 않았다면 Eyemage 업그레이드는 후순위."],"phases":[{"range":"1–5","target":"준비","actions":["저비용 마법으로 생존.","눈 소환에 필요한 SP와 방어 장비 확보.","Floating Eye는 HP1이지만 기본 보호막 4를 가진 임시 소환수. 적 광역에 몰리지 않도록 흩뿌린다."]},{"range":"6–10","target":"눈 생성","actions":["부유하는 눈과 눈의 마법사를 연결한다.","재생 보호막으로 소환수를 보호한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"중반 선택 분기","target":"핵심 장비 부재 시 대체 성장","actions":["Eyemage가 늦으면 Regenerating Shields와 Arcane Warding으로 어그로를 받아내고 저비용 공격에 집중한다.","현재 재료·SP로 확실히 구매 가능한 주력 주문과 방어 주문을 우선한다. 장비가 나오기만 기다리지 않는다.","핵심 장비를 획득하면 기존 임시 주문을 더 강화하기보다 해당 빌드의 자동/추가 시전 조건에 맞춰 전환한다."]},{"range":"11–15","target":"보호막 엔진","actions":["보호막 흡수 + 안구 렌즈화.","눈의 투구·의복을 제작할 수 있는지 확인.","Regenerating Shields(2SP)는 눈이 매턴 실드 2 획득, Eyemage(4SP)는 다른 Lv2 Eye 주문 자동 시전."]},{"range":"16–19","target":"생존과 보스","actions":["감시(Overwatch), 이동·보호막 능력 완성.","눈 공격의 속성 면역을 대비한 직접 피해 마련.","Siphon Shields는 시야의 적 보호막 최대3씩 흡수; Ocular Lensing은 보유 보호막에 따라 Eye 피해를 증폭한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["고체력/높은 Arcane 저항 보스는 눈만 전개해도 체력이 줄지 않을 수 있어 다른 피해 유형 확보.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","고체력/높은 Arcane 저항 보스는 눈만 전개해도 체력이 줄지 않을 수 있어 다른 피해 유형 확보."]}],"spells":[{"name":"부유하는 눈 (Floating Eye)","up":"눈의 마법사(Eye Mage)","reason":"눈 주문 사용","priority":"필수"},{"name":"부유하는 눈 (Floating Eye)","up":"재생 보호막(Regenerating Shields)","reason":"소환수 보호막 재생","priority":"필수"},{"name":"보호막 흡수 (Siphon Shields)","up":"안구 렌즈화(Ocular Lensing)","reason":"보호막을 공격에 활용","priority":"필수"},{"name":"신비로운 시야 (Mystic Vision)","up":"감시(Overwatch)","reason":"자동 대응","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"본체 보호","priority":"생존"},{"name":"석화 (Petrify)","up":"Arcane Conductivity","reason":"눈 소환수의 추가 제어·비전 저항 감소","priority":"후반"},{"name":"얼음의 눈 (Eye of Ice)","up":"기본","reason":"Eyemage가 자동 시전할 수 있는 다른 Lv2 Eye 주문","priority":"연계 필수"}],"gear":[{"name":"눈의 투구 (Eye Helm)","reason":"눈/보호막 시너지","priority":"핵심"},{"name":"눈의 의복 (Raiment of Eyes)","reason":"눈 주문 보조","priority":"선택"},{"name":"발로르의 눈 지팡이 (Balor's Eye Staff)","reason":"눈 공격 연계","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"마법 소환수 보호막 (Magic Minion Shield)","reason":"비전 눈의 소환시 보호막","priority":"중반"}],"rotation":["눈 소환을 먼저 배치하고 위험한 원거리 적을 파악한다.","보호막을 수급하여 눈의 화력을 유지한다.","본체는 직접 피격을 최소화한다.","Regenerating Shields(2SP)는 눈이 매턴 실드 2 획득, Eyemage(4SP)는 다른 Lv2 Eye 주문 자동 시전.","고체력/높은 Arcane 저항 보스는 눈만 전개해도 체력이 줄지 않을 수 있어 다른 피해 유형 확보."],"pitfalls":["보호막이 사라지면 화력과 생존이 함께 무너진다.","피의 눈(Eye of Blood)은 부유하는 눈이 사용하지 못한다는 가이드 주의점.","Eyemage가 자동 시전할 다른 Lv2 Eye 주문이 없다면 기대 효과가 감소한다. 구매 목록을 먼저 확인한다."],"boss":["보호막 제거·소환수 제어 적에게 주의.","고체력/높은 Arcane 저항 보스는 눈만 전개해도 체력이 줄지 않을 수 있어 다른 피해 유형 확보."],"variants":[],"evidence":"스팀 빌드 가이드 기반.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466" ority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Magic Minion Shield","slot":"장신구","recipe":"Arcane×1 + Conjuration×1 + 자유×3","cost":5,"effect":"Arcane allies gain 3 SH when summoned / Other allies gain 1 SH instead","priority":"중반","verified":true}]},{"id":"demon","icon":"💀","title":"악마 의식 · 절멸","group":"기타 빌드","level":"★★★","tagline":"의식으로 소환수를 강화한 뒤 폭딜","idea":"악마 의식(Demonic Ritual)의 불가침 의식(Inviolate Ritual)과 지배자의 갑옷(Armor of the Master)으로 소환수를 강화하고 절멸(Annihilate)·아마겟돈의 칼날(Armageddon Blades)을 공격으로 쓴다.","first":["초반: 죽음의 화살(Death Bolt)·뼈 전사(Bone Warriors)로 생존.","중반: 악마 의식(Demonic Ritual)과 불가침 의식.","후반: 절멸·아마겟돈의 칼날과 방어 장비.","핵심 연계: Demonic Ritual 채널 완수→강력한 Fiend 소환→Armageddon Blade로 Annihilate 제공","핵심 주문이 늦어질 때: HP66을 감당하기 어렵다면 Demonic Ritual을 미루고 저비용 공격·Fae Plate와 제어 주문으로 초반 클리어.","보스 대비: 보스의 침묵/기절이나 의식 채널 취소는 소환수가 적이 되는 사고로 이어지므로 별도 고화력/보호막 준비."],"phases":[{"range":"1–5","target":"값싼 공격","actions":["초반 무리한 의식 구매보다 죽음의 화살/소환수로 처치력 확보.","Demonic Ritual 기본 Lv6·HP 비용 66. 첫 3구역에 강행하지 말고 저가 공격과 본체 방어를 준비한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"6–10","target":"의식","actions":["악마 의식 + 불가침 의식 준비.","HP 비용 및 채널링 중의 위험을 미리 계산.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"중반 선택 분기","target":"핵심 장비 부재 시 대체 성장","actions":["HP66을 감당하기 어렵다면 Demonic Ritual을 미루고 저비용 공격·Fae Plate와 제어 주문으로 초반 클리어.","현재 재료·SP로 확실히 구매 가능한 주력 주문과 방어 주문을 우선한다. 장비가 나오기만 기다리지 않는다.","핵심 장비를 획득하면 기존 임시 주문을 더 강화하기보다 해당 빌드의 자동/추가 시전 조건에 맞춰 전환한다."]},{"range":"11–15","target":"폭발 화력","actions":["절멸과 아마겟돈의 칼날 확보.","의식 도중 끊기면 Ritual Bound 악마가 적으로 돌아설 수 있다. Inviolate Ritual(3SP)은 채널 중 전체 피해 저항 100% 제공.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"16–19","target":"방어 동반","actions":["지배자의 갑옷, 보호막 확보 후 의식 시전.","고저항 보스에게 다른 유형 공격도 준비.","Armageddon Blade는 Armageddon Blades가 아니라 단수 주문이며 아군에게 근접 Annihilate를 부여한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["보스의 침묵/기절이나 의식 채널 취소는 소환수가 적이 되는 사고로 이어지므로 별도 고화력/보호막 준비.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","보스의 침묵/기절이나 의식 채널 취소는 소환수가 적이 되는 사고로 이어지므로 별도 고화력/보호막 준비."]}],"spells":[{"name":"악마 의식 (Demonic Ritual)","up":"불가침 의식(Inviolate Ritual), 대의식(Grand Ritual)","reason":"소환수 강화","priority":"필수"},{"name":"절멸 (Annihilate)","up":"대량 절멸(Mass), 포괄적 절멸(Comprehensive)","reason":"광역 폭발","priority":"필수"},{"name":"아마겟돈의 칼날 (Armageddon Blade)","up":"대량 무장(Mass) 계열","reason":"추가 공격","priority":"필수"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"의식 직전 보호막","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"취소 후 탈출","priority":"생존"},{"name":"제재 (Sanction)","up":"Stripped Bare","reason":"암흑·화염 면역 적 대응","priority":"후반"}],"gear":[{"name":"지배자의 갑옷 (Armor of the Master)","reason":"의식·소환수 연계","priority":"핵심"},{"name":"요정 판금 (Fae Plate)","reason":"채널링 위험 감소","priority":"안전"},{"name":"위기 부적 (Crisis Charm)","reason":"의식 실패 대비","priority":"안전"},{"name":"영혼 사슬 갑옷 (Soulmail)","reason":"소환수 사망 연계 보호","priority":"선택"},{"name":"신속 의식 지팡이 (Rapid Ritual Rod)","reason":"Demonic Ritual 채널링 발동 추가, 생존 확보 후 시도","priority":"후반 핵심"}],"rotation":["엄호가 된 장소에서 소환수와 방어를 준비한다.","악마 의식을 시전하고 소환수를 강화한다.","대량 절멸로 적을 제거한다.","의식 도중 끊기면 Ritual Bound 악마가 적으로 돌아설 수 있다. Inviolate Ritual(3SP)은 채널 중 전체 피해 저항 100% 제공.","보스의 침묵/기절이나 의식 채널 취소는 소환수가 적이 되는 사고로 이어지므로 별도 고화력/보호막 준비."],"pitfalls":["악마 의식은 HP와 행동을 요구하여 초반 생존 빌드로는 어렵다.","패치로 의식 업그레이드 SP가 바뀐 적이 있다.","채널 중 무적성에 가까운 Inviolate Ritual을 얻어도 HP를 즉시 66 지불하는 문제와 침묵·취소는 남는다."],"boss":["고저항 보스를 대비한 다속성 공격과 피해 수단 필요.","보스의 침묵/기절이나 의식 채널 취소는 소환수가 적이 되는 사고로 이어지므로 별도 고화력/보호막 준비."],"variants":[],"evidence":"실제 클리어 경험담 기반이나 초보자 추천도는 낮음.","sources":[["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core": ort gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Sanction","cost":6,"tags":"Blood / Holy / Enchantment","base":"Sanction the target / Sanction deals 30 Holy damage to the cursed unit when they cast a spell or take Holy damage from another source / You are healed for 1 HP when Sanction deals damage","stats":"피해 30 · 충전 10 · HP소모 10 · 사거리 36","upgrades":[{"name":"Divine Rebuke","cost":3,"effect":"Each turn, cast Sanction on the first unsanctioned enemy that damages you / Always Active"},{"name":"Exiled One","cost":3,"effect":"Sanction gains 5 Duration / Sanctioned units are berserked for 5 turns"},{"name":"Mass Sanction","cost":4,"effect":"Sanction gains 4 Num Targets / Sanction affects up to 4 enemies in a connected group"},{"name":"Stripped Bare","cost":6,"effect":"Sanction reduces all resistances to 0"}]},{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 우선한다."]},{"range":"중반 선택 분기","target":"핵심 장비 부재 시 대체 성장","actions":["지진 장화가 없으면 Earthquake는 3충전 주문에 불과하다. Drain Pulse나 이동·방어 주문으로 안전하게 버틴다.","현재 재료·SP로 확실히 구매 가능한 주력 주문과 방어 주문을 우선한다. 장비가 나오기만 기다리지 않는다.","핵심 장비를 획득하면 기존 임시 주문을 더 강화하기보다 해당 빌드의 자동/추가 시전 조건에 맞춰 전환한다."]},{"range":"11–15","target":"지진 확장","actions":["지진과 여진(Aftershock), 장화 시너지를 구축.","Earthquake Boots는 6걸음마다 Earthquake를 시전한다. 걷지 않고 턴을 넘기면 자동 지진이 나오지 않는다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"16–19","target":"이동 생존","actions":["위험 범위에서 벗어날 경로를 항상 남겨둔다.","Aftershocks가 아닌 표준 업그레이드명은 Aftershocks(3SP). Magnitude 8.0은 모든 타일 명중·기절, 둘 중 우선 선택.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["Physical 내성 보스에는 Chthonic Breach(Arcane) 또는 Essence Flux/다른 속성 공격 마련.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","Physical 내성 보스에는 Chthonic Breach(Arcane) 또는 Essence Flux/다른 속성 공격 마련."]}],"spells":[{"name":"지진 (Earthquake)","up":"여진(Aftershock)","reason":"주력 광역","priority":"필수"},{"name":"순수 (Purity)","up":"기본","reason":"상태이상 대응","priority":"선택"},{"name":"흡수 파동 (Drain Pulse)","up":"기본","reason":"보조 자동 발동","priority":"선택"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"걸음 기반 자동 시전의 이동 보완","priority":"생존"},{"name":"정수 교환 (Essence Flux)","up":"Essence Degradation","reason":"물리 저항 높은 보스 대응","priority":"후반"}],"gear":[{"name":"지진 장화 (Earthquake Boots)","reason":"6걸음마다 Earthquake 자동 시전. 이동형 지진의 핵심","priority":"핵심"},{"name":"흡수 장화 (Drain Boots)","reason":"초반 자동 발동","priority":"핵심"},{"name":"주교의 장화 (Bishop Boots)","reason":"이동·시전 연계","priority":"선택"},{"name":"성주 나막신 (Castellan Clogs)","reason":"이동 관련 보조","priority":"선택"},{"name":"비단 샌들 (Silken Sandals)","reason":"이동 시 보호막","priority":"선택"},{"name":"날개 달린 신발 (Winged Shoes)","reason":"지형 제약 완화","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"걷는 동안 본체 보호","priority":"안전"}],"rotation":["안전한 이동 경로를 확보한다.","움직이는 동안 자동 시전이 발동하는 조건을 확인한다.","광역 효과로 적을 줄이되 포위되기 전에 이동한다.","Earthquake Boots는 6걸음마다 Earthquake를 시전한다. 걷지 않고 턴을 넘기면 자동 지진이 나오지 않는다.","Physical 내성 보스에는 Chthonic Breach(Arcane) 또는 Essence Flux/다른 속성 공격 마련."],"pitfalls":["장비 운이 나쁘면 완성할 수 없다.","이동 경로를 잘못 택하면 자동 공격보다 먼저 죽는다.","Drain Boots도 6걸음마다 Drain Pulse를 발동하지만 Earthquake Boots와 같은 신발 칸이라 둘 중 하나만 착용한다."],"boss":["이동이 제한되는 보스·지형에서 특히 주의.","Physical 내성 보스에는 Chthonic Breach(Arcane) 또는 Essence Flux/다른 속성 공격 마련."],"variants":[],"evidence":"실제 클리어 사례 기반이지만 장비 의존도가 높음.","sources":[["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"6걸음마다 Earthquake Boots 자동 지진→Aftershocks 확장→움직이며 지진 전장 제어","proof":"일부 승리 사례 기반, 문서화한 구매 순서는 재구성","risk":"Drain Boots도 6걸음마다 Drain Pulse를 발동하지만 Earthquake Boots와 같은 신발 칸이라 둘 중 하나만 착용한다."},"fallbacks":["지진 장화가 없으면 Earthquake는 3충전 주문에 불과하다. Drain Pulse나 이동·방어 주문으로 안전하게 버틴다.","Drain Boots도 6걸음마다 Drain Pulse를 발동하지만 Earthquake Boots와 같은 신발 칸이라 둘 중 하나만 착용한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["6걸음마다 Earthquake Boots 자동 지진→Aftershocks 확장→움직이며 지진 전장 제어","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","지진 장화가 없으면 Earthquake는 3충전 주문에 불과하다. Drain Pulse나 이동·방어 주문으로 안전하게 버틴다."],"craftNotes":["핵심 장비 Drain Boots의 제작 태그는 Dark×1 + Blood×1 + Sorcery×1 + Translocation×1 + 자유×4 (총 8). 태그 공급 재료 예: Dark: Shadeweave(Dark), Cursed Dice(Dark+Sorcery), Cursed Seal(Dark+Enchantment) / Blood: Heart Fragment(Blood), Beastblood Fungus(Nature+Blood), Blood Basin(Blood+Ritual) / Sorcery: Magic Rune(Sorcery), Ancient Inscription(Sorcery+Word), Crimson Sigil(Blood+Sorcery). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다.","지진 장화(Earthquake Boots): Sorcery×1 + Nature×1 + Translocation×1 + 자유×5. Drain Boots도 신발 칸이므로 양자택일."],"purchase":[{"kind":"spell","name":"Lightning Bolt","cost":1,"reason":"D rt gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Essence Flux","cost":4,"tags":"Arcane / Chaos / Enchantment","base":"Swap the resistances of units in a 4 tile burst / Fire swaps with Ice / Lightning swaps with Physical / Dark swaps with Holy / Poison swaps with Arcane / Does not affect the Wizard","stats":"충전 5 · 사거리 6 · 반경 4","upgrades":[{"name":"Banishment","cost":1,"effect":"Temporary units in the affected area are killed / Adds the Sorcery tag"},{"name":"Essence Degradation","cost":2,"effect":"Enemies' resistances match the lower of each pair, rather than being swapped"},{"name":"Essence Stabilizer","cost":3,"effect":"Allies' resistances match the higher of each pair, rather than being swapped"},{"name":"Flummoxed","cost":4,"effect":"Essence Flux gains 4 Duration / Affected enemies are silenced for 4 turns"}]},{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 2 turns"}]}],"verifiedGear":[{"name":"Earthquake Boots","slot":"신발","recipe":"Sorcery×1 + Nature×1 + Translocation×1 + 자유×5","cost":8,"effect":"Every 6 steps, cast Earthquake / 6 steps until cast","priority":"핵심","verified":true},{"name":"Drain Boots","slot":"신발","recipe":"Dark×1 + Blood×1 + Sorcery×1 + Translocation×1 + 자유×4","cost":8,"effect":"Every 6 steps, cast Drain Pulse / 6 steps until cast","priority":"핵심","verified":true},{"name":"Bishop Boots","slot":"신발","recipe":"Translocation×2 + 자유×2","cost":4,"effect":"When you step diagonally, if you are able, take another step in that same direction","priority":"선택","verified":true},{"name":"Castellan Clogs","slot":"신발","recipe":"Translocation×2 + 자유×3","cost":5,"effect":"When you step orthogonally, if you are able, take another step in that same direction","priority":"선택","verified":true},{"name":"Silken Sandals","slot":"신발","recipe":"Holy×1 + Translocation×1 + 자유×4","cost":6,"effect":"When you take a step, gain 1 SH","priority":"선택","verified":true},{"name":"Winged Shoes","slot":"신발","recipe":"Enchantment×1 + Translocation×2 + 자유×2","cost":5,"effect":"Grants Flying","priority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true}]},{"id":"wolf","icon":"🐺","title":"늑대 무리 · 야생성 소환","group":"기타 빌드","level":"★★☆","tagline":"늑대 소환수로 전선을 밀어붙이는 자연계","idea":"늑대(Wolf)의 늑대 무리(Wolf Pack)·굶주린 늑대(Ravenous Wolf)와 야생성 발현(Invoke Savagery)을 결합한다. 소환수 물량과 강화 효과로 적을 압박.","first":["1구역: 늑대(Wolf) 확보.","초반: 늑대 무리(Wolf Pack) 우선.","중반: 야생성 발현(Invoke Savagery) 강화.","후반: 자연/소환 장비와 다른 피해 수단 마련.","핵심 연계: Wolf Pack으로 늑대 3마리 생성→Invoke Savagery→Savage Leap/Savage Spree로 공격 연쇄","핵심 주문이 늦어질 때: Wolf Pack 6SP가 늦으면 기본 늑대 1~2마리로 적을 분산하고 보호막·이동을 먼저 확보한다.","보스 대비: 아군이 공포/지배에 걸리거나 Physical 100% 저항 보스가 나오면 늑대만으로 진행이 막혀 저항 감소/다른 공격 필요."],"phases":[{"range":"1–5","target":"늑대 군단","actions":["늑대를 적과 본체 사이에 배치.","늑대 무리/굶주린 늑대로 수와 공격력 보강.","Wolf Lv1·기본 충전7, Wolf Pack은 6SP 업그레이드로 단일 늑대 대신 3마리 소환."]},{"range":"6–10","target":"야생성","actions":["야생성 발현으로 소환수를 강화한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"중반 선택 분기","target":"핵심 장비 부재 시 대체 성장","actions":["Wolf Pack 6SP가 늦으면 기본 늑대 1~2마리로 적을 분산하고 보호막·이동을 먼저 확보한다.","현재 재료·SP로 확실히 구매 가능한 주력 주문과 방어 주문을 우선한다. 장비가 나오기만 기다리지 않는다.","핵심 장비를 획득하면 기존 임시 주문을 더 강화하기보다 해당 빌드의 자동/추가 시전 조건에 맞춰 전환한다."]},{"range":"11–16","target":"지속력","actions":["자연 지팡이·소환술 지팡이·소환수 방어 강화.","Invoke Savagery(2SP)는 Living 아군에게 임의 적을 근접 공격시키며 기절2턴을 부여한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"17–19","target":"제어 대책","actions":["공포·지배에 소환수가 무너지는 상황 대비.","직접 공격과 보호막 추가.","Savage Leap(6SP)과 Savage Spree(9SP)로 점프 공격·처치 시 추가 Invoke Savagery 연쇄를 만든다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["아군이 공포/지배에 걸리거나 Physical 100% 저항 보스가 나오면 늑대만으로 진행이 막혀 저항 감소/다른 공격 필요.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","아군이 공포/지배에 걸리거나 Physical 100% 저항 보스가 나오면 늑대만으로 진행이 막혀 저항 감소/다른 공격 필요."]}],"spells":[{"name":"늑대 (Wolf)","up":"늑대 무리(Wolf Pack), 굶주린 늑대(Ravenous Wolf)","reason":"전열","priority":"필수"},{"name":"야생성 발현 (Invoke Savagery)","up":"야생의 도약(Savage Leap), 야생의 난동(Savage Spree)","reason":"소환수 강화","priority":"필수"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"소환수 물량 완성 전 보호막","priority":"생존"},{"name":"석화 (Petrify)","up":"기본","reason":"강력 원거리 적 제어","priority":"선택"},{"name":"순간이동 (Teleport)","up":"Quickcast","reason":"소환수가 무력화되었을 때 탈출","priority":"생존"}],"gear":[{"name":"자연 지팡이 (Nature Staff)","reason":"자연 주문 강화","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환수 증강","priority":"선택"},{"name":"드루이드의 로브 (Robe of the Druids)","reason":"자연 계열 강화","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 방어","priority":"안전"},{"name":"위기 부적 (Crisis Charm)","reason":"본체 급사 방지","priority":"안전"},{"name":"마법 소환수 보호막 (Magic Minion Shield)","reason":"소환 즉시 실드 부여","priority":"선택"}],"rotation":["늑대를 먼저 소환하고 마법사는 후방.","위험한 상태이상 적은 직접 먼저 제거.","군단이 전진하는 동안 다른 피해 보조.","Invoke Savagery(2SP)는 Living 아군에게 임의 적을 근접 공격시키며 기절2턴을 부여한다.","아군이 공포/지배에 걸리거나 Physical 100% 저항 보스가 나오면 늑대만으로 진행이 막혀 저항 감소/다른 공격 필요."],"pitfalls":["공포(Fear)에 살아 있는 소환수가 영향을 크게 받는다.","단일 소환수에 지나치게 올인하면 지배/탈취에 취약하다.","Ravenous Wolf는 남은 충전을 소모하는 별도 업그레이드. Wolf Pack과 함께 채택할지 연속 소환 전략에 맞춰 결정한다."],"boss":["물리 저항력 높은 보스에게 늑대만으로 피해 부족.","아군이 공포/지배에 걸리거나 Physical 100% 저항 보스가 나오면 늑대만으로 진행이 막혀 저항 감소/다른 공격 필요."],"variants":[],"evidence":"스팀 빌드 가이드 기반.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"Wolf Pack으로 늑대 3마리 생성→Invoke Savagery→Savage Leap/Savage Spree로 공격 연쇄","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Ravenous Wolf는 남은 충전을 소모하는 별도 업그레이드. Wolf Pack과 함께 채택할지 연속 소환 전략에 맞춰 결정한다."},"fallbacks":["Wolf Pack 6SP가 늦으면 기본 늑대 1~2마리로 적을 분산하고 보호막·이동을 먼저 확보한다.","Ravenous Wolf는 남은 충전을 소모하는 별도 업그레이드. Wolf Pack과 함께 채택할지 연속 소환 전략에 맞춰 결정한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["Wolf Pack으로 늑대 3마리 생성→Invoke Savagery→Savage Leap/Savage Spree로 공격 연쇄","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","Wolf Pack 6SP가 늦으면 기본 늑대 1~2마리로 적을 분산하고 보호막·이동을 먼저 확보한다."],"craftNotes":["핵심 장비 Nature Staff의 제작 태그는 Nature×2 + 자유×2 (총 4). 태그 공급 재료 예: Nature: Wildflower(Nature), Beastblood Fungus(Nature+Blood), Dreamthorn Vine(Arcane+Nature). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Wolf","cost":1,"reason":"Summon a Wolf"},{"kind":"upgrade","name":"Wolf Pack","forSpell":"Wolf","cost":6,"reason":"Wolf gains 3 Num Summons / Summons a pack of 3 wolves instead of just 1"},{"kind":"spell","name":"Invoke Savagery","cost":2,"reason":"Your Living allies attack a random enemy in melee range / The attack inflicts 18 Physical damage and 2 turns of stun"},{"kind":"upgrade","name":"Savage Leap","forSpell":"Invoke Savagery","cost":6,"reason":"Invoke Savagery gains 3 Radius / Instead of a melee attack, allies do a leap ,"effect":"Nature spells and equipment gain 50% Max Charges ; Nature spells and equipment gain 50% Minion Damage ; Nature spells and equipment gain 50% Minion Health","priority":"선택","verified":true},{"name":"Conjuration Staff","slot":"무기","recipe":"Conjuration×2 + 자유×2","cost":4,"effect":"Conjuration spells and equipment gain 50% Minion Damage ; Conjuration spells and equipment gain 50% Minion Health","priority":"선택","verified":true},{"name":"Robe of the Druids","slot":"몸통","recipe":"Nature×2 + 자유×7","cost":9,"effect":"Nature spells and equipment gain 50% Damage ; Nature spells and equipment gain 50% Minion Health ; 100% Resist Poison","priority":"선택","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Crisis Charm","slot":"장신구","recipe":"Holy×1 + Word×1 + 자유×2","cost":4,"effect":"On taking lethal damage, remove all debuffs and heal to full health / Discarded after use","priority":"안전","verified":true},{"name":"Magic Minion Shield","slot":"장신구","recipe":"Arcane×1 + Conjuration×1 + 자유×3","cost":5,"effect":"Arcane allies gain 3 SH when summoned / Other allies gain 1 SH instead","priority":"선택","verified":true}]},{"id":"ward","icon":"🛡️","title":"범용 보호막 · 생존 개조","group":"소환·방어","level":"★☆☆","tagline":"기존 빌드를 바꾸지 않고 몸만 단단하게","idea":"주력 공격 빌드를 그대로 두되 요정 판금(Fae Plate), 비전 방호(Arcane Warding), 북방 갑옷(Boreal Armor), 이동 주문 등을 상황에 맞게 넣는다.","first":["1~3구역: 주력 공격 마법 하나로 시작한다.","가능한 즉시 요정 판금(Fae Plate) 또는 쉬운 보호 장비 제작.","중반 이전: 비전 방호(Arcane Warding) 또는 소환수 1종으로 공격 분산.","이후: 주력 공격과 저항력 대응도 잊지 않는다.","핵심 연계: Fae Plate 보호막→Arcane Warding 시전 시 실드 회복·반사→Teleport 탈출","핵심 주문이 늦어질 때: Fae Plate가 없으면 Boreal Armor의 시작 보호막7 또는 Arcane Warding 수동 시전으로 버틴다.","보스 대비: 다단 공격에는 보호막이 소모되므로 보스별 공격 횟수와 대체 저항·반격 여부를 계산한다."],"phases":[{"range":"1–5","target":"방어 기초","actions":["주력 공격을 먼저 사고, 생존 장비를 1개 제작한다.","최대 HP와 보호막 모두 중요하다.","이 페이지는 자체 공격 빌드가 아니라 방어 모듈이다. 공격 주문 1개와 조합해야 완주 가능."]},{"range":"6–10","target":"보호막 유지","actions":["요정 판금·비전 방호·부여술 지팡이 중 가능한 조합 확보.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"중반 선택 분기","target":"핵심 장비 부재 시 대체 성장","actions":["Fae Plate가 없으면 Boreal Armor의 시작 보호막7 또는 Arcane Warding 수동 시전으로 버틴다.","현재 재료·SP로 확실히 구매 가능한 주력 주문과 방어 주문을 우선한다. 장비가 나오기만 기다리지 않는다.","핵심 장비를 획득하면 기존 임시 주문을 더 강화하기보다 해당 빌드의 자동/추가 시전 조건에 맞춰 전환한다."]},{"range":"11–15","target":"행동 절약","actions":["순간이동/이동 보조를 갖추어 피격 수를 줄인다.","Fae Plate는 매턴 보호막 1(상한3)을 보급하고 Arcane Warding은 매턴 보호막3을 얻으며 막은 피해를 반사한다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"16–19","target":"보스 대비","actions":["방어만 늘리지 말고 단일 고체력 적을 죽일 화력 확보.","Teleport+Quickcast를 확보하면 위험한 시작 위치에서 행동을 소모하지 않고 탈출할 수 있다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["다단 공격에는 보호막이 소모되므로 보스별 공격 횟수와 대체 저항·반격 여부를 계산한다.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","다단 공격에는 보호막이 소모되므로 보스별 공격 횟수와 대체 저항·반격 여부를 계산한다."]}],"spells":[{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"보호막","priority":"필수"},{"name":"순간이동 (Teleport)","up":"신속 시전(Quickcast)","reason":"안전한 위치 이동","priority":"선택"},{"name":"어둠 (Darkness)","up":"기본","reason":"일부 원거리 적 견제","priority":"선택"},{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"방어 외 초반 공격 기준 예시","priority":"선택"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"적 실드를 빼앗아 방어 전환","priority":"후반"},{"name":"늑대 (Wolf)","up":"기본","reason":"본체 피격 분산","priority":"선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"지속 보호막","priority":"핵심"},{"name":"북방 갑옷 (Boreal Armor)","reason":"구역 시작 보호막","priority":"선택"},{"name":"부여술 지팡이 (Enchantment Staff)","reason":"비전 방호 등 방어 부여술 보완","priority":"선택"},{"name":"폭풍의 로브 (Robe of Storms)","reason":"냉기·번개 처치 시 보호막","priority":"속성별"},{"name":"위기 부적 (Crisis Charm)","reason":"급사 방지","priority":"선택"},{"name":"비전 방패 (Arcane Shield)" ,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Darkness","cost":3,"tags":"Dark / Enchantment","base":"Each turn, blind all units for 1 turn / Lasts 5 turns","stats":"충전 1 · 지속 5턴","upgrades":[{"name":"Nightstalkers","cost":3,"effect":"When you cast this spell, summon either a Wild Man or a Vampire Bat near each enemy / Adds the Conjuration tag"},{"name":"Eyes Of Cursed Dark","cost":4,"effect":"Darkness gains 2 Num Targets / Casting Darkness also casts Shadow Hex on up to 2 enemies in your line of sight / Adds the Eye tag"},{"name":"Long Night","cost":4,"effect":"Darkness gains 5 Duration"},{"name":"Darkvision","cost":6,"effect":"Only blinds enemies"}]},{"name":"Lightning Bolt","cost":1,"tags":"Lightning / Sorcery","base":"Deal 12 Lightning damage in a beam","stats":"피해 12 · 충전 14 · 사거리 8","upgrades":[{"name":"Electric Ink","cost":3,"effect":"Lightning Bolt gains 5 Minion Health / When Lightning Bolt kills a unit, summon a Living Lightning Scroll that can cast your Lightning Bolt once / When it casts the spell it dies"},{"name":"Stormbolt","cost":3,"effect":"Create Storm Clouds on affected tiles / Adds the Nature tag"},{"name":"Energy Bolt","cost":5,"effect":"Lightning Bolt also deals Arcane damage / Adds the Arcane tag"},{"name":"Repeater Bolts","cost":6,"effect":"Lightning Bolt gains 2 Duration / Lightning Bolt will be recast at the target location at the end of your turn for 2 turns"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]},{"name":"Wolf","cost":1,"tags":"Nature / Conjuration","base":"Summon a Wolf","stats":"충전 7 · 사거리 5","upgrades":[{"name":"Werewolf","cost":1,"effect":"Summon a Werewolf instead of a Wolf / Adds the Dark tag"},{"name":"Fleet Footed","cost":2,"effect":"Wolves gain quickstep / Adds the Translocation tag"},{"name":"Ravenous Wolf","cost":5,"effect":"Consumes all remaining charges on cast / The wolf's health and spells' damage are multiplied by the number of charges consumed / Each time the wolf kills a unit, they grow more powerful / Adds the Blood tag"},{"name":"Wolf Pack","cost":6,"effect":"Wolf gains 3 Num Summons / Summons a pack of 3 wolves instead of just 1"}]}],"verifiedGear":[{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"핵심","verified":true},{"name":"Boreal Armor","slot":"몸통","recipe":"Ice×1 + Metallic×1 + 자유×4","cost":6,"effect":"Gain 7 SH at the beginning of each level / When an enemy removes one of your shields, deal 12 Ice damage to them","priority":"선택","verified":true},{"name":"Enchantment Staff","slot":"무기","recipe":"Enchantment×1 + 자유×3","cost":4,"effect":"Enchantment spells and equipment gain 3 Duration ; Enchantment spells and equipment gain 2 Max Charges","priority":"선택","verified":true},{"name":"Robe of Storms","slot":"몸통","recipe":"Ice×1 + Lightning×1 + Nature×1 + 자유×3","cost":6,"effect":"When an enemy dies to Ice or Lightning damage, gain 1 SH","priority":"속성별","verified":true},{"name":"Crisis Charm","slot":"장신구","recipe":"Holy×1 + Word×1 + 자유×2","cost":4,"effect":"On taking lethal damage, remove all debuffs and heal to full health / Discarded after use","priority":"선택","verified":true},{"name":"Arcane Shield","slot":"장신구","recipe":"Arcane×1 + 자유×3","cost":4,"effect":"When you manually cast an Arcane spell, gain 1 SH","priority":"선택","verified":true}]},{"id":"graygoo","icon":"🧪","title":"회색 점액 · 방어구 용해","group":"신규 연구 빌드","level":"★★★","tagline":"증식하는 점액을 물리 관통으로 보완하는 상태이상 연계형","idea":"초반에 강한 회색 점액(Gray Goo)의 물리 피해가 후반에도 통하도록 방어구 용해기(Armor Melter)의 저항력 감소를 더한다. 에메랄드 화염으로 용해를 발동하고 슬라임샷의 저주·흡혈 연쇄를 연결하는 복합 빌드. 기존 ‘슬라임 형태+재생 오라’와 달리 회복이 아니라 방어력 약화와 복합 피해가 목적이다. [검증 주의] 원본 Gray Goo의 최신 획득 경로는 확인되지 않아, 아래 Slime Form 경로가 원본과 동일한 성능이라는 보장은 없다.","first":["원본 승리 로그의 Gray Goo는 현재 live 주문·유닛 데이터에서 확인되지 않는다. 이 공략의 실제 플레이 가능 대체 경로는 Slime Form + Slimeshot이다.","초반: 점액이 증식할 시간을 벌 수 있는 소환·이동·보호막 수단 한 가지를 마련한다.","중반: 방어구 용해기(Armor Melter)와 에메랄드 화염(Emerald Flame) 연계를 목표로 재료를 모은다.","후반: 슬라임샷·흡혈·저주 연쇄를 ‘여유 SP가 있을 때’ 추가한다.","핵심 연계: 과거 Gray Goo 승리 기록을 현행 데이터로 재구성: Slime Form·Slimeshot + Armor Melter","핵심 주문이 늦어질 때: 원문 Gray Goo를 당장 구할 수 없는 경우 Slime Form+Slimeshot을 독립 슬라임 빌드로 사용하며 동일 승리 성능으로 간주하지 않는다.","보스 대비: Physical 면역이면 Armor Melter로 저항을 실제 낮추거나 Melt의 -100 Physical 저항 대안 마련. Icy Vengeance Icon은 아군 사망 시 Ice 반응 피해."],"phases":[{"range":"1–3","target":"점액 확산","actions":["현행 Slime Form을 사용해 매턴 Green Slime을 전개한다. 원문 Gray Goo 소환과는 다름.","물리 면역 적이 많은 균열은 피한다.","첫 3구역의 고정 구매 순서는 원문에 없으므로 저가 공격·방어 주문은 상황에 맞게 선택한다.","원문은 Gray Goo 사용이지만 live 주문·유닛 데이터에는 동일 이름이 없다. 구매 가능한 현재 대체인 Slime Form으로 시동한다."]},{"range":"4–7","target":"저항력 대책","actions":["방어구 용해기(Armor Melter)를 제작 목표로 삼는다.","장비 발동용 화염 피해 수단으로 에메랄드 화염(Emerald Flame)을 고려한다.","소환수만으로 처리되지 않는 원거리 적을 직접 제거한다."]},{"range":"8–12","target":"슬라임샷 확장","actions":["슬라임샷(Slimeshot)을 이용해 점액화(Slimefy)와 생명력 흡수(Lifedrain) 상태를 퍼뜨리는 변형을 구성한다.","보호막 또는 안정적인 군중 제어를 확보한다.","Armor Melter는 Fire 피해를 받은 적에 Melted Armor 3턴(-Physical 저항10) 스택 부여. Amulet of Emerald Flame가 화염 발동원."]},{"range":"13–17","target":"연쇄 발동 보완","actions":["붉은 위엄(Red Majesty)과 채찍질/징벌(Scourge), 피의 저주(Blood Hexes)를 연결할 수 있다면 추가한다.","얼음의 복수(Icy Vengeance) 등 다른 피해 축으로 면역 대응을 만든다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"18–19","target":"보스 준비","actions":["물리 면역/고저항 보스에게 방어구 용해 효과가 실제로 적용되는지 확인한다.","소환수가 약한 보스는 저주·상태이상 연쇄와 별도 피해로 처리한다.","Slimeshot→Slimification Shot은 적에게 Slimify를 시전. Lifedrain→Blood Hexes는 Enchantment 표적 시 Lifedrain 자동 연계."]},{"range":"20–21","target":"최종 보스 실전 점검","actions":["Physical 면역이면 Armor Melter로 저항을 실제 낮추거나 Melt의 -100 Physical 저항 대안 마련. Icy Vengeance Icon은 아군 사망 시 Ice 반응 피해.","본체 보호막과 보스 저항력·상태이상 면역을 다시 확인하고, 주력 피해가 통하지 않으면 보조 속성으로 교체한다.","최종전에서는 즉시 끊길 수 있는 시전·채널링·반사 조건을 먼저 안전하게 만든다.","Physical 면역이면 Armor Melter로 저항을 실제 낮추거나 Melt의 -100 Physical 저항 대안 마련. Icy Vengeance Icon은 아군 사망 시 Ice 반응 피해."]}],"spells":[{"name":"회색 점액 (Slime Form)","up":"속성별 슬라임 업그레이드(현행 데이터에서 Gray Goo 주문명 미확인)","reason":"원문 Gray Goo는 현행 주문·유닛 DB에서 찾지 못함. 따라하기 위해 Slime Form으로 대체한 실험 경로이며 동일한 승리 조합이라는 뜻은 아님","priority":"핵심"},{"name":"슬라임샷 (Slimeshot)","up":"점액화 (Slimefy) 등","reason":"점액·흡혈 상태를 넓게 퍼뜨림","priority":"중반"},{"name":"생명력 흡수 (Lifedrain)","up":"해당 빌드에 맞는 저주 연계","reason":"붉은 위엄 연쇄의 시작점","priority":"후반"},{"name":"징벌 (Scourge)","up":"기절 연계 확인","reason":"적 행동을 막아 점액이 공격할 턴을 확보","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"재구성한 슬라임폼 루트 보호막","priority":"생존"},{"name":"용해 (Melt)","up":"Mass Melt","reason":"Armor Melter 없이도 물리 저항 감소 대안","priority":"후반"}],"gear":[{"name":"방어구 용해기 (Armor Melter)","reason":"물리 저항력 감소의 핵심. 어떤 피해로 발동하는지 툴팁 확인","priority":"핵심"},{"name":"에메랄드 화염 (Amulet of Emerald Flame)","reason":"Enchantment 피해가 누적되면 Fire 발동. Armor Melter의 물리 저항 감소를 촉발","priority":"핵심 연계"},{"name":"요정 판금 (Fae Plate)","reason":"점액이 증식하기 전 본체를 지키는 범용 대체 장비","priority":"선택"},{"name":"얼음 복수 성상 (Icy Vengeance Icon)","reason":"아군 죽을 때 Ice 피해, 누적 점액 사망 보조","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"현재 대체 슬라임 소환 강화","priority":"선택"}],"rotation":["위협 범위를 먼저 확인하고 점액이 직접 맞을 수 있는 위치에 배치한다.","점액이 살아 있는 동안 본체는 원거리·기절 적부터 제거한다.","물리 저항력 높은 적에 에메랄드 화염+방어구 용해기가 적용되는지 살핀다.","상태이상 연쇄가 작동하면 직접 공격 횟수보다 제어·보호막 유지에 집중한다.","Armor Melter는 Fire 피해를 받은 적에 Melted Armor 3턴(-Physical 저항10) 스택 부여. Amulet of Emerald Flame가 화염 발동원.","Physical 면역이면 Armor Melter로 저항을 실제 낮추거나 Melt의 -100 Physical 저항 대안 마련. Icy Vengeance Icon은 아군 사망 시 Ice 반응 피해."],"pitfalls":["기존 슬라임 형태 빌드와 이름만 비슷할 뿐 핵심 메커니즘은 다르다.","물리 면역 적에게 점액만 쏟아부으면 막힌다.","붉은 위엄·징벌 연계는 후반 복잡한 변형이므로 초반 필수로 계산하지 않는다.","원본 클리어에서도 얼음의 복수와 기절이 큰 역할을 했다. 점액만으로 엔딩을 보장하지 않는다.","원문 Gray Goo 획득 경로는 현재 live 컴펜디엄에서 검증 불가. 이 빌드는 역사적 조합의 재구성으로 표시한다."],"boss":["물리 저항 보스: 방어구 용해가 실제 작동하는지 공격 로그로 확인.","소환수 소모가 많은 보스: 보호막과 기절 등으로 시간을 번다.","모르드레드: 단일 물리 피해 대신 저항력 감소+추가 속성 피해의 연쇄로 준비.","Physical 면역이면 Armor Melter로 저항을 실제 낮추거나 Melt의 -100 Physical 저항 대안 마련. Icy Vengeance Icon은 아군 사망 시 Ice 반응 피해."],"variants":["쉬운 변형: 회색 점액+방어구 용해기까지만 완성하고 다른 소환·방어 장비로 생존.","고화력 변형: 슬라임샷→생명력 흡수→피의 저주→붉은 위엄 연쇄 추가."],"evidence":"라이아노즈 실제 승리 로그 #1 기반. 초반 구매 구역은 추천 재구성. 복잡한 연쇄가 필요해 뉴비에게는 실험용.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"],["2026-10-12 live 주문·장비·제작식 원본","https://github.com/hpp3/rw3"]],"engine":{"core":"과거 Gray Goo 승리 기록을 현행 데이터로 재구성: Slime Form·Slimeshot + Armor Melter","proof":"과거 원문 승리 로그는 확인. 그러나 Gray Goo를 현행 주문으로 구매하는 방법은 미확인; Slime Form 대체형은 별도로 제안한 구성이다.","risk":"원문 Gray Goo 획득 경로는 현재 live 컴펜디엄에서 검증 불가. 이 빌드는 역사적 조합의 재구성으로 표시한다."},"fallbacks":["원문 Gray Goo를 당장 구할 수 없는 경우 Slime Form+Slimeshot을 독립 슬라임 빌드로 사용하며 동일 승리 성능으로 간주하지 않는다.","원문 Gray Goo 획득 경로는 현재 live 컴펜디엄에서 검증 불가. 이 빌드는 역사적 조합의 재구성으로 표시한다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"auto":["과거 Gray Goo 승리 기록을 현행 데이터로 재구성: Slime Form·Slimeshot + Armor Melter","자동 발동은 해당 장비·업그레이드의 발동 조건이 충족된 순간에만 일어난다.","원문 Gray Goo를 당장 구할 수 없는 경우 Slime Form+Slimeshot을 독립 슬라임 빌드로 사용하며 동일 승리 성능으로 간주하지 않는다."],"craftNotes":["핵심 장비 Armor Melter의 제작 태그는 Fire×2 + Metallic×1 + 자유×2 (총 5). 태그 공급 재료 예: Fire: Burning Ember(Fire), Drakentooth(Dragon+Fire), Hellbloom(Fire+Nature) / Metallic: Shielding Shard(Metallic), Charged Cog(Metallic+Lightning), Sacrificial Brand(Blood+Metallic). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"purchase":[{"kind":"spell","name":"Slime Form","cost":3,"reason":"Assume Slime Form for 12 turns / Gain 50 Physical and 100 Poison resistance / Each turn, summon a Green Slime nearby / If you have multiple upgrades that would replace the Green Slime, summon one of each"},{"kind":"spell","name":"Slimeshot","cost":2,"reason":"Deal 12 Poison damage in a 3 tile burst / If the target is an allied Slime, it explodes, adding its max HP to the spell's damage / Inflict 10 turns of soaked on non Slime units / Turns water chasms into swamp chasms"},{"kind":"upgrade","name":"Slimification Shot","forSpell":"Slimeshot","cost":6,"reason":"Cast Slimify on affected enemies"},{"kind":"spell","name":"Lifedrain","cost":1,"reason":"Deal 3 Dark damage to the target each turn / Heals the caster for damage dealt / Lasts 15 turns"},{"kind":"upgrade","name":"Blood Hexes","forSpell":"Lifedrain","cost":6,"reason":"When you cast an Enchantment spell other than Lifedrain targeting an enemy, Lifedrain is also cast on that target / Always Active"},{"kind":"spell","name":"Melt","cost":2,"reason":"Target takes 22 Fire damage and loses 100 Physical resist"},{"kind":"upgrade","name":"Mass Melt","forSpell":"Melt","cost":3,"reason":"Melt gains 6 Num Targets / Melt affects up to 6 enemies in a connected group"}],"purchaseCost":23,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Slime Form","cost":3,"tags":"Enchantment / Conjuration / Slime","base":"Assume Slime Form for 12 turns / Gain 50 Physical and 100 Poison resistance / Each turn, summon a Green Slime nearby / If you have multiple upgrades that would replace the Green Slime, summon one of each","stats":"충전 2 · 지속 12턴","upgrades":[{"name":"Blood Slime","cost":3,"effect":"Slime Form gains 3 HP Cost / Instead of a Green Slime, summon a Blood Slime / Adds the Blood tag"},{"name":"Electric Slime","cost":3,"effect":"Instead of a Green Slime, summon an Electric Slime / Adds the Lightning tag"},{"name":"Fire Slime","cost":3,"effect":"Instead of a Green Slime, summon a Fire Slime / Adds the Fire tag"},{"name":"Ice Slime","cost":3,"effect":"Instead of a Green Slime, summon an Ice Slime / Adds the Ice tag"},{"name":"Void Slime","cost":3,"effect":"Instead of a Green Slime, summon a Void Slime / Adds the Arcane tag"},{"name":"Chromatic Oozemancer","cost":9,"effect":"Slime Form gains 4 Num Summons / Summon 4 additional random slimes each turn / Adds the Chaos tag"}]},{"name":"Slimeshot","cost":2,"tags":"Sorcery / Slime","base":"Deal 12 Poison damage in a 3 tile burst / If the target is an allied Slime, it explodes, adding its max HP to the spell's damage / Inflict 10 turns of soaked on non Slime units / Turns water chasms into swamp chasms","stats":"피해 12 · 충전 5 · 사거리 6 · 반경 3 · 지속 10턴","upgrades":[{"name":"Slime Chucker","cost":2,"effect":"Adjacent Slime allies are sacrificed, and their max HP is added to the spell's damage"},{"name":"Slime Rust","cost":3,"effect":"Slimeshot also deals Physical damage / Affected units receive Slime Rust which reduces all of their resistances by 10% / Does not affect Slime units / Adds the Metallic tag"},{"name":"Storm Transmutation","cost":4,"effect":"Storms over affected tiles are consumed, and turned into slimes of matching types / Lightning Storms become Electric Slimes / Blizzards become Ice Slimes / Rain Clouds become Green Slimes / Adds the Nature tag"},{"name":"Slimification Shot","cost":6,"effect":"Cast Slimify on affected enemies"}]},{"name":"Lifedrain","cost":1,"tags":"Blood / Dark / Enchantment","base":"Deal 3 Dark damage to the target each turn / Heals the caster for damage dealt / Lasts 15 tur
