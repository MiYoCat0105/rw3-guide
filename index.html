dly arcs to new targets within range of the previous target / Each arc deals damage to units in a beam / The bolt terminates when it cannot arc to any new targets","stats":"피해 24 · 충전 3 · 사거리 5","upgrades":[{"name":"Jolting Chain","cost":1,"effect":"Affected units are stunned for 1 turn"},{"name":"Cloud Conductance","cost":2,"effect":"Chain Lightning can arc to Blizzards, Rain Clouds, and Storm Clouds / Adds the Nature tag"},{"name":"Lightning Shield","cost":3,"effect":"Chain Lightning can arc to friendly targets / Friendly units hit by Chain Lightning gain 1 SH instead of being damaged"},{"name":"Chain Fireball","cost":7,"effect":"Cast Fireball on each tile Chain Lightning arcs to / Adds the Fire tag"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]}],"verifiedGear":[{"name":"Dowsing Spark","slot":"장신구","recipe":"Lightning×1 + Nature×1 + Translocation×1 + 자유×2","cost":5,"effect":"Each turn, deal 5 Lightning damage to 20 random enemies currently afflicted with soaked","priority":"핵심","verified":true},{"name":"Rain Beacon","slot":"장신구","recipe":"Nature×2 + Translocation×1 + 자유×2","cost":5,"effect":"Each turn, summon a random number of Rain Clouds across the level / The Rain Clouds last for 5 turns / The maximum number summoned each turn is your Nature mastery","priority":"확장","verified":true},{"name":"Stagnation Basin","slot":"장신구","recipe":"Nature×1 + 자유×3","cost":4,"effect":"When an enemy is soaked, they are poisoned for 10 turns","priority":"대체","verified":true},{"name":"Robe of Storms","slot":"몸통","recipe":"Ice×1 + Lightning×1 + Nature×1 + 자유×3","cost":6,"effect":"When an enemy dies to Ice or Lightning damage, gain 1 SH","priority":"후반","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"안전","verified":true},{"name":"Galvanic Focus","slot":"장신구","recipe":"Lightning×1 + Metallic×1 + 자유×3","cost":5,"effect":"Targeting a Metallic or Construct enemy with a Lightning spell inflicts a debuff which reduces their Lightning resistance by 25%","priority":"선택","verified":true}]},{"id":"revelation","icon":"📖","title":"계시록 의식 · 천사 강림","level":"★★★","tagline":"금서가 부여하는 긴 의식에서 Holy Fire 자동 발동·처치 시 세라프 소환","idea":"Book of Revelation은 주문이 아니라 금지 주문 Ritual of Revelation을 부여하는 장신구다. 의식은 HP 77을 소모하고 최대 12턴 동안 매턴 시야의 적 최대 3명에게 Holy Fire를 자동 시전한다. 완료 시 False Prophet 7마리를 소환한다. Holy Fire→Heaven Call은 목표 처치에 성공해야 Call Seraph가 추가 발동한다. Multimancer's Staff로 대상 수를 늘릴 수 있지만 준비 없이 쓰면 의식 중 사망하기 쉽다.","first":["1구역: Holy Fire(화염·성속성 십자 공격)로 시작.","2~5구역: Blinding Light→Halting Light로 실명·기절 제어.","5~8구역: Arcane Warding 또는 Fae Plate로 보호막 확보.","8~12구역: Holy Fire→Heaven Call·Divine Blaze 중 SP에 맞게 구매.","12~16구역: Book of Revelation 제작(성1+혈1+의식1+언령1+자유5), HP 77 비용에 대비.","16~19구역: Ritual of Revelation을 보호막 뒤에서 채널링. The Witness를 추가하면 자동 Blinding Light.","19~21구역: Multimancer's Staff·Permanence→Reality Hold, 보스용 다른 속성 공격 추가."],"phases":[{"range":"1–3","target":"성화 기본 공격","actions":["Holy Fire는 수직 Fire, 수평 Holy 피해. Demon/Undead에 기절 적용.","광역 범위를 잘 잡고 불필요한 주문 구매를 자제한다.","금서 의식은 HP77 소비/채널 최대12턴이어서 첫 구역에서 사용 불가에 가까운 고위험 선택이다."]},{"range":"4–7","target":"실명·보호막","actions":["Blinding Light로 시야 내 적 실명, Halting Light로 2턴 기절을 추가.","Arcane Warding·Fae Plate로 의식 전 생존 습관을 익힌다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"8–12","target":"Heaven Call 준비","actions":["Holy Fire→Heaven Call은 그 Holy Fire가 목표를 죽여야 Seraph 소환. 타격마다 무조건 소환이 아니다.","Divine Blaze는 Holy Fire를 시전할 때 Blazerip 추가 시전으로 다른 속성을 보강한다.","Holy Fire→Heaven Call은 처치가 있어야 Call Seraph가 발생한다. Blinding Light→Halting Light로 원거리 제어."]},{"range":"12–16","target":"금서와 HP 준비","actions":["Book of Revelation은 Holy×1+Blood×1+Ritual×1+Word×1+Any×5 총9 요구.","부여되는 Ritual of Revelation은 HP 77 비용, 12턴 채널, 매턴 시야 내 최대3 적 타격. 시작 전에 체력·보호막 확보.","책을 해제하면 그 주문도 사라지므로 교체하지 않는다."]},{"range":"16–19","target":"자동 성화 의식","actions":["매턴 의식이 Holy Fire를 자동 시전하며 끝까지 채널하면 False Prophet 7명을 소환한다.","The Witness는 채널 중 Blinding Light를 추가 자동 시전. Multimancer's Staff는 대상 수 +50%.","Permanence→Reality Hold는 이미 소환한 임시 세라프를 유지하는 선택형이다.","Ritual of Revelation의 The Witness는 매턴 Blinding Light, Multimancer's Staff는 대상 수 +50% 옵션."]},{"range":"20–21","target":"보스와 면역 대응","actions":["단일 보스만 남으면 Heaven Call 처치 시너지가 약해진다.","Holy/Fire 저항·Sorcery/Enchantment 면역을 확인하고 직접 소환수·Blazerip 등 대체 공격.","의식 유지가 위험하면 수동 공격·보호막·Teleport로 전환한다.","Fire/Holy 면역 적과 단일 보스는 처치형 Seraph 연쇄가 잘 안 나올 수 있어 소환수·Blazerip 보완."]}],"spells":[{"name":"계시 의식 (Ritual of Revelation)","up":"The Witness (5SP), Holy Horde (6SP)","reason":"Book of Revelation에서만 부여, HP77 소비·긴 채널","priority":"금서 획득 후"},{"name":"성화 (Holy Fire)","up":"Heaven Call (6SP), Divine Blaze (4SP)","reason":"처치 시 세라프 소환·Blazerip 추가 피해","priority":"핵심"},{"name":"눈부신 빛 (Blinding Light)","up":"Halting Light (5SP)","reason":"시야 내 적 실명/기절","priority":"제어"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"긴 의식 시작 전 보호막","priority":"필수"},{"name":"영속성 (Permanence)","up":"Reality Hold (4SP)","reason":"임시 아군 영구화","priority":"후반"},{"name":"세라프 소환 (Call Seraph)","up":"기본","reason":"Heaven Call 연계/직접 소환 선택","priority":"선택"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"의식 중단·탈출","priority":"생존"},{"name":"제재 (Sanction)","up":"Stripped Bare (6SP)","reason":"저항 높은 보스 대안","priority":"후반"}],"gear":[{"name":"계시록 (Book of Revelation)","reason":"Ritual of Revelation 금지 주문 부여. 제거하면 주문도 제거 [Trinket / 제작: Holy×1 + Blood×1 + Ritual×1 + Word×1 + 자유×5, 총 9]","priority":"핵심"},{"name":"멀티맨서 지팡이 (Multimancer's Staff)","reason":"전체 주문/장비 대상 +50%, 의식 공격 대상 증가 [Weapon / 제작: Arcane×1 + Translocation×1 + 자유×6, 총 8]","priority":"무기 핵심"},{"name":"신속 의식 지팡이 (Rapid Ritual Rod)","reason":"Ritual 채널당 발동 추가, 멀티맨서와 무기 택일 [Weapon / 제작: Ritual×2 + 자유×5, 총 7]","priority":"무기 대안"},{"name":"요정 판금 (Fae Plate)","reason":"의식 전 보호막 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"},{"name":"말하는 모자 (Talking Hat)","reason":"Enchantment 퀵캐스트로 사전 준비 행동 효율 증가 [Head / 제작: Enchantment×3 + 자유×5, 총 8]","priority":"유틸"},{"name":"위기 부적 (Crisis Charm)","reason":"급사에 대비하는 안전 장신구 [Trinket / 제작: Holy×1 + Word×1 + 자유×2, 총 4]","priority":"선택"}],"craftNotes":["재료 예: Holy Water(Holy+Ritual), Blood Basin(Blood+Ritual), Scripted Cortex(Arcane+Word), Dragontongue Tablet(Dragon+Word).","Book of Revelation은 장신구. Multimancer's Staff/Rapid Ritual Rod는 둘 다 무기이므로 선택.","HP 77은 의식의 직접 비용이다. 고HP·회복·보호막 확보 전에는 시작하지 않는다.","핵심 장비 Book of Revelation의 제작 태그는 Holy×1 + Blood×1 + Ritual×1 + Word×1 + 자유×5 (총 9). 태그 공급 재료 예: Holy: Holy Icon(Holy), Golden Dragonscale(Dragon+Holy), Holy Water(Holy+Ritual) / Blood: Heart Fragment(Blood), Beastblood Fungus(Nature+Blood), Blood Basin(Blood+Ritual) / Ritual: Blood Basin(Blood+Ritual), Holy Water(Holy+Ritual), Mirror Stone(Ritual+Translocation). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"auto":["계시 의식 채널 중 Holy Fire가 매턴 시야 대상에 자동 시전된다.","Holy Fire→Heaven Call은 처치 조건부로 Seraph 소환, 매번 반드시 소환되지 않는다.","The Witness는 추가 자동 Blinding Light, Multimancer's Staff는 대상수 +50%.","의식 완료 후 False Prophet 7 소환. 채널 중단 시 완료 보상은 얻지 못한다."],"rotation":["Blinding Light→Halting Light로 위협 적 제어.","Arcane Warding·체력 77 이상과 추가 여유분 확보.","계시록 의식 시작, Holy Fire 자동 발동·처치 시 세라프 소환.","채널 완료를 노리되 위험하면 안전한 위치·방어 우선.","보스는 Sanction/다른 속성 공격 보완."],"pitfalls":["Book of Revelation은 주문이 아니라 장신구.","HP 비용 77·채널 최대 12턴 때문에 초중반 운용이 위험.","Heaven Call은 Holy Fire 처치 시에만 소환.","멀티맨서와 신속 의식 지팡이는 같은 무기 슬롯.","시야 대상이 없으면 자동 포격 대상 감소.","성속성·화염 저항이 높은 적은 다른 피해 수단 필요."],"boss":["성속성/화염 저항과 주문 유형 면역을 별도 확인.","단일 보스는 처치 트리거가 적어 Seraph 자동 증식이 어려움.","모르드레드는 미리 소환군·방어·이동을 준비한다.","Fire/Holy 면역 적과 단일 보스는 처치형 Seraph 연쇄가 잘 안 나올 수 있어 소환수·Blazerip 보완."],"variants":["폭격형: 계시록+Multimancer's Staff+Heaven Call.","제어형: Blinding Light→Halting Light + The Witness.","소환 영구형: Seraph + Permanence→Reality Hold.","의식 반복형: Rapid Ritual Rod 무기 대안."],"evidence":"Steam Book of Revelation 공략과 2026-10-12 live 데이터 검증. Ritual of Revelation HP77/채널12/대상3/완료시 False Prophet7; Heaven Call은 처치 조건. 세부 구역은 생존형 재구성.","sources":[["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["2026-10-12 베타 변경사항","https://steamdb.info/patchnotes/25891047/"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드","engine":{"core":"Book of Revelation 장신구→Ritual of Revelation 채널 중 Holy Fire 자동 시전→처치시 Seraph, 완료시 False Prophet 7","proof":"공략·트라이얼 중심, 이 정확한 구성의 클리어는 추가 검증 필요","risk":"Book of Revelation 제거 시 Ritual 주문도 제거된다. Multimancer's Staff와 Rapid Ritual Rod는 무기 슬롯 택일."},"fallbacks":["금서가 없을 때에는 Holy Fire/Blinding Light/Fae Plate로 기본 신성 주문을 운용한다.","Book of Revelation 제거 시 Ritual 주문도 제거된다. Multimancer's Staff와 Rapid Ritual Rod는 무기 슬롯 택일.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"purchase":[{"kind":"spell","name":"Holy Fire","cost":3,"reason":"Deal 22 Fire damage in a vertical line / Deal 22 Holy damage in a horizontal line / Stun affected Demon and Undead units for 3 turns"},{"kind":"spell","name":"Blinding Light","cost":3,"reason":"Blind units in line of sight of the caster for 4 turns / Deal 5 Holy damage to affected Undead and Demon units"},{"kind":"upgrade","name":"Halting Light","forSpell":"Blinding Light","cost":5,"reason":"Stuns affected enemies for 2 turn turns"},{"kind":"upgrade","name":"Heaven Call","forSpell":"Holy Fire","cost":6,"reason":"When Holy Fire kills its target, cast Call Seraph where it died"},{"kind":"upgrade","name":"Divine Blaze","forSpell":"Holy Fire","cost":4,"reason":"Casting Holy Fire also casts Blazerip on the target / Adds the Arcane her than being swapped"},{"name":"Essence Stabilizer","cost":3,"effect":"Allies' resistances match the higher of each pair, rather than being swapped"},{"name":"Flummoxed","cost":4,"effect":"Essence Flux gains 4 Duration / Affected enemies are silenced for 4 turns"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]}],"verifiedGear":[{"name":"Rapid Ritual Rod","slot":"무기","recipe":"Ritual×2 + 자유×5","cost":7,"effect":"Your channeled Ritual spells activate an additional time each turn","priority":"필수","verified":true},{"name":"Robe of Storms","slot":"몸통","recipe":"Ice×1 + Lightning×1 + Nature×1 + 자유×3","cost":6,"effect":"When an enemy dies to Ice or Lightning damage, gain 1 SH","priority":"공격형 방어","verified":true},{"name":"Boreal Armor","slot":"몸통","recipe":"Ice×1 + Metallic×1 + 자유×4","cost":6,"effect":"Gain 7 SH at the beginning of each level / When an enemy removes one of your shields, deal 12 Ice damage to them","priority":"보스형 방어","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"초반","verified":true},{"name":"Storm Oculus","slot":"장신구","recipe":"Enchantment×1 + Ice×1 + Lightning×1 + 자유×3","cost":6,"effect":"The first time an enemy takes Ice or Lightning damage, it gets -25 Ice and Lightning resist","priority":"선택","verified":true},{"name":"Philosopher's Stone","slot":"장신구","recipe":"자유×10","cost":10,"effect":"This item gains the tags of the components used to craft it / When you cast a spell that shares a tag with this item, there is a 10% chance for all of your spells to regain a charge","priority":"선택","verified":true}]},{"id":"iceeye","icon":"👁️","title":"얼음의 눈 · 냉기 연타 폭격","level":"★★★","tagline":"눈동자의 자동 고드름과 눈보라로 냉기 주문 발동 횟수를 늘려 가면 강화","idea":"Eye of Ice는 30턴 지속하며 3턴마다 시야의 적에게 Ice 15 피해. Icy Array로 눈을 중복 유지하고 Eye of Icicles로 눈의 발사마다 Icicle을 추가한다. Ice Frenzy Mask는 냉기 주문을 시전할 때마다 Ice 주문/장비 피해를 6턴 동안 +2 중첩. Blizzard→Hailstorm이 생성한 구름마다 매턴 25% 확률로 Icicle을 시전하며 스택을 빠르게 올린다. 냉기 면역과 본체 피격이 약점.","first":["1구역: Icicle로 안전한 물리+냉기 기본 공격.","2~4구역: Eye of Ice 확보(3턴에 한 번 자동 Ice).","4~7구역: Icy Array와 Fae Plate/Arcane Warding 확보.","7~11구역: Eye of Icicles와 Ice Frenzy Mask 제작(Ice×2+자유×4).","11~15구역: Blizzard→Hailstorm 추가, 조건되면 Blizzard Beacon.","15~18구역: Icicle→Corrosive Shard로 Poison/Dark·저항 감소 대책.","19~21구역: 가면/로브는 슬롯 택일. 보호막·비냉기 단일 화력 보강."],"phases":[{"range":"1–3","target":"고드름","actions":["Icicle은 물리 직접 피해+좁은 냉기 범위이므로 초반 공격으로 효율적.","얼음 면역 다수 균열은 피한다.","Eye of Ice 기본 3턴마다 Ice15 자동 공격, 지속30턴, 직접 시전 후 경과 시간이 필요하다."]},{"range":"4–7","target":"얼음 눈 중첩","actions":["Eye of Ice 기본 공격은 3턴마다 자동 한 번, 지속 30턴. 매턴 공격으로 오해하지 않는다.","Icy Array를 구매하면 눈을 여러 개 유지해 자동 타격 수를 늘린다.","Fae Plate/Arcane Warding으로 눈이 반응하는 사이 생존한다."]},{"range":"7–11","target":"고드름의 눈+가면","actions":["Eye of Icicles는 눈이 적을 때릴 때 Icicle을 추가 시전.","Ice Frenzy Mask는 냉기 주문 시전마다 피해 +2 버프를 6턴간 중첩.","Icy Chill Mask는 시야 광역 냉기 피해 대안. 두 가면은 같은 머리 슬롯이다.","Icy Array+Eye of Icicles는 업그레이드 두 슬롯을 모두 사용한다."]},{"range":"11–15","target":"눈보라 자동 연타","actions":["Blizzard→Hailstorm: 생성된 눈보라 구름 하나당 매턴 25% 확률로 Icicle 추가.","Blizzard Beacon은 매턴 무작위 눈보라 구름을 공급하지만 상황에 따라 적을 못 맞힐 수 있다.","Robe of Crystals는 Arcane+Ice 추가 공격, Robe of Frostfire는 Fire+Ice로 저항 대처."]},{"range":"15–18","target":"내성 대응","actions":["Icicle→Corrosive Shard는 Poison/Dark 추가와 무작위 저항 -10%를 부여. 냉기 저항만 확정 감소시키지는 않는다.","Ice Frenzy Mask 효과는 주문 시전 횟수에 달렸으므로 눈 타격이 끊기지 않도록 시야 확보.","로브와 Fae Plate는 모두 몸통 슬롯, 공격/방어 하나만 선택.","Blizzard→Hailstorm의 구름마다 매턴 25% 확률 Icicle로 Ice Frenzy Mask의 피해+2 중첩을 증가."]},{"range":"20–21","target":"보스 유지력","actions":["단일 보스에게 눈의 자동 공격을 집중할 수 있으나 얼음 면역이라면 추가 화력 필요.","Blizzard Hailstorm+Corrosive Shard로 약점 형성 후 다른 속성으로 마무리.","Arcane Warding/Teleport로 강한 원거리 다단 공격 회피.","Ice 면역 보스는 Icicle→Corrosive Shard 및 Robe of Crystals/대체 속성으로 유효 피해 확보."]}],"spells":[{"name":"고드름 (Icicle)","up":"Corrosive Shard (5SP)","reason":"Physical+Ice, 후반 Dark/Poison·무작위 저항감소","priority":"시작"},{"name":"얼음의 눈 (Eye of Ice)","up":"Icy Array (4SP)","reason":"눈 중복 유지","priority":"핵심"},{"name":"얼음의 눈 (Eye of Ice)","up":"Eye of Icicles (6SP)","reason":"눈 타격 때 Icicle 추가 발동","priority":"핵심"},{"name":"눈보라 (Blizzard)","up":"Hailstorm (7SP)","reason":"구름마다 25% Icicle 반복 시전","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"자동 공격 사이 본체 방어","priority":"안전"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"시야 확보·회피","priority":"안전"},{"name":"얼음 드레이크 (Ice Drake)","up":"기본","reason":"초중반 탱킹 필요 시","priority":"선택"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"고실드 보스","priority":"후반"}],"gear":[{"name":"얼음 광란 가면 (Ice Frenzy Mask)","reason":"Ice 주문마다 냉기 피해+2/6턴 중첩 [Head / 제작: Ice×2 + 자유×4, 총 6]","priority":"핵심"},{"name":"냉기의 가면 (Icy Chill Mask)","reason":"Ice 시전마다 대상 시야의 적 추가 냉기 피해, 머리 대안 [Head / 제작: Eye×1 + Ice×2 + 자유×6, 총 9]","priority":"대안"},{"name":"수정 로브 (Robe of Crystals)","reason":"Ice/Arcane 시전 시 Ice+Arcane 추가 공격 [Body / 제작: Arcane×1 + Ice×1 + Eye×1 + 자유×3, 총 6]","priority":"공격 몸통"},{"name":"서리불꽃 로브 (Robe of Frostfire)","reason":"Ice/Fire 시전 시 Ice+Fire 추가 공격 [Body / 제작: Fire×1 + Ice×1 + Eye×1 + 자유×3, 총 6]","priority":"몸통 대안"},{"name":"폭풍 로브 (Robe of Storms)","reason":"Ice/Lightning 처치 시 보호막 [Body / 제작: Ice×1 + Lightning×1 + Nature×1 + 자유×3, 총 6]","priority":"안전 몸통"},{"name":"눈보라 신호기 (Blizzard Beacon)","reason":"매턴 눈보라 구름 자동 생성 [Trinket / 제작: Ice×2 + Translocation×1 + 자유×2, 총 5]","priority":"확장"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보호막, 로브와 택일 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"초반"}],"craftNotes":["Ice Frenzy Mask=Ice×2+자유×4. Elemental Ice(Ice), Frostpetal(Ice+Nature), Glacial Script(Ice+Word)를 재료 후보로.","Icy Chill Mask는 Eye×1+Ice×2+자유×6; Retinal Jelly(Eye+Slime), Watcher Stone(Eye+Metallic) 등 Eye 재료가 필요.","얼음 가면 두 종류는 머리 한 칸, Robe of Crystals/Frostfire/Storms/Fae Plate는 몸통 한 칸에서 선택.","핵심 장비 Ice Frenzy Mask의 제작 태그는 Ice×2 + 자유×4 (총 6). 태그 공급 재료 예: Ice: Elemental Ice(Ice), Frostpetal(Ice+Nature), Glacial Script(Ice+Word). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"auto":["Eye of Ice 기본 3턴 간격 자동 냉기 공격. Icy Array로 중복 유지.","Eye of Icicles는 눈 발사 시 Icicle 추가, Ice Frenzy Mask의 강화 스택을 늘린다.","Blizzard→Hailstorm은 구름별 매턴 25% Icicle, Blizzard Beacon은 구름 자동 공급."],"rotation":["Icicle로 초반 돌파 및 Eye of Ice 설치.","Icy Array로 여러 눈 유지, 본체 보호막 사용.","Eye of Icicles+Ice Frenzy Mask의 주문 반복 강화.","Blizzard→Hailstorm으로 Icicle 자동 발동 확대.","냉기 저항은 Corrosive Shard와 다른 속성으로 대응."],"pitfalls":["Eye of Ice는 기본 3턴에 한 번 타격.","Icy Array·Eye of Icicles 모두 SP 비용이 크므로 초반 한 번에 구매 어려움.","Ice Frenzy와 Icy Chill은 머리 장비 택일.","여러 로브·Fae Plate는 몸통 택일.","Corrosive Shard의 감소 저항 속성은 무작위.","빙결·냉기 면역 적에는 별도 피해 필요.","Ice Frenzy Mask와 Icy Chill Mask는 같은 머리 슬롯, 로브와 Fae Plate는 같은 몸통 슬롯."],"boss":["눈의 여왕 등 Ice 면역 상대로 물리·Dark·Poison/다른 속성 활용.","실드 보스에는 Siphon Shields.","모르드레드 단일 고HP에 눈 화력 집중 전 방어·Teleport 준비.","Ice 면역 보스는 Icicle→Corrosive Shard 및 Robe of Crystals/대체 속성으로 유효 피해 확보."],"variants":["Ice Frenzy Mask+Icy Array/Eye of Icicles 반복 냉기형.","Icy Chill Mask+Blizzard Beacon 화면 냉기 확산형.","Robe of Crystals 혼합 Arcane형.","Robe of Storms+Arcane Warding 생존형."],"evidence":"라이아노즈 실제 Cryomancer #14 승리 기록. live 데이터 Eye 3턴, 가면 +2/6턴, Hailstorm 구름별 25% 확인. 단계는 재구성.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드","engine":{"core":"Eye of Ice→Icy Array 다중 눈→Eye of Icicles 자동 Icicle→Ice Frenzy Mask 피해 누적","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Ice Frenzy Mask와 Icy Chill Mask는 같은 머리 슬롯, 로브와 Fae Plate는 같은 몸통 슬롯."},"fallbacks":["Ice Frenzy Mask가 안 나오면 눈의 자동 공격과 Fae Plate/Arcane Warding으로 버티고 제작 재료를 모은다.","Ice Frenzy Mask와 Icy Chill Mask는 같은 머리 슬롯, 로브와 Fae Plate는 같은 몸통 슬롯.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"purchase":[{"kind":"spell","name":"Icicle","cost":1,"reason":"Deal 6 Physical damage to the target / Then, deal 6 Ice damage to the target and a 1 tile burst around it / Turns chasms into floors"},{"kind":"spell","name":"Eye of Ice","cost":2,"reason":"Every 3 turns, deal 15 Ice damage to a random enemy in line of sight / Lasts 30 turns"},{"kind":"upgrade","name":"Icy Array","forSpell":"Eye of Ice","cost":4,"reason":"You can have multiple instances of Eye of Ice active simultaneously"},{"kind":"upgrade","name":"Eye of Icicles","forSpell":"Eye of Ice","cost":6,"reason":"Eye of Ice also casts Icicle on units it shoots"},{"kind":"spell","name":"Blizzard","cost":4,"reason":"Create Blizzards over tiles in a 3 tile radius / Blizzards deal 5 Ice damage each turn and have a 50% chance to inflict frozen / The clouds last for 5 turns"},{"kind":"upgrade","name":"Hailstorm","forSpell":"Blizzard","cost":7,"reason":"For each cloud created by Blizzard, there is a 25% chance for you to cast Icicle on it each turn"}],"purchaseCost":24,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Icicle","cost":1,"tags":"Ice / Sorcery","base":"Deal 6 Physical damage to the target / Then, deal 6 Ice damage to the target and a 1 tile burst around it / Turns chasms into floors","stats":"피해 6 · 충전 14 · 사거리 6 · 반경 1","upgrades":[{"name":"Freezing","cost":1,"effect":"Icicle gains 3 Duration / Freeze the target for 3 turns"},{"name":"Ice Spear","cost":2,"effect":"Deals Physical damage in a beam to the target"},{"name":"Corrosive Shard","cost":5,"effect":"Icicle also deals Poison and Dark damage to the target / Reduces a random resistance by 10% / Adds the Dark tag"},{"name":"Storm Spike","cost":5,"effect":"Icicle also deals Lightning damage to affected tiles / Icicle can be cast on any tile containing a cloud / Adds the Lightning tag"}]},{"name":"Eye of Ice","cost":2,"tags":"Ice / Enchantment / Eye","base":"Every 3 turns, deal 15 Ice damage to a random enemy in line of sight / Lasts 30 turns","stats":"피해 15 · 충전 4 · 지속 30턴","upgrades":[{"name":"Freezing","cost":1,"effect":"Eye of Ice freezes the target for 2 turns"},{"name":"Frosty Onlooker","cost":2,"effect":"Summon a Frosty Eyeball when Eye of Ice is removed / Adds the Conjuration tag"},{"name":"Icy Array","cost":4,"effect":"You can have multiple instances of Eye of Ice active simultaneously"},{"name":"Eye of Icicles","cost":6,"effect":"Eye of Ice also casts Icicle on units it shoots"}]},{"name":"Blizzard","cost":4,"tags":"Enchantment / Ice / Nature","base":"Create Blizzards over tiles in a 3 tile radius / Blizzards deal 5 Ice damage each turn and have a 50% chance to inflict frozen / The clouds last for 5 turns","stats":"피해 5 · 충전 3 · 사거리 6 · 반경 3 · 지속 5턴","upgrades":[{"name":"Blinding Squall","cost":2,"effect":"Damage dealt by this spell's Blizzards inflict 5 turns of blind"},{"name":"Blizzard Beasts","cost":4,"effect":"Blizzard gains 36 Minion Health / Blizzard gains 8 Minion Damage / Blizzard gains 3 Num Summons / Casting Blizzard also summons up to 3 Blizzard Beasts in unoccupied affected tiles / Adds the Conjuration tag"},{"name":"Blizzard Harvest","cost":6,"effect":"Every 300 damage dealt by this spell's Blizzards, regain a charge of a random Ice spell"},{"name":"Hailstorm","cost":7,"effect":"For each cloud created by Blizzard, there is a 25% chance for you to cast Icicle on it each turn"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy damage is blocked by your shields, reflect that damage to the source / Lasts 8 turns","stats":"충전 2 · 지속 8턴","upgrades":[{"name":"Soul Thief","cost":3,"effect":"If Arcane Ward kills a unit, it extends its remaining duration by 3 / Adds the Dark tag"},{"name":"Transmutation Ward","cost":3,"effect":"Instead of reflecting the same damage type, the damage type will instead be of a type that the targeted unit is most vulnerable to / Adds the Chaos tag"},{"name":"Amplifier Ward","cost":4,"effect":"Arcane Ward deals twice as much damage as the blocked hit"},{"name":"Energy Absorber","cost":5,"effect":"In addition to reflecting damage back at the attacker, heal for half the incoming damage"}]},{"name":"Teleport","cost":5,"tags":"Sorcery / Arcane / Translocation","base":"Teleport to target tile","stats":"충전 2 · 사거리 16","upgrades":[{"name":"Group Teleport","cost":1,"effect":"Teleport gains 10 Num Targets / Also teleports up to 10 allies to locations near the destination"},{"name":"Assassinate","cost":3,"effect":"Teleport gains 60 Damage / Teleport gains 3 Duration / If you Teleport adjacent to an enemy who could not see your original location, attempt to assassinate them, inflicting 60 Arcane damage and 3 turns of silence / If this kills an enemy, the Teleport charge is refunded"},{"name":"Quickcast","cost":3,"effect":"Teleport gains quickcast"},{"name":"Void Teleport","cost":5,"effect":"Teleport deals Arcane damage to enemies in line of sight of the destination equal to its max charges"}]},{"name":"Ice Drake","cost":4,"tags":"Ice / Conjuration / Dragon","base":"Summon an Ice Drake","stats":"충전 3 · 사거리 4","upgrades":[{"name":"Dragon Mage","cost":2,"effect":"Ice Drakes gain the Dark tag and can cast your Death Chill on a 6 turn cooldown / Adds the Dark tag"},{"name":"Cold Embrace","cost":3,"effect":"Instead of harming allies, the Ice Drake's breath grants them 5% Ice resist and 1 SH"},{"name":"Elite Drakes","cost":3,"effect":"Ice Drake gains 16 Minion Health / Ice Drake gains 4 Minion Damage / Ice Drake gains 1 Minion Range"},{"name":"Winterbringer","cost":9,"effect":"When you cast this spell, if there is room, summon Winterbringer instead of an Ice Drake / Can only activate once each level"}]},{"name":"Siphon Shields","cost":3,"tags":"Arcane / Enchantment","base":"Steal up to 3 SH from all enemies in line of sight","stats":"충전 2","upgrades":[{"name":"Shield Burn","cost":2,"effect":"Siphon Shields gains 5 Damage / Deal 5 Fire damage for each shield stolen / Adds the Fire tag"},{"name":"Retributive Siphon","cost":3,"effect":"If a shielded unit damages you, steal one of their shields / Always Active"},{"name":"Shield Steal","cost":3,"effect":"Siphon Shields gains 7 Shield Steal"},{"name":"Ocular Lensing","cost":4,"effect":"After casting Siphon Shields, your Eye spells get a 10% damage bonus for each SH you have / This bonus lasts until your shields are completely removed or you cast this spell again / Adds the Eye tag"}]}],"verifiedGear":[{"name":"Ice Frenzy Mask","slot":"머리","recipe":"Ice×2 + 자유×4","cost":6,"effect":"When you cast an Ice spell, your Ice spells and equipment gain 2 damage for 6 turns","priority":"핵심","verified":true},{"name":"Icy Chill Mask","slot":"머리","recipe":"Eye×1 + Ice×2 + 자유×6","cost":9,"effect":"When you cast an Ice spell, deal 1 Ice damage to enemies in line of sight of the target","priority":"대안","verified":true},{"name":"Robe of Crystals","slot":"몸통","recipe":"Arcane×1 + Ice×1 + Eye×1 + 자유×3","cost":6,"effect":"When you cast a Arcane or Ice spell, deal 8 Arcane damage to a random enemy in line of sight, and 8 Ice damage to another","priority":"공격 몸통","verified":true},{"name":"Robe of Frostfire","slot":"몸통","recipe":"Fire×1 + Ice×1 + Eye×1 + 자유×3","cost":6,"effect":"When you cast a Fire or Ice spell, deal 8 Fire damage to a random enemy in line of sight, and 8 Ice damage to another","priority":"몸통 대안","verified":true},{"name":"Robe of Storms","slot":"몸통","recipe":"Ice×1 + Lightning×1 + Nature×1 + 자유×3","cost":6,"effect":"When an enemy dies to Ice or Lightning damage, gain 1 SH","priority":"안전 몸통","verified":true},{"name":"Blizzard Beacon","slot":"장신구","recipe":"Ice×2 + Translocation×1 + 자유×2","cost":5,"effect":"Each turn, summon a random number of Blizzards across the level / The Blizzards deal 5 damage and last for 5 turns / The maximum number summoned each turn is equal to your Ice mastery","priority":"확장","verified":true},{"name":"Fae Plate","slot":"몸통","recipe":"Arcane×1 + Metallic×1 + 자유×2","cost":4,"effect":"Gain 1 SH each turn, up to a max of 3","priority":"초반","verified":true}]},{"id":"bluelion","icon":"🦁","title":"푸른 사자 · 음파 보호막 반격","level":"★★★","tagline":"푸른 사자가 보호막을 공급하고 깨질 때 Sonic Shields가 침묵 반격","idea":"Blue Lion은 Arcane·Nature·Holy 소환수이며 기본 3턴 간격으로 시야 내 아군에 실드 1(상한2)을 부여한다. Sonic Shields는 주문이 아닌 장신구로, 아군의 실드가 깨질 때 5타일 시야 내 최대2 적에게 Physical+Arcane 피해 각1과 침묵2턴을 준다. Magic Minion Shield가 Arcane 아군 소환 때 실드3을 주며, Void Hunter's Sigil은 Arcane 유닛 사망 시 Arcane 주문 충전 하나를 회복한다. Magic Missile→Arcane Crossfire 및 Disperse→Violent Warp로 부족한 화력을 보완한다.","first":["1구역: Magic Missile 한 종류로 시작.","2~4구역: Disperse로 적을 흩뜨려 생존, Violent Warp는 SP 여유 있을 때.","4~7구역: Blue Lion 확보, 3턴마다 아군에게 보호막이 부여되는지 확인.","7~11구역: Sonic Shields 제작(Arcane×2+Metallic×1+자유×5).","10~14구역: Magic Minion Shield로 Arcane 아군 생성 즉시 실드3, Crossfire로 직접 화력 추가.","14~18구역: Void Hunter's Sigil 제작(Arcane×2 + Arcane×2 + 자유×6)로 사망 시 충전 회복.","19~21구역: Quipu Saga 장비 피해 성장과 비Arcane 피해·보호막 대응."],"phases":[{"range":"1–3","target":"미사일·분산 생존","actions":["Magic Missile로 초반 적 정리.","Disperse는 범위 내 유닛 랜덤 순간이동으로 위험 적을 분리하는 생존 도구.","Blue Lion은 3턴마다 아군 실드1(최대2), 사자 자체 HP28/물리·비전 저항50%."]},{"range":"4–7","target":"푸른 사자 배치","actions":["Blue Lion은 HP28, Arcane/Physical 저항50%, 3턴마다 아군 시야 내 실드1(최대2)을 부여.","Lion Saviors는 구역 최초로 본체 HP 50% 미만이면 사자 3마리를 소환. 이 조건을 고의로 만들지는 않는다.","이 단계에서 본체가 다음 행동 후 받을 공격 횟수를 확인하고, 부족하면 보호막·시야·안전한 균열 선택을 우선한다."]},{"range":"7–11","target":"Sonic Shields 연동","actions":["Sonic Shields는 아군 실드가 깨져야 발동, 최대2 적에 Physical+Arcane 각각1 피해·침묵2턴.","Magic Minion Shield는 Arcane 아군 소환 때 실드3(다른 아군은 1) 제공.","실드를 보호할 몬스터가 없으면 자동 공격이 발생하지 않으므로 위치 선정이 중요.","Sonic Shields는 아군 실드가 깨져야 Physical+Arcane 피해와 침묵을 가한다."]},{"range":"11–15","target":"Arcane 화력 추가","actions":["Magic Missile→Arcane Crossfire는 직접 수동 시전할 때 Arcane 아군이 추가 발사한다.","Disperse→Violent Warp는 순간이동된 적에게 Magic Missile을 발사해 광역 보조.","Arcane 면역 적은 다른 속성 공격 필요."]},{"range":"15–19","target":"죽음→충전 회수","actions":["Void Hunter's Sigil은 Arcane 유닛 사망마다 소유 Arcane 주문 하나의 충전 1 회복.","Blue Lion은 Arcane 태그가 있어 사망→충전 흐름이 가능하나 회복 주문 선택은 고정되지 않는다.","Quipu Saga 희귀 재료를 Sonic Shields 제작에 쓰면 damage 속성 있는 장비에 구역 종료 때마다 +1 피해를 부여할 수 있다.","Void Hunter's Sigil은 Arcane 소환수 사망 시 보유 Arcane 주문 중 임의 충전1을 회복한다."]},{"range":"20–21","target":"모르드레드","actions":["Sonic Shields 기본 물리/비전 피해가 낮으므로 자동 반격만으로 단일 고HP 보스를 끝내기 어렵다.","고실드 적에 Siphon Shields, Arcane 면역 적에 별도 피해 유형을 준비.","Arcane Warding과 Teleport로 본체 생존 후 직접 Magic Missile/Disperse 화력 병행.","기본 Sonic Shields 피해는 각 1이라 단독 보스 DPS가 부족, Magic Missile Crossfire와 Disperse Violent Warp를 병행."]}],"spells":[{"name":"마법 미사일 (Magic Missile)","up":"Arcane Crossfire (1SP)","reason":"수동 시전시 Arcane 아군 추가 사격","priority":"시작+중반"},{"name":"분산 (Disperse)","up":"Violent Warp (6SP), Protective Warp (2SP)","reason":"위치 제어·Magic Missile 추가 시전","priority":"중반"},{"name":"푸른 사자 (Blue Lion)","up":"Lion Saviors (4SP), Holy Bolt (2SP)","reason":"아군 실드 공급·위기시 추가 사자·Holy 보조","priority":"핵심"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"본체 보호막","priority":"안전"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"보스 실드 제거","priority":"후반"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"배치·도주","priority":"안전"},{"name":"영속성 (Permanence)","up":"Reality Hold (4SP)","reason":"다른 임시 Arcane 소환수를 쓰는 경우만","priority":"선택"}],"gear":[{"name":"음파 보호막 (Sonic Shields)","reason":"아군 실드 파괴 시 자동 Physical+Arcane 피해/침묵 [Trinket / 제작: Arcane×2 + Metallic×1 + 자유×5, 총 8]","priority":"핵심"},{"name":"마법 소환수 보호막 (Magic Minion Shield)","reason":"Arcane 아군 소환 순간 실드3, 그 외 아군1 [Trinket / 제작: Arcane×1 + Conjuration×1 + 자유×3, 총 5]","priority":"보조"},{"name":"공허 사냥꾼의 인장 (Void Hunter's Sigil)","reason":"Arcane 유닛 사망시 Arcane 주문 무작위 충전 1회복 [Trinket / 제작: Arcane×2 + Arcane×2 + 자유×6, 총 10]","priority":"후반 핵심"},{"name":"요정 판금 (Fae Plate)","reason":"본체 생존 보호막 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"},{"name":"요정 가시 지팡이 (Fae Thorn Staff)","reason":"Arcane/Nature 주문 시 Fae Thorn 소환으로 아군 물량 보강 [Weapon / 제작: Arcane×1 + Conjuration×1 + Nature×2 + 자유×2, 총 6]","priority":"무기 선택"},{"name":"수정 로브 (Robe of Crystals)","reason":"Arcane 주문에 Ice+Arcane 추가 공격, Fae Plate와 택일 [Body / 제작: Arcane×1 + Ice×1 + Eye×1 + 자유×3, 총 6]","priority":"몸통 대안"}],"craftNotes":["Arcane Mote(Arcane), Voidstone Shard(Arcane+Sorcery), Slime Core(Arcane+Slime), Mithril Ore(Metallic) 등 모으기.","Void Hunter's Sigil의 Arcane×2+Arcane×2는 같은 속성 요구 묶음 두 개다. 총 요구 10으로 제작이 비싸다.","Quipu Saga는 희귀 On Craft 재료로 damage 특성이 있는 장비를 제작하면 매 구역 종료 때 피해 +1. Sonic Shields 강화에 적합.","핵심 장비 Sonic Shields의 제작 태그는 Arcane×2 + Metallic×1 + 자유×5 (총 8). 태그 공급 재료 예: Arcane: Arcane Mote(Arcane), Dreamthorn Vine(Arcane+Nature), Scripted Cortex(Arcane+Word) / Metallic: Shielding Shard(Metallic), Charged Cog(Metallic+Lightning), Sacrificial Brand(Blood+Metallic). 목록은 태그 예시이지 완제품 보장 조합이 아니다.","장비의 요구 태그와 개수는 live 데이터 기준. 일부 재료는 여러 태그를 동시에 갖지만 희귀 재료·On Craft/On Pickup 효과와 실제 재료 소모는 제작창에서 최종 확인한다."],"auto":["Blue Lion은 3턴마다 아군 실드 공급, Magic Minion Shield는 소환 순간 실드 추가.","아군 실드가 공격으로 깨질 때 Sonic Shields가 물리+비전 피해와 침묵을 자동 발동.","Arcane 태그 사자 등 아군 사망 시 Void Hunter's Sigil이 Arcane 주문 충전 하나를 회복.","Magic Missile→Arcane Crossfire는 반드시 직접 시전해야 하는 별도 공격 경로."],"rotation":["Magic Missile/Disperse로 초반 위치와 공격을 관리.","푸른 사자를 적과 본체 사이에 배치해 아군 실드 공급.","Sonic Shields+Magic Minion Shield 준비 후 적이 실드를 깰 때 반격·침묵 확인.","Arcane Crossfire/Violent Warp로 직접 화력 보충.","Void Hunter's Sigil로 소환수 사망 시 충전 회수, 보스는 대체 피해로 마무리."],"pitfalls":["Sonic Shields는 주문이 아니라 장신구이므로 직접 시전하지 않는다.","아군 실드가 깨지지 않으면 발동하지 않는다.","기본 데미지가 작아 보스에게는 추가 강화 필요.","Void Hunter's Sigil은 특정 주문 충전을 반드시 돌려주지는 않는다.","Arcane Crossfire는 직접 Magic Missile 시전 조건.","Robe of Crystals와 Fae Plate는 같은 몸통 슬롯.","Quipu Saga는 장비가 아니라 On Craft 희귀 재료. Sonic Shields 제작 시 피해 성장 효과를 노린다."],"boss":["Arcane 면역 적에게 Sonic Shields의 Physical 피해/다른 속성 공격 필요.","높은 실드는 Siphon Shields로 제거.","모르드레드 본체는 보호막/회피를 확보한 뒤 수동 Arcane 미사일과 다른 유효 속성 사용.","기본 Sonic Shields 피해는 각 1이라 단독 보스 DPS가 부족, Magic Missile Crossfire와 Disperse Violent Warp를 병행."],"variants":["기본형: Blue Lion+Sonic Shields+Arcane Warding.","충전 순환형: Void Hunter's Sigil+Magic Minion Shield.","공격형: Magic Missile→Arcane Crossfire + Disperse→Violent Warp.","희귀 성장형: Quipu Saga를 Sonic Shields에 제작 사용."],"evidence":"라이아노즈 Manamancer #18 실제 승리+live 데이터 비교. Blue Lion 보호막 쿨다운3, Sonic Shields 반응·기본 피해·Silence2, Void Hunter's Sigil 제작식 확인. 구역은 재구성.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드","engine":{"core":"Blue Lion 실드 부여→Magic Minion Shield 소환 실드→Sonic Shields가 아군 실드 소실 때 자동 반격","proof":"실제 승리 기록에 해당 핵심 연계가 등장함","risk":"Quipu Saga는 장비가 아니라 On Craft 희귀 재료. Sonic Shields 제작 시 피해 성장 효과를 노린다."},"fallbacks":["Sonic Shields 제작 재료가 없으면 사자 실드+Magic Missile로 진행하고 Fae Plate와 Siphon Shields로 생존한다.","Quipu Saga는 장비가 아니라 On Craft 희귀 재료. Sonic Shields 제작 시 피해 성장 효과를 노린다.","한 주문에 적용 가능한 업그레이드는 최대 두 개이며, 동시에 배울 수 있는 주문도 10개로 제한된다. 추천표와 선택형 업그레이드를 모두 구매하지 말 것."],"purchase":[{"kind":"spell","name":"Magic Missile","cost":1,"reason":"Deal 11 Arcane damage to the target"},{"kind":"spell","name":"Disperse","cost":2,"reason":"Teleport all units in a 3 tile radius to random locations / The caster is unaffected"},{"kind":"spell","name":"Blue Lion","cost":5,"reason":"Summon a Blue Lion"},{"kind":"upgrade","name":"Lion Saviors","forSpell":"Blue Lion","cost":4,"reason":"Blue Lion gains 3 Num Summons / The first time you fall below 50% HP each level, cast Blue Lion 3 times nearby"},{"kind":"upgrade","name":"Arcane Crossfire","forSpell":"Magic Missile","cost":1,"reason":"Magic Missile gains 3 Num Targets / When you manually cast Magic Missile, up to 3 additional missiles are fired by Arcane allies in line of sight of the target"},{"kind":"upgrade","name":"Violent Warp","forSpell":"Disperse","cost":6,"reason":"Cast Magic Missile on teleported enemies"}],"purchaseCost":19,"purchaseDisclaimer":"각 행의 비용은 Compendium live에서 확인한 주문 레벨/업그레이드 SP다. 표의 구매 순서는 추천이며 보유 SP·장비·균열에 따라 변경 가능. 방어·보조 주문, 선택형 대안은 총합에서 제외될 수 있음.","verifiedSpells":[{"name":"Magic Missile","cost":1,"tags":"Arcane / Sorcery","base":"Deal 11 Arcane damage to the target","stats":"피해 11 · 충전 20 · 사거리 9","upgrades":[{"name":"Arcane Crossfire","cost":1,"effect":"Magic Missile gains 3 Num Targets / When you manually cast Magic Missile, up to 3 additional missiles are fired by Arcane allies in line of sight of the target"},{"name":"Shield Burn","cost":2,"effect":"Magic Missile removes all SH from the target before dealing damage"},{"name":"Disruption Bolt","cost":3,"effect":"If Magic Missile targets an Arcane unit, it deals Dark and Holy damage instead of Arcane"},{"name":"Ricochet","cost":5,"effect":"Magic Missile gains 2 Num Targets / Magic Missile bounces up to 2 times to targets in range and line of sight of the target"}]},{"name":"Disperse","cost":2,"tags":"Arcane / Sorcery / Translocation","base":"Teleport all units in a 3 tile radius to random locations / The caster is unaffected","stats":"충전 15 · 사거리 6 · 반경 3","upgrades":[{"name":"Protective Warp","cost":2,"effect":"Disperse gains 3 Shields / Teleported allies gain 3 SH"},{"name":"Void Sickness","cost":2,"effect":"Disperse gains 10 Duration / Teleported enemies receive 10 turns of silence and poison / Adds the Dark tag"},{"name":"Far Sending","cost":3,"effect":"Instead of being randomly teleported, targets are sent as far away from the caster as possible"},{"name":"Violent Warp","cost":6,"effect":"Cast Magic Missile on teleported enemies"}]},{"name":"Blue Lion","cost":5,"tags":"Nature / Holy / Conjuration / Arcane","base":"Summon a Blue Lion","stats":"충전 2 · 사거리 5","upgrades":[{"name":"Holy Bolt","cost":2,"effect":"Blue Lion gains 4 Minion Range / Blue Lion gains a ranged 4 Holy attack"},{"name":"Shimmermane","cost":3,"effect":"Blue Lion can cast your Healing Light on a 7 turn cooldown"},{"name":"Lion Saviors","cost":4,"effect":"Blue Lion gains 3 Num Summons / The first time you fall below 50% HP each level, cast Blue Lion 3 times nearby"},{"name":"Summon Lamasu","cost":9,"effect":"Blue Lion gains 4 Minion Range / Blue Lion gains 5 Radius / Instead of a Blue Lion, summon a Lamasu"}]},{"name":"Arcane Warding","cost":4,"tags":"Arcane / Enchantment","base":"Each turn, gain 3 SH / When enemy ['③ 전투','시작 위치와 한 턴 계산','원거리 적의 위협 범위(T), 시야(L), 상태이상을 확인합니다. 한 행동 뒤 적이 어떻게 대응할지 예상해야 합니다.'],
['④ 성장','전리품과 장비 제작','제작 재료와 보상을 이용해 소환수 강화·보호막·마법 연쇄를 완성합니다. 빌드의 핵심 엔진을 하나씩 연결합니다.'],
['⑤ 마지막 도전','20구역과 최종 전투','후반 특수 보스와 숙적 모르드레드에 대비합니다. 높은 저항력, 보호막, 소환수 제어 등 빌드의 약점 대책이 필요합니다.']
].map(([r,t,a])=>'<section class="step"><div class="stepnum">'+esc(r)+'</div><div><h3>'+esc(t)+'</h3><p>'+esc(a)+'</p></div></section>').join('')+'</div><div class="callout"><b>핵심:</b> 고정된 맵을 빨리 통과하는 게임이 아니라, 내가 상대할 적과 보상을 고르고 그 적을 이길 마법을 설계하는 게임입니다.</div>';
}
if(state.tab==='gear'){
body='<h2>기본 시스템 정리</h2><div class="tablewrap"><table><thead><tr><th>용어</th><th>하는 일</th></tr></thead><tbody>'+[
['주문 포인트 (Spell Points)','새 주문·업그레이드를 구입하는 자원. 무작정 여러 주문에 분산하지 않는 것이 좋습니다.'],
['주문 충전 횟수 (Charges)','한 구역에서 주문을 사용할 수 있는 횟수. 공격 효율과 생존을 함께 고려합니다.'],
['피해 저항력 (Resistance)','속성별 피해 감소. 100% 저항이면 일반적인 해당 속성 공격은 통하지 않을 수 있습니다.'],
['보호막 (Shields)','기본적으로 피해량보다 피격 횟수에 대응하는 방어 자원입니다. 다단 공격에 약할 수 있습니다.'],
['마법 분류·속성 (Tags)','Fire, Ice, Lightning, Arcane, Holy, Dark, Conjuration 등. 주문과 장비의 시너지를 결정합니다.'],
['제작 재료 (Components)','장비의 레시피 슬롯을 채우며, 일부는 줍거나 제작할 때 추가 효과가 발동합니다.'],
['제단 (Shrines)','강화·변환·재료 보상 등 다양한 선택을 제공하는 장소입니다.']
].map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+esc(b)+'</td></tr>').join('')+'</tbody></table></div><h2>빌드의 기본 구성</h2>'+summaryCard('대부분의 빌드에서 필요한 네 역할',['일반 적을 처리하는 주력 공격','여러 적을 한 번에 제어하거나 제거하는 광역 수단','보호막·소환수·순간이동 등 생존 수단','주력 속성 면역 적과 고체력 보스에 대응하는 보조 피해']) ;
}
if(state.tab==='battle'){
body='<h2>처음 플레이한다면</h2>'+summaryCard('실패를 줄이는 다섯 가지 습관',['처음에는 완성형 빌드보다 첫 3구역을 안전하게 통과하는 것이 목표.','균열 선택 전에 적의 위협 범위와 주력 피해의 저항력을 확인.','적을 많이 때리는 행동보다 공격을 덜 받는 행동을 선택.','저렴하게 제작 가능한 보호막·소환 장비를 초반에 활용.','사망 원인을 적 공격·상태이상·위치·면역 중 하나로 기록.'])+'<h2>이 공략집을 보는 순서</h2>'+summaryCard('추천 학습 순서',['① 게임 전체 생존 팁 페이지에서 T키·균열·제작 확인','② 고룡의 알 또는 슬라임 군단으로 초반 생존 연습','③ 빌드별 구역 루트와 체크리스트에 따라 플레이','④ 중후반에는 보스·저항력 대책만 추가해 엔딩 도전'])+'<div class="note">도움이 필요하면 페이지 상단의 목차 열기에서 생존 팁과 빌드를 선택하세요. 구매한 항목 체크는 현재 브라우저 저장소에만 남습니다.</div>';
}
return intro+body+renderSources([['Steam 공식 상점·게임 설명','https://store.steampowered.com/app/4366330/Rift_Wizard_3/'],['개발자 발표·패치 노트','https://steamcommunity.com/app/4366330/allnews/'],['마법·장비 정보 검색','https://hpp3.github.io/rw3/']])+renderFooter();
}
function tipsPage(){let t=D.tips;let intro='<div class="kicker">기본 가이드 · 공통 생존 전략</div><h1>📘 게임 전체 생존 팁</h1><p class="lede">모든 빌드에 공통으로 적용되는 생존 기술입니다. 먼저 시작 위치와 위협 범위부터 확인하면 빌드 완성 전 사망을 줄일 수 있습니다.</p>'+renderTabs(tipTabs);let body='';
if(state.tab==='overview'){body='<div class="callout"><b>초반의 목표는 ‘빌드 완성’이 아니라 ‘다음 한 턴 살아남기’입니다.</b><br>매 턴: 위험 범위 확인 → 위험한 적 제거/제어 → 안전한 위치 확보 순서로 판단하세요.</div><div class="tipgrid">'+t.principles.map(([em,title,desc])=>'<section class="card"><span class="em">'+em+'</span><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></section>').join('')+'</div>'}
if(state.tab==='route'){body='<h2>1–5구역 행동 루틴</h2><div class="timeline">'+t.opening.map(([r,title,desc])=>'<section class="step"><div class="stepnum">'+r+'</div><div><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></div></section>').join('')+'</div><h2>실전 위험도 체크</h2>'+summaryCard('첫 턴에 반드시 할 일',['적을 클릭/호버하고 공격 범위·상태이상·저항력을 확인한다.','T로 적 위협 범위를 확인하고 가장 안전한 시작 타일을 고른다.','이번 턴에 즉시 위험한 적 한 마리 또는 여러 마리를 제거할 수 있는지 본다.','한 턴 공격받을 피해가 치명적이라면 공격 대신 이동·소환·빙결·보호막을 선택한다.'])}
if(state.tab==='gear'){body='<h2>위험한 적 유형</h2><div class="tablewrap"><table><thead><tr><th>유형</th><th>원문 / 예시</th><th>대응</th></tr></thead><tbody>'+t.enemies.map(x=>'<tr>'+x.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><h2>제작 재료·장비 기본</h2><div class="cards">'+t.materials.map(([a,b])=>'<section class="card"><h3>'+esc(a)+'</h3><p>'+esc(b)+'</p></section>').join('')+'</div><div class="note">SP는 강한 주문 하나에 전부 쓰기보다, 현재 부족한 역할(광역/단일/방어/이동)을 먼저 점검하세요. 장비가 제작되면 즉시 효과를 확인하세요.</div>'}
if(state.tab==='battle'){body='<h2>주요 후반 보스 유의점</h2><div class="tablewrap"><table><thead><tr><th>보스</th><th>대응 핵심</th></tr></thead><tbody>'+t.bosses.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</tbody></table></div>'+checkRows('tips',t.checklist)}
return intro+body+renderSources(Object.values({db:sourcesFallback('db'),steam:sourcesFallback('steam')}))+renderFooter();}
function sourcesFallback(k){return ({db:['Rift Wizard 3 Compendium','https://hpp3.github.io/rw3/'],steam:['Steam 빌드 가이드','https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466']})[k]}
function buildPage(b){let intro='<div class="kicker">'+esc(b.group)+' · 난이도 '+esc(b.level)+'</div><h1>'+b.icon+' '+esc(b.title)+'</h1><p class="lede">'+esc(b.tagline)+'</p><div class="chiprow"><span class="chip">'+esc(b.level)+'</span><span class="chip good">마법·장비 영문 병기</span><span class="chip">구역별 목표</span></div>'+renderTabs(tabs);let body='';
if(state.tab==='overview'){body='<section class="summary"><b>🎯 빌드의 작동 원리</b><p>'+esc(b.idea)+'</p></section><h2>지금 바로 시작하는 순서</h2>'+checkRows(b.id+'-first',b.first)+'<div class="note"><b>근거 구분:</b> '+esc(b.evidence)+'</div>'+summaryCard('이 빌드의 특징',[b.tagline, b.level==='★☆☆'?'초보자용 생존과 전투 연습에 적합':'초반 구역에서 생존·SP 관리를 먼저 확인', '게임 패치에 따라 일부 자동 시전/업그레이드 조건이 다를 수 있음'])}
if(state.tab==='route'){body='<h2>초반부터 최종 보스까지</h2><div class="timeline">'+b.phases.map(p=>'<section class="step"><div class="stepnum">'+esc(p.range)+'</div><div><h3>'+esc(p.target)+'</h3>'+list(p.actions)+'</div></section>').join('')+'</div><div class="note">구역별 목표는 별도 표기가 없는 한 해외 공략을 바탕으로 재구성한 <b>추천 진행안</b>입니다. SP·재료 운에 따라 몇 구역 늦어져도 생존을 우선하세요.</div>'}
if(state.tab==='gear'){body='<h2>필수·추천 주문</h2><div class="tablewrap"><table><thead><tr><th>주문 (원문)</th><th>업그레이드</th><th>목적</th><th>우선</th></tr></thead><tbody>'+b.spells.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.up)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.priority)+'</td></tr>').join('')+'</tbody></table></div><h2>추천 장비</h2><div class="tablewrap"><table><thead><tr><th>장비 (원문)</th><th>이유</th><th>시점</th></tr></thead><tbody>'+b.gear.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.priority)+'</td></tr>').join('')+'</tbody></table></div><div class="note">특정 제작식/재료 태그/장비 가격을 검증하지 않은 항목은 억지로 채우지 않았습니다. 아래 Compendium에서 영문명을 검색해 실제 게임 버전과 대조하세요.</div>'+(b.craftNotes?summaryCard('제작 재료·장비 슬롯 안내',b.craftNotes):'')+''}
if(state.tab==='battle'){body=summaryCard('한 전투의 추천 순서',b.rotation)+(b.auto?summaryCard('자동 시전·연쇄 발동 조건',b.auto):'')+summaryCard('자주 실패하는 이유',b.pitfalls)+summaryCard('보스와 면역 대응',b.boss)+(b.variants.length?summaryCard('대체·변칙 운영',b.variants):'')+checkRows(b.id+'-battle',[...b.rotation.map((x,i)=>'전투 순서 '+(i+1)+': '+x)])}

if(state.tab==='overview'&&b.engine){body+=summaryCard('확인된 연계와 문서의 검증 수준',[b.engine.core,'검증 수준: '+b.engine.proof,'가장 중요한 실패 조건: '+b.engine.risk])+summaryCard('핵심 장비가 없을 때',b.fallbacks)}
if(state.tab==='route'&&b.purchase){body+='<h2>구매 순서와 단계별 비용 확인</h2>'+summaryCard('중간 점검',[b.purchase.filter(x=>x.kind==='spell').slice(0,3).map(x=>x.name+' '+x.cost+'SP').join(' → '),'이 단계가 막히면: '+b.fallbacks[0], '최종 보스 대비: '+(b.boss.at(-1)||'속성 면역·보호막 확인')])}
if(state.tab==='gear'&&b.verifiedGear){body+='<h2>실제 제작 속성·효과 검증</h2><div class="tablewrap"><table><thead><tr><th>장비 · 슬롯</th><th>제작식</th><th>데이터상 발동 효과</th></tr></thead><tbody>'+b.verifiedGear.map(g=>'<tr><td>'+esc(g.name)+'<div class="note">'+esc(g.slot)+'</div></td><td>'+esc(g.recipe)+' <small>('+g.cost+'태그)</small></td><td>'+esc(g.effect)+'</td></tr>').join('')+'</tbody></table></div>'}
if(state.tab==='plan'){body='<h2>실전 구매 순서 · SP 비용</h2><p class="lede">검증된 게임 데이터에 적힌 주문 및 업그레이드 비용으로 구성한 권장 루트입니다. 기존 설명의 선택형 업그레이드를 모두 사는 목록이 아닙니다.</p><div class="tablewrap"><table><thead><tr><th>순서</th><th>구매할 주문/업그레이드</th><th>SP</th><th>실제 효과·목적</th></tr></thead><tbody>'+b.purchase.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.kind==='upgrade'?x.forSpell+' → '+x.name:x.name)+'</td><td>'+x.cost+'</td><td>'+esc(x.reason)+'</td></tr>').join('')+'</tbody></table></div><p class="note">위 핵심 구매에 사용하는 SP 합계: '+b.purchaseCost+'SP (구역별 SP 수급·방어용 선택 주문·장비 제외). '+esc(b.purchaseDisclaimer)+'</p><h2>주문 원문 데이터 · 업그레이드 선택</h2>'+b.verifiedSpells.map(s=>'<section class="card flat"><h3>'+esc(s.name)+' <small>Lv '+s.cost+'</small></h3><p>'+esc(s.stats)+'</p><p>'+esc(s.base)+'</p><div class="tablewrap"><table><thead><tr><th>업그레이드</th><th>비용</th><th>실제 효과</th></tr></thead><tbody>'+s.upgrades.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+u.cost+'SP</td><td>'+esc(u.effect)+'</td></tr>').join('')+'</tbody></table></div></section>').join('')+'<h2>재료·장비가 없을 때 대안</h2>'+summaryCard('제작 목표와 대체 경로',b.craftNotes)+'<h2>실전 제약과 검증 근거</h2>'+summaryCard('반드시 확인',[b.engine.proof,'주문 최대 10개, 각 주문의 업그레이드 최대 2개.','베타/메인 패치 수치는 실제 게임 툴팁 우선.',...b.fallbacks])}
return intro+body+renderSources(b.sources)+renderFooter();}
function render(){renderNav();let b=D.builds.find(x=>x.id===state.id);$('appBody').innerHTML=state.id==='intro'?introPage():state.id==='tips'?tipsPage():buildPage(b);document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>go(state.id,el.dataset.tab));document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.check]=el.checked;saveChecks();let pageY=window.scrollY;render();window.scrollTo(0,pageY)});document.querySelectorAll('[data-reset]').forEach(el=>el.onclick=()=>{for(let key of Object.keys(state.checks))if(key.startsWith(el.dataset.reset+':'))delete state.checks[key];saveChecks();render()});$('sidebarToggle').textContent=state.closed?'☰ 목차 열기':'☰ 목차 접기';$('sidebarToggle').setAttribute('aria-expanded',String(!state.closed));}
function closeSidebar(){state.closed=true;$('sidebar').classList.add('closed');$('shade').classList.add('hidden');render();}
function openSidebar(){state.closed=false;$('sidebar').classList.remove('closed');$('shade').classList.toggle('hidden',innerWidth>820);render();}
$('sidebarToggle').onclick=()=>state.closed?openSidebar():closeSidebar();$('sideClose').onclick=closeSidebar;$('shade').onclick=closeSidebar;$('search').oninput=e=>{state.q=e.target.value;renderNav()};$('theme').onclick=()=>{setTheme(state.theme==='light'?'dark':'light');render()};$('share').onclick=async()=>{let url=location.href;try{await navigator.clipboard.writeText(url);$('share').textContent='✓ 복사됨';setTimeout(()=>$('share').textContent='🔗 링크',1300)}catch{prompt('현재 페이지 주소',url)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.closed)closeSidebar();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();openSidebar();$('search').focus()}});window.addEventListener('hashchange',()=>{hashRead();render()});hashRead();render();
if(innerWidth<=820){closeSidebar()}
</script>
</body></html>
