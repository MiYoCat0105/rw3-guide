<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;color-scheme:light;--bg:#f5f6f8;--surface:#fff;--surface2:#f1f4f7;--line:#dbe0e7;--text:#17212e;--muted:#657282;--accent:#3666c8;--accentbg:#eaf1ff;--green:#187d59;--shadow:0 10px 36px #15233c12}
[data-theme="dark"]{color-scheme:dark;--bg:#111823;--surface:#1b2634;--surface2:#243244;--line:#344456;--text:#ecf2f9;--muted:#aab8c8;--accent:#8cb5ff;--accentbg:#293e60;--green:#74dab3;--shadow:0 8px 28px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.65}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:row}.main{min-width:0;flex:1;transition:margin .2s}.content{max-width:980px;padding:33px 40px 100px;margin:0 auto}.top{position:sticky;top:0;z-index:5;padding:10px 24px;background:color-mix(in srgb,var(--surface) 96%,transparent);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px)}.brand{font-weight:800;font-size:15px;white-space:nowrap}.top small{color:var(--muted);white-space:nowrap}.top .push{flex:1}.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:8px 12px;font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.tabs{display:flex;gap:7px;flex-wrap:wrap;position:relative;margin:22px 0 26px}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 13px;font-weight:650}.tabs button[aria-selected=true]{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}.side{width:286px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--line);background:var(--surface);transition:width .22s,transform .22s;z-index:7;scrollbar-width:thin}.side.closed{width:0;border:0;overflow:hidden}.sideInner{width:285px;padding:18px 16px 26px}.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.shead h2{margin:0;font-size:16px}.side button.iconbtn,.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;width:33px;height:33px;display:grid;place-items:center}.search{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;outline-offset:2px}.search:focus{outline:2px solid var(--accent)}.sgroup{margin-top:20px}.sgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;padding-left:8px}.navitem{width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:flex-start}.navitem:hover{background:var(--surface2)}.navitem.active{background:var(--accentbg);color:var(--accent);font-weight:750}.navitem .emoji{font-size:18px;line-height:1.2}.navitem .ntext{font-size:13px;line-height:1.38}.navitem .desc{display:block;color:var(--muted);font-size:11px;font-weight:450;margin-top:3px}.sideNote{margin:25px 8px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:14px}.kicker{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.02em;margin-bottom:8px}h1{font-size:clamp(26px,4.5vw,38px);letter-spacing:-.04em;line-height:1.28;margin:0 0 12px}h2{font-size:21px;letter-spacing:-.025em;margin:28px 0 12px}h3{font-size:16px;margin:20px 0 8px}p{margin:10px 0 15px}.lede{color:var(--muted);font-size:15px;max-width:850px}.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{background:var(--surface2);border:1px solid var(--line);padding:3px 10px;border-radius:50px;font-size:12px;color:var(--muted);font-weight:650}.chip.good{color:var(--green)}.card{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:19px;margin-bottom:13px;box-shadow:var(--shadow)}.card.flat{box-shadow:none}.card h3{margin-top:0}.card p:last-child{margin-bottom:0}.summary{border-left:4px solid var(--accent);padding:18px 20px;border-radius:0 13px 13px 0;background:var(--surface)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cards .card{margin:0;box-shadow:none}.step{display:flex;gap:15px;margin:0;padding:18px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.stepnum{width:76px;flex-shrink:0;text-align:center;background:var(--surface2);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:850;height:max-content}.step h3{margin:0 0 6px;font-size:16px}.step p{margin:4px 0}.step ul{margin:6px 0 0;padding-left:20px}.step li{margin-bottom:5px}.cleanlist{padding-left:22px}.cleanlist li{margin:7px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:15px 0}table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}th,td{padding:12px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:750;background:var(--surface2)}tr:last-child td{border-bottom:0}td:first-child{font-weight:700;min-width:160px}.note{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px;color:var(--muted);margin:15px 0}.timeline{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 18px}.checkline{display:flex;align-items:flex-start;gap:11px;padding:11px 3px;border-bottom:1px solid var(--line);cursor:pointer}.checkline:last-child{border:0}.checkline input{width:17px;height:17px;accent-color:var(--accent);margin-top:4px}.checkline span{flex:1}.progress{height:7px;border-radius:100px;background:var(--surface2);overflow:hidden;margin:8px 0 17px}.fill{height:100%;background:var(--green);width:0;transition:width .2s}.flexbetween{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.source a{display:inline-block;color:var(--accent);text-decoration:none;font-weight:650;margin:0 12px 8px 0}.source a:hover{text-decoration:underline}.footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px;margin-top:35px}.empty{text-align:center;color:var(--muted);padding:28px}.tipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tipgrid .card{box-shadow:none;margin:0}.tipgrid .em{font-size:23px}.callout{margin:20px 0;background:var(--accentbg);color:var(--text);padding:15px 18px;border-radius:12px}.toggleFloat{display:none}.mobileShade{display:none}.jump{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;margin-top:22px}a{color:var(--accent)}
@media(max-width:820px){.content{padding:25px 18px 80px}.top{padding:9px 12px}.top small{display:none}.side{position:fixed;right:0;top:0;box-shadow:-18px 0 40px #0003;transform:translateX(0)}.side.closed{width:286px;transform:translateX(110%);border-left:1px solid var(--line)}.mobileShade{display:block;position:fixed;inset:0;background:#0007;z-index:6}.mobileShade.hidden{display:none}.btn.widehide{display:none}.cards,.tipgrid{grid-template-columns:1fr}.stepnum{width:64px}}
@media print{body{background:white;color:black}.top,.side,.tabs,.jump,.btn,.sideNote{display:none!important}.content{max-width:100%;padding:0} .card{break-inside:avoid;box-shadow:none}.step{break-inside:avoid}.pageBreak{break-before:page}}
</style>

<body><div class="app"><main class="main"><header class="top"><span class="brand">⚔️ RW3 생존·빌드 공략집</span><small>대화 요약본</small><span class="push"></span><button class="btn widehide" id="theme" title="화면 테마 변경">◐ 테마</button><button class="btn" id="share" title="현재 페이지 주소 복사">🔗 링크</button><button class="btn primary" id="sidebarToggle" aria-expanded="true">☰ 목차 접기</button></header><div id="appBody" class="content"></div></main><div id="shade" class="mobileShade hidden"></div><aside class="side" id="sidebar"><div class="sideInner"><div class="shead"><h2>📚 페이지 목차</h2><button class="iconbtn" id="sideClose" aria-label="목차 닫기">✕</button></div><input id="search" class="search" aria-label="빌드 검색" placeholder="🔍 빌드·마법 검색  /" autocomplete="off"><div id="nav"></div><div class="sideNote">각 빌드는 <b>개요 / 성장 순서 / 주문·장비 / 전투·대응</b>으로 구분됩니다. 체크 상태는 이 브라우저에만 저장됩니다.</div></div></aside></div>
<script>
const D = {"builds":[{"id":"wyrm","icon":"🥚","title":"고룡의 알 · 드레이크 탑승","group":"입문 추천","level":"★★☆","tagline":"소환수로 버티며 반복 소환을 완성하는 첫 엔딩 후보","idea":"고룡의 알(Wyrm Eggs)을 확보한 뒤 용을 전개하고, 드레이크 탑승(Ride Drake)·용들의 비행(Flight of the Dragons)·드래곤 사냥꾼의 인장(Dragon Hunter’s Sigil)을 연결해 소환 전력을 유지한다. 후반에는 마법사 소환(Summon Wizard)으로 화력을 보완한다.","first":["1구역: 저비용 공격 1개로 안전하게 시작. 늑대(Wolf)는 안전형 선택이지만 알 구매가 늦어진다.","2~3구역: 불필요한 주문 구매를 줄이고 고룡의 알(Wyrm Eggs) 구매 자금 확보.","3~5구역: 고룡의 알 구매 후 알이 부화할 시간을 확보하고 마법사는 후방 유지.","장비는 얼음 소환사(Ice Caller)·양치기의 지팡이(Shepherd’s Staff)처럼 제작 가능한 것을 먼저 사용."],"phases":[{"range":"1–3","target":"기본 생존·SP 저축","actions":["저비용 공격 하나로 약한 균열을 선택한다.","각 맵 시작 전에 위협 범위(T)를 확인하고 소환수나 벽 뒤에서 한 턴을 벌어준다.","고룡의 알 구매를 목표로 SP를 보유한다."]},{"range":"3–5","target":"고룡의 알 확보","actions":["고룡의 알(Wyrm Eggs)을 구매한다(3구역 목표는 빠른 기록, 4~5구역도 괜찮음).","알이 부화하기 전에 맞아 죽지 않도록 적의 원거리 공격을 제거하거나 시야를 끊는다.","알을 플레이어와 적 사이에 소환하되 광역 공격 한 번에 같이 맞지 않도록 한다."]},{"range":"6–10","target":"소환 유지력","actions":["얼음 소환사(Ice Caller) 또는 양치기의 지팡이(Shepherd’s Staff) 중 가능한 장비를 먼저 제작한다.","고룡 영혼 갑옷(Wyrm Spirit Armor)을 노리되 재료가 안 나오면 기다리지 않는다.","알/드래곤이 전장에 유지되는 시간을 늘리고 주문 충전 관리에 익숙해진다."]},{"range":"11–15","target":"반복 소환 엔진","actions":["드레이크 탑승(Ride Drake)과 용들의 비행(Flight of the Dragons)을 확보한다.","드래곤 사냥꾼의 인장(Dragon Hunter’s Sigil)을 제작 목표로 둔다.","용들의 비행은 패치 이후 직접 시전 조건에 주의한다.","회피 기동(Evasive Maneuvers)을 생존에 필요한 시점에 확보한다."]},{"range":"16–21","target":"보스 대처 및 마법사 군단","actions":["마법사 소환(Summon Wizard)·용 마법사(Dragon Wizard)·마법사 군단(Wizard Gang)으로 보조 공격을 마련한다.","냉기·화염에 면역인 보스용 물리/다른 유형의 피해를 확인한다.","소환수만 많고 보스 체력이 줄지 않는 상황이면 소환 추가보다 저항력 대책을 우선한다."]}],"spells":[{"name":"고룡의 알 (Wyrm Eggs)","up":"빛나는 알(Radiant Eggs) 등은 선택","reason":"핵심 소환원","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"용들의 비행 (Flight of the Dragons)","reason":"드래곤 추가 소환과 탑승 연계","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"회피 기동 (Evasive Maneuvers)","reason":"소환형의 방어 안정화","priority":"필수"},{"name":"마법사 소환 (Summon Wizard)","up":"용 마법사(Dragon Wizard), 마법사 군단(Wizard Gang)","reason":"엔딩용 마법 공격 보완","priority":"후반"}],"gear":[{"name":"얼음 소환사 (Ice Caller)","reason":"초중반 알/냉기 소환 보완","priority":"초중반"},{"name":"양치기의 지팡이 (Shepherd’s Staff)","reason":"소환수 전개 보조","priority":"초중반"},{"name":"고룡 영혼 갑옷 (Wyrm Spirit Armor)","reason":"드래곤 계열 지속력과 방어 강화","priority":"중후반"},{"name":"드래곤 사냥꾼의 인장 (Dragon Hunter’s Sigil)","reason":"반복 소환의 핵심 장비","priority":"후반 핵심"},{"name":"요정 판금 (Fae Plate)","reason":"본체의 지속 보호막","priority":"안전"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환 능력 보강","priority":"선택"}],"rotation":["위협 범위를 확인하고 안전한 시작 위치를 고른다.","알을 전방에 생성하고, 마법사는 광역 공격의 직선·범위에서 벗어난다.","부화한 용이 공격하는 동안 위협적인 원거리/상태이상 적만 직접 처리한다.","드레이크 탑승 이후 용들의 비행으로 소환 전력을 보충한다.","고체력 보스는 마법사 소환과 별도 피해 수단으로 마무리한다."],"pitfalls":["초반부터 늑대·보조 주문을 너무 많이 구매하면 고룡의 알 구매가 지연된다.","알이 부화하기 전까지 무방비일 수 있으니 원거리 공격이 겹치는 맵을 피한다.","고룡 영혼 갑옷이 없다고 진행을 중단하지 않는다.","드래곤 사냥꾼 인장의 정확한 발동 조건과 용들의 비행의 직접 시전 조건을 현 버전에서 확인한다."],"boss":["20구역 개구리 교황: 한 턴 피해 제한 때문에 장기 소환/생존이 중요.","눈의 여왕·아마루: 냉기/화염 면역에 주의해 다른 유형 공격 확보.","모르드레드: 소환수만 늘리기보다 본체에게 유효 피해가 들어가는지 먼저 확인."],"variants":["안전 스타트: 늑대(Wolf) + 고룡의 알. 구매 시점이 늦어지는 대신 초반 탱킹에 유리.","빠른 스타트: 저비용 공격만 구매하고 3구역 고룡의 알 목표."],"evidence":"일본 플레이어의 실제 엔딩 승리 기록 기반. 1~3구역 세부 안전 스타트는 재구성.","sources":[["일본 플레이어 실제 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"slime","icon":"🟢","title":"슬라임 군단 · 재생 오라","group":"입문 추천","level":"★☆☆","tagline":"느리지만 소환수가 대신 맞아주는 안정형","idea":"슬라임 형태(Slime Form)로 아군 숫자를 늘리고 재생 오라(Regeneration Aura)로 전열을 회복시킨다. 흡혈의 시선(Vampiric Gaze)으로 본체의 지속 전투 능력을 보완한다.","first":["1~2구역: 저비용 주문/소환수로 생존하며 SP 모으기.","3~5구역: 슬라임 형태(Slime Form) 확보.","5~8구역: 재생 오라(Regeneration Aura)로 유지력 강화.","8~11구역: 흡혈의 시선(Vampiric Gaze)과 방어 장비 확보."],"phases":[{"range":"1–3","target":"준비","actions":["기본 공격 또는 늑대 소환으로 앞라인을 만든다.","가능하면 소환/방어 관련 장비를 우선 만든다."]},{"range":"4–7","target":"슬라임 양산","actions":["슬라임 형태를 확보해 아군이 적의 공격을 나눠 받게 한다.","재생 오라를 확보해 손상된 전열을 회복한다."]},{"range":"8–12","target":"지속전","actions":["흡혈의 시선과 비전 방호를 보완한다.","재생 점액(Regenerative Goop)으로 회복 효과의 시너지를 노린다."]},{"range":"13–17","target":"군단 강화","actions":["죽음 저항(Death Defiance) 등 소환수 생존 업그레이드 고려.","본체가 직접 맞는 일이 없도록 위치·시야를 관리한다."]},{"range":"18–21","target":"보스 준비","actions":["슬라임과 다른 피해 속성을 가진 직접 공격 추가.","고체력·높은 물리저항 보스를 대비해 저항력 감소 및 집중 피해 확보."]}],"spells":[{"name":"슬라임 형태 (Slime Form)","up":"슬라임 생성","reason":"전열과 어그로 분산","priority":"필수"},{"name":"재생 오라 (Regeneration Aura)","up":"재생 점액(Regenerative Goop)","reason":"피해를 입은 아군의 회복","priority":"필수"},{"name":"재생 오라 (Regeneration Aura)","up":"죽음 저항(Death Defiance)","reason":"소환수의 생존 보조","priority":"후반"},{"name":"흡혈의 시선 (Vampiric Gaze)","up":"기본 효과","reason":"후방에서 공격·회복","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"기본 효과","reason":"본체 보호막","priority":"선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"자연 지팡이 (Nature Staff)","reason":"자연 속성 증강","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환 전력 강화","priority":"선택"},{"name":"위기 부적 (Crisis Charm)","reason":"급사 방지","priority":"안전"}],"rotation":["슬라임을 먼저 생성한 후 본체가 한 발짝 물러난다.","오라 효과 범위에 전열을 유지한다.","적 소환사·강력한 원거리 몬스터는 흡혈의 시선으로 따로 처치한다.","소환수가 잘 버티는 동안 추가 슬라임을 준비한다."],"pitfalls":["광역 공격이 플레이어와 슬라임을 함께 맞추지 않게 한다.","슬라임 수만 늘리고 보스 화력이 부족할 수 있다.","소환수가 많아지면 턴 진행이 느려질 수 있다."],"boss":["보스에게 슬라임 공격이 통하는지 확인.","슬라임 물량만으로 피해가 부족하면 다른 속성 공격·저항력 감소를 확보한다."],"variants":["회색 점액(Gray Goo) + 방어구 용해기(Armor Melter) 기반 물리 저항력 감소 변형."],"evidence":"스팀 초중반 생존 사례 기반. 이 정확한 세 주문 조합으로 엔딩 클리어는 검증되지 않음.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"chain","icon":"⚡","title":"연쇄 번개 · 폭풍 드래곤","group":"핵심 빌드 1–4","level":"★★☆","tagline":"드래곤에게 번개를 맡기는 자동 포격","idea":"연쇄 번개(Chain Lightning)와 폭풍 드래곤(Storm Drake)을 조합한다. 용 마법사(Dragon Mage)로 소환수가 직접 연쇄 번개를 사용하게 하며, 번개 보호막(Lightning Shield)으로 방어까지 담당한다.","first":["1구역: 번개 화살(Lightning Bolt).","2구역: 폭풍 드래곤(Storm Drake).","3구역: 연쇄 번개(Chain Lightning).","4구역: 번개 보호막(Lightning Shield).","5구역: 용 마법사(Dragon Mage).","7구역 목표: 폭풍 소환(Storm Summoning)."],"phases":[{"range":"1–2","target":"드래곤 확보","actions":["번개 화살로 직선의 적을 함께 공격한다.","드래곤이 살아남을 위치에 소환한다."]},{"range":"3–5","target":"자동 번개","actions":["연쇄 번개 → 번개 보호막 → 용 마법사 순서로 연결한다.","드래곤이 주문을 쓰는 시간을 벌어준다."]},{"range":"6–10","target":"확장","actions":["폭풍 소환(Storm Summoning) 확보.","뇌우의 비(Rain of Thunderbolts)를 목표로 한다."]},{"range":"11–15","target":"자동 생산","actions":["폭풍 드래곤 생성(Tempest Drakes)·폭풍 신호기(Storm Beacon)로 소환 효율을 높인다.","갈바닉 집중 장치 등 저항력 감소 수단 확보."]},{"range":"16–21","target":"후반 대책","actions":["비번개 속성/물리 공격 보조.","보호막 장비와 순간이동으로 본체 보호.","소환수가 제어되거나 훔쳐지는 적을 조심한다."]}],"spells":[{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"초반 공격","priority":"필수"},{"name":"폭풍 드래곤 (Storm Drake)","up":"용 마법사(Dragon Mage)","reason":"자동 번개 공격","priority":"필수"},{"name":"연쇄 번개 (Chain Lightning)","up":"번개 보호막(Lightning Shield)","reason":"아군 보호막 생성 및 적 연쇄 공격","priority":"필수"},{"name":"연쇄 번개 (Chain Lightning)","up":"구름 전도(Cloud Conductance)","reason":"구름 연쇄를 활용하는 변형","priority":"선택"},{"name":"폭풍 소환 (Storm Summoning)","up":"기본","reason":"소환 전력 확대","priority":"필수"},{"name":"뇌우의 비 (Rain of Thunderbolts)","up":"폭풍 드래곤 생성(Tempest Drakes)","reason":"후반 대량 소환","priority":"후반"}],"gear":[{"name":"번개 지팡이 (Lightning Staff)","reason":"번개 주문 강화","priority":"초중반"},{"name":"갈바닉 집중 장치 (Galvanic Focus)","reason":"번개 저항력 대응","priority":"중반"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"드래곤 강화","priority":"선택"},{"name":"폭풍 신호기 (Storm Beacon)","reason":"후반 소환 가속","priority":"후반"}],"rotation":["시야가 안전한 곳에서 폭풍 드래곤을 소환한다.","연쇄 번개를 사용해 밀집한 적을 타격하고 아군에 보호막을 제공한다.","용 마법사로 드래곤이 자동으로 연쇄 번개를 사용하게 한다.","폭풍을 이용해 소환을 확장하고, 본체는 위험한 적만 직접 제거한다."],"pitfalls":["초반 용 마법사 이전까지는 화력이 낮아 사망할 수 있다.","번개 저항력 100% 적이 많은 균열은 선택하지 않는다.","보호막을 무조건 생성하는 게 아니라 아군 연결·배치가 중요하다."],"boss":["전기의 육체(Body Electric): 직접 대상 주문 반격 주의.","아마루 등 번개만으로 어려운 적은 소환수 물리/다른 유형 피해 필요."],"variants":["구름 전도(Cloud Conductance) 중심 번개 구름 빌드.","연쇄 화염구(Chain Fireball)로 화염 피해를 연계하는 혼합형."],"evidence":"THEKI 트라이얼 1~7구역 구매 흐름과 해외 클리어 사례를 참고.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"fire","icon":"🔥","title":"화염 · 저주 · 불기둥","group":"핵심 빌드 1–4","level":"★★★","tagline":"화염구 1종으로 초반을 넘기고, 방어를 갖춘 다음 불기둥 연쇄를 완성","idea":"초반에는 화염구(Fireball) 한 종류로 광역 처치를 담당하고 SP를 방어·핵심 주문에 집중한다. 비전 방호(Arcane Ward) 또는 요정 판금(Fae Plate)으로 피격을 줄인 다음, 불기둥(Pillar of Fire)으로 체력이 낮은 적을 처치해 절멸의 기둥(Pillar of Annihilation)을 연쇄 발동한다. 중후반 화염·번개 저주(Pyrostatic Curse)와 저항력 융해(Resistance Melting)로 저항력에 대응한다. 화염 폭발·고급 제작 장비는 필수 선행 조건이 아니라 여유가 있을 때 강화하는 선택지다.","first":["1구역: 화염구(Fireball) 1종으로 시작. 여러 적을 함께 맞히고, 약한 적 1마리에게 남은 충전을 낭비하지 않는다.","2~3구역: 화염구 외 공격 주문을 연달아 구매하지 말고 SP를 모은다. 원거리·상태이상 적이 적은 균열을 고른다.","3~5구역: 요정 판금(Fae Plate)을 제작할 수 있으면 우선 검토; 재료가 없다면 비전 방호(Arcane Ward)를 방어 1순위로 고려한다. 둘 다 없다면 벽·시야·시작 위치로 버틴다.","5~8구역: 불기둥(Pillar of Fire)을 확보해 강한 원거리 적을 제거한다. 광역 범위에 자기 자신이 들어가는지 반드시 확인한다.","8~11구역: 낮은 체력 적 처치가 가능하면 절멸의 기둥(Pillar of Annihilation)을, 화염 저항·보호막이 문제면 교란의 불꽃(Disrupting Flames)을 먼저 택한다.","11~15구역: 화염·번개 저주(Pyrostatic Curse) → 저항력 융해(Resistance Melting). 절멸 연쇄가 안정적이면 파이로스태틱 혼돈(Pyrostatic Chaos)으로 확장한다.","후반: 순간이동(Teleport)·추가 방어·비화염 공격을 보강한다. 정화자(The Purifier)나 화산의 창(Volcanic Lance)은 재료가 갖춰질 때만 연계한다."],"phases":[{"range":"1–2","target":"최소 주문으로 안정화","actions":["화염구(Fireball)는 다수 적을 맞히는 위치에서 사용하고, 시야를 끊어 적을 나눠 상대한다.","SP를 화염 폭발·추가 광역기에 바로 투자하지 않는다. 화염 저항 적이 많은 균열은 피한다.","첫 구역부터 안전한 시작 타일을 정하고 적 소환사·장거리 상태이상 적을 먼저 처리한다."]},{"range":"3–5","target":"방어 1개 + SP 확보","actions":["재료가 허용하면 요정 판금(Fae Plate), 아니면 비전 방호(Arcane Ward) 등 방어 수단 한 개를 먼저 확보한다.","즉시 제작 가능한 방어 장비가 있다면 보호 주문 구매를 뒤로 미뤄 SP를 아낀다.","화염구 충전이 부족하거나 저항 적을 피할 수 없을 때에만 보조 공격을 추가한다."]},{"range":"5–8","target":"불기둥으로 위협 제거","actions":["불기둥(Pillar of Fire) 확보 시점은 SP에 따라 조정한다. 먼저 강한 적을 제거하는 단일 결정타로 사용한다.","불기둥은 사용 횟수가 적고 자기 피격 위험이 있으므로, 마법사가 범위 밖에 있는지 확인한다.","불기둥만으로 모든 적을 처리하려 하지 말고 남은 적은 화염구로 정리한다."]},{"range":"8–11","target":"첫 번째 연쇄 완성","actions":["체력이 낮은 적을 불기둥으로 처치해 절멸의 기둥(Pillar of Annihilation)을 연쇄시킨다.","보호막·화염 저항이 발목을 잡으면 절멸보다 교란의 불꽃(Disrupting Flames)을 먼저 구입한다.","연쇄 발동에 실패해도 바로 죽지 않도록 보호막과 벽 뒤 후퇴 위치를 준비한다."]},{"range":"11–16","target":"저주·장비는 선택적으로 확대","actions":["화염·번개 저주(Pyrostatic Curse)에 저항력 융해(Resistance Melting)를 연결해 화염·번개 저항 적을 상대한다.","절멸이 안정적으로 발생하는 경우에만 파이로스태틱 혼돈(Pyrostatic Chaos)을 추가한다.","정화자(The Purifier)가 있으면 화염 폭발(Flame Burst)의 밝은 화염(Bright Flame) 연계를 고려하고, 장비가 없다면 해당 추가 지출은 미룬다.","방어가 부족하면 화력 주문보다 순간이동(Teleport)이나 비전 방호 보강을 우선한다."]},{"range":"17–21","target":"보스용 지속전","actions":["화염 속성 저항 외에도 Sorcery/Enchantment 주문 유형 면역이 있는지 확인하고 별도 피해 수단을 마련한다.","불기둥 충전이 부족한 긴 보스전은 충전 보조 장비·저주·다른 피해 유형으로 대응한다.","모르드레드전에서는 연쇄 시작용 약한 적이 없을 수도 있으므로 단일 대상 지속 피해와 본체 생존을 함께 준비한다."]}],"spells":[{"name":"화염구 (Fireball)","up":"혼돈 화염구(Chaos Ball)는 저항 적 대처가 필요할 때만","reason":"첫 1~5구역의 기본 공격. 다수 적 동시 처리에 사용","priority":"시작 필수"},{"name":"비전 방호 (Arcane Ward)","up":"기본 효과로도 충분; 방어 장비가 없을 때 우선","reason":"불기둥 연쇄가 완성되기 전 급사 방지","priority":"초반 생존"},{"name":"불기둥 (Pillar of Fire)","up":"절멸의 기둥 (Pillar of Annihilation)","reason":"처치 성공 시 추가 절멸 주문으로 화력 확대","priority":"핵심"},{"name":"불기둥 (Pillar of Fire)","up":"교란의 불꽃 (Disrupting Flames)","reason":"보호막·화염 저항 적이 막힐 때 우선 구매","priority":"조건부 핵심"},{"name":"화염·번개 저주 (Pyrostatic Curse)","up":"저항력 융해 (Resistance Melting)","reason":"화염·번개 저항 대처. 10/12 베타 변경 효과는 현재 버전 확인","priority":"중반 핵심"},{"name":"화염·번개 저주 (Pyrostatic Curse)","up":"파이로스태틱 혼돈 (Pyrostatic Chaos)","reason":"절멸의 기둥의 Chaos 주문과 연쇄되도록 확장","priority":"연쇄 완성 후"},{"name":"순간이동 (Teleport)","up":"퀵캐스트 (Quickcast) 가능하면","reason":"불기둥 범위 회피·시야 단절·위기 탈출","priority":"생존 추천"},{"name":"화염 폭발 (Flame Burst)","up":"밝은 화염(Bright Flame), 이중 폭발(Dual Burst)","reason":"정화자(The Purifier) 등을 얻었을 때 확장. 초반 필수 아님","priority":"장비 조건부"},{"name":"용해 (Melt)","up":"백색 화염(White Flame), 대량 용해(Mass Melt)","reason":"중후반 추가 화력과 연계","priority":"후반 선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"조기 제작 가능하면 방어 투자 부담을 줄이는 보호막 장비","priority":"초반 안전"},{"name":"화산의 창 (Volcanic Lance)","reason":"화염 주문 사용 시 추가 광선; 확보 시 연쇄 화력 향상","priority":"중후반 화력"},{"name":"정화자 (The Purifier)","reason":"밝은 화염(Bright Flame) 등 신성 피해 연계가 있을 때 효율 증가","priority":"조건부 연계"},{"name":"파이로스태틱 오큘러스 (Pyrostatic Oculus)","reason":"화염·번개 저항력 감소 보조","priority":"저항 대응"},{"name":"철학자의 돌 (Philosopher’s Stone)","reason":"충전 횟수가 부족한 불기둥의 지속전 보조","priority":"지속전 추천"},{"name":"보이드 여행자의 망토 (Void Traveler’s Cloak)","reason":"순간이동과 보호막 획득 연계가 가능한 경우","priority":"생존 선택"}],"rotation":["전투 전 T키로 위협 범위, 화염 저항, 시작 타일을 확인하고 화염구로 밀집한 약한 적부터 정리한다.","즉사 위험이 있으면 공격보다 비전 방호/장비 보호막 또는 순간이동으로 한 턴을 확보한다.","불기둥 범위에 본체가 없는지 확인하고 체력이 낮은 적을 마무리해 절멸의 기둥을 연쇄 발동한다.","화염 저항·보호막이 걸림돌이면 교란의 불꽃 또는 화염·번개 저주로 대응한 다음 연쇄를 건다.","보스에게 연쇄용 잡몹이 없으면 주문을 낭비하지 말고 충전 보조·별도 지속 피해로 전환한다."],"pitfalls":["화염구·화염 폭발·고급 업그레이드를 초반에 함께 구매하면 불기둥과 생존 주문 확보가 늦어진다.","불기둥은 피해 범위에 마법사가 들어가면 자해 위험이 있고 충전 횟수도 적다.","절멸의 기둥은 처치가 선행되어야 하므로 체력이 높은 적 하나를 상대로 자동 연쇄를 기대하지 않는다.","화염 저항 100%뿐 아니라 Sorcery/Enchantment 유형 면역, 적 보호막을 확인한다.","제작 장비는 드랍·재료 운에 좌우된다. 정화자·화산의 창이 없어도 빌드를 진행할 수 있어야 한다."],"boss":["아마루(Amaru): 화염 저항과 주문 유형 면역을 따로 확인하고 유효한 다른 피해 유형을 준비한다.","모르드레드(Mordred): 초기 연쇄를 터뜨릴 처치 대상이 없을 수 있으니 단일 지속 피해·보호막·충전 관리를 확보한다.","보호막이 많은 상대는 교란의 불꽃(Disrupting Flames) 등 제거 수단을 우선한다."],"variants":["정화자(The Purifier)를 일찍 제작했다면 화염 폭발(Flame Burst) → 밝은 화염(Bright Flame)으로 보조 화력을 늘린다. 제작 불가 시 무리해서 구매하지 않는다.","불의 비(Rain of Fire) + 화염의 문(Flame Gate) + 화염 광란 가면(Fire Frenzy Mask)은 별도 소환·화염구 반복형으로 전환할 때만 선택한다."],"evidence":"스팀 파이로맨서 트라이얼 조합과 플레이 후기 기반. 1~8구역 생존·구매 순서는 안정성을 위해 재설계한 권장 경로로, 보장된 클리어 루트는 아니다. 2026-10-12 베타의 저항력 융해 변경은 실제 플레이 브랜치에서 확인할 것.","sources":[["Steam 파이로맨서 트라이얼 구성","https://steamcommunity.com/app/4366330/discussions/0/589562498866268086/"],["Steam 빌드 가이드·공통 생존 지침","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["RW3 2026-10-12 베타 변경 사항","https://steamdb.info/patchnotes/25891047/"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"missile","icon":"✨","title":"마법 미사일 · 분산","group":"핵심 빌드 1–4","level":"★★★","tagline":"분산시킨 적마다 마법 미사일을 발동","idea":"마법 미사일(Magic Missile) → 분산(Disperse) → 폭력적 왜곡(Violent Warp)을 초반에 맞추고, 도탄(Ricochet)과 비전 광란 가면(Arcane Frenzy Mask)으로 다수 적에게 강해지는 빌드.","first":["1구역: 마법 미사일(Magic Missile).","2구역: 분산(Disperse).","3구역 목표: 폭력적 왜곡(Violent Warp).","4~5구역: 도탄(Ricochet)·교란 탄환(Disruption Bolt)을 검토."],"phases":[{"range":"1–3","target":"자동 공격 엔진","actions":["마법 미사일과 분산을 구매한다.","폭력적 왜곡을 빠르게 구매해 순간이동된 적에게 미사일 발동.","소수의 비전 면역 적은 피한다."]},{"range":"4–7","target":"광역 보완","actions":["도탄(Ricochet) 및 교란 탄환(Disruption Bolt)로 사각지대 감소.","위협 범위 확인 후 분산을 사용한다(적이 가까이 올 수도 있음)."]},{"range":"8–12","target":"반복 공격","actions":["비전 광란 가면을 제작 목표로 둔다.","공허불꽃 랜턴/수정 로브로 보조 발동을 검토한다."]},{"range":"13–17","target":"충전·생존","actions":["반짝이는 무희의 로브 등 충전 회복 장비를 고려한다.","본체 보호막을 보강한다."]},{"range":"18–21","target":"단일 보스 화력","actions":["고체력 단일 보스용 별도 공격 또는 피해 누적 수단을 준비한다.","비전 면역 적에게 교란 탄환 등 다른 속성 활용."]}],"spells":[{"name":"마법 미사일 (Magic Missile)","up":"도탄(Ricochet)","reason":"기본/추가 대상 공격","priority":"필수"},{"name":"분산 (Disperse)","up":"폭력적 왜곡(Violent Warp)","reason":"적 순간이동 후 미사일 추가 시전","priority":"필수"},{"name":"마법 미사일 (Magic Missile)","up":"교란 탄환(Disruption Bolt)","reason":"비전 면역 대처","priority":"필수"},{"name":"마법 미사일 (Magic Missile)","up":"비전 교차 사격(Arcane Crossfire)","reason":"직접 시전 미사일 연계","priority":"선택"},{"name":"석화 (Petrify)","up":"비전 전도(Arcane Conductivity)","reason":"저항력 대응 변형","priority":"선택"}],"gear":[{"name":"비전 광란 가면 (Arcane Frenzy Mask)","reason":"반복 비전 발동으로 화력 누적","priority":"핵심"},{"name":"공허불꽃 랜턴 (Voidflame Lantern)","reason":"추가 피해 연계","priority":"선택"},{"name":"수정 로브 (Robe of Crystals)","reason":"비전 피해 보조","priority":"선택"},{"name":"반짝이는 무희의 로브 (Glittering Dancer’s Robes)","reason":"충전 횟수·지속력 보강","priority":"선택"},{"name":"요정 가시 지팡이 (Fae Thorne Staff)","reason":"비전 아군 공급 변형","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"}],"rotation":["다수의 적을 분산 범위에 포함시키되 이동 후 위협 범위를 감안한다.","폭력적 왜곡으로 적마다 마법 미사일 발동을 유도한다.","위협적인 원거리 적이 남으면 직접 마법 미사일로 마무리한다.","보스만 남았다면 분산 연쇄가 약해지므로 별도 단일 화력을 사용한다."],"pitfalls":["비전 면역 적을 초반에 만나면 무력해질 수 있다.","분산은 적을 자신 근처에 재배치할 수 있다.","비전 교차 사격은 무료 자동 시전 모두에 무제한 반응하지 않는다(패치 주의)."],"boss":["단일 보스에게 다수 적용 분산의 이점이 줄어든다.","비전 면역·보호막 대상 처리 수단과 본체 생존력 필수."],"variants":["캔트립 연쇄(Cantrip Cascade) + 저레벨 주문 다량 발동형.","요정 가시 지팡이 + 비전 교차 사격으로 직접 시전 보강."],"evidence":"일본 Manamancer 공략의 3구역 목표와 클리어 로그 참고.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["일본 플레이어 실제 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"freeze","icon":"❄️","title":"광역 빙결 · 자동 분쇄","group":"핵심 빌드 1–4","level":"★★☆","tagline":"빙결→물리 분쇄로 시작해 장비 완성 후 매턴 자동 빙결·분쇄 연쇄","idea":"기존 프리즘 광선 중심 운영을 광역 동결(Mass Freeze) + 분쇄(Shatter)로 전환한 지속전 빌드. 초반에는 얼음구(Iceball)나 동결(Freeze)로 적을 얼리고 분쇄로 물리 피해를 주며, 보호막을 갖춘 뒤 분쇄의 서리 교본(Shattering Frost Manual)을 제작하면 매턴 자동 분쇄가 발생한다. 냉기의 지팡이(Chill Staff)와 결합하면 자동 분쇄의 냉기 주문 연계로 적이 새로 빙결되어 추가 분쇄 대상을 마련할 수 있다. 더 넓은 자동 빙결 확산은 냉기의 가면(Icy Chill Mask) + 한파 부적(Coldsnap Amulet)을 갖췄을 때 노릴 수 있는 장비 의존 확장형이다. '모든 적이 매턴 자동 빙결'되는 무조건적인 효과는 아니며, 냉기·물리 저항과 발동 순서·장비 수급에 따라 화력이 달라진다.","first":["1구역: 고드름(Icicle) 1종으로 안정적으로 출발. 처음부터 주문 세 종류를 모두 구입하지 않는다.","2~3구역: 적 밀집도가 높고 SP가 되면 얼음구(Iceball)로 광역 피해+빙결을 확보한다. 스스로 안전하게 처리된다면 얼음구 구매를 뒤로 미뤄도 된다.","3~5구역: 동결(Freeze)→광역 동결(Mass Freeze)과 분쇄(Shatter)를 목표로 SP를 모은다. 동결과 분쇄를 모두 당장 구매하기 어렵다면 얼음구+분쇄 또는 동결+분쇄로 먼저 시작한다.","4~6구역: 요정 판금(Fae Plate)을 제작할 수 있으면 활용하고, 아니라면 비전 방호(Arcane Ward)를 검토한다. 공격 주문 추가보다 본체 생존을 먼저 확보한다.","6~10구역: 광역 동결로 여러 적을 묶은 뒤 수동 분쇄. 빙결이 풀린 적은 이동·시야 관리로 다시 묶는다.","8~13구역 이후: 분쇄의 서리 교본(Shattering Frost Manual)을 제작할 수 있는 즉시 자동 분쇄 체제로 전환한다. 제작 전에는 기존 수동 루트로 진행한다.","중후반: 냉기의 지팡이(Chill Staff)로 자동 분쇄→신규 빙결의 순환을 보강하고, 한파 부적(Coldsnap Amulet)+냉기의 가면(Icy Chill Mask)이 가능하면 시야 범위로 빙결을 확산한다.","후반: Sorcwinter+죽음의 한기(Death Chill)는 대체 지팡이/처치 연쇄 경로로 검토한다. 물리 저항·빙결 면역 보스에 대비해 별도 화력과 보호막·순간이동을 준비한다."],"phases":[{"range":"1–2","target":"생존형 냉기 스타트","actions":["고드름(Icicle)을 첫 공격으로 사용하고 원거리·상태이상 몬스터가 적은 균열을 고른다.","광역 적이 유난히 많으면 얼음구(Iceball)를 구매해 여러 적을 한꺼번에 얼리는 선택을 한다.","처음부터 고드름·얼음구·동결의 업그레이드를 전부 구입하지 않고 분쇄를 위한 SP를 남긴다."]},{"range":"3–5","target":"첫 빙결→분쇄 연계","actions":["동결(Freeze)과 분쇄(Shatter)를 확보해 얼어붙은 적에 물리 피해를 넣는 흐름을 만든다.","이미 얼음구로 무리 전체를 빙결시킬 수 있다면 분쇄 구매를 먼저 당기고, 광역 동결 업그레이드는 다음으로 미룰 수 있다.","요정 판금(Fae Plate) 또는 비전 방호(Arcane Ward) 같은 방어 1개를 확보한다. 제작 장비 운이 없으면 방어 주문 우선."]},{"range":"5–8","target":"광역 동결 확장","actions":["동결(Freeze)→광역 동결(Mass Freeze)을 완성해 연결된 적 무리를 묶는다. 전장 전체 자동 빙결과는 다르다.","빙결된 무리에 분쇄를 사용해 물리 피해를 주고, 광역 공격을 받는 위치에 오래 서 있지 않는다.","빙결된 적이 물리 피해를 받으면 행동 봉쇄가 해제될 수 있으므로, 분쇄 후 생존할 강적은 다시 묶을 계획을 세운다."]},{"range":"8–12","target":"자동 분쇄 엔진 확보","actions":["분쇄의 서리 교본(Shattering Frost Manual) 제작 가능 여부를 우선 점검한다. 2026년 8월 28일 업데이트로 추가된 자동 시전 장비다.","교본을 장착하면 매턴 분쇄가 자동 발동하므로, 본체는 빙결·방어·이동에 턴을 사용할 수 있다.","자동 시전이 어떤 순서로 처리되는지, 빙결 대상이 없을 때 어떻게 동작하는지 게임 내 전투 로그로 확인한다.","교본을 아직 못 만들었다면 분쇄를 직접 사용해도 빌드는 기능한다. 제작 재료를 기다리느라 진도를 멈추지 않는다."]},{"range":"12–16","target":"자동 빙결 보충","actions":["냉기의 지팡이(Chill Staff)로 분쇄 자동 시전 시 추가 빙결을 발생시키는 실전 기록 기반 연계를 목표로 한다.","초기 광역 동결 1회로 시작해 자동 분쇄→다음 빙결 대상 생성의 반복을 노린다. 매턴 전장 전체를 얼리는 효과로 오해하지 않는다.","자동 빙결 대상이 적거나 끊기는 경우 동결·얼음구를 직접 사용해 엔진을 다시 가동한다.","여유가 생기면 순간이동(Teleport)+퀵캐스트(Quickcast) 또는 비전 방호로 본체를 보호한다."]},{"range":"16–19","target":"시야 범위 빙결 확산","actions":["냉기의 가면(Icy Chill Mask)의 냉기 피해 확산과 한파 부적(Coldsnap Amulet)의 빙결 연계로 신규 대상에 빙결을 퍼뜨리는 확장형을 검토한다.","분쇄의 서리 교본이 매턴 냉기 주문을 시전하면 가면·부적 연계가 돌아갈 수 있지만, 피해 저항·시야·적 구성·발동 조건에 따라 결과가 다르다.","Sorcwinter가 나온다면 죽음의 한기(Death Chill)로 처치 후 빙결 확산을 노리는 대체 지팡이 경로를 선택한다. Chill Staff와 동일 지팡이 칸이면 둘 중 하나를 선택한다.","빙결과 분쇄가 혼합된 다수 대상 전투에서 효과가 좋더라도, 자동 연쇄가 보스에게 그대로 유지될 것으로 가정하지 않는다."]},{"range":"19–21","target":"보스·저항 대응","actions":["빙결 면역 대상은 분쇄 엔진의 시동 자체가 막힐 수 있으므로 비냉기·비물리 피해 수단을 별도로 갖춘다.","높은 물리 저항력에는 저항력 감소 효과를 가진 주문·장비 또는 별도 공격 유형을 준비한다.","보호막형 상대에는 보호막 흡수(Siphon Shields) 등으로 선제 대응하고, 고체력 단일 보스전에서는 지속 피해·보호막·이동을 우선한다.","장비 자동 시전만 믿고 턴을 넘기지 말고, 적에게 반격 기회가 생기는지 매턴 확인한다."]}],"spells":[{"name":"고드름 (Icicle)","up":"냉기 저항 적이 많으면 부식 파편(Corrosive Shard) 검토","reason":"초반에 SP 낭비를 줄이는 기본 공격. 이후 빙결 중 직접 물리 타격으로 빙결이 풀릴 수 있음","priority":"초반 시작"},{"name":"얼음구 (Iceball)","up":"기본 효과(광역 냉기 피해·빙결). 필요할 때만 강화","reason":"여러 적을 한 번에 빙결해 분쇄의 시동을 걸기 좋음. 초기 SP가 부족하면 구매를 미룸","priority":"초반 광역 선택"},{"name":"동결 (Freeze)","up":"광역 동결 (Mass Freeze)","reason":"연결된 적 무리를 한 번에 제어하는 핵심 빙결 수단. 자동 전장 전체 빙결은 아님","priority":"핵심 제어"},{"name":"분쇄 (Shatter)","up":"면도날 얼음 (Razor Ice)은 출혈 연계가 필요할 때 검토. 증기 정령(Steam Anima)은 화염 피해를 추가하므로 빙결 해제 영향 주의","reason":"빙결된 적에 물리 피해를 가하는 주력 마무리. 교본 확보 전 직접 시전","priority":"핵심 공격"},{"name":"비전 방호 (Arcane Ward)","up":"기본 효과로도 사용 가능","reason":"자동 시전 엔진 완성 전과 보스전의 본체 생존 보장","priority":"생존 우선"},{"name":"순간이동 (Teleport)","up":"퀵캐스트 (Quickcast)","reason":"자동 공격 동안 위치를 조정하고 면역 적에게서 탈출","priority":"중반 생존"},{"name":"죽음의 한기 (Death Chill)","up":"기본 효과·빙결 확산 관련 툴팁을 현재 버전에서 확인","reason":"Sorcwinter 활용 시 처치 연쇄로 추가 빙결 확장","priority":"대체 경로"},{"name":"얼음의 언령 (Word of Ice)","up":"주문서/장비를 통해 확보할 수 있을 때 검토","reason":"넓은 전장의 초기 대량 빙결을 만드는 보조 시동","priority":"선택 보조"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본 효과","reason":"적 보호막으로 분쇄 피해가 막힐 때 대응","priority":"후반 상황별"}],"gear":[{"name":"분쇄의 서리 교본 (Shattering Frost Manual)","reason":"매턴 분쇄(Shatter) 자동 시전. 자동화의 핵심 장비이며 수급 전에는 수동 분쇄로 진행","priority":"자동화 최우선"},{"name":"냉기의 지팡이 (Chill Staff)","reason":"분쇄의 자동 냉기 시전이 새 빙결을 유발하는 연계. 교본과 결합하면 매턴 표적 공급 가능","priority":"자동 빙결 핵심"},{"name":"냉기의 가면 (Icy Chill Mask)","reason":"냉기 주문 시 시야 범위 냉기 피해를 확산해 한파 부적의 추가 빙결을 유도","priority":"광역 자동화"},{"name":"한파 부적 (Coldsnap Amulet)","reason":"냉기 피해와 빙결 확산의 연결 고리. 냉기의 가면과 시너지","priority":"광역 자동화"},{"name":"소서윈터 (Sorcwinter)","reason":"죽음의 한기(Death Chill)로 처치 후 추가 빙결을 노리는 대체 지팡이. Chill Staff와 양자택일","priority":"대체 확장"},{"name":"요정 판금 (Fae Plate)","reason":"초반 자동 엔진을 준비하는 동안 본체를 보호하는 방어 장비","priority":"초반 안전"},{"name":"폭풍의 로브 (Robe of Storms)","reason":"냉기·번개 피해로 적을 처치할 때 보호막을 획득하는 방어형 로브. 분쇄의 물리 처치만으로는 발동을 기대하지 말 것","priority":"방어 선택"},{"name":"수정의 로브 (Robe of Crystals)","reason":"냉기 피해를 광역으로 확산하는 장비 조합에서 보스 화력 증폭을 노리는 공격형 로브","priority":"후반 화력"},{"name":"얼음 광란 가면 (Ice Frenzy Mask)","reason":"냉기 주문 반복 시 공격력 증폭을 노리는 대체 머리 장비. Icy Chill Mask와 같은 머리 칸이면 양자택일","priority":"공격 대체"},{"name":"눈 신발 (Snow Shoes)","reason":"빙결을 유지하는 동안 방어 안정성을 보강하는 신발 후보","priority":"보조 생존"}],"rotation":["입장 전 T키로 시작 위치·적 공격 범위를 확인하고, 빙결 면역과 물리 저항이 높은 적부터 표시한다.","초반 수동 구간: 얼음구(Iceball) 또는 광역 동결(Mass Freeze)로 적들을 묶고, 분쇄(Shatter)를 직접 사용해 처리한다.","교본 획득 후: 빙결을 먼저 준비해 두면 분쇄의 서리 교본(Shattering Frost Manual)이 매턴 분쇄를 자동 시전하므로 직접 분쇄하는 턴을 아낄 수 있다.","냉기의 지팡이(Chill Staff) 추가 후: 자동 분쇄에서 새로운 빙결 대상이 생기는지 확인하고, 끊기면 동결/얼음구로 재시동한다.","광역 확장 후: Icy Chill Mask → 시야 내 냉기 피해 → Coldsnap Amulet에 의한 빙결 확산 → 다음 분쇄의 순환을 노린다. 발동 순서는 실제 게임 툴팁·로그 확인.","장기전: Sorcwinter·Death Chill 처치 연쇄로 전환하거나 보호막·저항 감소·다른 피해 수단을 사용한다. 본체가 위험할 땐 자동 공격을 믿고 턴을 넘기지 않는다."],"pitfalls":["광역 동결(Mass Freeze)은 연결된 적 무리 제어이지 시야 전체가 매턴 자동으로 빙결되는 효과는 아니다.","Shattering Frost Manual은 자동 분쇄 장비지만, 적이 얼어 있지 않거나 발동 대상이 없으면 원하는 피해가 나오지 않는다.","분쇄의 물리 피해는 빙결을 해제할 수 있다. 살아남은 강적의 반격을 예상하고 다시 얼리거나 후퇴한다.","Chill Staff의 자동 빙결은 한꺼번에 모든 적을 얼리는 보장이 아니다. 넓은 범위 자동화에는 Icy Chill Mask + Coldsnap Amulet 등이 추가로 필요하다.","Chill Staff와 Sorcwinter, Icy Chill Mask와 Ice Frenzy Mask, Robe of Storms와 Robe of Crystals는 각각 같은 유형의 장비이므로 실제 장비 칸을 확인해 서로 다른 경로로 선택한다.","높은 물리 저항 적은 빙결이 들어가도 분쇄 피해가 줄 수 있다. 빙결 면역 적은 자동 연계 시동이 잘 걸리지 않는다.","8월 이후 패치에서 Shatter의 Shattered Sorrows는 제거되고 Steam Anima로 변경됐다. 오래된 업그레이드명은 따라 사지 않는다.","교본·지팡이·가면·부적은 재료 수급에 따라 늦을 수 있다. 자동화를 완성하지 못해도 수동 분쇄+방어로 계속 진행한다."],"boss":["일반 무리: 광역 동결→분쇄→자동 재빙결로 적 행동을 줄이고 시야 범위 자동 처치를 노린다.","눈의 여왕(Snow Queen): 냉기 저항/면역과 빙결 가능 여부를 확인하고 비냉기 피해 수단을 준비한다.","높은 물리 저항 보스: 분쇄가 핵심 피해를 주지 못할 수 있어 저항력 감소 또는 독립된 다른 속성 공격이 필요하다.","보호막이 많은 상대: 보호막 흡수(Siphon Shields) 등으로 대응한다.","모르드레드(Mordred): 다수 적을 대상으로 연쇄를 늘리는 빌드가 단일 본체로 전환될 때 약해지므로 본체 보호막·순간이동·비빙결 대체 화력을 마련한다."],"variants":["기본·무장비형: 고드름 → 얼음구/광역 동결 → 수동 분쇄 → 비전 방호. 교본이 없어도 성장과 전투 진행이 가능하다.","자동화 중심형(추천): 분쇄의 서리 교본 + 냉기의 지팡이, 초기 광역 동결로 시작. 매턴 신규 빙결 대상이 생기며 자동 분쇄가 이어지는지 확인한다.","광역 확산형(장비 의존): 분쇄의 서리 교본 + 냉기의 가면 + 한파 부적. 냉기 피해를 시야로 퍼뜨려 추가 빙결 대상을 만드는 후반 확장.","처치 연쇄형: 냉기의 지팡이 대신 소서윈터(Sorcwinter)와 죽음의 한기(Death Chill)를 이용해 킬 체인을 늘린다.","예전 프리즘 광선형 보존: 프리즘 광선(Prismatic Beam)+부드러워진 빛(Softened Light)으로 빙결 적을 즉시 섬멸하는 폭발형. 자해 방지 업그레이드가 필수이며 단일 보스 남으면 화력이 급감할 수 있어, 자동 분쇄형과 다른 선택 빌드로 취급한다."],"evidence":"2026-08-28 공식 업데이트로 Shattering Frost Manual 추가 확인, 2026-09-27 일본 트라이얼 공략의 실전 Shatter→Chill Staff→Sorcwinter→Icy Chill Mask·Coldsnap Amulet 연계 기록 참고. Steam 커뮤니티의 Iceball+Shatter 초반 사례 및 프리즘 광선의 단일 보스 한계 검토. '매턴 자동 분쇄'는 자료로 확인된 동작이나 '매턴 시야 전체 자동 빙결'은 특정 장비 조합과 발동 조건이 있어 항상 보장되지 않는다. 구역별 구매 순서와 장비 우선순위는 안정성 중심으로 재구성한 권장안이며 미검증 세부 수치·제작식은 기록하지 않았다.","sources":[["분쇄 자동 장비·빙결 자동화 실전 기록 (THEKI, 2026-09-27)","https://note.com/theki/n/nf90736db34ac?hl=ko"],["공식 패치 — Shattering Frost Manual 추가 (2026-08-28)","https://steamdb.info/patchnotes/24995190/"],["Steam 실전 의견 — Iceball+Shatter·초반 생존","https://steamcommunity.com/app/4366330/discussions/0/592938033420140478/"],["Steam 프리즘 광선의 한계·보스전 사례","https://steamcommunity.com/app/4366330/discussions/0/592937761422713548/"],["Rift Wizard 3 Compendium (주문·장비·패치별 확인)","https://hpp3.github.io/rw3/"]]},{"id":"archon","icon":"🪽","title":"아콘 소환 · 보호막 광선","group":"소환·방어","level":"★★☆","tagline":"소환수가 광선 공격과 보호막 공급을 동시에","idea":"아콘 소환(Call Archon)의 광선의 호(Beam Arc)·폭풍 아콘(Storm Archon)을 활용하고 영속화(Permanence)와 재생 오라로 유지력을 높인다.","first":["1~3구역: 늑대 또는 저비용 공격으로 시작.","4~7구역: 아콘 소환(Call Archon) 확보.","8~11구역: 광선의 호(Beam Arc), 폭풍 아콘(Storm Archon).","후반: 보호막·소환 장비·저항력 감소 강화."],"phases":[{"range":"1–3","target":"기본 생존","actions":["고비용 아콘을 기다리는 동안 저비용 공격으로 약한 균열 선택."]},{"range":"4–8","target":"아콘 확보","actions":["아콘 소환과 광선의 호를 목표.","아콘 광선이 적과 아군을 지나는 배치를 의식."]},{"range":"9–13","target":"화력 확대","actions":["폭풍 아콘, 냉기 충격 부적, 소환술 지팡이 등 보완."]},{"range":"14–18","target":"소환 유지","actions":["영속화(Permanence), 재생 오라 등으로 소환수 보호."]},{"range":"19–21","target":"보스","actions":["드래곤/아콘 소환수의 공격이 통하지 않는 적용 보조 공격 준비.","본체 보호막 없을 때 전방 노출 금지."]}],"spells":[{"name":"아콘 소환 (Call Archon)","up":"광선의 호(Beam Arc)","reason":"광선 확대","priority":"필수"},{"name":"아콘 소환 (Call Archon)","up":"폭풍 아콘(Storm Archon)","reason":"공격 속성 추가","priority":"필수"},{"name":"영속화 (Permanence)","up":"현실 고정(Reality Hold)","reason":"소환 유지","priority":"중반"},{"name":"재생 오라 (Regeneration Aura)","up":"죽음 저항(Death Defiance)","reason":"소환수 생존","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"본체 보호막","priority":"안전"}],"gear":[{"name":"소환술 지팡이 (Conjuration Staff)","reason":"아콘 능력 강화","priority":"핵심"},{"name":"냉기 충격 부적 (Coldsnap Amulet)","reason":"광선 공격 시너지","priority":"선택"},{"name":"분노의 연결고리 (Wrath Links)","reason":"광선 연계","priority":"선택"},{"name":"혼돈의 연결고리 (Chaos Links)","reason":"추가 피해","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보조 보호막","priority":"안전"}],"rotation":["아콘을 안전한 곳에서 소환한다.","아콘의 광선이 적을 타격하는 경로를 관찰한다.","보호막을 받을 수 있도록 자신의 위치를 조정한다.","소환수가 공격하는 동안 본체는 위험한 적만 대응한다."],"pitfalls":["광선 각도가 나쁘면 실제 화력이 떨어진다.","SP가 많이 들어 초반 완성 전 취약하다."],"boss":["소환수의 공격 속성 저항·면역 보스를 위한 별도 피해 필요."],"variants":["신성 아콘 + 세라프 소환 연계 변형."],"evidence":"스팀 빌드 가이드 기반. 해당 가이드 작성자의 엔딩 검증은 별도.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"claw","icon":"🐉","title":"용의 발톱 · 대지 보호막","group":"소환·방어","level":"★★★","tagline":"직접 싸우되 지형 이동과 보호막으로 버티기","idea":"용의 발톱(Dragon Claw)의 근접 공격에 대지 통로(Earth Passage)·광물 보호막(Mineral Shielding)을 결합하는 방식. 단단한 느낌은 크지만 위치 선정 난이도는 높다.","first":["1구역: 용의 발톱(Dragon Claw) 또는 다른 저비용 공격.","초반: 대지 통로(Earth Passage)와 광물 보호막(Mineral Shielding).","중반: 용발톱 군화(Dragonclaw Sabatons), 혼돈의 발톱(Chaos Claws).","후반: 드레이크 탑승(Ride Drake)과 회피 기동(Evasive Maneuvers)."],"phases":[{"range":"1–3","target":"발톱 사용법","actions":["매 턴 위협 범위를 확인한다.","근접 시 적 여러 마리에게 동시에 맞으면 지형 이동을 우선한다."]},{"range":"4–8","target":"방어 이동","actions":["대지 통로와 광물 보호막 확보.","벽/병목을 활용해 한 번에 상대하는 적 수 축소."]},{"range":"9–14","target":"근접 화력","actions":["용발톱 군화와 혼돈의 발톱으로 물리저항 대책 마련."]},{"range":"15–18","target":"탑승 생존","actions":["드레이크 탑승 및 회피 기동으로 위험 감소."]},{"range":"19–21","target":"보스","actions":["근접하면 즉사할 수 있는 보스의 공격 범위를 반드시 확인.","원거리 또는 다른 속성 피해 수단 준비."]}],"spells":[{"name":"용의 발톱 (Dragon Claw)","up":"혼돈의 발톱(Chaos Claws)","reason":"직접 공격","priority":"필수"},{"name":"대지 통로 (Earth Passage)","up":"광물 보호막(Mineral Shielding)","reason":"지형 이동과 방어","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"회피 기동(Evasive Maneuvers)","reason":"후반 생존","priority":"후반"}],"gear":[{"name":"용발톱 군화 (Dragonclaw Sabatons)","reason":"용의 발톱 연계","priority":"핵심"},{"name":"요정 판금 (Fae Plate)","reason":"보호막","priority":"안전"},{"name":"이동 강화 장비","reason":"전장 위치 선정 보조","priority":"선택"}],"rotation":["원거리 몬스터가 공격할 수 없는 벽 뒤에서 접근한다.","단일 적을 빠르게 제거한 후 이동하여 공격 범위 밖에 선다.","위험할 때는 대지 통로와 방어를 우선 사용한다."],"pitfalls":["단단하다고 무조건 근접하면 안 된다.","행동 불능·원거리 집중 공격에 취약."],"boss":["정원사 같은 강한 근접 보스에게 정면 돌격 금지."],"variants":["소환/탑승 능력을 강화한 드레이크 전사 변형."],"evidence":"스팀 초반 조합 추천 기반. 완전한 엔딩 클리어 경로 검증은 부족.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"eye","icon":"👁️","title":"부유하는 눈 · 보호막 포탑","group":"기타 빌드","level":"★★★","tagline":"보호막을 공격력으로 바꾸는 눈 소환","idea":"부유하는 눈(Floating Eye)에 눈의 마법사(Eye Mage)와 재생 보호막(Regenerating Shields)을 연결하고, 보호막 흡수(Siphon Shields)의 안구 렌즈화(Ocular Lensing)로 공격과 보호막을 증폭한다.","first":["초반: 저비용 눈 공격 또는 일반 광역 공격으로 생존.","중반: 부유하는 눈 + 눈의 마법사 + 재생 보호막.","중후반: 보호막 흡수 + 안구 렌즈화.","후반: 신비로운 시야 + 감시(Overwatch) 및 눈 장비."],"phases":[{"range":"1–5","target":"준비","actions":["저비용 마법으로 생존.","눈 소환에 필요한 SP와 방어 장비 확보."]},{"range":"6–10","target":"눈 생성","actions":["부유하는 눈과 눈의 마법사를 연결한다.","재생 보호막으로 소환수를 보호한다."]},{"range":"11–15","target":"보호막 엔진","actions":["보호막 흡수 + 안구 렌즈화.","눈의 투구·의복을 제작할 수 있는지 확인."]},{"range":"16–21","target":"생존과 보스","actions":["감시(Overwatch), 이동·보호막 능력 완성.","눈 공격의 속성 면역을 대비한 직접 피해 마련."]}],"spells":[{"name":"부유하는 눈 (Floating Eye)","up":"눈의 마법사(Eye Mage)","reason":"눈 주문 사용","priority":"필수"},{"name":"부유하는 눈 (Floating Eye)","up":"재생 보호막(Regenerating Shields)","reason":"소환수 보호막 재생","priority":"필수"},{"name":"보호막 흡수 (Siphon Shields)","up":"안구 렌즈화(Ocular Lensing)","reason":"보호막을 공격에 활용","priority":"필수"},{"name":"신비로운 시야 (Mystic Vision)","up":"감시(Overwatch)","reason":"자동 대응","priority":"중반"}],"gear":[{"name":"눈의 투구 (Eye Helm)","reason":"눈/보호막 시너지","priority":"핵심"},{"name":"눈의 의복 (Raiment of Eyes)","reason":"눈 주문 보조","priority":"선택"},{"name":"발로르의 눈 지팡이 (Balor’s Eye Staff)","reason":"눈 공격 연계","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"}],"rotation":["눈 소환을 먼저 배치하고 위험한 원거리 적을 파악한다.","보호막을 수급하여 눈의 화력을 유지한다.","본체는 직접 피격을 최소화한다."],"pitfalls":["보호막이 사라지면 화력과 생존이 함께 무너진다.","피의 눈(Eye of Blood)은 부유하는 눈이 사용하지 못한다는 가이드 주의점."],"boss":["보호막 제거·소환수 제어 적에게 주의."],"variants":[],"evidence":"스팀 빌드 가이드 기반.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"demon","icon":"💀","title":"악마 의식 · 절멸","group":"기타 빌드","level":"★★★","tagline":"의식으로 소환수를 강화한 뒤 폭딜","idea":"악마 의식(Demonic Ritual)의 불가침 의식(Inviolate Ritual)과 지배자의 갑옷(Armor of the Master)으로 소환수를 강화하고 절멸(Annihilate)·아마겟돈의 칼날(Armageddon Blades)을 공격으로 쓴다.","first":["초반: 죽음의 화살(Death Bolt)·뼈 전사(Bone Warriors)로 생존.","중반: 악마 의식(Demonic Ritual)과 불가침 의식.","후반: 절멸·아마겟돈의 칼날과 방어 장비."],"phases":[{"range":"1–5","target":"값싼 공격","actions":["초반 무리한 의식 구매보다 죽음의 화살/소환수로 처치력 확보."]},{"range":"6–10","target":"의식","actions":["악마 의식 + 불가침 의식 준비.","HP 비용 및 채널링 중의 위험을 미리 계산."]},{"range":"11–15","target":"폭발 화력","actions":["절멸과 아마겟돈의 칼날 확보."]},{"range":"16–21","target":"방어 동반","actions":["지배자의 갑옷, 보호막 확보 후 의식 시전.","고저항 보스에게 다른 유형 공격도 준비."]}],"spells":[{"name":"악마 의식 (Demonic Ritual)","up":"불가침 의식(Inviolate Ritual), 대의식(Grand Ritual)","reason":"소환수 강화","priority":"필수"},{"name":"절멸 (Annihilate)","up":"대량 절멸(Mass), 포괄적 절멸(Comprehensive)","reason":"광역 폭발","priority":"필수"},{"name":"아마겟돈의 칼날 (Armageddon Blades)","up":"대량 무장(Mass) 계열","reason":"추가 공격","priority":"필수"}],"gear":[{"name":"지배자의 갑옷 (Armor of the Master)","reason":"의식·소환수 연계","priority":"핵심"},{"name":"요정 판금 (Fae Plate)","reason":"채널링 위험 감소","priority":"안전"}],"rotation":["엄호가 된 장소에서 소환수와 방어를 준비한다.","악마 의식을 시전하고 소환수를 강화한다.","대량 절멸로 적을 제거한다."],"pitfalls":["악마 의식은 HP와 행동을 요구하여 초반 생존 빌드로는 어렵다.","패치로 의식 업그레이드 SP가 바뀐 적이 있다."],"boss":["고저항 보스를 대비한 다속성 공격과 피해 수단 필요."],"variants":[],"evidence":"실제 클리어 경험담 기반이나 초보자 추천도는 낮음.","sources":[["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"quake","icon":"🥾","title":"지진 · 자동 시전 장화","group":"기타 빌드","level":"★★★","tagline":"이동이 곧 공격이 되는 특이한 빌드","idea":"지진(Earthquake)과 자동 시전 장비를 연결하고 이동하며 적을 공격한다. 지진 여진(Aftershock)으로 광역 효과를 늘린다.","first":["1~5구역: 평범한 광역 마법으로 생존.","6~10구역: 자동 시전 장비/장화 확보.","11~15구역: 지진과 여진 연결.","16~21구역: 이동 생존·상태이상 대응."],"phases":[{"range":"1–5","target":"일반 공격","actions":["이동 연계 장비가 없으면 지진 자동화에 집착하지 않는다."]},{"range":"6–10","target":"자동 시전","actions":["흡수 장화(Drain Boots) 등 이동 시 발동 장비를 확보한다."]},{"range":"11–15","target":"지진 확장","actions":["지진과 여진(Aftershock), 장화 시너지를 구축."]},{"range":"16–21","target":"이동 생존","actions":["위험 범위에서 벗어날 경로를 항상 남겨둔다."]}],"spells":[{"name":"지진 (Earthquake)","up":"여진(Aftershock)","reason":"주력 광역","priority":"필수"},{"name":"순수 (Purity)","up":"기본","reason":"상태이상 대응","priority":"선택"},{"name":"흡수 파동 (Drain Pulse)","up":"기본","reason":"보조 자동 발동","priority":"선택"}],"gear":[{"name":"흡수 장화 (Drain Boots)","reason":"초반 자동 발동","priority":"핵심"},{"name":"주교의 장화 (Bishop Boots)","reason":"이동·시전 연계","priority":"선택"},{"name":"성주 나막신 (Castellan Clogs)","reason":"이동 관련 보조","priority":"선택"},{"name":"비단 샌들 (Silken Sandals)","reason":"이동 시 보호막","priority":"선택"},{"name":"날개 달린 신발 (Winged Shoes)","reason":"지형 제약 완화","priority":"선택"}],"rotation":["안전한 이동 경로를 확보한다.","움직이는 동안 자동 시전이 발동하는 조건을 확인한다.","광역 효과로 적을 줄이되 포위되기 전에 이동한다."],"pitfalls":["장비 운이 나쁘면 완성할 수 없다.","이동 경로를 잘못 택하면 자동 공격보다 먼저 죽는다."],"boss":["이동이 제한되는 보스·지형에서 특히 주의."],"variants":[],"evidence":"실제 클리어 사례 기반이지만 장비 의존도가 높음.","sources":[["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"wolf","icon":"🐺","title":"늑대 무리 · 야생성 소환","group":"기타 빌드","level":"★★☆","tagline":"늑대 소환수로 전선을 밀어붙이는 자연계","idea":"늑대(Wolf)의 늑대 무리(Wolf Pack)·굶주린 늑대(Ravenous Wolf)와 야생성 발현(Invoke Savagery)을 결합한다. 소환수 물량과 강화 효과로 적을 압박.","first":["1구역: 늑대(Wolf) 확보.","초반: 늑대 무리(Wolf Pack) 우선.","중반: 야생성 발현(Invoke Savagery) 강화.","후반: 자연/소환 장비와 다른 피해 수단 마련."],"phases":[{"range":"1–5","target":"늑대 군단","actions":["늑대를 적과 본체 사이에 배치.","늑대 무리/굶주린 늑대로 수와 공격력 보강."]},{"range":"6–10","target":"야생성","actions":["야생성 발현으로 소환수를 강화한다."]},{"range":"11–16","target":"지속력","actions":["자연 지팡이·소환술 지팡이·소환수 방어 강화."]},{"range":"17–21","target":"제어 대책","actions":["공포·지배에 소환수가 무너지는 상황 대비.","직접 공격과 보호막 추가."]}],"spells":[{"name":"늑대 (Wolf)","up":"늑대 무리(Wolf Pack), 굶주린 늑대(Ravenous Wolf)","reason":"전열","priority":"필수"},{"name":"야생성 발현 (Invoke Savagery)","up":"야생의 도약(Savage Leap), 야생의 난동(Savage Spree)","reason":"소환수 강화","priority":"필수"}],"gear":[{"name":"자연 지팡이 (Nature Staff)","reason":"자연 주문 강화","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환수 증강","priority":"선택"},{"name":"드루이드의 로브 (Robe of the Druids)","reason":"자연 계열 강화","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 방어","priority":"안전"}],"rotation":["늑대를 먼저 소환하고 마법사는 후방.","위험한 상태이상 적은 직접 먼저 제거.","군단이 전진하는 동안 다른 피해 보조."],"pitfalls":["공포(Fear)에 살아 있는 소환수가 영향을 크게 받는다.","단일 소환수에 지나치게 올인하면 지배/탈취에 취약하다."],"boss":["물리 저항력 높은 보스에게 늑대만으로 피해 부족."],"variants":[],"evidence":"스팀 빌드 가이드 기반.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"ward","icon":"🛡️","title":"범용 보호막 · 생존 개조","group":"소환·방어","level":"★☆☆","tagline":"기존 빌드를 바꾸지 않고 몸만 단단하게","idea":"주력 공격 빌드를 그대로 두되 요정 판금(Fae Plate), 비전 방호(Arcane Warding), 북방 갑옷(Boreal Armor), 이동 주문 등을 상황에 맞게 넣는다.","first":["1~3구역: 주력 공격 마법 하나로 시작한다.","가능한 즉시 요정 판금(Fae Plate) 또는 쉬운 보호 장비 제작.","중반 이전: 비전 방호(Arcane Warding) 또는 소환수 1종으로 공격 분산.","이후: 주력 공격과 저항력 대응도 잊지 않는다."],"phases":[{"range":"1–5","target":"방어 기초","actions":["주력 공격을 먼저 사고, 생존 장비를 1개 제작한다.","최대 HP와 보호막 모두 중요하다."]},{"range":"6–10","target":"보호막 유지","actions":["요정 판금·비전 방호·부여술 지팡이 중 가능한 조합 확보."]},{"range":"11–15","target":"행동 절약","actions":["순간이동/이동 보조를 갖추어 피격 수를 줄인다."]},{"range":"16–21","target":"보스 대비","actions":["방어만 늘리지 말고 단일 고체력 적을 죽일 화력 확보."]}],"spells":[{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"보호막","priority":"필수"},{"name":"순간이동 (Teleport)","up":"신속 시전(Quickcast)","reason":"안전한 위치 이동","priority":"선택"},{"name":"어둠 (Darkness)","up":"기본","reason":"일부 원거리 적 견제","priority":"선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"지속 보호막","priority":"핵심"},{"name":"북방 갑옷 (Boreal Armor)","reason":"구역 시작 보호막","priority":"선택"},{"name":"부여술 지팡이 (Enchantment Staff)","reason":"비전 방호 등 방어 부여술 보완","priority":"선택"},{"name":"폭풍의 로브 (Robe of Storms)","reason":"냉기·번개 처치 시 보호막","priority":"속성별"},{"name":"위기 부적 (Crisis Charm)","reason":"급사 방지","priority":"선택"}],"rotation":["매 구역 시작 때 위협 범위를 확인한다.","공격 전 보호막 수를 확인한다.","그 턴에 위험한 적을 죽일 수 없다면 이동·제어를 먼저 한다."],"pitfalls":["보호막은 공격 1회를 막을 뿐 연속 다단 히트에 취약하다.","보호막 투자에 SP를 모두 소모하면 고체력 보스에 막힌다."],"boss":["보스 별 공격 횟수·상태이상·방어 특성을 따로 확인한다."],"variants":[],"evidence":"초보자 방어 공통 세팅을 독립 페이지로 정리.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"graygoo","icon":"🧪","title":"회색 점액 · 방어구 용해","group":"신규 연구 빌드","level":"★★★","tagline":"증식하는 점액을 물리 관통으로 보완하는 상태이상 연계형","idea":"초반에 강한 회색 점액(Gray Goo)의 물리 피해가 후반에도 통하도록 방어구 용해기(Armor Melter)의 저항력 감소를 더한다. 에메랄드 화염으로 용해를 발동하고 슬라임샷의 저주·흡혈 연쇄를 연결하는 복합 빌드. 기존 ‘슬라임 형태+재생 오라’와 달리 회복이 아니라 방어력 약화와 복합 피해가 목적이다.","first":["시작: 회색 점액(Gray Goo)을 주력 후보로 확보하고 적의 물리 저항력을 먼저 본다.","초반: 점액이 증식할 시간을 벌 수 있는 소환·이동·보호막 수단 한 가지를 마련한다.","중반: 방어구 용해기(Armor Melter)와 에메랄드 화염(Emerald Flame) 연계를 목표로 재료를 모은다.","후반: 슬라임샷·흡혈·저주 연쇄를 ‘여유 SP가 있을 때’ 추가한다."],"phases":[{"range":"1–3","target":"점액 확산","actions":["회색 점액(Gray Goo)로 적을 묶고 점액이 늘어날 시간을 번다.","물리 면역 적이 많은 균열은 피한다.","첫 3구역의 고정 구매 순서는 원문에 없으므로 저가 공격·방어 주문은 상황에 맞게 선택한다."]},{"range":"4–7","target":"저항력 대책","actions":["방어구 용해기(Armor Melter)를 제작 목표로 삼는다.","장비 발동용 화염 피해 수단으로 에메랄드 화염(Emerald Flame)을 고려한다.","소환수만으로 처리되지 않는 원거리 적을 직접 제거한다."]},{"range":"8–12","target":"슬라임샷 확장","actions":["슬라임샷(Slimeshot)을 이용해 점액화(Slimefy)와 생명력 흡수(Lifedrain) 상태를 퍼뜨리는 변형을 구성한다.","보호막 또는 안정적인 군중 제어를 확보한다."]},{"range":"13–17","target":"연쇄 발동 보완","actions":["붉은 위엄(Red Majesty)과 채찍질/징벌(Scourge), 피의 저주(Blood Hexes)를 연결할 수 있다면 추가한다.","얼음의 복수(Icy Vengeance) 등 다른 피해 축으로 면역 대응을 만든다."]},{"range":"18–최종","target":"보스 준비","actions":["물리 면역/고저항 보스에게 방어구 용해 효과가 실제로 적용되는지 확인한다.","소환수가 약한 보스는 저주·상태이상 연쇄와 별도 피해로 처리한다."]}],"spells":[{"name":"회색 점액 (Gray Goo)","up":"기본 소환·증식 효과","reason":"초반 주력 소환 전력","priority":"핵심"},{"name":"슬라임샷 (Slimeshot)","up":"점액화 (Slimefy) 등","reason":"점액·흡혈 상태를 넓게 퍼뜨림","priority":"중반"},{"name":"생명력 흡수 (Lifedrain)","up":"해당 빌드에 맞는 저주 연계","reason":"붉은 위엄 연쇄의 시작점","priority":"후반"},{"name":"징벌 (Scourge)","up":"기절 연계 확인","reason":"적 행동을 막아 점액이 공격할 턴을 확보","priority":"후반"},{"name":"얼음의 복수 (Icy Vengeance)","up":"선택","reason":"물리 편중을 피하는 추가 피해","priority":"후반"}],"gear":[{"name":"방어구 용해기 (Armor Melter)","reason":"물리 저항력 감소의 핵심. 어떤 피해로 발동하는지 툴팁 확인","priority":"핵심"},{"name":"에메랄드 화염 (Emerald Flame)","reason":"방어구 용해기 효과를 발동시키는 원문 사례","priority":"핵심 연계"},{"name":"요정 판금 (Fae Plate)","reason":"점액이 증식하기 전 본체를 지키는 범용 대체 장비","priority":"선택"},{"name":"기타 소환/보호막 장비","reason":"원본 기록의 특정 장비가 없어도 초반 생존을 먼저 확보","priority":"대체"}],"rotation":["위협 범위를 먼저 확인하고 점액이 직접 맞을 수 있는 위치에 배치한다.","점액이 살아 있는 동안 본체는 원거리·기절 적부터 제거한다.","물리 저항력 높은 적에 에메랄드 화염+방어구 용해기가 적용되는지 살핀다.","상태이상 연쇄가 작동하면 직접 공격 횟수보다 제어·보호막 유지에 집중한다."],"pitfalls":["기존 슬라임 형태 빌드와 이름만 비슷할 뿐 핵심 메커니즘은 다르다.","물리 면역 적에게 점액만 쏟아부으면 막힌다.","붉은 위엄·징벌 연계는 후반 복잡한 변형이므로 초반 필수로 계산하지 않는다.","원본 클리어에서도 얼음의 복수와 기절이 큰 역할을 했다. 점액만으로 엔딩을 보장하지 않는다."],"boss":["물리 저항 보스: 방어구 용해가 실제 작동하는지 공격 로그로 확인.","소환수 소모가 많은 보스: 보호막과 기절 등으로 시간을 번다.","모르드레드: 단일 물리 피해 대신 저항력 감소+추가 속성 피해의 연쇄로 준비."],"variants":["쉬운 변형: 회색 점액+방어구 용해기까지만 완성하고 다른 소환·방어 장비로 생존.","고화력 변형: 슬라임샷→생명력 흡수→피의 저주→붉은 위엄 연쇄 추가."],"evidence":"라이아노즈 실제 승리 로그 #1 기반. 초반 구매 구역은 추천 재구성. 복잡한 연쇄가 필요해 뉴비에게는 실험용.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"stonewake","icon":"🪨","title":"스톤웨이크 · 자력 골렘","group":"신규 연구 빌드","level":"★★★","tagline":"골렘을 만들 때 자력화 주문이 반복 발동하는 공학형","idea":"스톤웨이크(Stonewake/Stone Wake)로 골렘을 만들고 북극(North Pole)으로 자력화(Magnetize)를 대량 발동시킨다. 생성 골렘 수만큼 레이저아이·철학자의 돌·마법 지팡이 같은 ‘시전 반응형’ 장비가 작동한다. 기존 소환수 물량전과 달리 소환 자체가 주문·장비 발동 스위치다.","first":["1~3구역은 특정 골렘이 없어도 버틸 수 있는 저비용 공격 또는 전열 소환으로 출발.","스톤웨이크(Stonewake)를 구매하고 소환 위치·지형에 익숙해진다.","북극(North Pole)을 제작/확보해 자력화(Magnetize) 연계를 활성화한다.","시전 반응 장비를 하나씩 추가하고 마지막에 물리 저항 보스 대책을 만든다."],"phases":[{"range":"1–3","target":"초반 버티기","actions":["원본은 지식 제단(Shrine of Knowledge)에서 얻은 강화된 레그헤드(Leghead)로 생존했다.","그 제단 보상은 확정이 아니므로 범용 공격·보호막/소환으로 대체한다."]},{"range":"4–7","target":"골렘 준비","actions":["스톤웨이크를 확보하고 골렘 소환이 안전하게 되는 지형을 고른다.","소환 행동 후 적이 본체를 공격할 수 있는지 확인한다."]},{"range":"8–12","target":"자력화 엔진","actions":["북극(North Pole)을 확보하여 Magnetize 발동을 늘린다.","레이저아이(Rayzoreye), 철학자의 돌(Philosopher’s Stone), 마법 지팡이(Magic Wand) 등의 장비 발동을 시험한다."]},{"range":"13–17","target":"수은·유령 연쇄","actions":["액체 자력(Liquid Magnetism)→수은화(Mercurize)와 유령 소환 연계는 선택적으로 확장한다.","시전 횟수가 늘어나면 성능 저하가 있는지 점검한다."]},{"range":"18–최종","target":"물리 저항 대응","actions":["혼돈의 발톱(Chaos Claws)이 달린 용발톱 군화(Dragonclaw Sabatons)나 다른 속성 보조를 준비한다.","유령/골렘이 고저항 보스에게 실제 피해를 주는지 전투 로그로 확인한다."]}],"spells":[{"name":"스톤웨이크 (Stonewake / Stone Wake)","up":"골렘 생성","reason":"자력화 엔진의 시작점","priority":"필수"},{"name":"자력화 (Magnetize)","up":"북극(North Pole) 장비와 연계","reason":"반복 발동의 중심 효과","priority":"필수 연계"},{"name":"액체 자력 (Liquid Magnetism)","up":"수은화 (Mercurize)","reason":"추가 유령 소환과 장비 트리거 확장","priority":"선택"},{"name":"용의 발톱 (Dragon Claw)","up":"혼돈의 발톱 (Chaos Claws)","reason":"물리 저항 적 보완용","priority":"선택"}],"gear":[{"name":"북극 (North Pole)","reason":"자력화(Magnetize)를 다수 발동하게 하는 핵심 장비","priority":"필수급"},{"name":"레이저아이 (Rayzoreye)","reason":"골렘 소환/시전 연쇄의 추가 피해 반응","priority":"중반"},{"name":"철학자의 돌 (Philosopher’s Stone)","reason":"반복 시전에 반응하는 보조 자원 엔진","priority":"중반"},{"name":"마법 지팡이 (Magic Wand)","reason":"반복 시전 연계","priority":"중반"},{"name":"용발톱 군화 (Dragonclaw Sabatons)","reason":"혼돈의 발톱 변형으로 물리 피해의 약점 보완","priority":"대체"}],"rotation":["초반 공격과 방어로 골렘 생성 준비 시간을 확보한다.","스톤웨이크로 골렘을 만들고 북극의 발동을 확인한다.","발동된 자력화/추가 공격으로 적 숫자가 줄어드는지 본다.","피해가 통하지 않는 적에게는 혼돈 속성 등 다른 공격을 적용한다."],"pitfalls":["원본 플레이어는 특정 제단 보상으로 초반을 버텼다. 같은 스타트를 고정적으로 재현할 수 없다.","북극과 다수의 시전 반응 장비를 갖추기 전에는 완성형처럼 강하지 않다.","물리 저항력이 높으면 골렘 물량만으로 부족할 수 있다.","자동 주문 발동이 지나치게 많아지면 게임 진행이 느려질 수 있다."],"boss":["일반 맵: 골렘 수만큼 발동하는 자력화를 이용해 광역 정리.","물리 저항 보스: 별도 혼돈·비물리 공격을 확보.","모르드레드: 시전 반응 장비가 충분하지 않다면 방어를 늘리고 다른 속성의 피해를 확보."],"variants":["골렘 물량형: 원본 #4의 스톤웨이크+북극 조합.","철 금속형: 원본 #20의 스톤웨이크+아마겟돈 블레이드(Armageddon Blade)+파멸의 낙인(Doombrand)."],"evidence":"라이아노즈 실제 승리 로그 #4·#20 기반. 초반 핵심 아이템의 입수는 무작위라 장비 의존성이 크다.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"skull","icon":"💀","title":"황금 해골 · 죽음의 손길","group":"신규 연구 빌드","level":"★★★","tagline":"원거리에서 ‘죽음의 손길’을 여러 해골이 반복 발동","idea":"뼈 손가락 왕관(Crown of Bony Fingers)은 강력한 죽음의 손길(Touch of Death)을 발동하지만 한 턴에 한 번 임의 대상을 노리기 쉬워 불안정하다. 황금 해골(Golden Skull)의 갑옷 해골(Armored Skull)로 왕관 효과를 복제하면 해골 수만큼 발동 횟수를 늘릴 수 있다.","first":["초반에는 언데드 소환·어둠 공격 외에도 최소한 하나의 안정적인 처리 수단을 확보한다.","황금 해골(Golden Skull)을 확보해 배치와 충전 수급을 연습한다.","뼈 손가락 왕관(Crown of Bony Fingers)을 제작/확보한 후 갑옷 해골(Armored Skull)을 우선 목표로 삼는다.","어둠 면역 몬스터에 화염의 손길(Flametouch)·황혼의 시선(Twilight Gaze)을 준비한다."],"phases":[{"range":"1–3","target":"언데드 스타트","actions":["죽음 계열 저비용 공격 또는 소환수로 시작한다.","이 단계의 고정 구매 순서는 원본에 명시되지 않았다. 생존용 보호막/공격을 우선한다."]},{"range":"4–7","target":"해골 안정화","actions":["황금 해골을 확보하고 적 공격을 분산할 위치에 배치한다.","해골을 한 위치에 몰아놓고 광역 피해를 함께 맞지 않게 한다."]},{"range":"8–12","target":"왕관 복제 엔진","actions":["뼈 손가락 왕관 + 갑옷 해골(Armored Skull)을 연결한다.","해골 여러 마리가 죽음의 손길을 발동하는지 확인한다."]},{"range":"13–17","target":"충전·속성 대책","actions":["영혼 수확자(Soul Harvester)로 해골 충전 수급을 보조한다.","화염의 손길(Flametouch), 황혼의 시선(Twilight Gaze)로 어둠 면역을 대비한다."]},{"range":"18–최종","target":"지형·보스 대응","actions":["흡혈귀의 손길(Touch of the Vampire) 및 유령구(Ghostball)로 장애물 많은 지형에 접근한다.","죽음의 손길 외의 속성 피해와 보호막으로 보스의 반격을 견딘다."]}],"spells":[{"name":"황금 해골 (Golden Skull)","up":"갑옷 해골 (Armored Skull)","reason":"왕관 효과를 복제하는 원거리 언데드","priority":"필수"},{"name":"죽음의 손길 (Touch of Death)","up":"최후의 손길 (Final Touch)은 선택","reason":"강력한 단일 피해의 핵심","priority":"필수 연계"},{"name":"영혼 수확자 (Soul Harvester)","up":"충전 보조","reason":"해골 사용 횟수 관리","priority":"중반"},{"name":"화염의 손길 (Flametouch)","up":"어둠 이외의 피해","reason":"어둠 면역 대응","priority":"중반"},{"name":"황혼의 시선 (Twilight Gaze)","up":"저항력 약화","reason":"어둠 저항/면역 대응","priority":"후반"},{"name":"흡혈귀의 손길 (Touch of the Vampire)","up":"유령구 (Ghostball)","reason":"장애물·사거리 문제 완화","priority":"선택"}],"gear":[{"name":"뼈 손가락 왕관 (Crown of Bony Fingers)","reason":"죽음의 손길을 해골들과 연계하는 빌드 필수품","priority":"필수"},{"name":"요정 판금 (Fae Plate)","reason":"해골을 준비하는 동안 본체 보호막","priority":"안전"},{"name":"다른 언데드/어둠 강화 장비","reason":"부족한 체력·시전 횟수 보완","priority":"대체"}],"rotation":["원거리에서 살아남을 수 있도록 해골을 나눠 배치한다.","왕관을 가진 해골이 실제로 죽음의 손길을 발동하는지 확인한다.","충전이 소모되면 영혼 수확자로 보충한다.","어둠 면역 적은 화염의 손길·황혼의 시선과 보조 피해로 처리한다."],"pitfalls":["왕관 제작 전에는 공격력이 폭발하지 않는다.","왕관만 있고 해골 숫자가 적으면 턴당 1회 무작위 공격의 한계가 남는다.","어둠 면역 적이 많으므로 단일 속성에 올인하면 실패한다.","최후의 손길(Final Touch)은 원본 플레이어가 제단에서 얻은 보너스다. 필수 구매로 가정하지 않는다."],"boss":["일반 몬스터: 여러 해골의 손길 공격으로 수적 우세.","고저항 적: 황혼의 시선과 화염의 손길로 속성 보완.","20구역 보스: 원본은 최후의 손길 추가 업그레이드 덕분에 매우 빠른 처치를 기록. 항상 보장되지는 않는다."],"variants":["왕관을 얻지 못했다면 다른 언데드 기반의 주력 피해 주문으로 전환.","더 높은 피해 변형: 진화 제단에서 최후의 손길(Final Touch)을 얻었을 때."],"evidence":"라이아노즈 실제 승리 로그 #16(Necromancer 챌린지) 기반. 왕관을 요구하므로 초보자에게는 후반 장비 의존형.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"blades","icon":"🗡️","title":"칼날 소환 · 음파 보호막","group":"신규 연구 빌드","level":"★★☆","tagline":"검 군단으로 전선을 만들고 음파 보호막으로 공격을 방어","idea":"칼날 소환(Summon Blade) 의식을 고속화해 한 턴에 다수의 검을 전개한다. 검은 몸으로 적 공격을 소모시키는 역할을 하고, 플레이어는 비전 방호·음파 보호막(Sonic Shields)으로 안전을 확보한다. 기존 늑대나 드래곤 소환과 달리 ‘소환수 자체가 소모 가능한 방패’라는 점이 핵심이다.","first":["초반에는 칼날 소환(Summon Blade)으로 한 번에 감당할 적 수를 제한한다.","피해량보다 검 소환 횟수와 안전한 소환 위치를 우선한다.","중반에 칼날 의식(Ritual of Blades)+검 제작(Bladeworks)을 목표로 한다.","양치기의 지팡이·전쟁군주 깃발·고속 의식 지팡이 중 제작 가능한 것을 확보한다."],"phases":[{"range":"1–3","target":"검으로 전선 만들기","actions":["칼날 소환을 공격과 어그로 분산 수단으로 사용한다.","소환수가 막을 수 없는 광역 주문 적은 별도로 제거한다."]},{"range":"4–7","target":"검 물량 증가","actions":["칼날 의식(Ritual of Blades), 검 제작(Bladeworks) 업그레이드를 모은다.","이 시점에는 일단 생존 가능한 검 숫자가 목표다."]},{"range":"8–12","target":"전선 폭증","actions":["양치기의 지팡이(Shepherd’s Staff), 전쟁군주 깃발(Warlord Banner), 고속 의식 지팡이(Rapid Ritual Rod)로 의식을 가속한다.","원본 클리어 기록에서는 장비가 갖춰져 1턴 약 12자루를 전개했다. 보편적 수치가 아니다."]},{"range":"13–17","target":"보호막·불멸 보강","actions":["음파 보호막(Sonic Shields)과 퀴푸 사가(Quipu Saga)를 추가한다.","천상의 우상(Heavenly Idol), 필멸성 유예(Suspend Mortality)로 검 재생을 시도한다."]},{"range":"18–최종","target":"보스 파훼","actions":["비전 방호(Arcane Warding)로 본체를 지킨다.","독침(Poison Sting)+산성(Acidity) 업그레이드로 모르드레드 3페이즈의 대책을 확보한다."]}],"spells":[{"name":"칼날 소환 (Summon Blade)","up":"칼날 의식 (Ritual of Blades), 검 제작 (Bladeworks)","reason":"소모 가능한 검 군단을 빠르게 양산","priority":"필수"},{"name":"음파 보호막 (Sonic Shields)","up":"퀴푸 사가 (Quipu Saga) 연계","reason":"보호막과 추가 피해","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"필수 업그레이드 아님","reason":"본체의 보호막 유지","priority":"중반"},{"name":"천상의 우상 (Heavenly Idol)","up":"불멸의 요새(Bastion of Immortality)","reason":"검의 생존력 강화","priority":"후반"},{"name":"필멸성 유예 (Suspend Mortality)","up":"대량 불멸 (Mass Immortality), 끝없는 삶 (Endlessness)","reason":"검 반복 부활","priority":"후반"},{"name":"독침 (Poison Sting)","up":"산성 (Acidity)","reason":"최종 보스에 별도 피해 경로","priority":"후반"}],"gear":[{"name":"양치기의 지팡이 (Shepherd’s Staff)","reason":"소환 개수 보완","priority":"핵심"},{"name":"전쟁군주 깃발 (Warlord Banner)","reason":"소환 개수 증가에 기여","priority":"핵심"},{"name":"고속 의식 지팡이 (Rapid Ritual Rod)","reason":"칼날 의식을 빠르게 시전","priority":"핵심"},{"name":"기사의 우리 (Knight Cage) + 사역마 목걸이 (Familiar’s Collar)","reason":"음파 보호막 연계 원래 실험 목적","priority":"선택"},{"name":"퀴푸 사가 (Quipu Saga)","reason":"음파 보호막 피해 보조","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"핵심 검 의식을 만들기 전 플레이어 보호","priority":"대체"}],"rotation":["안전 타일에서 검을 전방에 소환한다.","검이 적의 공격을 소모시키는 동안 위험한 상태이상 적을 직접 처리한다.","의식 업그레이드를 완성해 검 수를 늘리되 본체가 무방비인 채 채널링하지 않는다.","후반에는 비전 방호+검 부활을 유지하면서 보스의 유효 피해 수단을 점검한다."],"pitfalls":["검은 강한 피해보다는 어그로와 보호막 소모 역할이 더 중요하다.","고급 의식 장비가 없으면 물량이 덜 나오지만 빌드 자체는 굴러간다.","채널링 도중 기절·침묵 등으로 취소될 수 있어 시작 타일 선정이 중요하다.","검 물량만으로 막히는 보스에게는 산성 등 다른 피해가 필요하다."],"boss":["20구역: 보호막과 군중 제어로 장기전 대비.","오판: 피해 전가 적을 먼저 제거.","모르드레드: 원본은 독침(Poison Sting)+산성(Acidity)으로 3페이즈를 보완해 클리어."],"variants":["방어형: 검 물량+비전 방호만 우선해 중반 생존 연습.","완성형: 천상의 우상과 필멸성 유예로 무한 부활을 노린다."],"evidence":"라이아노즈 실제 승리 로그 #15 기반. 1턴 12자루는 특정 장비 조합이 완성된 원본 사례의 수치.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"seraph","icon":"🪽","title":"세라프 소환 · 불멸 우상","group":"신규 연구 빌드","level":"★★★","tagline":"신성 소환수를 살려 증식시키는 장기전 신성 빌드","idea":"세라프 소환(Call Seraph)으로 주력 천사 소환수를 만들고 천상의 우상(Heavenly Idol)과 필멸성 유예(Suspend Mortality)를 중첩한다. 영혼 수확자(Soul Harvester)로 소환 전력을 늘리고, 불기둥(Pillar of Fire)으로 첫 턴의 약한 구간을 메운다. 기존 아콘 소환과 달리 광선 보호막보다 불멸/복제 유지가 중심이다.","first":["초반에 세라프를 바로 구매하려고 공격 주문을 포기하지 않는다.","구역 시작 직후 적을 정리할 폭발 주문으로 불기둥(Pillar of Fire) 등을 준비한다.","세라프 소환(Call Seraph)과 천상의 우상(Heavenly Idol)을 연결한다.","영혼 수확자(Soul Harvester)로 증식할 수 있을 때 생존 지원을 추가한다."],"phases":[{"range":"1–3","target":"신성 입문","actions":["다수 적을 처리할 저가 공격 주문이나 소환수를 확보한다.","보스형 적뿐 아니라 구역 시작 직후 소환사와 원거리 적을 우선 정리한다."]},{"range":"4–7","target":"세라프 준비","actions":["세라프 소환(Call Seraph)을 확보할 SP를 모은다.","천상의 우상과 필멸성 유예의 연결 조건을 확인한다."]},{"range":"8–12","target":"불멸 연결","actions":["천상의 우상(Heavenly Idol)과 필멸성 유예(Suspend Mortality)를 함께 사용한다.","주문 충전 수급 수단으로 영혼 수확자(Soul Harvester)를 고려한다."]},{"range":"13–17","target":"초반 급사 방어","actions":["불기둥(Pillar of Fire)을 초기 광역 피해 수단으로 강화한다.","아름다움의 언령(Word of Beauty) 및 위기 부적(Crisis Charm) 등으로 본체를 보호한다."]},{"range":"18–최종","target":"제재로 보스 대응","actions":["제재(Sanction)의 무장 해제(Stripped Bare) 및 추방자(Exiled One) 업그레이드로 모르드레드를 대비한다.","신성 피해 무효인 적이 등장하면 별도 타입의 공격을 준비한다."]}],"spells":[{"name":"세라프 소환 (Call Seraph)","up":"기본 세라프 소환","reason":"후반 핵심 전투력","priority":"필수"},{"name":"천상의 우상 (Heavenly Idol)","up":"원본은 제단에서 강화형 획득","reason":"불멸 연계의 중심","priority":"핵심"},{"name":"필멸성 유예 (Suspend Mortality)","up":"소환수에게 생존 효과 부여","reason":"세라프 생존력 강화","priority":"핵심"},{"name":"영혼 수확자 (Soul Harvester)","up":"충전 수급","reason":"소환 지속력과 증식 보조","priority":"중반"},{"name":"불기둥 (Pillar of Fire)","up":"초기 피해","reason":"소환 전 취약 턴 보완","priority":"중반"},{"name":"제재 (Sanction)","up":"벌거벗기기 (Stripped Bare), 추방자 (Exiled One)","reason":"최종 보스의 방어·면역 대비","priority":"후반"},{"name":"아름다움의 언령 (Word of Beauty)","up":"상태이상/방어 확인","reason":"본체 급사 방지 보조","priority":"후반"}],"gear":[{"name":"위기 부적 (Crisis Charm)","reason":"한 번의 사고로 종료되는 상황에 대비","priority":"중요"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"세라프의 기본 성능 강화","priority":"대체"},{"name":"신성 지팡이 (Holy Staff)","reason":"신성 주문의 보조 성능 강화","priority":"대체"},{"name":"요정 판금 (Fae Plate)","reason":"세라프를 세우기 전 본체 보호막","priority":"초반 대체"}],"rotation":["불기둥 등 즉시 공격으로 첫 턴 위험한 원거리 적부터 줄인다.","안전한 뒤쪽 타일에서 세라프를 소환한다.","천상의 우상+필멸성 유예로 세라프가 전선을 유지하게 한다.","영혼 수확자로 충전 수급을 연결하고 본체는 위기 부적으로 급사를 대비한다."],"pitfalls":["원본 클리어는 지식 제단에서 강화된 천상의 우상을 얻은 행운이 있었다.","첫 턴 소환 전까지 공격에 취약하다.","신성 면역이나 소환수 제어를 하는 적에게 막힐 수 있다.","후반 핵심 주문이 여럿 필요해 초보자 스타트로는 권장하지 않는다."],"boss":["강한 원거리 보스: 첫 턴 전멸을 피하기 위해 본체 보호막과 즉시 피해가 필요.","신성 면역 보스: 불기둥 및 제재의 유효 공격 경로 확인.","모르드레드: 원본은 제재+Stripped Bare+Exiled One으로 최종 돌파."],"variants":["안전 변형: 세라프+본체 보호막 위주로 진행한 뒤 불멸 연계는 늦게 완성.","클리어 변형: 세라프+천상의 우상+필멸성 유예+영혼 수확자를 갖춘 원본 구성."],"evidence":"라이아노즈 실제 승리 로그 #19(Sanctumancer) 기반. 원본의 지식 제단 보상은 확정 획득 요소가 아니다.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"chaos","icon":"🌈","title":"혼돈 탄막 · 캔트립 연쇄","group":"신규 연구 빌드","level":"★★☆","tagline":"속성을 바꿔가며 정예·보스에게 집중 폭격","idea":"혼돈 탄막(Chaos Barrage)의 똑똑한 탄환(Smart Bolts)이 다양한 피해 속성 가운데 유효 속성을 찾아 집중 공격한다. 캔트립 연쇄(Cantrip Cascade)의 방출 융합(Evocation Amalgamation)으로 다단 공격을 강화한다. 기존 마법 미사일+분산과 달리 엘리트·단일 보스 처리에 초점을 맞춘다.","first":["시작: 혼돈 탄막(Chaos Barrage)을 구매할 수 있다면 주력 단일 공격 후보로 정한다.","초반: 똑똑한 탄환(Smart Bolts) 업그레이드로 저항력이 높은 정예를 처리한다.","중반: 캔트립 연쇄(Cantrip Cascade)+방출 융합(Evocation Amalgamation)을 목표로 SP를 축적한다.","후반: 신비로운 시야(Mystic Vision)와 공격 범위·사거리 증폭 장비를 추가한다."],"phases":[{"range":"1–3","target":"정예 대응","actions":["혼돈 탄막+똑똑한 탄환을 우선 목표로 한다.","충전 횟수가 부족하면 별도 저비용 광역 주문이나 소환수를 확보한다."]},{"range":"4–7","target":"중반 연결","actions":["캔트립 연쇄를 확보하고 해당 주문의 자동 발동 조건을 확인한다.","적을 한 방향으로 묶어 남는 탄환이 고체력 적에게 집중되도록 위치를 고른다."]},{"range":"8–12","target":"융합 다단 공격","actions":["방출 융합(Evocation Amalgamation)을 적용해 혼돈 탄막을 여러 번 시전하는 엔진을 만든다.","방어 수단이 빈약하면 비전 방호와 보호막 장비를 먼저 확보한다."]},{"range":"13–17","target":"사거리와 추가 피해","actions":["신비로운 시야(Mystic Vision)로 사거리 이점을 확보한다.","절멸자 지팡이(Annihilator Staff)·탐투의 눈(Eye of Tamtu) 등 시전 보조 장비를 제작한다."]},{"range":"18–최종","target":"보스 집중 폭격","actions":["저항력 높은 보스에 Smart Bolts의 유효 속성 탐색이 실제 작동하는지 확인한다.","체력 보상과 보호막 유지로 연속 공격을 버틴다."]}],"spells":[{"name":"혼돈 탄막 (Chaos Barrage)","up":"똑똑한 탄환 (Smart Bolts)","reason":"정예·고체력 적에 적합한 핵심 공격","priority":"필수"},{"name":"캔트립 연쇄 (Cantrip Cascade)","up":"방출 융합 (Evocation Amalgamation)","reason":"혼돈 탄막의 다단 발동 엔진","priority":"필수"},{"name":"신비로운 시야 (Mystic Vision)","up":"사거리 보조","reason":"벽/장거리 적을 공격할 기회 확대","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"보호막","reason":"초반 후의 급사 방지","priority":"중반"}],"gear":[{"name":"절멸자 지팡이 (Annihilator Staff)","reason":"혼돈 탄막의 추가 피해 및 방어 대응","priority":"후반"},{"name":"탐투의 눈 (Eye of Tamtu)","reason":"혼돈 연쇄 추가 피해","priority":"후반"},{"name":"요정 판금 (Fae Plate)","reason":"캔트립 엔진 완성 전 보호막을 제공","priority":"안전"},{"name":"시전 보조 지팡이","reason":"혼돈·주문 유형에 맞춘 보조 강화","priority":"대체"}],"rotation":["첫 턴에 어떤 적이 가장 위험한지 확인한다.","혼돈 탄막+똑똑한 탄환으로 고위험 정예 적을 먼저 제거한다.","캔트립 연쇄가 완성되면 적 여러 마리를 포함해 탄막이 고체력 적에게도 향하도록 배치한다.","남은 보스에는 속성 약점을 확인하며 반복 집중 공격을 한다."],"pitfalls":["혼돈 탄막은 태그가 Chaos·Sorcery 계열이라 특정 강화 장비 확보에 운이 따른다.","고체력 한 마리를 잘 잡아도 넓은 맵의 다수 적을 통제할 수단이 없으면 위험하다.","캔트립 엔진 이전에는 별도 생존·광역 수단이 필요하다.","방출 융합의 세부 발동 조건 및 업그레이드 가격은 게임 내 툴팁 우선."],"boss":["정예 적: 똑똑한 탄환으로 유효 피해 속성을 탐색.","다수 소환형 보스: 광역·소환수/보호막 보조를 함께 운용.","모르드레드: 원본 플레이어는 Smart Bolts가 유효한 속성을 찾아 승리했다고 보고."],"variants":["입문 변형: 혼돈 탄막+똑똑한 탄환을 단일 화력용으로 사용, 다른 주력 빌드 보조.","완성형: 캔트립 연쇄+방출 융합으로 다단 공격, 탐투의 눈/절멸자 지팡이 추가."],"evidence":"라이아노즈 실제 승리 로그 #7 기반. 비전 마법 미사일과 별개로 보스 집중 딜링에 특화된 구성.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"bloodworm","icon":"🪱","title":"벌레 증식 · HP 피해 반사","level":"★★★","tagline":"벌레를 소환·포식해 체력을 순환시키고 HP 소모를 광역 피해로 변환","idea":"벌레 생성(Lumbriogenesis)은 현재 HP 절반을 소모해 벌레를 만들고, 포식(Devour Flesh)은 아군 Living 벌레의 현재 HP만큼 회복시킨다. Worm Host를 얻으면 벌레 생성 충전 제한이 해제되고 매턴 HP 3이 회복된다. 고통의 거울(Pain Mirror)은 HP 손실/소비만큼 시야의 적에게 암흑 피해를 주며, Voodoo Doll·Bloodspike Helm·Orb of Infinite Slaughter가 공격 연쇄를 만든다. 체력 회복 차단과 희귀 재료 부족에 취약한 고난도형.","first":["1구역: Blood Bullet을 기본 공격으로, HP를 과하게 쓰지 않는다.","2~4구역: Lumbriogenesis+Devour Flesh로 벌레를 소환한 뒤 포식하는 기본 회복 루틴을 만든다.","4~7구역: Worm Host 확보 목표. 6SP 업그레이드 이전에는 무한 소환으로 오해하지 않는다.","6~10구역: Voodoo Doll 또는 Bloodspike Helm을 만들어 HP 소비를 직접 공격으로 바꾼다.","10~14구역: Pain Mirror와 Illusory Pain; 암흑 면역이 문제면 Burning Pain으로 화염 추가.","14~18구역: Mass Feeding+Hemocorruptor 또는 Orb of Infinite Slaughter 폭발 시너지 준비.","19~21구역: Arcane Warding·독 대응·Stripped Bare로 보스 저항과 급사 대처."],"phases":[{"range":"1–3","target":"혈탄과 HP 관리","actions":["Blood Bullet은 HP를 소모하므로 적은 수를 안전하게 처치한다.","독·암흑 저항·장거리 공격 적이 많은 균열을 피하고 회복 기회를 우선한다."]},{"range":"3–6","target":"벌레→포식 순환","actions":["Lumbriogenesis로 현재 HP 절반을 써 소환한 Living 벌레를 Devour Flesh로 먹어 회복한다.","Worm Host는 충전 제한을 없애고 매턴 HP 3 재생. 이때부터 반복 소환이 편해진다.","HP 부족 시 더 소환하지 말고 포식/이동으로 생존을 우선한다."]},{"range":"6–10","target":"HP 소비를 반격으로","actions":["Voodoo Doll은 시작 시 고HP 적 다섯을 묶고 HP 소비에 물리 피해를 보낸다.","Bloodspike Helm은 HP 소비량을 시야 안 적 최대 셋에 물리 피해로 적용한다.","Pain Mirror는 14턴 동안 HP 소비·피해 시 시야의 적에 암흑 피해. 시전도 HP 11 소모한다."]},{"range":"10–15","target":"피해 유형 확대","actions":["Pain Mirror→Burning Pain으로 화염 피해를 추가해 암흑 저항을 넘는다.","Devour Flesh→Mass Feeding으로 아군 회복 범위를 늘리고 Hemocorruptor의 독 피해와 연결한다.","Crimson Coronet의 소환수 화염 오라는 Bloodspike Helm과 같은 머리 장비라 대체 경로다."]},{"range":"15–19","target":"희귀 구체·장기전","actions":["Orb of Infinite Slaughter의 사망 폭발은 Dark 피해이며 피해만큼 본체를 회복한다.","구체는 Chaos·Dragon·Enchantment·Holy·Nature·Orb 각 1을 필요로 하므로 재료가 나오지 않으면 Voodoo Doll/Pain Mirror 중심으로 계속 진행한다.","Flagellant's Cup으로 디버프 1개 제거를 노리되 매턴 HP 1 지불을 감안한다."]},{"range":"20–21","target":"보스 대비","actions":["독은 포식 회복을 막을 수 있으니 정화 수단·시야·후퇴 위치를 우선한다.","Sanction→Stripped Bare로 높은 저항을 0으로 낮추거나 다른 유효 피해 유형을 준비한다.","벌레 폭발만으로 못 끝내는 모르드레드는 보호막·직접 피해를 병행한다."]}],"spells":[{"name":"혈탄 (Blood Bullet)","up":"초반 기본","reason":"초반 물리 공격(HP 비용 있음)","priority":"시작"},{"name":"벌레 생성 (Lumbriogenesis)","up":"Worm Host (6SP)","reason":"현 HP 절반 소비해 벌레 생성; 업그레이드 후 무제한 충전+턴당 3HP","priority":"필수"},{"name":"포식 (Devour Flesh)","up":"Controlled Appetite (1SP), Mass Feeding (2SP)","reason":"인접 Living 아군을 포식해 HP 회복·광역 아군 회복","priority":"필수"},{"name":"고통의 거울 (Pain Mirror)","up":"Illusory Pain (1SP), Burning Pain (6SP)","reason":"HP 지출·피격량을 시야 내 Dark/Fire 피해로 변환","priority":"핵심"},{"name":"제재 (Sanction)","up":"Stripped Bare (6SP)","reason":"보스 저항을 0으로 만들기 위한 저주","priority":"후반"},{"name":"혈액 이동 (Bloodshift)","up":"Blood Greed (3SP)","reason":"Dark 광역 타격·본체 회복 대안","priority":"선택"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"HP 비용 사용 직후 보호막","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"독·강한 적 포위에서 벗어남","priority":"생존"}],"gear":[{"name":"부두 인형 (Voodoo Doll)","reason":"HP 소비를 물리 피해로 변환 [Trinket / 제작: Blood×1 + Enchantment×1 + 자유×2, 총 4]","priority":"초중반"},{"name":"혈침 투구 (Bloodspike Helm)","reason":"HP 소비 시 최대 3명에게 물리 피해 [Head / 제작: Blood×1 + Eye×1 + Metallic×1 + 자유×3, 총 6]","priority":"핵심"},{"name":"무한 학살의 구체 (Orb of Infinite Slaughter)","reason":"유닛 사망 시 인접 Dark 폭발+회복, 재료 수급 난도 큼 [Trinket / 제작: Chaos×1 + Dragon×1 + Enchantment×1 + Holy×1 + Nature×1 + Orb×1, 총 6]","priority":"후반"},{"name":"혈오염기 (Hemocorruptor)","reason":"아군 회복 시 최대 3명의 적에 Poison 피해 [Trinket / 제작: Blood×1 + Dark×1 + Nature×1 + 자유×3, 총 6]","priority":"중반"},{"name":"진홍 왕관 (Crimson Coronet)","reason":"소환수 화염 오라, 혈침 투구와 같은 머리 칸 [Head / 제작: Blood×1 + Fire×2 + Conjuration×1 + 자유×3, 총 7]","priority":"대안"},{"name":"고행자의 잔 (Flagellant's Cup)","reason":"매턴 HP 1 소모하고 디버프 하나 제거 [Trinket / 제작: Blood×1 + Holy×1 + 자유×3, 총 5]","priority":"생존"},{"name":"피의 불꽃 지팡이 (Blazeblood Staff)","reason":"Blood/Fire 주문 퀵캐스트 [Weapon / 제작: Arcane×1 + Blood×1 + Fire×1 + 자유×4, 총 7]","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보호막 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"}],"craftNotes":["속성 재료 예: Heart Fragment(Blood), Blood Basin(Blood+Ritual), Devil's Blood(Blood+Chaos), Relocator Beacon(Orb+Translocation).","무한 학살의 구체는 총 6개 요구 태그가 모두 다르다. 모자란 속성 하나 때문에 제작이 늦을 수 있다.","혈침 투구와 진홍 왕관은 머리 장비 양자택일. 레시피의 숫자는 제작 태그 요구량이며 재료 하나가 태그 여럿을 지닐 수 있다."],"auto":["Worm Host: Lumbriogenesis 무제한 충전과 매턴 HP 재생은 상시 효과지만 벌레를 실제로 소환하는 행동은 직접 필요.","Voodoo Doll·Bloodspike Helm·Pain Mirror: HP 소비 발생 시 연계 피해 자동 발동. Pain Mirror는 미리 시전해야 함.","Orb of Infinite Slaughter: 유닛 사망 조건부 폭발, 몬스터의 Dark 저항과 폭발 위치에 영향 받음."],"rotation":["초반 혈탄으로 몬스터 수 줄이기.","벌레 생성→포식 회복을 먼저 안정화.","고통의 거울/보호막을 사용한 뒤 체력 지출로 연계 공격.","적과 본체 사이 벌레를 유지하면서 독·암흑 저항 강한 대상 따로 처리.","보스는 Sanction/물리/화염 및 보호막으로 마무리."],"pitfalls":["Lumbriogenesis는 현재 HP의 절반을 소모하므로 과도하게 반복하면 HP가 바닥난다.","독 상태는 회복을 막으므로 Devour Flesh 활용이 봉쇄될 수 있다.","Pain Mirror는 시야 내 적만 공격한다.","혈침 투구/진홍 왕관은 같이 착용할 수 없다.","희귀 구체가 없다고 진행을 멈추지 않는다.","혈마법 트라이얼의 재료 우선순위를 일반 게임에 그대로 적용할 필요는 없다."],"boss":["Dark+Fire 저항이 높으면 Sanction→Stripped Bare나 Physical 보조 공격 확보.","공격 차수가 많으면 HP 기반 몸빵만으로 위험하므로 Arcane Warding으로 보호.","모르드레드에게 벌레 사망 폭발이 충분히 들어가지 않으면 별도 직접 피해로 전환."],"variants":["수동 생존형: Worm Host+Devour Flesh+비전 방호.","혈비용 반사형: Voodoo Doll+Bloodspike Helm+Pain Mirror.","사망 폭발형: Orb of Infinite Slaughter 중심(제작 의존).","소환/회복 독형: Mass Feeding+Hemocorruptor."],"evidence":"실제 엔딩 승리 로그 #5 및 Steam Hemomancer 트라이얼과 대조. 마법, 업그레이드, 장비 레시피는 2026-10-12 live 게임 데이터 확인. 구역 시점은 권장 재구성.","sources":[["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Hemomancer Trial 실전","https://steamcommunity.com/app/4366330/discussions/0/589561964325498148/"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드"},{"id":"rainzap","icon":"🌧️","title":"폭우 · 급류 · 자동 감전","level":"★★☆","tagline":"비구름으로 젖음을 유지하고 장신구가 매턴 감전·물 정령은 전열 담당","idea":"Rain Storm과 Torrent는 Soaked를 부여한다. 젖음은 Ice/Lightning 저항 각각 -50%, Fire 저항 +50%다. Dowsing Spark(장신구)가 젖은 적 최대 20명에게 매턴 Lightning 5 피해를 자동 발생시키고, Rain Storm→Living Rain이 매턴 Water Elemental을 소환한다. 초반 적 제압과 채널링 효율은 좋지만 자동 감전 단독 피해는 낮아 중후반 Lightning 직접 공격과 생존이 필요하다.","first":["1구역: Lightning Bolt로 생존.","2~3구역: Rain Storm·Torrent 중 가능한 것을 확보해 Soaked 부여.","3~5구역: Dowsing Spark 제작. Lightning×1+Nature×1+Translocation×1+자유×2.","5~9구역: Torrent는 3칸 너비의 물리 피해 채널·밀쳐내기. 본체 안전 위치에서 시전.","9~13구역: Rain Storm→Living Rain으로 매턴 물 정령을 생성.","13~17구역: Rain Beacon·Acid Rain·Stagnation Basin 등 지속 확장.","18~21구역: Chain Lightning·Arcane Warding·Teleport로 보스와 저항 몬스터에 대응."],"phases":[{"range":"1–3","target":"물·번개 스타트","actions":["Lightning Bolt 한 종류로 일단 클리어하고 Rain Storm으로 젖음 공급.","구름이 실제 적 위치에 생기는지 확인. Personal Storms가 있으면 적 점유 타일에도 생성."]},{"range":"3–6","target":"Dowsing Spark 자동 감전","actions":["Dowsing Spark는 매턴 Soaked 적 최대 20명에게 Lightning 5피해(장신구).","Torrent는 3칸 너비 물리 피해·Soaked 6턴·밀쳐내기, 최대 6턴 채널.","채널링 중 다른 주문·이동이 제한되므로 안전한 통로에서 시작한다."]},{"range":"6–10","target":"물 정령으로 방어","actions":["Rain Storm→Living Rain은 매턴 아군 비구름에서 Water Elemental 2마리를 생성.","물 정령은 물리 저항 75%, Soaked 상태에서 턴당 15HP 회복(물리 완전 면역 아님).","정령이 공격을 받아 주는 동안 Torrent로 밀어내고 Dowsing Spark가 자동 타격."]},{"range":"10–15","target":"범위와 피해 유형 확장","actions":["Rain Beacon으로 구름 자동 생성 또는 Acid Rain·Stagnation Basin으로 Poison 피해 추가.","번개 피해는 Soaked의 저항 -50%와 시너지, Fire 공격은 Soaked의 저항 +50% 때문에 불리.","Robe of Storms는 Ice/Lightning로 적을 죽이면 보호막 획득. Fae Plate와 몸 슬롯 양자택일."]},{"range":"16–19","target":"중반 화력 정체 극복","actions":["Torrent 물리와 Dowsing Spark 번개만으로 고HP 적을 못 잡으면 Chain Lightning 구매.","빙결/기절·침묵 원거리 적이 있는 균열에서 장시간 Torrent 채널링은 피한다.","Arcane Warding·Teleport로 시작 위치 위험 줄이기."]},{"range":"20–21","target":"보스 지속전","actions":["Soaked를 먼저 걸고 Lightning 직접 피해를 쌓는다. 장신구 기본 5/턴만 믿지 않는다.","높은 물리·번개 저항 적에게 Poison/저항 감소로 대체.","보스 패턴이 위험하면 Torrent 채널을 고집하지 않고 본체 보호막·이동을 우선한다."]}],"spells":[{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"초반·보스 Lightning 직접 피해","priority":"시작"},{"name":"폭우 (Rain Storm)","up":"Living Rain (4SP), Personal Storms (2SP)","reason":"구름 Soaked 공급·물 정령 소환","priority":"핵심"},{"name":"급류 (Torrent)","up":"Dangerous Debris (2SP), Water Bend (3SP)","reason":"물리 채널 피해·젖음·밀쳐내기","priority":"핵심"},{"name":"폭우 (Rain Storm)","up":"Acid Rain (4SP)","reason":"후반 Poison 대체 피해","priority":"선택"},{"name":"연쇄 번개 (Chain Lightning)","up":"Cloud Conductance (2SP)","reason":"고HP 보스 Lightning 직격","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"채널링 시작 전 보호막","priority":"생존"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"위험한 채널 중단·탈출","priority":"생존"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"실드형 보스 대응","priority":"후반"}],"gear":[{"name":"감전 탐지기 (Dowsing Spark)","reason":"매턴 Soaked 대상 최대 20명 Lightning 피해 [Trinket / 제작: Lightning×1 + Nature×1 + Translocation×1 + 자유×2, 총 5]","priority":"핵심"},{"name":"비 신호기 (Rain Beacon)","reason":"매턴 무작위 비구름 자동 생성 [Trinket / 제작: Nature×2 + Translocation×1 + 자유×2, 총 5]","priority":"확장"},{"name":"고인 물 대야 (Stagnation Basin)","reason":"Soaked 적을 10턴 Poison 상태로 [Trinket / 제작: Nature×1 + 자유×3, 총 4]","priority":"대체"},{"name":"폭풍 로브 (Robe of Storms)","reason":"Ice/Lightning 처치 시 보호막 1 [Body / 제작: Ice×1 + Lightning×1 + Nature×1 + 자유×3, 총 6]","priority":"후반"},{"name":"요정 판금 (Fae Plate)","reason":"초반 턴당 보호막 유지, 몸통 로브와 택일 [Body / 제작: Arcane×1 + Metallic×1 + 자유×2, 총 4]","priority":"안전"},{"name":"갈바닉 초점 (Galvanic Focus)","reason":"번개 저항 감소 보조, 값은 게임 툴팁 우선 [Trinket / 제작: Lightning×1 + Metallic×1 + 자유×3, 총 5]","priority":"선택"}],"craftNotes":["재료 예: Lightning Jar(Lightning), Wildflower(Nature), Mirror Stone(Ritual+Translocation), Charged Cog(Metallic+Lightning).","Dowsing Spark를 3~5구역에 만들면 빠르지만 재료/균열 운에 달린다. Rain Beacon은 이후 목표.","Fae Plate와 Robe of Storms는 같은 몸통 칸; 둘 중 하나만 선택."],"auto":["Rain Storm/Torrent로 Soaked를 유지하면 Dowsing Spark가 매턴 Lightning 피해를 자동 발생.","Living Rain은 비구름에서 Water Elemental 매턴 소환; Rain Beacon은 구름 범위 확장.","Torrent 자체는 채널 중 자동으로 반복 타격하나 마법사는 다른 행동을 하기 어렵다."],"rotation":["폭우/급류로 적에게 Soaked 적용.","감전 탐지기 자동 공격과 물 정령 전열 형성.","채널링 중 원거리 위험 적부터 처리.","부족한 화력을 Chain Lightning/Acid Rain으로 보강.","보스에선 실드와 순간이동을 먼저 확보."],"pitfalls":["Dowsing Spark는 젖은 적이 없으면 자동 피해가 없다.","Water Elemental 물리 저항 75%는 완전 면역이 아님.","채널 중 적 기절·침묵과 피격에 취약.","Soaked는 Fire 저항을 높여 화염 보조 공격 효율이 낮아짐.","일부 실제 승리 기록에서도 중반 딜이 막혀 추가 주문을 선택했다.","감전 5피해/턴만으로 최종 보스 클리어가 보장되지 않는다."],"boss":["물리 저항 적은 Soaked→Lightning로.","Lightning 저항 적은 Torrent 물리·Acid Rain Poison 등 대안.","모르드레드는 Dowsing Spark 외 고화력 직접 공격을 별도로 확보."],"variants":["안정형: Rain Storm+Torrent+Dowsing Spark.","소환형: Living Rain+Rain Beacon.","독혼합: Acid Rain+Stagnation Basin.","보스형: Soaked+Chain Lightning+Arcane Warding."],"evidence":"Steam 초반/승리 사례와 일본 별도 승리 로그 대조. 실제 데이터에서 Soaked의 내성 변경과 감전 5피해/20대상, 물 정령 물리 저항 75% 확인. 중반 딜 부족을 경고했으며 구역은 추천 재구성.","sources":[["Steam Torrent + Rain Storm 실전 의견","https://steamcommunity.com/app/4366330/discussions/0/573791755377536594/"],["실제 엔딩 승리 로그(일본)","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Steam 실전 빌드·생존 공략","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["주문·장비 데이터(라이브 24995190)","https://github.com/hpp3/rw3"],["실시간 주문·장비 Compendium","https://hpp3.github.io/rw3/"]],"group":"신규 연구 빌드"},{"id":"revelation","icon":"📖","title":"계시록 의식 · 천사 강림","level":"★★★","tagline":"금서가 부여하는 긴 의식에서 Holy Fire 자동 발동·처치 시 세라프 소환","idea":"Book of Revelation은 주문이 아니라 금지 주문 Ritual of Revelation을 부여하는 장신구다. 의식은 HP 77을 소모하고 최대 12턴 동안 매턴 시야의 적 최대 3명에게 Holy Fire를 자동 시전한다. 완료 시 False Prophet 7마리를 소환한다. Holy Fire→Heaven Call은 목표 처치에 성공해야 Call Seraph가 추가 발동한다. Multimancer's Staff로 대상 수를 늘릴 수 있지만 준비 없이 쓰면 의식 중 사망하기 쉽다.","first":["1구역: Holy Fire(화염·성속성 십자 공격)로 시작.","2~5구역: Blinding Light→Halting Light로 실명·기절 제어.","5~8구역: Arcane Warding 또는 Fae Plate로 보호막 확보.","8~12구역: Holy Fire→Heaven Call·Divine Blaze 중 SP에 맞게 구매.","12~16구역: Book of Revelation 제작(성1+혈1+의식1+언령1+자유5), HP 77 비용에 대비.","16~19구역: Ritual of Revelation을 보호막 뒤에서 채널링. The Witness를 추가하면 자동 Blinding Light.","19~21구역: Multimancer's Staff·Permanence→Reality Hold, 보스용 다른 속성 공격 추가."],"phases":[{"range":"1–3","target":"성화 기본 공격","actions":["Holy Fire는 수직 Fire, 수평 Holy 피해. Demon/Undead에 기절 적용.","광역 범위를 잘 잡고 불필요한 주문 구매를 자제한다."]},{"range":"4–7","target":"실명·보호막","actions":["Blinding Light로 시야 내 적 실명, Halting Light로 2턴 기절을 추가.","Arcane Warding·Fae Plate로 의식 전 생존 습관을 익힌다."]},{"range":"8–12","target":"Heaven Call 준비","actions":["Holy Fire→Heaven Call은 그 Holy Fire가 목표를 죽여야 Seraph 소환. 타격마다 무조건 소환이 아니다.","Divine Blaze는 Holy Fire를 시전할 때 Blazerip 추가 시전으로 다른 속성을 보강한다."]},{"range":"12–16","target":"금서와 HP 준비","actions":["Book of Revelation은 Holy×1+Blood×1+Ritual×1+Word×1+Any×5 총9 요구.","부여되는 Ritual of Revelation은 HP 77 비용, 12턴 채널, 매턴 시야 내 최대3 적 타격. 시작 전에 체력·보호막 확보.","책을 해제하면 그 주문도 사라지므로 교체하지 않는다."]},{"range":"16–19","target":"자동 성화 의식","actions":["매턴 의식이 Holy Fire를 자동 시전하며 끝까지 채널하면 False Prophet 7명을 소환한다.","The Witness는 채널 중 Blinding Light를 추가 자동 시전. Multimancer's Staff는 대상 수 +50%.","Permanence→Reality Hold는 이미 소환한 임시 세라프를 유지하는 선택형이다."]},{"range":"20–21","target":"보스와 면역 대응","actions":["단일 보스만 남으면 Heaven Call 처치 시너지가 약해진다.","Holy/Fire 저항·Sorcery/Enchantment 면역을 확인하고 직접 소환수·Blazerip 등 대체 공격.","의식 유지가 위험하면 수동 공격·보호막·Teleport로 전환한다."]}],"spells":[{"name":"계시 의식 (Ritual of Revelation)","up":"The Witness (5SP), Holy Horde (6SP)","reason":"Book of Revelation에서만 부여, HP77 소비·긴 채널","priority":"금서 획득 후"},{"name":"성화 (Holy Fire)","up":"Heaven Call (6SP), Divine Blaze (4SP)","reason":"처치 시 세라프 소환·Blazerip 추가 피해","priority":"핵심"},{"name":"눈부신 빛 (Blinding Light)","up":"Halting Light (5SP)","reason":"시야 내 적 실명/기절","priority":"제어"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"긴 의식 시작 전 보호막","priority":"필수"},{"name":"영속성 (Permanence)","up":"Reality Hold (4SP)","reason":"임시 아군 영구화","priority":"후반"},{"name":"세라프 소환 (Call Seraph)","up":"기본","reason":"Heaven Call 연계/직접 소환 선택","priority":"선택"},{"name":"순간이동 (Teleport)","up":"Quickcast (3SP)","reason":"의식 중단·탈출","priority":"생존"},{"name":"제재 (Sanction)","up":"Stripped Bare (6SP)","reason":"저항 높은 보스 대안","priority":"후반"}],"gear":[{"name":"계시록 (Book of Revelation)","reason":"Ritual of Revelation 금지 주문 부여. 제거하면 주문도 제거 [Trinket / 제작: Holy×1 + Blood×1 + Ritual×1 + Word×1 + 자유×5, 총 9]","priority":"핵심"},{"name":"멀티맨서 지팡이 (Multimancer's Staff)","reason":"전체 주문/장비 대상 +50%, 의식 공격 대상 증가 [Weapon / 제작: Arcane×1 + Translocation×1 + 자유×6, 총 8]","priority":"무기 핵심"},{"name":"신속 의식 지팡이 (Rapid Ritual Rod)","reason":"Ritual 채널당 발동 추가, 멀티맨서와 무기 택일 [Weapon / 제작: Ritual×2 + 자유×5, 총 7]","priority":
