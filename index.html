<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;color-scheme:light;--bg:#f5f6f8;--surface:#fff;--surface2:#f1f4f7;--line:#dbe0e7;--text:#17212e;--muted:#657282;--accent:#3666c8;--accentbg:#eaf1ff;--green:#187d59;--shadow:0 10px 36px #15233c12}
[data-theme="dark"]{color-scheme:dark;--bg:#111823;--surface:#1b2634;--surface2:#243244;--line:#344456;--text:#ecf2f9;--muted:#aab8c8;--accent:#8cb5ff;--accentbg:#293e60;--green:#74dab3;--shadow:0 8px 28px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.65}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:row}.main{min-width:0;flex:1;transition:margin .2s}.content{max-width:980px;padding:33px 40px 100px;margin:0 auto}.top{position:sticky;top:0;z-index:5;padding:10px 24px;background:color-mix(in srgb,var(--surface) 96%,transparent);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px)}.brand{font-weight:800;font-size:15px;white-space:nowrap}.top small{color:var(--muted);white-space:nowrap}.top .push{flex:1}.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:8px 12px;font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.tabs{display:flex;gap:7px;flex-wrap:wrap;position:relative;margin:22px 0 26px}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 13px;font-weight:650}.tabs button[aria-selected=true]{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}.side{width:286px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--line);background:var(--surface);transition:width .22s,transform .22s;z-index:7;scrollbar-width:thin}.side.closed{width:0;border:0;overflow:hidden}.sideInner{width:285px;padding:18px 16px 26px}.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.shead h2{margin:0;font-size:16px}.side button.iconbtn,.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;width:33px;height:33px;display:grid;place-items:center}.search{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;outline-offset:2px}.search:focus{outline:2px solid var(--accent)}.sgroup{margin-top:20px}.sgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;padding-left:8px}.navitem{width:100%;border:0;background:transparent;color:var(--text);text-align:left;border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:flex-start}.navitem:hover{background:var(--surface2)}.navitem.active{background:var(--accentbg);color:var(--accent);font-weight:750}.navitem .emoji{font-size:18px;line-height:1.2}.navitem .ntext{font-size:13px;line-height:1.38}.navitem .desc{display:block;color:var(--muted);font-size:11px;font-weight:450;margin-top:3px}.sideNote{margin:25px 8px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:14px}.kicker{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.02em;margin-bottom:8px}h1{font-size:clamp(26px,4.5vw,38px);letter-spacing:-.04em;line-height:1.28;margin:0 0 12px}h2{font-size:21px;letter-spacing:-.025em;margin:28px 0 12px}h3{font-size:16px;margin:20px 0 8px}p{margin:10px 0 15px}.lede{color:var(--muted);font-size:15px;max-width:850px}.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{background:var(--surface2);border:1px solid var(--line);padding:3px 10px;border-radius:50px;font-size:12px;color:var(--muted);font-weight:650}.chip.good{color:var(--green)}.card{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:19px;margin-bottom:13px;box-shadow:var(--shadow)}.card.flat{box-shadow:none}.card h3{margin-top:0}.card p:last-child{margin-bottom:0}.summary{border-left:4px solid var(--accent);padding:18px 20px;border-radius:0 13px 13px 0;background:var(--surface)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cards .card{margin:0;box-shadow:none}.step{display:flex;gap:15px;margin:0;padding:18px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.stepnum{width:76px;flex-shrink:0;text-align:center;background:var(--surface2);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:850;height:max-content}.step h3{margin:0 0 6px;font-size:16px}.step p{margin:4px 0}.step ul{margin:6px 0 0;padding-left:20px}.step li{margin-bottom:5px}.cleanlist{padding-left:22px}.cleanlist li{margin:7px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:15px 0}table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}th,td{padding:12px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:750;background:var(--surface2)}tr:last-child td{border-bottom:0}td:first-child{font-weight:700;min-width:160px}.note{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px;color:var(--muted);margin:15px 0}.timeline{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 18px}.checkline{display:flex;align-items:flex-start;gap:11px;padding:11px 3px;border-bottom:1px solid var(--line);cursor:pointer}.checkline:last-child{border:0}.checkline input{width:17px;height:17px;accent-color:var(--accent);margin-top:4px}.checkline span{flex:1}.progress{height:7px;border-radius:100px;background:var(--surface2);overflow:hidden;margin:8px 0 17px}.fill{height:100%;background:var(--green);width:0;transition:width .2s}.flexbetween{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.source a{display:inline-block;color:var(--accent);text-decoration:none;font-weight:650;margin:0 12px 8px 0}.source a:hover{text-decoration:underline}.footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px;margin-top:35px}.empty{text-align:center;color:var(--muted);padding:28px}.tipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tipgrid .card{box-shadow:none;margin:0}.tipgrid .em{font-size:23px}.callout{margin:20px 0;background:var(--accentbg);color:var(--text);padding:15px 18px;border-radius:12px}.toggleFloat{display:none}.mobileShade{display:none}.jump{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;margin-top:22px}a{color:var(--accent)}
@media(max-width:820px){.content{padding:25px 18px 80px}.top{padding:9px 12px}.top small{display:none}.side{position:fixed;right:0;top:0;box-shadow:-18px 0 40px #0003;transform:translateX(0)}.side.closed{width:286px;transform:translateX(110%);border-left:1px solid var(--line)}.mobileShade{display:block;position:fixed;inset:0;background:#0007;z-index:6}.mobileShade.hidden{display:none}.btn.widehide{display:none}.cards,.tipgrid{grid-template-columns:1fr}.stepnum{width:64px}}
@media print{body{background:white;color:black}.top,.side,.tabs,.jump,.btn,.sideNote{display:none!important}.content{max-width:100%;padding:0} .card{break-inside:avoid;box-shadow:none}.step{break-inside:avoid}.pageBreak{break-before:page}}
</style>

<body><div class="app"><main class="main"><header class="top"><span class="brand">⚔️ RW3 생존·빌드 공략집</span><small>대화 요약본</small><span class="push"></span><button class="btn widehide" id="theme" title="화면 테마 변경">◐ 테마</button><button class="btn" id="share" title="현재 페이지 주소 복사">🔗 링크</button><button class="btn primary" id="sidebarToggle" aria-expanded="true">☰ 목차 접기</button></header><div id="appBody" class="content"></div></main><div id="shade" class="mobileShade hidden"></div><aside class="side" id="sidebar"><div class="sideInner"><div class="shead"><h2>📚 페이지 목차</h2><button class="iconbtn" id="sideClose" aria-label="목차 닫기">✕</button></div><input id="search" class="search" aria-label="빌드 검색" placeholder="🔍 빌드·마법 검색  /" autocomplete="off"><div id="nav"></div><div class="sideNote">각 빌드는 <b>개요 / 성장 순서 / 주문·장비 / 전투·대응</b>으로 구분됩니다. 체크 상태는 이 브라우저에만 저장됩니다.</div></div></aside></div>
<script>
const D = {"builds":[{"id":"wyrm","icon":"🥚","title":"고룡의 알 · 드레이크 탑승","group":"입문 추천","level":"★★☆","tagline":"소환수로 버티며 반복 소환을 완성하는 첫 엔딩 후보","idea":"고룡의 알(Wyrm Eggs)을 확보한 뒤 용을 전개하고, 드레이크 탑승(Ride Drake)·용들의 비행(Flight of the Dragons)·드래곤 사냥꾼의 인장(Dragon Hunter’s Sigil)을 연결해 소환 전력을 유지한다. 후반에는 마법사 소환(Summon Wizard)으로 화력을 보완한다.","first":["1구역: 저비용 공격 1개로 안전하게 시작. 늑대(Wolf)는 안전형 선택이지만 알 구매가 늦어진다.","2~3구역: 불필요한 주문 구매를 줄이고 고룡의 알(Wyrm Eggs) 구매 자금 확보.","3~5구역: 고룡의 알 구매 후 알이 부화할 시간을 확보하고 마법사는 후방 유지.","장비는 얼음 소환사(Ice Caller)·양치기의 지팡이(Shepherd’s Staff)처럼 제작 가능한 것을 먼저 사용."],"phases":[{"range":"1–3","target":"기본 생존·SP 저축","actions":["저비용 공격 하나로 약한 균열을 선택한다.","각 맵 시작 전에 위협 범위(T)를 확인하고 소환수나 벽 뒤에서 한 턴을 벌어준다.","고룡의 알 구매를 목표로 SP를 보유한다."]},{"range":"3–5","target":"고룡의 알 확보","actions":["고룡의 알(Wyrm Eggs)을 구매한다(3구역 목표는 빠른 기록, 4~5구역도 괜찮음).","알이 부화하기 전에 맞아 죽지 않도록 적의 원거리 공격을 제거하거나 시야를 끊는다.","알을 플레이어와 적 사이에 소환하되 광역 공격 한 번에 같이 맞지 않도록 한다."]},{"range":"6–10","target":"소환 유지력","actions":["얼음 소환사(Ice Caller) 또는 양치기의 지팡이(Shepherd’s Staff) 중 가능한 장비를 먼저 제작한다.","고룡 영혼 갑옷(Wyrm Spirit Armor)을 노리되 재료가 안 나오면 기다리지 않는다.","알/드래곤이 전장에 유지되는 시간을 늘리고 주문 충전 관리에 익숙해진다."]},{"range":"11–15","target":"반복 소환 엔진","actions":["드레이크 탑승(Ride Drake)과 용들의 비행(Flight of the Dragons)을 확보한다.","드래곤 사냥꾼의 인장(Dragon Hunter’s Sigil)을 제작 목표로 둔다.","용들의 비행은 패치 이후 직접 시전 조건에 주의한다.","회피 기동(Evasive Maneuvers)을 생존에 필요한 시점에 확보한다."]},{"range":"16–21","target":"보스 대처 및 마법사 군단","actions":["마법사 소환(Summon Wizard)·용 마법사(Dragon Wizard)·마법사 군단(Wizard Gang)으로 보조 공격을 마련한다.","냉기·화염에 면역인 보스용 물리/다른 유형의 피해를 확인한다.","소환수만 많고 보스 체력이 줄지 않는 상황이면 소환 추가보다 저항력 대책을 우선한다."]}],"spells":[{"name":"고룡의 알 (Wyrm Eggs)","up":"빛나는 알(Radiant Eggs) 등은 선택","reason":"핵심 소환원","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"용들의 비행 (Flight of the Dragons)","reason":"드래곤 추가 소환과 탑승 연계","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"회피 기동 (Evasive Maneuvers)","reason":"소환형의 방어 안정화","priority":"필수"},{"name":"마법사 소환 (Summon Wizard)","up":"용 마법사(Dragon Wizard), 마법사 군단(Wizard Gang)","reason":"엔딩용 마법 공격 보완","priority":"후반"}],"gear":[{"name":"얼음 소환사 (Ice Caller)","reason":"초중반 알/냉기 소환 보완","priority":"초중반"},{"name":"양치기의 지팡이 (Shepherd’s Staff)","reason":"소환수 전개 보조","priority":"초중반"},{"name":"고룡 영혼 갑옷 (Wyrm Spirit Armor)","reason":"드래곤 계열 지속력과 방어 강화","priority":"중후반"},{"name":"드래곤 사냥꾼의 인장 (Dragon Hunter’s Sigil)","reason":"반복 소환의 핵심 장비","priority":"후반 핵심"},{"name":"요정 판금 (Fae Plate)","reason":"본체의 지속 보호막","priority":"안전"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환 능력 보강","priority":"선택"}],"rotation":["위협 범위를 확인하고 안전한 시작 위치를 고른다.","알을 전방에 생성하고, 마법사는 광역 공격의 직선·범위에서 벗어난다.","부화한 용이 공격하는 동안 위협적인 원거리/상태이상 적만 직접 처리한다.","드레이크 탑승 이후 용들의 비행으로 소환 전력을 보충한다.","고체력 보스는 마법사 소환과 별도 피해 수단으로 마무리한다."],"pitfalls":["초반부터 늑대·보조 주문을 너무 많이 구매하면 고룡의 알 구매가 지연된다.","알이 부화하기 전까지 무방비일 수 있으니 원거리 공격이 겹치는 맵을 피한다.","고룡 영혼 갑옷이 없다고 진행을 중단하지 않는다.","드래곤 사냥꾼 인장의 정확한 발동 조건과 용들의 비행의 직접 시전 조건을 현 버전에서 확인한다."],"boss":["20구역 개구리 교황: 한 턴 피해 제한 때문에 장기 소환/생존이 중요.","눈의 여왕·아마루: 냉기/화염 면역에 주의해 다른 유형 공격 확보.","모르드레드: 소환수만 늘리기보다 본체에게 유효 피해가 들어가는지 먼저 확인."],"variants":["안전 스타트: 늑대(Wolf) + 고룡의 알. 구매 시점이 늦어지는 대신 초반 탱킹에 유리.","빠른 스타트: 저비용 공격만 구매하고 3구역 고룡의 알 목표."],"evidence":"일본 플레이어의 실제 엔딩 승리 기록 기반. 1~3구역 세부 안전 스타트는 재구성.","sources":[["일본 플레이어 실제 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"slime","icon":"🟢","title":"슬라임 군단 · 재생 오라","group":"입문 추천","level":"★☆☆","tagline":"느리지만 소환수가 대신 맞아주는 안정형","idea":"슬라임 형태(Slime Form)로 아군 숫자를 늘리고 재생 오라(Regeneration Aura)로 전열을 회복시킨다. 흡혈의 시선(Vampiric Gaze)으로 본체의 지속 전투 능력을 보완한다.","first":["1~2구역: 저비용 주문/소환수로 생존하며 SP 모으기.","3~5구역: 슬라임 형태(Slime Form) 확보.","5~8구역: 재생 오라(Regeneration Aura)로 유지력 강화.","8~11구역: 흡혈의 시선(Vampiric Gaze)과 방어 장비 확보."],"phases":[{"range":"1–3","target":"준비","actions":["기본 공격 또는 늑대 소환으로 앞라인을 만든다.","가능하면 소환/방어 관련 장비를 우선 만든다."]},{"range":"4–7","target":"슬라임 양산","actions":["슬라임 형태를 확보해 아군이 적의 공격을 나눠 받게 한다.","재생 오라를 확보해 손상된 전열을 회복한다."]},{"range":"8–12","target":"지속전","actions":["흡혈의 시선과 비전 방호를 보완한다.","재생 점액(Regenerative Goop)으로 회복 효과의 시너지를 노린다."]},{"range":"13–17","target":"군단 강화","actions":["죽음 저항(Death Defiance) 등 소환수 생존 업그레이드 고려.","본체가 직접 맞는 일이 없도록 위치·시야를 관리한다."]},{"range":"18–21","target":"보스 준비","actions":["슬라임과 다른 피해 속성을 가진 직접 공격 추가.","고체력·높은 물리저항 보스를 대비해 저항력 감소 및 집중 피해 확보."]}],"spells":[{"name":"슬라임 형태 (Slime Form)","up":"슬라임 생성","reason":"전열과 어그로 분산","priority":"필수"},{"name":"재생 오라 (Regeneration Aura)","up":"재생 점액(Regenerative Goop)","reason":"피해를 입은 아군의 회복","priority":"필수"},{"name":"재생 오라 (Regeneration Aura)","up":"죽음 저항(Death Defiance)","reason":"소환수의 생존 보조","priority":"후반"},{"name":"흡혈의 시선 (Vampiric Gaze)","up":"기본 효과","reason":"후방에서 공격·회복","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"기본 효과","reason":"본체 보호막","priority":"선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"자연 지팡이 (Nature Staff)","reason":"자연 속성 증강","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환 전력 강화","priority":"선택"},{"name":"위기 부적 (Crisis Charm)","reason":"급사 방지","priority":"안전"}],"rotation":["슬라임을 먼저 생성한 후 본체가 한 발짝 물러난다.","오라 효과 범위에 전열을 유지한다.","적 소환사·강력한 원거리 몬스터는 흡혈의 시선으로 따로 처치한다.","소환수가 잘 버티는 동안 추가 슬라임을 준비한다."],"pitfalls":["광역 공격이 플레이어와 슬라임을 함께 맞추지 않게 한다.","슬라임 수만 늘리고 보스 화력이 부족할 수 있다.","소환수가 많아지면 턴 진행이 느려질 수 있다."],"boss":["보스에게 슬라임 공격이 통하는지 확인.","슬라임 물량만으로 피해가 부족하면 다른 속성 공격·저항력 감소를 확보한다."],"variants":["회색 점액(Gray Goo) + 방어구 용해기(Armor Melter) 기반 물리 저항력 감소 변형."],"evidence":"스팀 초중반 생존 사례 기반. 이 정확한 세 주문 조합으로 엔딩 클리어는 검증되지 않음.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"chain","icon":"⚡","title":"연쇄 번개 · 폭풍 드래곤","group":"핵심 빌드 1–4","level":"★★☆","tagline":"드래곤에게 번개를 맡기는 자동 포격","idea":"연쇄 번개(Chain Lightning)와 폭풍 드래곤(Storm Drake)을 조합한다. 용 마법사(Dragon Mage)로 소환수가 직접 연쇄 번개를 사용하게 하며, 번개 보호막(Lightning Shield)으로 방어까지 담당한다.","first":["1구역: 번개 화살(Lightning Bolt).","2구역: 폭풍 드래곤(Storm Drake).","3구역: 연쇄 번개(Chain Lightning).","4구역: 번개 보호막(Lightning Shield).","5구역: 용 마법사(Dragon Mage).","7구역 목표: 폭풍 소환(Storm Summoning)."],"phases":[{"range":"1–2","target":"드래곤 확보","actions":["번개 화살로 직선의 적을 함께 공격한다.","드래곤이 살아남을 위치에 소환한다."]},{"range":"3–5","target":"자동 번개","actions":["연쇄 번개 → 번개 보호막 → 용 마법사 순서로 연결한다.","드래곤이 주문을 쓰는 시간을 벌어준다."]},{"range":"6–10","target":"확장","actions":["폭풍 소환(Storm Summoning) 확보.","뇌우의 비(Rain of Thunderbolts)를 목표로 한다."]},{"range":"11–15","target":"자동 생산","actions":["폭풍 드래곤 생성(Tempest Drakes)·폭풍 신호기(Storm Beacon)로 소환 효율을 높인다.","갈바닉 집중 장치 등 저항력 감소 수단 확보."]},{"range":"16–21","target":"후반 대책","actions":["비번개 속성/물리 공격 보조.","보호막 장비와 순간이동으로 본체 보호.","소환수가 제어되거나 훔쳐지는 적을 조심한다."]}],"spells":[{"name":"번개 화살 (Lightning Bolt)","up":"기본","reason":"초반 공격","priority":"필수"},{"name":"폭풍 드래곤 (Storm Drake)","up":"용 마법사(Dragon Mage)","reason":"자동 번개 공격","priority":"필수"},{"name":"연쇄 번개 (Chain Lightning)","up":"번개 보호막(Lightning Shield)","reason":"아군 보호막 생성 및 적 연쇄 공격","priority":"필수"},{"name":"연쇄 번개 (Chain Lightning)","up":"구름 전도(Cloud Conductance)","reason":"구름 연쇄를 활용하는 변형","priority":"선택"},{"name":"폭풍 소환 (Storm Summoning)","up":"기본","reason":"소환 전력 확대","priority":"필수"},{"name":"뇌우의 비 (Rain of Thunderbolts)","up":"폭풍 드래곤 생성(Tempest Drakes)","reason":"후반 대량 소환","priority":"후반"}],"gear":[{"name":"번개 지팡이 (Lightning Staff)","reason":"번개 주문 강화","priority":"초중반"},{"name":"갈바닉 집중 장치 (Galvanic Focus)","reason":"번개 저항력 대응","priority":"중반"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"드래곤 강화","priority":"선택"},{"name":"폭풍 신호기 (Storm Beacon)","reason":"후반 소환 가속","priority":"후반"}],"rotation":["시야가 안전한 곳에서 폭풍 드래곤을 소환한다.","연쇄 번개를 사용해 밀집한 적을 타격하고 아군에 보호막을 제공한다.","용 마법사로 드래곤이 자동으로 연쇄 번개를 사용하게 한다.","폭풍을 이용해 소환을 확장하고, 본체는 위험한 적만 직접 제거한다."],"pitfalls":["초반 용 마법사 이전까지는 화력이 낮아 사망할 수 있다.","번개 저항력 100% 적이 많은 균열은 선택하지 않는다.","보호막을 무조건 생성하는 게 아니라 아군 연결·배치가 중요하다."],"boss":["전기의 육체(Body Electric): 직접 대상 주문 반격 주의.","아마루 등 번개만으로 어려운 적은 소환수 물리/다른 유형 피해 필요."],"variants":["구름 전도(Cloud Conductance) 중심 번개 구름 빌드.","연쇄 화염구(Chain Fireball)로 화염 피해를 연계하는 혼합형."],"evidence":"THEKI 트라이얼 1~7구역 구매 흐름과 해외 클리어 사례를 참고.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"fire","icon":"🔥","title":"화염 · 저주 · 불기둥","group":"핵심 빌드 1–4","level":"★★★","tagline":"화염 피해와 혼돈 주문의 연쇄 폭발","idea":"화염구(Fireball)로 출발하고, 불기둥(Pillar of Fire)의 처치 시 추가 주문과 화염·번개 저주(Pyrostatic Curse)의 저항력 감소를 조합한다. 화력은 높지만 생존 장비를 일찍 챙겨야 한다.","first":["1구역: 화염구(Fireball).","2~5구역: 광역 화염 주문/화염 폭발(Flame Burst) 중 적당한 보조 화력.","6~8구역 목표: 불기둥(Pillar of Fire) + 절멸의 기둥(Pillar of Annihilation).","9~11구역 목표: 화염·번개 저주(Pyrostatic Curse) + 저항력 융해(Resistance Melting)."],"phases":[{"range":"1–5","target":"광역 화염","actions":["화염구로 약한 적 여러 마리를 동시에 제거한다.","화염 면역이 많은 균열은 피한다.","바로 죽지 않게 보호막/소환수/이동 옵션을 준비한다."]},{"range":"6–8","target":"불기둥","actions":["불기둥과 절멸의 기둥을 확보한다.","체력이 적은 적을 불기둥으로 마무리해 처치 연쇄를 만든다."]},{"range":"9–14","target":"저주 연쇄","actions":["화염·번개 저주 → 저항력 융해 → 파이로스태틱 혼돈을 목표로 한다.","교란의 불꽃(Disrupting Flames)으로 높은 저항력 대처."]},{"range":"15–18","target":"장비 시너지","actions":["화산의 창(Volcanic Lance) 또는 정화자(The Purifier) 확보.","용해(Melt) 계열이나 다른 유형의 공격 보완."]},{"range":"19–21","target":"보스","actions":["Sorcery/Enchantment 피해 무효 적은 다른 유형의 공격을 준비한다.","공격에 SP를 모두 투자하지 말고 보호막을 확보한다."]}],"spells":[{"name":"화염구 (Fireball)","up":"혼돈 화염구(Chaos Ball) 변형","reason":"초반 광역","priority":"필수"},{"name":"화염 폭발 (Flame Burst)","up":"밝은 화염(Bright Flame), 이중 폭발(Dual Burst)","reason":"신성·연속 피해 연계","priority":"선택"},{"name":"불기둥 (Pillar of Fire)","up":"절멸의 기둥(Pillar of Annihilation)","reason":"처치 시 절멸 추가 시전","priority":"필수"},{"name":"불기둥 (Pillar of Fire)","up":"교란의 불꽃(Disrupting Flames)","reason":"저항력 대응","priority":"필수"},{"name":"화염·번개 저주 (Pyrostatic Curse)","up":"저항력 융해(Resistance Melting)","reason":"화염/번개 저항력 감소","priority":"필수"},{"name":"화염·번개 저주 (Pyrostatic Curse)","up":"파이로스태틱 혼돈(Pyrostatic Chaos)","reason":"혼돈 주문과 저주 연계","priority":"필수"},{"name":"용해 (Melt)","up":"백색 화염(White Flame), 대량 용해(Mass Melt)","reason":"후반 보조","priority":"후반"}],"gear":[{"name":"화산의 창 (Volcanic Lance)","reason":"화염 주문 사용 시 추가 광선","priority":"핵심"},{"name":"정화자 (The Purifier)","reason":"신성-점화 연계","priority":"핵심"},{"name":"파이로스태틱 오큘러스 (Pyrostatic Oculus)","reason":"저항력 감소 보조","priority":"선택"},{"name":"철학자의 돌 (Philosopher’s Stone)","reason":"충전 회복 기회","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"생존용 보호막","priority":"안전"}],"rotation":["먼저 저주를 적용하거나 저항력 감소 상태를 만든다.","체력이 낮은 적을 불기둥으로 마무리해 절멸을 유발한다.","연쇄 피해로 남은 적을 줄이고 생존이 위험하면 공격 대신 위치를 바꾼다."],"pitfalls":["화염 저항력만 보고 Sorcery 주문 유형 면역을 놓치지 않는다.","화염구 충전 횟수가 적으면 약한 적 한 마리에게 낭비하지 않는다.","화력 완성 전에는 보호막 없는 광역 교전이 특히 위험하다."],"boss":["아마루(Amaru): 주문 유형 면역을 확인하고 다른 유형 피해 필요.","모르드레드: 저주/저항력 감소를 먼저 적용한 뒤 연쇄 피해 유도."],"variants":["불의 비(Rain of Fire) + 화염의 문(Flame Gate) + 화염 광란 가면(Fire Frenzy Mask) 반복 화염구형."],"evidence":"스팀 파이로맨서 트라이얼 및 클리어 후기. 단계별 구역은 추천 재구성.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"missile","icon":"✨","title":"마법 미사일 · 분산","group":"핵심 빌드 1–4","level":"★★★","tagline":"분산시킨 적마다 마법 미사일을 발동","idea":"마법 미사일(Magic Missile) → 분산(Disperse) → 폭력적 왜곡(Violent Warp)을 초반에 맞추고, 도탄(Ricochet)과 비전 광란 가면(Arcane Frenzy Mask)으로 다수 적에게 강해지는 빌드.","first":["1구역: 마법 미사일(Magic Missile).","2구역: 분산(Disperse).","3구역 목표: 폭력적 왜곡(Violent Warp).","4~5구역: 도탄(Ricochet)·교란 탄환(Disruption Bolt)을 검토."],"phases":[{"range":"1–3","target":"자동 공격 엔진","actions":["마법 미사일과 분산을 구매한다.","폭력적 왜곡을 빠르게 구매해 순간이동된 적에게 미사일 발동.","소수의 비전 면역 적은 피한다."]},{"range":"4–7","target":"광역 보완","actions":["도탄(Ricochet) 및 교란 탄환(Disruption Bolt)로 사각지대 감소.","위협 범위 확인 후 분산을 사용한다(적이 가까이 올 수도 있음)."]},{"range":"8–12","target":"반복 공격","actions":["비전 광란 가면을 제작 목표로 둔다.","공허불꽃 랜턴/수정 로브로 보조 발동을 검토한다."]},{"range":"13–17","target":"충전·생존","actions":["반짝이는 무희의 로브 등 충전 회복 장비를 고려한다.","본체 보호막을 보강한다."]},{"range":"18–21","target":"단일 보스 화력","actions":["고체력 단일 보스용 별도 공격 또는 피해 누적 수단을 준비한다.","비전 면역 적에게 교란 탄환 등 다른 속성 활용."]}],"spells":[{"name":"마법 미사일 (Magic Missile)","up":"도탄(Ricochet)","reason":"기본/추가 대상 공격","priority":"필수"},{"name":"분산 (Disperse)","up":"폭력적 왜곡(Violent Warp)","reason":"적 순간이동 후 미사일 추가 시전","priority":"필수"},{"name":"마법 미사일 (Magic Missile)","up":"교란 탄환(Disruption Bolt)","reason":"비전 면역 대처","priority":"필수"},{"name":"마법 미사일 (Magic Missile)","up":"비전 교차 사격(Arcane Crossfire)","reason":"직접 시전 미사일 연계","priority":"선택"},{"name":"석화 (Petrify)","up":"비전 전도(Arcane Conductivity)","reason":"저항력 대응 변형","priority":"선택"}],"gear":[{"name":"비전 광란 가면 (Arcane Frenzy Mask)","reason":"반복 비전 발동으로 화력 누적","priority":"핵심"},{"name":"공허불꽃 랜턴 (Voidflame Lantern)","reason":"추가 피해 연계","priority":"선택"},{"name":"수정 로브 (Robe of Crystals)","reason":"비전 피해 보조","priority":"선택"},{"name":"반짝이는 무희의 로브 (Glittering Dancer’s Robes)","reason":"충전 횟수·지속력 보강","priority":"선택"},{"name":"요정 가시 지팡이 (Fae Thorne Staff)","reason":"비전 아군 공급 변형","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"}],"rotation":["다수의 적을 분산 범위에 포함시키되 이동 후 위협 범위를 감안한다.","폭력적 왜곡으로 적마다 마법 미사일 발동을 유도한다.","위협적인 원거리 적이 남으면 직접 마법 미사일로 마무리한다.","보스만 남았다면 분산 연쇄가 약해지므로 별도 단일 화력을 사용한다."],"pitfalls":["비전 면역 적을 초반에 만나면 무력해질 수 있다.","분산은 적을 자신 근처에 재배치할 수 있다.","비전 교차 사격은 무료 자동 시전 모두에 무제한 반응하지 않는다(패치 주의)."],"boss":["단일 보스에게 다수 적용 분산의 이점이 줄어든다.","비전 면역·보호막 대상 처리 수단과 본체 생존력 필수."],"variants":["캔트립 연쇄(Cantrip Cascade) + 저레벨 주문 다량 발동형.","요정 가시 지팡이 + 비전 교차 사격으로 직접 시전 보강."],"evidence":"일본 Manamancer 공략의 3구역 목표와 클리어 로그 참고.","sources":[["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["일본 플레이어 실제 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"freeze","icon":"❄️","title":"광역 빙결 · 프리즘 광선","group":"핵심 빌드 1–4","level":"★★☆","tagline":"적 행동을 멈춘 뒤 광역 광선으로 정리","idea":"동결(Freeze)의 광역 동결(Mass Freeze)으로 적을 묶고 프리즘 광선(Prismatic Beam)으로 정리한다. 프리즘 광선의 부드러워진 빛(Softened Light)은 자신에게 피해가 발생하는 문제를 막기 위해 필수에 가깝다.","first":["1~3구역: 얼음구(Iceball)·고드름(Icicle)로 생존.","4~7구역: 동결(Freeze) + 광역 동결(Mass Freeze).","7~10구역: 프리즘 광선(Prismatic Beam) + 부드러워진 빛(Softened Light).","이후: 보호막·보스용 다른 속성 피해 확보."],"phases":[{"range":"1–3","target":"기본 공격","actions":["얼음구 또는 고드름으로 낮은 체력 적 제거.","빙결 면역 적이 많은 균열 회피."]},{"range":"4–7","target":"광역 동결","actions":["동결과 광역 동결을 확보한다.","위험한 원거리/상태이상 적을 먼저 묶는다."]},{"range":"8–10","target":"광선 완성","actions":["프리즘 광선과 부드러워진 빛을 확보한다.","해당 안전 업그레이드 없을 때 광선 사용에 신중."]},{"range":"11–16","target":"화력·생존","actions":["프리즘 연결고리(Prismatic Links), 비전 방호를 검토한다.","얼음 불사조(Ice Phoenix)로 공격 분산."]},{"range":"17–21","target":"빙결 면역 대응","actions":["빙결 불가 적과 고체력 보스를 위한 별도 공격 확보.","보호막 흡수(Siphon Shields) 등으로 방어형 적 대응."]}],"spells":[{"name":"얼음구 (Iceball)","up":"기본","reason":"초반 광역","priority":"필수"},{"name":"고드름 (Icicle)","up":"기본","reason":"초반 단일/대체 속성","priority":"필수"},{"name":"동결 (Freeze)","up":"광역 동결(Mass Freeze)","reason":"군중제어 핵심","priority":"필수"},{"name":"프리즘 광선 (Prismatic Beam)","up":"부드러워진 빛(Softened Light)","reason":"광역 공격의 자기 피해 위험 완화","priority":"필수"},{"name":"얼음의 언령 (Word of Ice)","up":"기본","reason":"후반 광역 빙결 보조","priority":"후반"},{"name":"얼음 불사조 (Ice Phoenix)","up":"기본","reason":"어그로 분산","priority":"선택"},{"name":"보호막 흡수 (Siphon Shields)","up":"기본","reason":"보호막 적 대응","priority":"선택"}],"gear":[{"name":"프리즘 연결고리 (Prismatic Links)","reason":"광선 공격 시너지","priority":"핵심"},{"name":"겨울 연결고리 (Winter Links)","reason":"냉기 관련 보조","priority":"선택"},{"name":"폭풍의 로브 (Robe of Storms)","reason":"냉기/번개 처치 시 보호막","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"},{"name":"눈보라 신호기 (Blizzard Beacon)","reason":"눈보라 변형","priority":"선택"}],"rotation":["위협적인 적의 위치를 확인한다.","광역 동결로 적 행동을 막는다.","부드러워진 빛을 갖춘 프리즘 광선으로 전장 정리.","빙결 면역 적과 보스만 남으면 다른 공격 수단 전환."],"pitfalls":["빙결이 들어갔다고 안전하다고 확신하지 않는다: 면역 대상 확인.","프리즘 광선 안전 업그레이드 전 자기 피해 가능성에 주의.","보스만 남으면 군중제어 효율이 떨어질 수 있다."],"boss":["눈의 여왕 등 냉기 면역 상대는 다른 속성이 필요.","고체력 보스 한 마리만 남았을 때 단일 공격 보조."],"variants":["눈보라(Blizzard) + 우박 폭풍(Hailstorm) + 고드름(Icicle) 반복 시전형."],"evidence":"스팀 광역 빙결/프리즘 빌드 가이드 기반. 구역별 구매 순서는 추천안.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["THEKI 트라이얼 공략","https://note.com/theki/n/nf90736db34ac?hl=en"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"archon","icon":"🪽","title":"아콘 소환 · 보호막 광선","group":"소환·방어","level":"★★☆","tagline":"소환수가 광선 공격과 보호막 공급을 동시에","idea":"아콘 소환(Call Archon)의 광선의 호(Beam Arc)·폭풍 아콘(Storm Archon)을 활용하고 영속화(Permanence)와 재생 오라로 유지력을 높인다.","first":["1~3구역: 늑대 또는 저비용 공격으로 시작.","4~7구역: 아콘 소환(Call Archon) 확보.","8~11구역: 광선의 호(Beam Arc), 폭풍 아콘(Storm Archon).","후반: 보호막·소환 장비·저항력 감소 강화."],"phases":[{"range":"1–3","target":"기본 생존","actions":["고비용 아콘을 기다리는 동안 저비용 공격으로 약한 균열 선택."]},{"range":"4–8","target":"아콘 확보","actions":["아콘 소환과 광선의 호를 목표.","아콘 광선이 적과 아군을 지나는 배치를 의식."]},{"range":"9–13","target":"화력 확대","actions":["폭풍 아콘, 냉기 충격 부적, 소환술 지팡이 등 보완."]},{"range":"14–18","target":"소환 유지","actions":["영속화(Permanence), 재생 오라 등으로 소환수 보호."]},{"range":"19–21","target":"보스","actions":["드래곤/아콘 소환수의 공격이 통하지 않는 적용 보조 공격 준비.","본체 보호막 없을 때 전방 노출 금지."]}],"spells":[{"name":"아콘 소환 (Call Archon)","up":"광선의 호(Beam Arc)","reason":"광선 확대","priority":"필수"},{"name":"아콘 소환 (Call Archon)","up":"폭풍 아콘(Storm Archon)","reason":"공격 속성 추가","priority":"필수"},{"name":"영속화 (Permanence)","up":"현실 고정(Reality Hold)","reason":"소환 유지","priority":"중반"},{"name":"재생 오라 (Regeneration Aura)","up":"죽음 저항(Death Defiance)","reason":"소환수 생존","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"본체 보호막","priority":"안전"}],"gear":[{"name":"소환술 지팡이 (Conjuration Staff)","reason":"아콘 능력 강화","priority":"핵심"},{"name":"냉기 충격 부적 (Coldsnap Amulet)","reason":"광선 공격 시너지","priority":"선택"},{"name":"분노의 연결고리 (Wrath Links)","reason":"광선 연계","priority":"선택"},{"name":"혼돈의 연결고리 (Chaos Links)","reason":"추가 피해","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"초반 보조 보호막","priority":"안전"}],"rotation":["아콘을 안전한 곳에서 소환한다.","아콘의 광선이 적을 타격하는 경로를 관찰한다.","보호막을 받을 수 있도록 자신의 위치를 조정한다.","소환수가 공격하는 동안 본체는 위험한 적만 대응한다."],"pitfalls":["광선 각도가 나쁘면 실제 화력이 떨어진다.","SP가 많이 들어 초반 완성 전 취약하다."],"boss":["소환수의 공격 속성 저항·면역 보스를 위한 별도 피해 필요."],"variants":["신성 아콘 + 세라프 소환 연계 변형."],"evidence":"스팀 빌드 가이드 기반. 해당 가이드 작성자의 엔딩 검증은 별도.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"claw","icon":"🐉","title":"용의 발톱 · 대지 보호막","group":"소환·방어","level":"★★★","tagline":"직접 싸우되 지형 이동과 보호막으로 버티기","idea":"용의 발톱(Dragon Claw)의 근접 공격에 대지 통로(Earth Passage)·광물 보호막(Mineral Shielding)을 결합하는 방식. 단단한 느낌은 크지만 위치 선정 난이도는 높다.","first":["1구역: 용의 발톱(Dragon Claw) 또는 다른 저비용 공격.","초반: 대지 통로(Earth Passage)와 광물 보호막(Mineral Shielding).","중반: 용발톱 군화(Dragonclaw Sabatons), 혼돈의 발톱(Chaos Claws).","후반: 드레이크 탑승(Ride Drake)과 회피 기동(Evasive Maneuvers)."],"phases":[{"range":"1–3","target":"발톱 사용법","actions":["매 턴 위협 범위를 확인한다.","근접 시 적 여러 마리에게 동시에 맞으면 지형 이동을 우선한다."]},{"range":"4–8","target":"방어 이동","actions":["대지 통로와 광물 보호막 확보.","벽/병목을 활용해 한 번에 상대하는 적 수 축소."]},{"range":"9–14","target":"근접 화력","actions":["용발톱 군화와 혼돈의 발톱으로 물리저항 대책 마련."]},{"range":"15–18","target":"탑승 생존","actions":["드레이크 탑승 및 회피 기동으로 위험 감소."]},{"range":"19–21","target":"보스","actions":["근접하면 즉사할 수 있는 보스의 공격 범위를 반드시 확인.","원거리 또는 다른 속성 피해 수단 준비."]}],"spells":[{"name":"용의 발톱 (Dragon Claw)","up":"혼돈의 발톱(Chaos Claws)","reason":"직접 공격","priority":"필수"},{"name":"대지 통로 (Earth Passage)","up":"광물 보호막(Mineral Shielding)","reason":"지형 이동과 방어","priority":"필수"},{"name":"드레이크 탑승 (Ride Drake)","up":"회피 기동(Evasive Maneuvers)","reason":"후반 생존","priority":"후반"}],"gear":[{"name":"용발톱 군화 (Dragonclaw Sabatons)","reason":"용의 발톱 연계","priority":"핵심"},{"name":"요정 판금 (Fae Plate)","reason":"보호막","priority":"안전"},{"name":"이동 강화 장비","reason":"전장 위치 선정 보조","priority":"선택"}],"rotation":["원거리 몬스터가 공격할 수 없는 벽 뒤에서 접근한다.","단일 적을 빠르게 제거한 후 이동하여 공격 범위 밖에 선다.","위험할 때는 대지 통로와 방어를 우선 사용한다."],"pitfalls":["단단하다고 무조건 근접하면 안 된다.","행동 불능·원거리 집중 공격에 취약."],"boss":["정원사 같은 강한 근접 보스에게 정면 돌격 금지."],"variants":["소환/탑승 능력을 강화한 드레이크 전사 변형."],"evidence":"스팀 초반 조합 추천 기반. 완전한 엔딩 클리어 경로 검증은 부족.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"eye","icon":"👁️","title":"부유하는 눈 · 보호막 포탑","group":"기타 빌드","level":"★★★","tagline":"보호막을 공격력으로 바꾸는 눈 소환","idea":"부유하는 눈(Floating Eye)에 눈의 마법사(Eye Mage)와 재생 보호막(Regenerating Shields)을 연결하고, 보호막 흡수(Siphon Shields)의 안구 렌즈화(Ocular Lensing)로 공격과 보호막을 증폭한다.","first":["초반: 저비용 눈 공격 또는 일반 광역 공격으로 생존.","중반: 부유하는 눈 + 눈의 마법사 + 재생 보호막.","중후반: 보호막 흡수 + 안구 렌즈화.","후반: 신비로운 시야 + 감시(Overwatch) 및 눈 장비."],"phases":[{"range":"1–5","target":"준비","actions":["저비용 마법으로 생존.","눈 소환에 필요한 SP와 방어 장비 확보."]},{"range":"6–10","target":"눈 생성","actions":["부유하는 눈과 눈의 마법사를 연결한다.","재생 보호막으로 소환수를 보호한다."]},{"range":"11–15","target":"보호막 엔진","actions":["보호막 흡수 + 안구 렌즈화.","눈의 투구·의복을 제작할 수 있는지 확인."]},{"range":"16–21","target":"생존과 보스","actions":["감시(Overwatch), 이동·보호막 능력 완성.","눈 공격의 속성 면역을 대비한 직접 피해 마련."]}],"spells":[{"name":"부유하는 눈 (Floating Eye)","up":"눈의 마법사(Eye Mage)","reason":"눈 주문 사용","priority":"필수"},{"name":"부유하는 눈 (Floating Eye)","up":"재생 보호막(Regenerating Shields)","reason":"소환수 보호막 재생","priority":"필수"},{"name":"보호막 흡수 (Siphon Shields)","up":"안구 렌즈화(Ocular Lensing)","reason":"보호막을 공격에 활용","priority":"필수"},{"name":"신비로운 시야 (Mystic Vision)","up":"감시(Overwatch)","reason":"자동 대응","priority":"중반"}],"gear":[{"name":"눈의 투구 (Eye Helm)","reason":"눈/보호막 시너지","priority":"핵심"},{"name":"눈의 의복 (Raiment of Eyes)","reason":"눈 주문 보조","priority":"선택"},{"name":"발로르의 눈 지팡이 (Balor’s Eye Staff)","reason":"눈 공격 연계","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 보호막","priority":"안전"}],"rotation":["눈 소환을 먼저 배치하고 위험한 원거리 적을 파악한다.","보호막을 수급하여 눈의 화력을 유지한다.","본체는 직접 피격을 최소화한다."],"pitfalls":["보호막이 사라지면 화력과 생존이 함께 무너진다.","피의 눈(Eye of Blood)은 부유하는 눈이 사용하지 못한다는 가이드 주의점."],"boss":["보호막 제거·소환수 제어 적에게 주의."],"variants":[],"evidence":"스팀 빌드 가이드 기반.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"demon","icon":"💀","title":"악마 의식 · 절멸","group":"기타 빌드","level":"★★★","tagline":"의식으로 소환수를 강화한 뒤 폭딜","idea":"악마 의식(Demonic Ritual)의 불가침 의식(Inviolate Ritual)과 지배자의 갑옷(Armor of the Master)으로 소환수를 강화하고 절멸(Annihilate)·아마겟돈의 칼날(Armageddon Blades)을 공격으로 쓴다.","first":["초반: 죽음의 화살(Death Bolt)·뼈 전사(Bone Warriors)로 생존.","중반: 악마 의식(Demonic Ritual)과 불가침 의식.","후반: 절멸·아마겟돈의 칼날과 방어 장비."],"phases":[{"range":"1–5","target":"값싼 공격","actions":["초반 무리한 의식 구매보다 죽음의 화살/소환수로 처치력 확보."]},{"range":"6–10","target":"의식","actions":["악마 의식 + 불가침 의식 준비.","HP 비용 및 채널링 중의 위험을 미리 계산."]},{"range":"11–15","target":"폭발 화력","actions":["절멸과 아마겟돈의 칼날 확보."]},{"range":"16–21","target":"방어 동반","actions":["지배자의 갑옷, 보호막 확보 후 의식 시전.","고저항 보스에게 다른 유형 공격도 준비."]}],"spells":[{"name":"악마 의식 (Demonic Ritual)","up":"불가침 의식(Inviolate Ritual), 대의식(Grand Ritual)","reason":"소환수 강화","priority":"필수"},{"name":"절멸 (Annihilate)","up":"대량 절멸(Mass), 포괄적 절멸(Comprehensive)","reason":"광역 폭발","priority":"필수"},{"name":"아마겟돈의 칼날 (Armageddon Blades)","up":"대량 무장(Mass) 계열","reason":"추가 공격","priority":"필수"}],"gear":[{"name":"지배자의 갑옷 (Armor of the Master)","reason":"의식·소환수 연계","priority":"핵심"},{"name":"요정 판금 (Fae Plate)","reason":"채널링 위험 감소","priority":"안전"}],"rotation":["엄호가 된 장소에서 소환수와 방어를 준비한다.","악마 의식을 시전하고 소환수를 강화한다.","대량 절멸로 적을 제거한다."],"pitfalls":["악마 의식은 HP와 행동을 요구하여 초반 생존 빌드로는 어렵다.","패치로 의식 업그레이드 SP가 바뀐 적이 있다."],"boss":["고저항 보스를 대비한 다속성 공격과 피해 수단 필요."],"variants":[],"evidence":"실제 클리어 경험담 기반이나 초보자 추천도는 낮음.","sources":[["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"quake","icon":"🥾","title":"지진 · 자동 시전 장화","group":"기타 빌드","level":"★★★","tagline":"이동이 곧 공격이 되는 특이한 빌드","idea":"지진(Earthquake)과 자동 시전 장비를 연결하고 이동하며 적을 공격한다. 지진 여진(Aftershock)으로 광역 효과를 늘린다.","first":["1~5구역: 평범한 광역 마법으로 생존.","6~10구역: 자동 시전 장비/장화 확보.","11~15구역: 지진과 여진 연결.","16~21구역: 이동 생존·상태이상 대응."],"phases":[{"range":"1–5","target":"일반 공격","actions":["이동 연계 장비가 없으면 지진 자동화에 집착하지 않는다."]},{"range":"6–10","target":"자동 시전","actions":["흡수 장화(Drain Boots) 등 이동 시 발동 장비를 확보한다."]},{"range":"11–15","target":"지진 확장","actions":["지진과 여진(Aftershock), 장화 시너지를 구축."]},{"range":"16–21","target":"이동 생존","actions":["위험 범위에서 벗어날 경로를 항상 남겨둔다."]}],"spells":[{"name":"지진 (Earthquake)","up":"여진(Aftershock)","reason":"주력 광역","priority":"필수"},{"name":"순수 (Purity)","up":"기본","reason":"상태이상 대응","priority":"선택"},{"name":"흡수 파동 (Drain Pulse)","up":"기본","reason":"보조 자동 발동","priority":"선택"}],"gear":[{"name":"흡수 장화 (Drain Boots)","reason":"초반 자동 발동","priority":"핵심"},{"name":"주교의 장화 (Bishop Boots)","reason":"이동·시전 연계","priority":"선택"},{"name":"성주 나막신 (Castellan Clogs)","reason":"이동 관련 보조","priority":"선택"},{"name":"비단 샌들 (Silken Sandals)","reason":"이동 시 보호막","priority":"선택"},{"name":"날개 달린 신발 (Winged Shoes)","reason":"지형 제약 완화","priority":"선택"}],"rotation":["안전한 이동 경로를 확보한다.","움직이는 동안 자동 시전이 발동하는 조건을 확인한다.","광역 효과로 적을 줄이되 포위되기 전에 이동한다."],"pitfalls":["장비 운이 나쁘면 완성할 수 없다.","이동 경로를 잘못 택하면 자동 공격보다 먼저 죽는다."],"boss":["이동이 제한되는 보스·지형에서 특히 주의."],"variants":[],"evidence":"실제 클리어 사례 기반이지만 장비 의존도가 높음.","sources":[["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"wolf","icon":"🐺","title":"늑대 무리 · 야생성 소환","group":"기타 빌드","level":"★★☆","tagline":"늑대 소환수로 전선을 밀어붙이는 자연계","idea":"늑대(Wolf)의 늑대 무리(Wolf Pack)·굶주린 늑대(Ravenous Wolf)와 야생성 발현(Invoke Savagery)을 결합한다. 소환수 물량과 강화 효과로 적을 압박.","first":["1구역: 늑대(Wolf) 확보.","초반: 늑대 무리(Wolf Pack) 우선.","중반: 야생성 발현(Invoke Savagery) 강화.","후반: 자연/소환 장비와 다른 피해 수단 마련."],"phases":[{"range":"1–5","target":"늑대 군단","actions":["늑대를 적과 본체 사이에 배치.","늑대 무리/굶주린 늑대로 수와 공격력 보강."]},{"range":"6–10","target":"야생성","actions":["야생성 발현으로 소환수를 강화한다."]},{"range":"11–16","target":"지속력","actions":["자연 지팡이·소환술 지팡이·소환수 방어 강화."]},{"range":"17–21","target":"제어 대책","actions":["공포·지배에 소환수가 무너지는 상황 대비.","직접 공격과 보호막 추가."]}],"spells":[{"name":"늑대 (Wolf)","up":"늑대 무리(Wolf Pack), 굶주린 늑대(Ravenous Wolf)","reason":"전열","priority":"필수"},{"name":"야생성 발현 (Invoke Savagery)","up":"야생의 도약(Savage Leap), 야생의 난동(Savage Spree)","reason":"소환수 강화","priority":"필수"}],"gear":[{"name":"자연 지팡이 (Nature Staff)","reason":"자연 주문 강화","priority":"선택"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"소환수 증강","priority":"선택"},{"name":"드루이드의 로브 (Robe of the Druids)","reason":"자연 계열 강화","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"본체 방어","priority":"안전"}],"rotation":["늑대를 먼저 소환하고 마법사는 후방.","위험한 상태이상 적은 직접 먼저 제거.","군단이 전진하는 동안 다른 피해 보조."],"pitfalls":["공포(Fear)에 살아 있는 소환수가 영향을 크게 받는다.","단일 소환수에 지나치게 올인하면 지배/탈취에 취약하다."],"boss":["물리 저항력 높은 보스에게 늑대만으로 피해 부족."],"variants":[],"evidence":"스팀 빌드 가이드 기반.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"ward","icon":"🛡️","title":"범용 보호막 · 생존 개조","group":"소환·방어","level":"★☆☆","tagline":"기존 빌드를 바꾸지 않고 몸만 단단하게","idea":"주력 공격 빌드를 그대로 두되 요정 판금(Fae Plate), 비전 방호(Arcane Warding), 북방 갑옷(Boreal Armor), 이동 주문 등을 상황에 맞게 넣는다.","first":["1~3구역: 주력 공격 마법 하나로 시작한다.","가능한 즉시 요정 판금(Fae Plate) 또는 쉬운 보호 장비 제작.","중반 이전: 비전 방호(Arcane Warding) 또는 소환수 1종으로 공격 분산.","이후: 주력 공격과 저항력 대응도 잊지 않는다."],"phases":[{"range":"1–5","target":"방어 기초","actions":["주력 공격을 먼저 사고, 생존 장비를 1개 제작한다.","최대 HP와 보호막 모두 중요하다."]},{"range":"6–10","target":"보호막 유지","actions":["요정 판금·비전 방호·부여술 지팡이 중 가능한 조합 확보."]},{"range":"11–15","target":"행동 절약","actions":["순간이동/이동 보조를 갖추어 피격 수를 줄인다."]},{"range":"16–21","target":"보스 대비","actions":["방어만 늘리지 말고 단일 고체력 적을 죽일 화력 확보."]}],"spells":[{"name":"비전 방호 (Arcane Warding)","up":"기본","reason":"보호막","priority":"필수"},{"name":"순간이동 (Teleport)","up":"신속 시전(Quickcast)","reason":"안전한 위치 이동","priority":"선택"},{"name":"어둠 (Darkness)","up":"기본","reason":"일부 원거리 적 견제","priority":"선택"}],"gear":[{"name":"요정 판금 (Fae Plate)","reason":"지속 보호막","priority":"핵심"},{"name":"북방 갑옷 (Boreal Armor)","reason":"구역 시작 보호막","priority":"선택"},{"name":"부여술 지팡이 (Enchantment Staff)","reason":"비전 방호 등 방어 부여술 보완","priority":"선택"},{"name":"폭풍의 로브 (Robe of Storms)","reason":"냉기·번개 처치 시 보호막","priority":"속성별"},{"name":"위기 부적 (Crisis Charm)","reason":"급사 방지","priority":"선택"}],"rotation":["매 구역 시작 때 위협 범위를 확인한다.","공격 전 보호막 수를 확인한다.","그 턴에 위험한 적을 죽일 수 없다면 이동·제어를 먼저 한다."],"pitfalls":["보호막은 공격 1회를 막을 뿐 연속 다단 히트에 취약하다.","보호막 투자에 SP를 모두 소모하면 고체력 보스에 막힌다."],"boss":["보스 별 공격 횟수·상태이상·방어 특성을 따로 확인한다."],"variants":[],"evidence":"초보자 방어 공통 세팅을 독립 페이지로 정리.","sources":[["Steam 빌드 가이드","https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466"],["Rift Wizard 3 Compendium","https://hpp3.github.io/rw3/"]]},{"id":"graygoo","icon":"🧪","title":"회색 점액 · 방어구 용해","group":"신규 연구 빌드","level":"★★★","tagline":"증식하는 점액을 물리 관통으로 보완하는 상태이상 연계형","idea":"초반에 강한 회색 점액(Gray Goo)의 물리 피해가 후반에도 통하도록 방어구 용해기(Armor Melter)의 저항력 감소를 더한다. 에메랄드 화염으로 용해를 발동하고 슬라임샷의 저주·흡혈 연쇄를 연결하는 복합 빌드. 기존 ‘슬라임 형태+재생 오라’와 달리 회복이 아니라 방어력 약화와 복합 피해가 목적이다.","first":["시작: 회색 점액(Gray Goo)을 주력 후보로 확보하고 적의 물리 저항력을 먼저 본다.","초반: 점액이 증식할 시간을 벌 수 있는 소환·이동·보호막 수단 한 가지를 마련한다.","중반: 방어구 용해기(Armor Melter)와 에메랄드 화염(Emerald Flame) 연계를 목표로 재료를 모은다.","후반: 슬라임샷·흡혈·저주 연쇄를 ‘여유 SP가 있을 때’ 추가한다."],"phases":[{"range":"1–3","target":"점액 확산","actions":["회색 점액(Gray Goo)로 적을 묶고 점액이 늘어날 시간을 번다.","물리 면역 적이 많은 균열은 피한다.","첫 3구역의 고정 구매 순서는 원문에 없으므로 저가 공격·방어 주문은 상황에 맞게 선택한다."]},{"range":"4–7","target":"저항력 대책","actions":["방어구 용해기(Armor Melter)를 제작 목표로 삼는다.","장비 발동용 화염 피해 수단으로 에메랄드 화염(Emerald Flame)을 고려한다.","소환수만으로 처리되지 않는 원거리 적을 직접 제거한다."]},{"range":"8–12","target":"슬라임샷 확장","actions":["슬라임샷(Slimeshot)을 이용해 점액화(Slimefy)와 생명력 흡수(Lifedrain) 상태를 퍼뜨리는 변형을 구성한다.","보호막 또는 안정적인 군중 제어를 확보한다."]},{"range":"13–17","target":"연쇄 발동 보완","actions":["붉은 위엄(Red Majesty)과 채찍질/징벌(Scourge), 피의 저주(Blood Hexes)를 연결할 수 있다면 추가한다.","얼음의 복수(Icy Vengeance) 등 다른 피해 축으로 면역 대응을 만든다."]},{"range":"18–최종","target":"보스 준비","actions":["물리 면역/고저항 보스에게 방어구 용해 효과가 실제로 적용되는지 확인한다.","소환수가 약한 보스는 저주·상태이상 연쇄와 별도 피해로 처리한다."]}],"spells":[{"name":"회색 점액 (Gray Goo)","up":"기본 소환·증식 효과","reason":"초반 주력 소환 전력","priority":"핵심"},{"name":"슬라임샷 (Slimeshot)","up":"점액화 (Slimefy) 등","reason":"점액·흡혈 상태를 넓게 퍼뜨림","priority":"중반"},{"name":"생명력 흡수 (Lifedrain)","up":"해당 빌드에 맞는 저주 연계","reason":"붉은 위엄 연쇄의 시작점","priority":"후반"},{"name":"징벌 (Scourge)","up":"기절 연계 확인","reason":"적 행동을 막아 점액이 공격할 턴을 확보","priority":"후반"},{"name":"얼음의 복수 (Icy Vengeance)","up":"선택","reason":"물리 편중을 피하는 추가 피해","priority":"후반"}],"gear":[{"name":"방어구 용해기 (Armor Melter)","reason":"물리 저항력 감소의 핵심. 어떤 피해로 발동하는지 툴팁 확인","priority":"핵심"},{"name":"에메랄드 화염 (Emerald Flame)","reason":"방어구 용해기 효과를 발동시키는 원문 사례","priority":"핵심 연계"},{"name":"요정 판금 (Fae Plate)","reason":"점액이 증식하기 전 본체를 지키는 범용 대체 장비","priority":"선택"},{"name":"기타 소환/보호막 장비","reason":"원본 기록의 특정 장비가 없어도 초반 생존을 먼저 확보","priority":"대체"}],"rotation":["위협 범위를 먼저 확인하고 점액이 직접 맞을 수 있는 위치에 배치한다.","점액이 살아 있는 동안 본체는 원거리·기절 적부터 제거한다.","물리 저항력 높은 적에 에메랄드 화염+방어구 용해기가 적용되는지 살핀다.","상태이상 연쇄가 작동하면 직접 공격 횟수보다 제어·보호막 유지에 집중한다."],"pitfalls":["기존 슬라임 형태 빌드와 이름만 비슷할 뿐 핵심 메커니즘은 다르다.","물리 면역 적에게 점액만 쏟아부으면 막힌다.","붉은 위엄·징벌 연계는 후반 복잡한 변형이므로 초반 필수로 계산하지 않는다.","원본 클리어에서도 얼음의 복수와 기절이 큰 역할을 했다. 점액만으로 엔딩을 보장하지 않는다."],"boss":["물리 저항 보스: 방어구 용해가 실제 작동하는지 공격 로그로 확인.","소환수 소모가 많은 보스: 보호막과 기절 등으로 시간을 번다.","모르드레드: 단일 물리 피해 대신 저항력 감소+추가 속성 피해의 연쇄로 준비."],"variants":["쉬운 변형: 회색 점액+방어구 용해기까지만 완성하고 다른 소환·방어 장비로 생존.","고화력 변형: 슬라임샷→생명력 흡수→피의 저주→붉은 위엄 연쇄 추가."],"evidence":"라이아노즈 실제 승리 로그 #1 기반. 초반 구매 구역은 추천 재구성. 복잡한 연쇄가 필요해 뉴비에게는 실험용.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"stonewake","icon":"🪨","title":"스톤웨이크 · 자력 골렘","group":"신규 연구 빌드","level":"★★★","tagline":"골렘을 만들 때 자력화 주문이 반복 발동하는 공학형","idea":"스톤웨이크(Stonewake/Stone Wake)로 골렘을 만들고 북극(North Pole)으로 자력화(Magnetize)를 대량 발동시킨다. 생성 골렘 수만큼 레이저아이·철학자의 돌·마법 지팡이 같은 ‘시전 반응형’ 장비가 작동한다. 기존 소환수 물량전과 달리 소환 자체가 주문·장비 발동 스위치다.","first":["1~3구역은 특정 골렘이 없어도 버틸 수 있는 저비용 공격 또는 전열 소환으로 출발.","스톤웨이크(Stonewake)를 구매하고 소환 위치·지형에 익숙해진다.","북극(North Pole)을 제작/확보해 자력화(Magnetize) 연계를 활성화한다.","시전 반응 장비를 하나씩 추가하고 마지막에 물리 저항 보스 대책을 만든다."],"phases":[{"range":"1–3","target":"초반 버티기","actions":["원본은 지식 제단(Shrine of Knowledge)에서 얻은 강화된 레그헤드(Leghead)로 생존했다.","그 제단 보상은 확정이 아니므로 범용 공격·보호막/소환으로 대체한다."]},{"range":"4–7","target":"골렘 준비","actions":["스톤웨이크를 확보하고 골렘 소환이 안전하게 되는 지형을 고른다.","소환 행동 후 적이 본체를 공격할 수 있는지 확인한다."]},{"range":"8–12","target":"자력화 엔진","actions":["북극(North Pole)을 확보하여 Magnetize 발동을 늘린다.","레이저아이(Rayzoreye), 철학자의 돌(Philosopher’s Stone), 마법 지팡이(Magic Wand) 등의 장비 발동을 시험한다."]},{"range":"13–17","target":"수은·유령 연쇄","actions":["액체 자력(Liquid Magnetism)→수은화(Mercurize)와 유령 소환 연계는 선택적으로 확장한다.","시전 횟수가 늘어나면 성능 저하가 있는지 점검한다."]},{"range":"18–최종","target":"물리 저항 대응","actions":["혼돈의 발톱(Chaos Claws)이 달린 용발톱 군화(Dragonclaw Sabatons)나 다른 속성 보조를 준비한다.","유령/골렘이 고저항 보스에게 실제 피해를 주는지 전투 로그로 확인한다."]}],"spells":[{"name":"스톤웨이크 (Stonewake / Stone Wake)","up":"골렘 생성","reason":"자력화 엔진의 시작점","priority":"필수"},{"name":"자력화 (Magnetize)","up":"북극(North Pole) 장비와 연계","reason":"반복 발동의 중심 효과","priority":"필수 연계"},{"name":"액체 자력 (Liquid Magnetism)","up":"수은화 (Mercurize)","reason":"추가 유령 소환과 장비 트리거 확장","priority":"선택"},{"name":"용의 발톱 (Dragon Claw)","up":"혼돈의 발톱 (Chaos Claws)","reason":"물리 저항 적 보완용","priority":"선택"}],"gear":[{"name":"북극 (North Pole)","reason":"자력화(Magnetize)를 다수 발동하게 하는 핵심 장비","priority":"필수급"},{"name":"레이저아이 (Rayzoreye)","reason":"골렘 소환/시전 연쇄의 추가 피해 반응","priority":"중반"},{"name":"철학자의 돌 (Philosopher’s Stone)","reason":"반복 시전에 반응하는 보조 자원 엔진","priority":"중반"},{"name":"마법 지팡이 (Magic Wand)","reason":"반복 시전 연계","priority":"중반"},{"name":"용발톱 군화 (Dragonclaw Sabatons)","reason":"혼돈의 발톱 변형으로 물리 피해의 약점 보완","priority":"대체"}],"rotation":["초반 공격과 방어로 골렘 생성 준비 시간을 확보한다.","스톤웨이크로 골렘을 만들고 북극의 발동을 확인한다.","발동된 자력화/추가 공격으로 적 숫자가 줄어드는지 본다.","피해가 통하지 않는 적에게는 혼돈 속성 등 다른 공격을 적용한다."],"pitfalls":["원본 플레이어는 특정 제단 보상으로 초반을 버텼다. 같은 스타트를 고정적으로 재현할 수 없다.","북극과 다수의 시전 반응 장비를 갖추기 전에는 완성형처럼 강하지 않다.","물리 저항력이 높으면 골렘 물량만으로 부족할 수 있다.","자동 주문 발동이 지나치게 많아지면 게임 진행이 느려질 수 있다."],"boss":["일반 맵: 골렘 수만큼 발동하는 자력화를 이용해 광역 정리.","물리 저항 보스: 별도 혼돈·비물리 공격을 확보.","모르드레드: 시전 반응 장비가 충분하지 않다면 방어를 늘리고 다른 속성의 피해를 확보."],"variants":["골렘 물량형: 원본 #4의 스톤웨이크+북극 조합.","철 금속형: 원본 #20의 스톤웨이크+아마겟돈 블레이드(Armageddon Blade)+파멸의 낙인(Doombrand)."],"evidence":"라이아노즈 실제 승리 로그 #4·#20 기반. 초반 핵심 아이템의 입수는 무작위라 장비 의존성이 크다.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"skull","icon":"💀","title":"황금 해골 · 죽음의 손길","group":"신규 연구 빌드","level":"★★★","tagline":"원거리에서 ‘죽음의 손길’을 여러 해골이 반복 발동","idea":"뼈 손가락 왕관(Crown of Bony Fingers)은 강력한 죽음의 손길(Touch of Death)을 발동하지만 한 턴에 한 번 임의 대상을 노리기 쉬워 불안정하다. 황금 해골(Golden Skull)의 갑옷 해골(Armored Skull)로 왕관 효과를 복제하면 해골 수만큼 발동 횟수를 늘릴 수 있다.","first":["초반에는 언데드 소환·어둠 공격 외에도 최소한 하나의 안정적인 처리 수단을 확보한다.","황금 해골(Golden Skull)을 확보해 배치와 충전 수급을 연습한다.","뼈 손가락 왕관(Crown of Bony Fingers)을 제작/확보한 후 갑옷 해골(Armored Skull)을 우선 목표로 삼는다.","어둠 면역 몬스터에 화염의 손길(Flametouch)·황혼의 시선(Twilight Gaze)을 준비한다."],"phases":[{"range":"1–3","target":"언데드 스타트","actions":["죽음 계열 저비용 공격 또는 소환수로 시작한다.","이 단계의 고정 구매 순서는 원본에 명시되지 않았다. 생존용 보호막/공격을 우선한다."]},{"range":"4–7","target":"해골 안정화","actions":["황금 해골을 확보하고 적 공격을 분산할 위치에 배치한다.","해골을 한 위치에 몰아놓고 광역 피해를 함께 맞지 않게 한다."]},{"range":"8–12","target":"왕관 복제 엔진","actions":["뼈 손가락 왕관 + 갑옷 해골(Armored Skull)을 연결한다.","해골 여러 마리가 죽음의 손길을 발동하는지 확인한다."]},{"range":"13–17","target":"충전·속성 대책","actions":["영혼 수확자(Soul Harvester)로 해골 충전 수급을 보조한다.","화염의 손길(Flametouch), 황혼의 시선(Twilight Gaze)로 어둠 면역을 대비한다."]},{"range":"18–최종","target":"지형·보스 대응","actions":["흡혈귀의 손길(Touch of the Vampire) 및 유령구(Ghostball)로 장애물 많은 지형에 접근한다.","죽음의 손길 외의 속성 피해와 보호막으로 보스의 반격을 견딘다."]}],"spells":[{"name":"황금 해골 (Golden Skull)","up":"갑옷 해골 (Armored Skull)","reason":"왕관 효과를 복제하는 원거리 언데드","priority":"필수"},{"name":"죽음의 손길 (Touch of Death)","up":"최후의 손길 (Final Touch)은 선택","reason":"강력한 단일 피해의 핵심","priority":"필수 연계"},{"name":"영혼 수확자 (Soul Harvester)","up":"충전 보조","reason":"해골 사용 횟수 관리","priority":"중반"},{"name":"화염의 손길 (Flametouch)","up":"어둠 이외의 피해","reason":"어둠 면역 대응","priority":"중반"},{"name":"황혼의 시선 (Twilight Gaze)","up":"저항력 약화","reason":"어둠 저항/면역 대응","priority":"후반"},{"name":"흡혈귀의 손길 (Touch of the Vampire)","up":"유령구 (Ghostball)","reason":"장애물·사거리 문제 완화","priority":"선택"}],"gear":[{"name":"뼈 손가락 왕관 (Crown of Bony Fingers)","reason":"죽음의 손길을 해골들과 연계하는 빌드 필수품","priority":"필수"},{"name":"요정 판금 (Fae Plate)","reason":"해골을 준비하는 동안 본체 보호막","priority":"안전"},{"name":"다른 언데드/어둠 강화 장비","reason":"부족한 체력·시전 횟수 보완","priority":"대체"}],"rotation":["원거리에서 살아남을 수 있도록 해골을 나눠 배치한다.","왕관을 가진 해골이 실제로 죽음의 손길을 발동하는지 확인한다.","충전이 소모되면 영혼 수확자로 보충한다.","어둠 면역 적은 화염의 손길·황혼의 시선과 보조 피해로 처리한다."],"pitfalls":["왕관 제작 전에는 공격력이 폭발하지 않는다.","왕관만 있고 해골 숫자가 적으면 턴당 1회 무작위 공격의 한계가 남는다.","어둠 면역 적이 많으므로 단일 속성에 올인하면 실패한다.","최후의 손길(Final Touch)은 원본 플레이어가 제단에서 얻은 보너스다. 필수 구매로 가정하지 않는다."],"boss":["일반 몬스터: 여러 해골의 손길 공격으로 수적 우세.","고저항 적: 황혼의 시선과 화염의 손길로 속성 보완.","20구역 보스: 원본은 최후의 손길 추가 업그레이드 덕분에 매우 빠른 처치를 기록. 항상 보장되지는 않는다."],"variants":["왕관을 얻지 못했다면 다른 언데드 기반의 주력 피해 주문으로 전환.","더 높은 피해 변형: 진화 제단에서 최후의 손길(Final Touch)을 얻었을 때."],"evidence":"라이아노즈 실제 승리 로그 #16(Necromancer 챌린지) 기반. 왕관을 요구하므로 초보자에게는 후반 장비 의존형.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"blades","icon":"🗡️","title":"칼날 소환 · 음파 보호막","group":"신규 연구 빌드","level":"★★☆","tagline":"검 군단으로 전선을 만들고 음파 보호막으로 공격을 방어","idea":"칼날 소환(Summon Blade) 의식을 고속화해 한 턴에 다수의 검을 전개한다. 검은 몸으로 적 공격을 소모시키는 역할을 하고, 플레이어는 비전 방호·음파 보호막(Sonic Shields)으로 안전을 확보한다. 기존 늑대나 드래곤 소환과 달리 ‘소환수 자체가 소모 가능한 방패’라는 점이 핵심이다.","first":["초반에는 칼날 소환(Summon Blade)으로 한 번에 감당할 적 수를 제한한다.","피해량보다 검 소환 횟수와 안전한 소환 위치를 우선한다.","중반에 칼날 의식(Ritual of Blades)+검 제작(Bladeworks)을 목표로 한다.","양치기의 지팡이·전쟁군주 깃발·고속 의식 지팡이 중 제작 가능한 것을 확보한다."],"phases":[{"range":"1–3","target":"검으로 전선 만들기","actions":["칼날 소환을 공격과 어그로 분산 수단으로 사용한다.","소환수가 막을 수 없는 광역 주문 적은 별도로 제거한다."]},{"range":"4–7","target":"검 물량 증가","actions":["칼날 의식(Ritual of Blades), 검 제작(Bladeworks) 업그레이드를 모은다.","이 시점에는 일단 생존 가능한 검 숫자가 목표다."]},{"range":"8–12","target":"전선 폭증","actions":["양치기의 지팡이(Shepherd’s Staff), 전쟁군주 깃발(Warlord Banner), 고속 의식 지팡이(Rapid Ritual Rod)로 의식을 가속한다.","원본 클리어 기록에서는 장비가 갖춰져 1턴 약 12자루를 전개했다. 보편적 수치가 아니다."]},{"range":"13–17","target":"보호막·불멸 보강","actions":["음파 보호막(Sonic Shields)과 퀴푸 사가(Quipu Saga)를 추가한다.","천상의 우상(Heavenly Idol), 필멸성 유예(Suspend Mortality)로 검 재생을 시도한다."]},{"range":"18–최종","target":"보스 파훼","actions":["비전 방호(Arcane Warding)로 본체를 지킨다.","독침(Poison Sting)+산성(Acidity) 업그레이드로 모르드레드 3페이즈의 대책을 확보한다."]}],"spells":[{"name":"칼날 소환 (Summon Blade)","up":"칼날 의식 (Ritual of Blades), 검 제작 (Bladeworks)","reason":"소모 가능한 검 군단을 빠르게 양산","priority":"필수"},{"name":"음파 보호막 (Sonic Shields)","up":"퀴푸 사가 (Quipu Saga) 연계","reason":"보호막과 추가 피해","priority":"중반"},{"name":"비전 방호 (Arcane Warding)","up":"필수 업그레이드 아님","reason":"본체의 보호막 유지","priority":"중반"},{"name":"천상의 우상 (Heavenly Idol)","up":"불멸의 요새(Bastion of Immortality)","reason":"검의 생존력 강화","priority":"후반"},{"name":"필멸성 유예 (Suspend Mortality)","up":"대량 불멸 (Mass Immortality), 끝없는 삶 (Endlessness)","reason":"검 반복 부활","priority":"후반"},{"name":"독침 (Poison Sting)","up":"산성 (Acidity)","reason":"최종 보스에 별도 피해 경로","priority":"후반"}],"gear":[{"name":"양치기의 지팡이 (Shepherd’s Staff)","reason":"소환 개수 보완","priority":"핵심"},{"name":"전쟁군주 깃발 (Warlord Banner)","reason":"소환 개수 증가에 기여","priority":"핵심"},{"name":"고속 의식 지팡이 (Rapid Ritual Rod)","reason":"칼날 의식을 빠르게 시전","priority":"핵심"},{"name":"기사의 우리 (Knight Cage) + 사역마 목걸이 (Familiar’s Collar)","reason":"음파 보호막 연계 원래 실험 목적","priority":"선택"},{"name":"퀴푸 사가 (Quipu Saga)","reason":"음파 보호막 피해 보조","priority":"선택"},{"name":"요정 판금 (Fae Plate)","reason":"핵심 검 의식을 만들기 전 플레이어 보호","priority":"대체"}],"rotation":["안전 타일에서 검을 전방에 소환한다.","검이 적의 공격을 소모시키는 동안 위험한 상태이상 적을 직접 처리한다.","의식 업그레이드를 완성해 검 수를 늘리되 본체가 무방비인 채 채널링하지 않는다.","후반에는 비전 방호+검 부활을 유지하면서 보스의 유효 피해 수단을 점검한다."],"pitfalls":["검은 강한 피해보다는 어그로와 보호막 소모 역할이 더 중요하다.","고급 의식 장비가 없으면 물량이 덜 나오지만 빌드 자체는 굴러간다.","채널링 도중 기절·침묵 등으로 취소될 수 있어 시작 타일 선정이 중요하다.","검 물량만으로 막히는 보스에게는 산성 등 다른 피해가 필요하다."],"boss":["20구역: 보호막과 군중 제어로 장기전 대비.","오판: 피해 전가 적을 먼저 제거.","모르드레드: 원본은 독침(Poison Sting)+산성(Acidity)으로 3페이즈를 보완해 클리어."],"variants":["방어형: 검 물량+비전 방호만 우선해 중반 생존 연습.","완성형: 천상의 우상과 필멸성 유예로 무한 부활을 노린다."],"evidence":"라이아노즈 실제 승리 로그 #15 기반. 1턴 12자루는 특정 장비 조합이 완성된 원본 사례의 수치.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"seraph","icon":"🪽","title":"세라프 소환 · 불멸 우상","group":"신규 연구 빌드","level":"★★★","tagline":"신성 소환수를 살려 증식시키는 장기전 신성 빌드","idea":"세라프 소환(Call Seraph)으로 주력 천사 소환수를 만들고 천상의 우상(Heavenly Idol)과 필멸성 유예(Suspend Mortality)를 중첩한다. 영혼 수확자(Soul Harvester)로 소환 전력을 늘리고, 불기둥(Pillar of Fire)으로 첫 턴의 약한 구간을 메운다. 기존 아콘 소환과 달리 광선 보호막보다 불멸/복제 유지가 중심이다.","first":["초반에 세라프를 바로 구매하려고 공격 주문을 포기하지 않는다.","구역 시작 직후 적을 정리할 폭발 주문으로 불기둥(Pillar of Fire) 등을 준비한다.","세라프 소환(Call Seraph)과 천상의 우상(Heavenly Idol)을 연결한다.","영혼 수확자(Soul Harvester)로 증식할 수 있을 때 생존 지원을 추가한다."],"phases":[{"range":"1–3","target":"신성 입문","actions":["다수 적을 처리할 저가 공격 주문이나 소환수를 확보한다.","보스형 적뿐 아니라 구역 시작 직후 소환사와 원거리 적을 우선 정리한다."]},{"range":"4–7","target":"세라프 준비","actions":["세라프 소환(Call Seraph)을 확보할 SP를 모은다.","천상의 우상과 필멸성 유예의 연결 조건을 확인한다."]},{"range":"8–12","target":"불멸 연결","actions":["천상의 우상(Heavenly Idol)과 필멸성 유예(Suspend Mortality)를 함께 사용한다.","주문 충전 수급 수단으로 영혼 수확자(Soul Harvester)를 고려한다."]},{"range":"13–17","target":"초반 급사 방어","actions":["불기둥(Pillar of Fire)을 초기 광역 피해 수단으로 강화한다.","아름다움의 언령(Word of Beauty) 및 위기 부적(Crisis Charm) 등으로 본체를 보호한다."]},{"range":"18–최종","target":"제재로 보스 대응","actions":["제재(Sanction)의 무장 해제(Stripped Bare) 및 추방자(Exiled One) 업그레이드로 모르드레드를 대비한다.","신성 피해 무효인 적이 등장하면 별도 타입의 공격을 준비한다."]}],"spells":[{"name":"세라프 소환 (Call Seraph)","up":"기본 세라프 소환","reason":"후반 핵심 전투력","priority":"필수"},{"name":"천상의 우상 (Heavenly Idol)","up":"원본은 제단에서 강화형 획득","reason":"불멸 연계의 중심","priority":"핵심"},{"name":"필멸성 유예 (Suspend Mortality)","up":"소환수에게 생존 효과 부여","reason":"세라프 생존력 강화","priority":"핵심"},{"name":"영혼 수확자 (Soul Harvester)","up":"충전 수급","reason":"소환 지속력과 증식 보조","priority":"중반"},{"name":"불기둥 (Pillar of Fire)","up":"초기 피해","reason":"소환 전 취약 턴 보완","priority":"중반"},{"name":"제재 (Sanction)","up":"벌거벗기기 (Stripped Bare), 추방자 (Exiled One)","reason":"최종 보스의 방어·면역 대비","priority":"후반"},{"name":"아름다움의 언령 (Word of Beauty)","up":"상태이상/방어 확인","reason":"본체 급사 방지 보조","priority":"후반"}],"gear":[{"name":"위기 부적 (Crisis Charm)","reason":"한 번의 사고로 종료되는 상황에 대비","priority":"중요"},{"name":"소환술 지팡이 (Conjuration Staff)","reason":"세라프의 기본 성능 강화","priority":"대체"},{"name":"신성 지팡이 (Holy Staff)","reason":"신성 주문의 보조 성능 강화","priority":"대체"},{"name":"요정 판금 (Fae Plate)","reason":"세라프를 세우기 전 본체 보호막","priority":"초반 대체"}],"rotation":["불기둥 등 즉시 공격으로 첫 턴 위험한 원거리 적부터 줄인다.","안전한 뒤쪽 타일에서 세라프를 소환한다.","천상의 우상+필멸성 유예로 세라프가 전선을 유지하게 한다.","영혼 수확자로 충전 수급을 연결하고 본체는 위기 부적으로 급사를 대비한다."],"pitfalls":["원본 클리어는 지식 제단에서 강화된 천상의 우상을 얻은 행운이 있었다.","첫 턴 소환 전까지 공격에 취약하다.","신성 면역이나 소환수 제어를 하는 적에게 막힐 수 있다.","후반 핵심 주문이 여럿 필요해 초보자 스타트로는 권장하지 않는다."],"boss":["강한 원거리 보스: 첫 턴 전멸을 피하기 위해 본체 보호막과 즉시 피해가 필요.","신성 면역 보스: 불기둥 및 제재의 유효 공격 경로 확인.","모르드레드: 원본은 제재+Stripped Bare+Exiled One으로 최종 돌파."],"variants":["안전 변형: 세라프+본체 보호막 위주로 진행한 뒤 불멸 연계는 늦게 완성.","클리어 변형: 세라프+천상의 우상+필멸성 유예+영혼 수확자를 갖춘 원본 구성."],"evidence":"라이아노즈 실제 승리 로그 #19(Sanctumancer) 기반. 원본의 지식 제단 보상은 확정 획득 요소가 아니다.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]},{"id":"chaos","icon":"🌈","title":"혼돈 탄막 · 캔트립 연쇄","group":"신규 연구 빌드","level":"★★☆","tagline":"속성을 바꿔가며 정예·보스에게 집중 폭격","idea":"혼돈 탄막(Chaos Barrage)의 똑똑한 탄환(Smart Bolts)이 다양한 피해 속성 가운데 유효 속성을 찾아 집중 공격한다. 캔트립 연쇄(Cantrip Cascade)의 방출 융합(Evocation Amalgamation)으로 다단 공격을 강화한다. 기존 마법 미사일+분산과 달리 엘리트·단일 보스 처리에 초점을 맞춘다.","first":["시작: 혼돈 탄막(Chaos Barrage)을 구매할 수 있다면 주력 단일 공격 후보로 정한다.","초반: 똑똑한 탄환(Smart Bolts) 업그레이드로 저항력이 높은 정예를 처리한다.","중반: 캔트립 연쇄(Cantrip Cascade)+방출 융합(Evocation Amalgamation)을 목표로 SP를 축적한다.","후반: 신비로운 시야(Mystic Vision)와 공격 범위·사거리 증폭 장비를 추가한다."],"phases":[{"range":"1–3","target":"정예 대응","actions":["혼돈 탄막+똑똑한 탄환을 우선 목표로 한다.","충전 횟수가 부족하면 별도 저비용 광역 주문이나 소환수를 확보한다."]},{"range":"4–7","target":"중반 연결","actions":["캔트립 연쇄를 확보하고 해당 주문의 자동 발동 조건을 확인한다.","적을 한 방향으로 묶어 남는 탄환이 고체력 적에게 집중되도록 위치를 고른다."]},{"range":"8–12","target":"융합 다단 공격","actions":["방출 융합(Evocation Amalgamation)을 적용해 혼돈 탄막을 여러 번 시전하는 엔진을 만든다.","방어 수단이 빈약하면 비전 방호와 보호막 장비를 먼저 확보한다."]},{"range":"13–17","target":"사거리와 추가 피해","actions":["신비로운 시야(Mystic Vision)로 사거리 이점을 확보한다.","절멸자 지팡이(Annihilator Staff)·탐투의 눈(Eye of Tamtu) 등 시전 보조 장비를 제작한다."]},{"range":"18–최종","target":"보스 집중 폭격","actions":["저항력 높은 보스에 Smart Bolts의 유효 속성 탐색이 실제 작동하는지 확인한다.","체력 보상과 보호막 유지로 연속 공격을 버틴다."]}],"spells":[{"name":"혼돈 탄막 (Chaos Barrage)","up":"똑똑한 탄환 (Smart Bolts)","reason":"정예·고체력 적에 적합한 핵심 공격","priority":"필수"},{"name":"캔트립 연쇄 (Cantrip Cascade)","up":"방출 융합 (Evocation Amalgamation)","reason":"혼돈 탄막의 다단 발동 엔진","priority":"필수"},{"name":"신비로운 시야 (Mystic Vision)","up":"사거리 보조","reason":"벽/장거리 적을 공격할 기회 확대","priority":"후반"},{"name":"비전 방호 (Arcane Warding)","up":"보호막","reason":"초반 후의 급사 방지","priority":"중반"}],"gear":[{"name":"절멸자 지팡이 (Annihilator Staff)","reason":"혼돈 탄막의 추가 피해 및 방어 대응","priority":"후반"},{"name":"탐투의 눈 (Eye of Tamtu)","reason":"혼돈 연쇄 추가 피해","priority":"후반"},{"name":"요정 판금 (Fae Plate)","reason":"캔트립 엔진 완성 전 보호막을 제공","priority":"안전"},{"name":"시전 보조 지팡이","reason":"혼돈·주문 유형에 맞춘 보조 강화","priority":"대체"}],"rotation":["첫 턴에 어떤 적이 가장 위험한지 확인한다.","혼돈 탄막+똑똑한 탄환으로 고위험 정예 적을 먼저 제거한다.","캔트립 연쇄가 완성되면 적 여러 마리를 포함해 탄막이 고체력 적에게도 향하도록 배치한다.","남은 보스에는 속성 약점을 확인하며 반복 집중 공격을 한다."],"pitfalls":["혼돈 탄막은 태그가 Chaos·Sorcery 계열이라 특정 강화 장비 확보에 운이 따른다.","고체력 한 마리를 잘 잡아도 넓은 맵의 다수 적을 통제할 수단이 없으면 위험하다.","캔트립 엔진 이전에는 별도 생존·광역 수단이 필요하다.","방출 융합의 세부 발동 조건 및 업그레이드 가격은 게임 내 툴팁 우선."],"boss":["정예 적: 똑똑한 탄환으로 유효 피해 속성을 탐색.","다수 소환형 보스: 광역·소환수/보호막 보조를 함께 운용.","모르드레드: 원본 플레이어는 Smart Bolts가 유효한 속성을 찾아 승리했다고 보고."],"variants":["입문 변형: 혼돈 탄막+똑똑한 탄환을 단일 화력용으로 사용, 다른 주력 빌드 보조.","완성형: 캔트립 연쇄+방출 융합으로 다단 공격, 탐투의 눈/절멸자 지팡이 추가."],"evidence":"라이아노즈 실제 승리 로그 #7 기반. 비전 마법 미사일과 별개로 보스 집중 딜링에 특화된 구성.","sources":[["라이아노즈 — 실제 22회 승리 로그","https://note.com/liarnose/n/n88a55781e869?hl=en"],["RW3 마법·장비 데이터베이스","https://hpp3.github.io/rw3/"]]}],"tips":{"principles":[["🎯","한 턴 후 위험을 먼저 계산","적을 얼마나 때리느냐보다 내 행동이 끝난 뒤 몇 마리가 나를 공격할 수 있는지가 중요."],["👁️","T / L로 시야와 위협 확인","T=위협 범위, L=시야. 시작 타일과 매 턴 이동할 타일을 확인."],["🚪","보상보다 안전한 균열","주력 속성 100% 저항 적, 긴 사거리, 소환사, 기절·공포 적은 초반에 피하기."],["🧱","벽·모서리·병목 활용","원거리 적 다수에게 동시에 노출되는 대신 벽 뒤에 숨어 한두 마리씩 상대."],["🎯","당장 위험한 적 먼저 제거","행동 불능 유발 → 소환사/회복 적 → 원거리 광역 → 일반 근접 순서가 대체로 유리."],["🛡️","보호막은 공격 횟수를 막는다","보호막 3개면 강한 공격 3회는 막지만 약한 다단 공격 4회엔 체력 피해가 날 수 있음."],["🔮","4구역 전 역할 3가지 이상","단일 처치, 다수 처치, 탈출·방어·소환 중 1개 이상을 갖추는 것이 안전."],["💰","SP는 빌드와 생존 사이 균형","핵심 업그레이드 전 무분별한 주문 구매를 피하되, 반복해서 죽으면 보조 방어를 먼저 구매."],["🧰","제작은 후반까지 미루지 않기","완성형 장비 하나보다 초반에 제작 가능한 보호막/소환 지팡이 하나가 더 유용할 때가 많음."],["🥚","소환수는 방패가 아니라 시간","소환수가 한 턴을 벌어주는 사이 위험한 원거리/상태이상 적을 직접 처리."]],"opening":[["1구역","안전한 공격 + T로 시작 위치 선택","주력 공격 하나만 확보하고 약한 균열로 진입. 시작 위치에서 원거리 적의 사거리와 상태이상 적을 먼저 조사."],["2구역","적 대응을 알아보기","주력 속성 면역 적을 피하고, 소환수나 저비용 보조 마법으로 적의 공격을 분산."],["3구역","첫 장비 확인","얻은 제작 재료로 즉시 만들 수 있는 보호막 또는 소환수 강화 장비를 확인."],["4구역","필요 역할 점검","광역/단일 처치, 생존 또는 이동 중 부족한 수단을 보충."],["5구역","핵심 연계 1개 완성","완전한 엔딩 빌드보다 우선 생존. 위험한 보상보다 클리어 가능한 균열을 선택."]],"enemies":[["위험한 상태이상","기절(Stun)·공포(Fear)·빙결(Frozen)·침묵(Silence)","상태이상 적은 피해량이 낮아도 최우선으로 제거/제어."],["소환사","추가 적을 생성하는 몬스터","그대로 두면 적 수가 불어나므로 먼저 처치하거나 소환 전력 자체를 막기."],["고저항 적","주력 피해 유형 저항력 100%","공격을 몇 번 쓸지 고민하기 전에 적 정보와 속성을 확인."],["원거리 광역","시야 바깥이나 벽 관통/넓은 공격","위협 범위 시각화만 믿지 말고 주문 설명과 타일 배치 확인."]],"materials":[["슬라임 핵 (Slime Core)","획득 시 아군 공허 슬라임(Void Slime) 3마리 소환 — 전투 중 유용할 수 있음."],["아스트랄 성물함 (Astral Phylactery)","획득 시 영혼 항아리(Soul Jar) 생성; 항아리가 살아있는 동안 생존 효과."],["요정 판금 (Fae Plate)","방어 장비 우선 후보. 매 턴 보호막 공급(정확한 상한은 현재 버전 툴팁 확인)."],["재료의 On Pickup / On Craft","획득하는 순간의 효과와 제작에 소비할 때 발동하는 효과를 반드시 구별."],["제작 코드의 *","자유 재료 슬롯. 제작 창에서 정확한 태그와 개수 확인."]],"bosses":[["개구리 교황 (Pope the Frog)","턴당 피해 상한 때문에 극딜보다 지속 방어가 중요."],["아마루 (Amaru)","화염·냉기 면역과 Sorcery/Enchantment 유형 피해 무효에 주의."],["전기의 육체 (The Body Electric)","직접 대상 지정 마법에 반격. 간접 피해·소환수 활용."],["눈의 여왕 (Snow Queen)","냉기·독 면역, 추가 형태/보호막 관리."],["오판 (Ophan)","피해를 다른 아군에게 전가하므로 주변의 특수 적부터 제거."],["모르드레드 (Mordred)","다수 적 정리·단일 보스 피해·생존 수단을 모두 준비. 소환수만 늘리지 않기."]],"checklist":["적 저항력과 상태이상 공격을 확인했다","T로 시작 위치 위협 범위를 확인했다","즉시 죽일 수 있는 위험한 적이 누군지 안다","내 주력 피해가 통한다","방어·소환·이동 중 하나 이상의 대응 수단이 있다","제작 가능한 장비를 확인했다","이번 행동이 끝나면 얼마나 공격받는지 예상했다"]},"updated":"2026-10-29","meta":"실제 승리 기록 및 스팀 공식 자료 기반. 신규 6개 빌드는 초반 목표를 재구성했으며, 2026-10-12 베타/메인 패치 차이에 유의."};

const tipTabs=[['overview','핵심 생존 원칙'],['route','1–5구역 운영'],['gear','제작·장비·적 분석'],['battle','보스·출발 체크']];
const introTabs=[['overview','게임 소개'],['route','게임 진행 흐름'],['gear','마법·장비 시스템'],['battle','초보자 시작 가이드']];
const pageTabs=id=>id==='intro'?introTabs:id==='tips'?tipTabs:tabs;
function hashRead(){const raw=location.hash.slice(1).split('/');let id=raw[0]||'intro';state.id=sections.some(x=>x.id===id)?id:'intro';state.tab=pageTabs(state.id).some(x=>x[0]===raw[1])?raw[1]:'overview';}
function go(id,tab='overview'){state.id=id;state.tab=tab;location.hash=id+'/'+tab;render();window.scrollTo({top:0,behavior:'instant'});if(innerWidth<=820)closeSidebar();}
function renderNav(){let q=state.q.toLocaleLowerCase();let content='';for(const group of groups){let items=sections.filter(s=>s.group===group&&(!q||[s.title,s.tagline,s.id,...(s.spells||[]).map(x=>x.name),...(s.gear||[]).map(x=>x.name)].join(' ').toLocaleLowerCase().includes(q)));if(!items.length)continue;content+='<div class="sgroup"><h3>'+esc(group)+'</h3>';for(let s of items)content+='<button class="navitem '+(s.id===state.id?'active':'')+'" data-go="'+s.id+'"><span class="emoji">'+s.icon+'</span><span class="ntext">'+esc(s.title)+'<span class="desc">'+esc(s.tagline)+'</span></span></button>';content+='</div>'} $('nav').innerHTML=content||'<div class="empty">검색 결과가 없습니다.</div>';document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));}
function renderTabs(list){return '<nav class="tabs" aria-label="페이지별 상세 내용">'+list.map(([id,txt])=>'<button role="tab" aria-selected="'+(state.tab===id)+'" data-tab="'+id+'">'+txt+'</button>').join('')+'</nav>'}
function renderFooter(){return '<div class="footer">업데이트·정리: '+D.updated+' · '+esc(D.meta)+'<br>관련 마법·제작 코드·SP 비용은 게임 버전마다 바뀔 수 있으므로 실제 툴팁이 최우선입니다.</div>'}
function renderSources(arr){return '<section class="source"><h2>해외 원문·데이터 확인</h2>'+arr.map(([name,url])=>'<a target="_blank" rel="noopener" href="'+esc(url)+'">↗ '+esc(name)+'</a>').join('')+'</section>'}
function list(items,cls='cleanlist'){return '<ul class="'+cls+'">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function checkRows(key,items){let done=items.filter((v,i)=>state.checks[key+':'+i]).length;return '<div class="card flat"><div class="flexbetween"><b>✅ 플레이 체크리스트</b><small>'+done+' / '+items.length+' 완료</small></div><div class="progress"><div class="fill" style="width:'+(100*done/items.length)+'%"></div></div>'+items.map((x,i)=>'<label class="checkline"><input type="checkbox" data-check="'+key+':'+i+'" '+(state.checks[key+':'+i]?'checked':'')+'><span>'+esc(x)+'</span></label>').join('')+'<div style="text-align:right;margin-top:14px"><button class="btn" data-reset="'+key+'">체크 초기화</button></div></div>'}
function summaryCard(title,items){return '<section class="card flat"><h3>'+esc(title)+'</h3>'+list(items)+'</section>'}
function introPage(){
let intro='<div class="kicker">GAME INTRODUCTION · TURN-BASED ROGUELIKE</div><h1>📖 Rift Wizard란?</h1><p class="lede">마법의 조합을 직접 설계하고, 위험한 균열을 하나씩 선택해 돌파하는 고난도 턴제 전략 로그라이크입니다. ‘얼마나 좋은 장비를 얻었는지’보다 <b>지금 배우고 싶은 마법을 어떻게 연결하고 다음 턴을 살아남을지</b>가 승부를 가릅니다.</p>'+renderTabs(introTabs);

['🧙','나만의 마법서','마법과 업그레이드를 정해진 직업 트리 대신 자유롭게 선택하고 조합합니다.'],
['⚡','한 턴의 무게','내가 한 번 행동하면 적도 행동합니다. 공격보다 적의 위협 범위·시야·위치를 먼저 보는 것이 중요합니다.'],
['🚪','균열과 시작 위치 선택','다음 구역의 적·보상을 살피고 들어갈 균열과 출발 위치를 선택합니다.'],
['⚒️','제작과 시너지','재료로 장비를 만들고, 한 주문이 다른 주문·소환수·장비 효과를 연쇄적으로 발동하게 만듭니다.'],

['📚','앞서 해보기','2026년 6월 23일 앞서 해보기로 출시되어 마법·장비·밸런스가 계속 변경됩니다.']
].map(([em,title,desc])=>'<section class="card"><span class="em">'+em+'</span><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></section>').join('')+'</div><div class="note">2026년 10월 기준 개발사 소개: 200종 이상의 마법, 400종 이상의 주문 업그레이드, 300종 이상의 제작 장비를 표방합니다. 개별 수치와 효과는 패치에 따라 달라질 수 있습니다.</div>';
}
if(state.tab==='route'){
body='<h2>한 번의 플레이는 이렇게 흘러갑니다</h2><div class="timeline">'+[
['① 준비','주문과 SP','게임 진행 중 얻는 주문 포인트(Spell Points, SP)로 필요한 주문·업그레이드를 구매합니다. 처음에는 공격 한 종류와 생존 방법을 마련합니다.'],
['② 균열 선택','적 구성과 보상 비교','어떤 적이 나오며 무엇을 얻는지 확인합니다. 주력 속성에 면역인 적이 많다면 다른 균열을 선택할 수 있습니다.'],
['③ 전투','시작 위치와 한 턴 계산','원거리 적의 위협 범위(T), 시야(L), 상태이상을 확인합니다. 한 행동 뒤 적이 어떻게 대응할지 예상해야 합니다.'],
['④ 성장','전리품과 장비 제작','제작 재료와 보상을 이용해 소환수 강화·보호막·마법 연쇄를 완성합니다. 빌드의 핵심 엔진을 하나씩 연결합니다.'],

['피해 저항력 (Resistance)','속성별 피해 감소. 100% 저항이면 일반적인 해당 속성 공격은 통하지 않을 수 있습니다.'],
['보호막 (Shields)','기본적으로 피해량보다 피격 횟수에 대응하는 방어 자원입니다. 다단 공격에 약할 수 있습니다.'],
['마법 분류·속성 (Tags)','Fire, Ice, Lightning, Arcane, Holy, Dark, Conjuration 등. 주문과 장비의 시너지를 결정합니다.'],

['제단 (Shrines)','강화·변환·재료 보상 등 다양한 선택을 제공하는 장소입니다.']
].map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+esc(b)+'</td></tr>').join('')+'</tbody></table></div><h2>빌드의 기본 구성</h2>'+summaryCard('대부분의 빌드에서 필요한 네 역할',['일반 적을 처리하는 주력 공격','여러 적을 한 번에 제어하거나 제거하는 광역 수단','보호막·소환수·순간이동 등 생존 수단','주력 속성 면역 적과 고체력 보스에 대응하는 보조 피해']) ;
}
if(state.tab==='battle'){
body='<h2>처음 플레이한다면</h2>'+summaryCard('실패를 줄이는 다섯 가지 습관',['처음에는 완성형 빌드보다 첫 3구역을 안전하게 통과하는 것이 목표.','균열 선택 전에 적의 위협 범위와 주력 피해의 저항력을 확인.','적을 많이 때리는 행동보다 공격을 덜 받는 행동을 선택.','저렴하게 제작 가능한 보호막·소환 장비를 초반에 활용.','사망 원인을 적 공격·상태이상·위치·면역 중 하나로 기록.'])+'<h2>이 공략집을 보는 순서</h2>'+summaryCard('추천 학습 순서',['① 게임 전체 생존 팁 페이지에서 T키·균열·제작 확인','② 고룡의 알 또는 슬라임 군단으로 초반 생존 연습','③ 빌드별 구역 루트와 체크리스트에 따라 플레이','④ 중후반에는 보스·저항력 대책만 추가해 엔딩 도전'])+'<div class="note">도움이 필요하면 페이지 상단의 목차 열기에서 생존 팁과 빌드를 선택하세요. 구매한 항목 체크는 현재 브라우저 저장소에만 남습니다.</div>';

function tipsPage(){let t=D.tips;let intro='<div class="kicker">기본 가이드 · 공통 생존 전략</div><h1>📘 게임 전체 생존 팁</h1><p class="lede">모든 빌드에 공통으로 적용되는 생존 기술입니다. 먼저 시작 위치와 위협 범위부터 확인하면 빌드 완성 전 사망을 줄일 수 있습니다.</p>'+renderTabs(tipTabs);let body='';
if(state.tab==='overview'){body='<div class="callout"><b>초반의 목표는 ‘빌드 완성’이 아니라 ‘다음 한 턴 살아남기’입니다.</b><br>매 턴: 위험 범위 확인 → 위험한 적 제거/제어 → 안전한 위치 확보 순서로 판단하세요.</div><div class="tipgrid">'+t.principles.map(([em,title,desc])=>'<section class="card"><span class="em">'+em+'</span><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p></section>').join('')+'</div>'}

if(state.tab==='battle'){body='<h2>주요 후반 보스 유의점</h2><div class="tablewrap"><table><thead><tr><th>보스</th><th>대응 핵심</th></tr></thead><tbody>'+t.bosses.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</tbody></table></div>'+checkRows('tips',t.checklist)}

function sourcesFallback(k){return ({db:['Rift Wizard 3 Compendium','https://hpp3.github.io/rw3/'],steam:['Steam 빌드 가이드','https://steamcommunity.com/sharedfiles/filedetails/?id=3785063466']})[k]}
function buildPage(b){let intro='<div class="kicker">'+esc(b.group)+' · 난이도 '+esc(b.level)+'</div><h1>'+b.icon+' '+esc(b.title)+'</h1><p class="lede">'+esc(b.tagline)+'</p><div class="chiprow"><span class="chip">'+esc(b.level)+'</span><span class="chip good">마법·장비 영문 병기</span><span class="chip">구역별 목표</span></div>'+renderTabs(tabs);let body='';
if(state.tab==='overview'){body='<section class="summary"><b>🎯 빌드의 작동 원리</b><p>'+esc(b.idea)+'</p></section><h2>지금 바로 시작하는 순서</h2>'+checkRows(b.id+'-first',b.first)+'<div class="note"><b>근거 구분:</b> '+esc(b.evidence)+'</div>'+summaryCard('이 빌드의 특징',[b.tagline, b.level==='★☆☆'?'초보자용 생존과 전투 연습에 적합':'초반 구역에서 생존·SP 관리를 먼저 확인', '게임 패치에 따라 일부 자동 시전/업그레이드 조건이 다를 수 있음'])}
if(state.tab==='route'){body='<h2>초반부터 최종 보스까지</h2><div class="timeline">'+b.phases.map(p=>'<section class="step"><div class="stepnum">'+esc(p.range)+'</div><div><h3>'+esc(p.target)+'</h3>'+list(p.actions)+'</div></section>').join('')+'</div><div class="note">구역별 목표는 별도 표기가 없는 한 해외 공략을 바탕으로 재구성한 <b>추천 진행안</b>입니다. SP·재료 운에 따라 몇 구역 늦어져도 생존을 우선하세요.</div>'}
if(state.tab==='gear'){body='<h2>필수·추천 주문</h2><div class="tablewrap"><table><thead><tr><th>주문 (원문)</th><th>업그레이드</th><th>목적</th><th>우선</th></tr></thead><tbody>'+b.spells.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.up)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.priority)+'</td></tr>').join('')+'</tbody></table></div><h2>추천 장비</h2><div class="tablewrap"><table><thead><tr><th>장비 (원문)</th><th>이유</th><th>시점</th></tr></thead><tbody>'+b.gear.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.priority)+'</td></tr>').join('')+'</tbody></table></div><div class="note">특정 제작식/재료 태그/장비 가격을 검증하지 않은 항목은 억지로 채우지 않았습니다. 아래 Compendium에서 영문명을 검색해 실제 게임 버전과 대조하세요.</div>'}
if(state.tab==='battle'){body=summaryCard('한 전투의 추천 순서',b.rotation)+summaryCard('자주 실패하는 이유',b.pitfalls)+summaryCard('보스와 면역 대응',b.boss)+(b.variants.length?summaryCard('대체·변칙 운영',b.variants):'')+checkRows(b.id+'-battle',[...b.rotation.map((x,i)=>'전투 순서 '+(i+1)+': '+x)])}
return intro+body+renderSources(b.sources)+renderFooter();}
function render(){renderNav();let b=D.builds.find(x=>x.id===state.id);$('appBody').innerHTML=state.id==='intro'?introPage():state.id==='tips'?tipsPage():buildPage(b);document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>go(state.id,el.dataset.tab));document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.check]=el.checked;saveChecks();let pageY=window.scrollY;render();window.scrollTo(0,pageY)});document.querySelectorAll('[data-reset]').forEach(el=>el.onclick=()=>{for(let key of Object.keys(state.checks))if(key.startsWith(el.dataset.reset+':'))delete state.checks[key];saveChecks();render()});$('sidebarToggle').textContent=state.closed?'☰ 목차 열기':'☰ 목차 접기';$('sidebarToggle').setAttribute('aria-expanded',String(!state.closed));}
function closeSidebar(){state.closed=true;$('sidebar').classList.add('closed');$('shade').classList.add('hidden');render();}
function openSidebar(){state.closed=false;$('sidebar').classList.remove('closed');$('shade').classList.toggle('hidden',innerWidth>820);render();}
$('sidebarToggle').onclick=()=>state.closed?openSidebar():closeSidebar();$('sideClose').onclick=closeSidebar;$('shade').onclick=closeSidebar;$('search').oninput=e=>{state.q=e.target.value;renderNav()};$('theme').onclick=()=>{setTheme(state.theme==='light'?'dark':'light');render()};$('share').onclick=async()=>{let url=location.href;try{await navigator.clipboard.writeText(url);$('share').textContent='✓ 복사됨';setTimeout(()=>$('share').textContent='🔗 링크',1300)}catch{prompt('현재 페이지 주소',url)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.closed)closeSidebar();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();openSidebar();$('search').focus()}});window.addEventListener('hashchange',()=>{hashRead();render()});hashRead();render();
if(innerWidth<=820){closeSidebar()}
</script>
</body></html>
